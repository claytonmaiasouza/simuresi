services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    networks:
      - fintrack_default
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fintrack_default"
      # calendar.guiafinanceiro.pro router intentionally removed (2026-09-22):
      # the app now only answers on its own domain, simuresi.com.py. The old
      # subdomain is unreachable through Traefik (default cert + 404), with
      # no redirect. Service name "conarem" kept as-is, just no longer tied
      # to that hostname.
      - "traefik.http.services.conarem.loadbalancer.server.port=3000"
      - "traefik.http.routers.simuresi.rule=Host(`simuresi.com.py`) || Host(`www.simuresi.com.py`)"
      - "traefik.http.routers.simuresi.entrypoints=websecure"
      - "traefik.http.routers.simuresi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.simuresi.service=conarem"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conarem
      POSTGRES_USER: conarem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    # deliberately no `ports:` mapping -- unreachable from the host or from
    # fintrack_default, only from `app` via the private `internal` network

volumes:
  db_data:

networks:
  fintrack_default:
    external: true
  internal:
    driver: bridge
