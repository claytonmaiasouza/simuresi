<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SimuResi — Simulador para residencia médica</title>
<style>
  :root{
    --paper:#EEF0EA; --paper-raised:#F8F9F4; --paper-deep:#E3E6DD;
    --ink:#1B2621; --ink-soft:#4B5750; --accent:#0E6E56; --accent-soft:#DCEAE4;
    --accent-ink:#0A4B3C; --critical:#A8362B; --critical-soft:#F3DEDA; --warn:#96631A; --warn-soft:#F1E6D2;
    --line:#C9CFC3; --shadow: 0 1px 0 rgba(27,38,33,.06), 0 8px 20px -12px rgba(27,38,33,.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0F1613; --paper-raised:#172420; --paper-deep:#0B100D;
      --ink:#E7EDE7; --ink-soft:#A9B6AE; --accent:#59D9B3; --accent-soft:#16352C;
      --accent-ink:#8FE9CD; --critical:#E2695C; --critical-soft:#3A211D; --warn:#D9A94E; --warn-soft:#3A2E14;
      --line:#2B3A34; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; line-height:1.5;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .display{ font-family:Rockwell,"Roboto Slab",Georgia,serif; font-weight:700; text-wrap:balance; }
  .label{ font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  button,input{font-family:inherit;}

  .folder-tag{
    display:inline-block; background:var(--critical-soft); color:var(--critical); padding:3px 10px;
    border-radius:5px; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; margin-bottom:10px;
  }

  .card{
    width:100%; max-width:420px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px 10px 10px 10px;
    box-shadow:var(--shadow); padding:28px 26px; position:relative;
  }
  .card::before{ content:""; position:absolute; top:-1px; left:-1px; width:34px; height:6px; background:var(--accent); border-radius:0 0 3px 0; }
  .card h1{font-size:1.5rem;margin:6px 0 4px;}
  .card p.sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 20px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.8rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font-size:.95rem;
  }
  .field input:focus{outline:none;border-color:var(--accent);}

  .btn{
    width:100%; padding:12px 18px; border-radius:8px; border:1.5px solid var(--accent); background:var(--accent);
    color:var(--paper-raised); font-weight:700; font-size:.92rem; cursor:pointer; letter-spacing:.02em;
    margin-top:6px;
  }
  .btn:disabled{opacity:.6;cursor:not-allowed;}

  .forgot-link{ text-align:right; margin:-6px 0 14px; }
  .forgot-link a{ color:var(--ink-soft); font-size:.8rem; cursor:pointer; text-decoration:none; }
  .forgot-link a:hover{ text-decoration:underline; color:var(--accent-ink); }

  .switch{margin-top:18px;text-align:center;font-size:.86rem;color:var(--ink-soft);}
  .switch a{color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;}
  .switch a:hover{text-decoration:underline;}

  .error-box{
    margin:0 0 16px; padding:10px 12px; border-radius:8px; background:var(--critical-soft);
    border:1px solid var(--critical); color:var(--ink); font-size:.85rem; display:none;
  }
  .error-box.show{display:block;}
  .success-box{
    margin:0 0 16px; padding:10px 12px; border-radius:8px; background:var(--accent-soft);
    border:1px solid var(--accent); color:var(--accent-ink); font-size:.85rem; display:none;
  }
  .success-box.show{display:block;}
</style>
</head>
<body>
  <div class="card">
    <div class="display" style="font-size:1.6rem;letter-spacing:.01em;margin:0 0 6px;color:var(--accent);">SimuResi</div>
    <span class="folder-tag">Entrenamiento cronometrado</span>
    <h1 class="display" id="formTitle">Iniciar sesión</h1>
    <p class="sub" id="formSub">Entrá a tu cuenta para seguir tu progreso.</p>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <form id="authForm">
      <div class="field" id="nameField" hidden>
        <label for="name">Nombre</label>
        <input type="text" id="name" autocomplete="name" maxlength="80">
      </div>
      <div class="field" id="emailField">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" maxlength="254">
      </div>
      <div class="field" id="passwordField">
        <label for="password" id="passwordLabel">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" minlength="8" maxlength="72">
      </div>
      <div class="field" id="password2Field" hidden>
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" autocomplete="new-password" minlength="8" maxlength="72">
      </div>
      <div class="forgot-link" id="forgotLink"><a id="forgotLinkA">¿Olvidaste tu contraseña?</a></div>
      <button class="btn" type="submit" id="submitBtn">Iniciar sesión</button>
    </form>

    <p class="switch" id="switchLine">
      ¿No tenés cuenta? <a id="switchLink">Creá una</a>
    </p>
  </div>

<script>
(function(){
  var mode = "login"; // "login" | "signup" | "forgot" | "reset"
  var resetToken = null;
  var form = document.getElementById("authForm");
  var nameField = document.getElementById("nameField");
  var nameInput = document.getElementById("name");
  var emailField = document.getElementById("emailField");
  var emailInput = document.getElementById("email");
  var passwordField = document.getElementById("passwordField");
  var passwordLabel = document.getElementById("passwordLabel");
  var passwordInput = document.getElementById("password");
  var password2Field = document.getElementById("password2Field");
  var password2Input = document.getElementById("password2");
  var forgotLink = document.getElementById("forgotLink");
  var submitBtn = document.getElementById("submitBtn");
  var errorBox = document.getElementById("errorBox");
  var successBox = document.getElementById("successBox");
  var formTitle = document.getElementById("formTitle");
  var formSub = document.getElementById("formSub");
  var switchLine = document.getElementById("switchLine");

  function hideMessages(){
    errorBox.classList.remove("show");
    successBox.classList.remove("show");
  }
  function showError(msg){
    hideMessages();
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }
  function showSuccess(msg){
    hideMessages();
    successBox.textContent = msg;
    successBox.classList.add("show");
  }

  function setMode(next){
    mode = next;
    hideMessages();
    nameField.hidden = true;
    emailField.hidden = false;
    passwordField.hidden = false;
    password2Field.hidden = true;
    forgotLink.hidden = false;
    passwordInput.value = "";
    password2Input.value = "";
    passwordInput.required = true;
    emailInput.required = true;

    if(mode==="signup"){
      formTitle.textContent = "Crear cuenta";
      formSub.textContent = "Registrate para empezar a estudiar y guardar tu progreso.";
      nameField.hidden = false;
      passwordInput.setAttribute("autocomplete","new-password");
      passwordLabel.textContent = "Contraseña";
      forgotLink.hidden = true;
      submitBtn.textContent = "Crear cuenta";
      switchLine.innerHTML = '¿Ya tenés cuenta? <a id="switchLink">Iniciá sesión</a>';
    } else if(mode==="forgot"){
      formTitle.textContent = "Recuperar contraseña";
      formSub.textContent = "Escribí tu email y te mandamos un enlace para crear una contraseña nueva.";
      passwordField.hidden = true;
      passwordInput.required = false;
      forgotLink.hidden = true;
      submitBtn.textContent = "Enviar enlace";
      switchLine.innerHTML = '<a id="switchLink">Volver a iniciar sesión</a>';
    } else if(mode==="reset"){
      formTitle.textContent = "Crear nueva contraseña";
      formSub.textContent = "Elegí una contraseña nueva para tu cuenta.";
      emailField.hidden = true;
      emailInput.required = false;
      password2Field.hidden = false;
      passwordInput.setAttribute("autocomplete","new-password");
      passwordLabel.textContent = "Contraseña nueva";
      forgotLink.hidden = true;
      submitBtn.textContent = "Guardar contraseña";
      switchLine.innerHTML = '<a id="switchLink">Volver a iniciar sesión</a>';
    } else {
      formTitle.textContent = "Iniciar sesión";
      formSub.textContent = "Entrá a tu cuenta para seguir tu progreso.";
      passwordInput.setAttribute("autocomplete","current-password");
      passwordLabel.textContent = "Contraseña";
      submitBtn.textContent = "Iniciar sesión";
      switchLine.innerHTML = '¿No tenés cuenta? <a id="switchLink">Creá una</a>';
    }
  }
  // event delegation: switchLine itself is never replaced, only its inner
  // <a>, so one listener here survives every setMode() re-render.
  switchLine.addEventListener("click", function(e){
    if(e.target && e.target.id==="switchLink"){
      // From "reset" or "forgot", the natural way back is always "login".
      setMode(mode==="login" ? "signup" : "login");
      history.replaceState(null, "", "/login");
    }
  });
  forgotLink.addEventListener("click", function(e){
    if(e.target && e.target.id==="forgotLinkA"){
      setMode("forgot");
    }
  });

  var ERROR_MESSAGES = {
    invalid_credentials: "Email o contraseña incorrectos.",
    email_in_use: "Ese email ya está registrado. Iniciá sesión en su lugar.",
    invalid_input: "Revisá los datos ingresados.",
    too_many_requests: "Demasiados intentos. Esperá unos minutos e intentá de nuevo.",
    invalid_or_expired_token: "Este enlace ya no es válido. Pedí uno nuevo.",
  };

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    hideMessages();

    if(mode==="reset" && passwordInput.value !== password2Input.value){
      showError("Las contraseñas no coinciden.");
      return;
    }

    submitBtn.disabled = true;
    try{
      if(mode==="forgot"){
        var email = emailInput.value.trim();
        await fetch("/api/auth/forgot-password", {
          method:"POST", credentials:"include", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({email:email})
        });
        // Always shown, whether or not that email is actually registered.
        showSuccess("Si ese email tiene una cuenta, te mandamos un enlace para recuperar tu contraseña. Revisá tu bandeja de entrada (y spam).");
        return;
      }

      if(mode==="reset"){
        var res = await fetch("/api/auth/reset-password", {
          method:"POST", credentials:"include", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({token:resetToken, password:passwordInput.value})
        });
        if(res.ok){
          history.replaceState(null, "", "/login");
          setMode("login");
          showSuccess("Contraseña actualizada. Ya podés iniciar sesión.");
          return;
        }
        var data = await res.json().catch(function(){ return {}; });
        showError(ERROR_MESSAGES[data.error] || "No se pudo actualizar la contraseña. Pedí un enlace nuevo.");
        return;
      }

      // login / signup
      var pwd = passwordInput.value;
      var name = nameInput.value.trim();
      var url = mode==="login" ? "/api/auth/login" : "/api/auth/signup";
      var body = mode==="login" ? {email:emailInput.value.trim(),password:pwd} : {email:emailInput.value.trim(),password:pwd,name:name||undefined};

      var res2 = await fetch(url, {
        method:"POST", credentials:"include",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });
      if(res2.ok){
        window.location.href = "/app";
        return;
      }
      var data2 = await res2.json().catch(function(){ return {}; });
      showError(ERROR_MESSAGES[data2.error] || "Ocurrió un error. Intentá de nuevo.");
    }catch(err){
      showError("No se pudo conectar. Revisá tu conexión e intentá de nuevo.");
    }finally{
      submitBtn.disabled = false;
    }
  });

  // "/login?reset=<token>" -- the link we email out -- opens straight into
  // the "set new password" form instead of the login form.
  var params = new URLSearchParams(window.location.search);
  var tokenFromUrl = params.get("reset");
  if(tokenFromUrl){
    resetToken = tokenFromUrl;
    setMode("reset");
  } else {
    setMode("login");
  }
})();
</script>
</body>
</html>
