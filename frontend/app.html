{id:"21b2-p16",area:"PED",q:"La erradicación del estado de portador de Estreptococo grupo A (EGA) se realiza en situaciones de",opts:[["A","ASTO positivo"],["B","Faringitis recurrente"],["C","Antecedentes personales de fiebre reumática"],["D","Cultivo de secreción faríngea positiva para Estreptococo grupo A (EGA)"]],ans:"C",exp:"La erradicación del estado de portador de Estreptococo grupo A se indica en pacientes con antecedentes personales de fiebre reumática, para prevenir recurrencias.",wrong:{A:"Un ASTO positivo aislado no es indicación para erradicar el estado de portador de estreptococo del grupo A.",B:"La faringitis recurrente por sí sola no constituye indicación estándar para erradicar el estado de portador.",D:"Un cultivo faríngeo positivo sin antecedente de fiebre reumática no justifica por sí solo la erradicación del portador."}},
{id:"21b2-p17",area:"PED",q:"¿Cuál de las siguientes características implican mayor riesgo de muerte o deterioro en recién nacidos con asfixia perinatal?",opts:[["A","Índices de Apgar de 0-3 al 1 minuto"],["B","Déficit de base alto (>20-25 mmol/l)"],["C","pH >6,7 de la sangre inicial o del cordón umbilical"],["D","Persistencia de la encefalopatía a las 12 horas de vida"]],ans:"B",exp:"Un déficit de base alto (>20-25 mmol/L) en la asfixia perinatal se asocia a mayor riesgo de muerte o deterioro neurológico.",wrong:{A:"Un Apgar bajo al minuto es un signo inicial, pero se asocia a peor pronóstico si persiste más allá de los 5 o 10 minutos.",C:"Un pH tan extremo referido así no representa por sí solo el marcador de mayor riesgo comparado con el déficit de base elevado.",D:"La persistencia de encefalopatía a las 12 horas es de mal pronóstico, pero el déficit de base elevado es el marcador más determinante."}},
{id:"21b2-p18",area:"PED",q:"José de 4 meses presenta tos de 48 horas de evolución, sin fiebre, la madre refiere episodio de rinorrea de 1 semana de evolución. Luego de examinarlo, usted constata sibilancias y sospecha que puede tratarse de una Bronquiolitis. ¿Cómo se realiza el diagnóstico?",opts:[["A","Solicitando radiografía de tórax"],["B","Realizando hemograma y PCR"],["C","Realizando un exhaustivo examen físico"],["D","Solicitando hisopado para virus respiratorios"]],ans:"C",exp:"El diagnóstico de bronquiolitis es fundamentalmente clínico, mediante un examen físico exhaustivo, sin requerir estudios complementarios de rutina.",wrong:{A:"La radiografía de tórax no es necesaria de rutina para el diagnóstico de bronquiolitis, que es clínico.",B:"El hemograma y la PCR no aportan al diagnóstico de bronquiolitis, que se basa en la clínica.",D:"El hisopado para virus respiratorios identifica el agente etiológico, pero no es necesario para establecer el diagnóstico clínico."}},
{id:"21b2-p19",area:"PED",q:"Llega a la urgencia paciente de 15 meses de edad, con antecedente de accidente doméstico (caída sobre agua caliente) 30 minutos antes, al examen físico se observa irritable por dolor, con eritema y ampollas distribuidas que corresponden a un 15% de superficie corporal quemada (SCQ), se han realizado los primeros cuidados y debe indicar su hidratación parenteral con:",opts:[["A","Suero fisiológico o ringer lactato a 10cc/kg por SCQ"],["B","Dextro fisiológico volumen 4ml/kg por SCQ"],["C","Suero fisiológico + cloruro de sodio a 2ml/kg por SCQ"],["D","Suero fisiológico + cloruro de potasio a 4ml/kg por SCQ"]],ans:"D",exp:"En quemaduras del 15% SCQ, la hidratación parenteral incluye suero fisiológico con cloruro de potasio a 4 mL/kg por SCQ, según los protocolos de reposición.",wrong:{A:"10 mL/kg por SCQ no corresponde a la fórmula estándar de reposición utilizada para el cálculo de líquidos en quemados.",B:"El uso de suero dextrosado fisiológico no corresponde al esquema de reposición hidroelectrolítica recomendado en quemaduras extensas.",C:"2 mL/kg por SCQ subestima el volumen de reposición necesario según los protocolos de manejo de quemaduras."}},
{id:"21b2-p20",area:"PED",q:"Acude a la urgencia un niño de 8 años por dolor abdominal, náuseas y vómitos, de aproximadamente 24 hs de evolución. No tolera la vía oral por lo que no ha podido recibir líquidos. Al examinarlo le llama la atención el estado de deshidratación, y le preocupa la hipotensión ortostática y la poliuria que presenta. Usted sospecha que se trata de:",opts:[["A","Una gastroenteritis bacteriana"],["B","Una cetoacidosis diabética"],["C","Un shock hipovolémico"],["D","Un cuadro quirúrgico"]],ans:"B",exp:"Deshidratación con hipotensión ortostática y poliuria en un niño con dolor abdominal y vómitos sugiere fuertemente una cetoacidosis diabética de debut.",wrong:{A:"Una gastroenteritis bacteriana no suele cursar con poliuria ni con el grado de deshidratación descrito, orientando más a otra causa metabólica.",C:"El shock hipovolémico no explicaría la poliuria, ya que en la depleción de volumen se esperaría oliguria compensatoria.",D:"Un cuadro quirúrgico abdominal no explica la poliuria asociada, que orienta más a un trastorno metabólico como la cetoacidosis."}},
{id:"21b2-p21",area:"PED",q:"El Lupus Eritematoso Sistémico puede ser inducido en los niños por los siguientes fármacos:",opts:[["A","Vancomicina, adenosina, topiramato"],["B","Baclofeno, imipenem, gluconato de calcio"],["C","Noradrenalina, aminofilina, clindamicina"],["D","Difenilhidantoína, penicilina, amiodarona"]],ans:"D",exp:"Difenilhidantoína, penicilina y amiodarona son fármacos que pueden inducir lupus eritematoso sistémico en niños.",wrong:{A:"Vancomicina, adenosina y topiramato no figuran entre los fármacos clásicamente asociados a lupus inducido por drogas.",B:"Baclofeno, imipenem y gluconato de calcio no se encuentran entre los fármacos reconocidos como inductores de lupus.",C:"Noradrenalina, aminofilina y clindamicina no son fármacos descritos como causantes de lupus inducido por drogas."}},
{id:"21b2-p22",area:"PED",q:"Usted se encuentra en sala de partos y recibe un neonato con líquido meconial espeso. El niño nace con llanto vigoroso y una frecuencia cardiaca > 100 latidos por minuto. ¿Qué acciones realizaría a continuación?",opts:[["A","Aspirar la boca y la nariz con una sonda de succión o una perilla"],["B","Intubación y aspirado traqueal de inmediato"],["C","Secar la cara y administrar oxigeno lo antes posible"],["D","Dado las características del líquido, aspirar la tráquea"]],ans:"A",exp:"Ante líquido meconial espeso con RN vigoroso y FC>100, la conducta es aspirar boca y nariz con sonda o perilla, sin intubación traqueal de rutina.",wrong:{B:"La intubación y aspiración traqueal inmediata no está indicada en un recién nacido vigoroso con FC >100, independientemente del meconio.",C:"Secar y administrar oxígeno sin antes despejar la vía aérea superior omite el paso inicial recomendado de aspiración de boca y nariz.",D:"La aspiración traqueal rutinaria ya no se recomienda en recién nacidos vigorosos, incluso con líquido meconial espeso."}},
{id:"21b2-p23",area:"PED",q:"Marcela es una niña de 2 años presenta cuadro de diarrea aguda y en análisis de heces se informa Entamoeba histolytica, el tratamiento adecuado sería:",opts:[["A","Azitromicina"],["B","Metronidazol"],["C","Cotrimoxazol"],["D","Albendazol"]],ans:"B",exp:"El metronidazol es el tratamiento adecuado para la diarrea aguda por Entamoeba histolytica.",wrong:{A:"La azitromicina no es el tratamiento de elección para la amebiasis intestinal por Entamoeba histolytica.",C:"El cotrimoxazol no tiene actividad antiamebiana y no está indicado para tratar Entamoeba histolytica.",D:"El albendazol es un antihelmíntico, sin actividad contra protozoos como Entamoeba histolytica."}},
{id:"21b2-p24",area:"PED",q:"Las comunicaciones interauriculares (CIA) pueden producirse en cualquier parte del tabique interauricular. Cuando están localizados en la región de la fosa oval se denomina Ostium",opts:[["A","Primum"],["B","Secundum"],["C","Tertium"],["D","Cuantum"]],ans:"B",exp:"Las comunicaciones interauriculares localizadas en la región de la fosa oval se denominan tipo Ostium secundum.",wrong:{A:"El Ostium primum se localiza en la porción baja del tabique, cerca de las válvulas auriculoventriculares, no en la fosa oval.",C:"'Ostium tertium' no es una entidad anatómica reconocida en la clasificación de las comunicaciones interauriculares.",D:"'Ostium cuantum' no corresponde a ninguna clasificación anatómica válida de comunicación interauricular."}},
{id:"21b2-p25",area:"PED",q:"¿Cuál de las siguientes es una de las complicaciones más frecuente del dengue en lactantes y niños pequeños?",opts:[["A","Diarrea profusa"],["B","Erupciones dérmicas"],["C","Neumonía"],["D","Convulsiones febriles"]],ans:"D",exp:"Las convulsiones febriles son una de las complicaciones más frecuentes del dengue en lactantes y niños pequeños.",wrong:{A:"La diarrea profusa no es una complicación característica ni frecuente del dengue en lactantes.",B:"Las erupciones dérmicas son una manifestación común del dengue, pero no se consideran una complicación grave frecuente.",C:"La neumonía no es una complicación típicamente asociada al dengue en lactantes y niños pequeños."}},
{id:"21b2-p26",area:"PED",q:"La fase subaguda de la enfermedad de Kawasaki dura:",opts:[["A","Una semana"],["B","Dos semanas"],["C","Tres semanas"],["D","Seis semanas"]],ans:"C",exp:"La fase subaguda de la enfermedad de Kawasaki dura aproximadamente tres semanas.",wrong:{A:"Una semana es un plazo muy corto y corresponde más a la duración de la fase aguda febril de Kawasaki.",B:"Dos semanas subestima la duración real de la fase subaguda de la enfermedad de Kawasaki.",D:"Seis semanas excede la duración habitual descrita para la fase subaguda de la enfermedad de Kawasaki."}},
{id:"21b2-p27",area:"PED",q:"Cuando realiza una reanimación de alta calidad a un niño debe comprimir el tórax",opts:[["A","La mitad de la profundidad del tórax"],["B","Dos tercios de la profundidad del tórax"],["C","Un tercio de la profundidad del tórax"],["D","Un cuarto de la profundidad del tórax"]],ans:"C",exp:"Las guías de reanimación pediátrica recomiendan comprimir el tórax al menos un tercio de su profundidad anteroposterior durante la RCP de alta calidad.",wrong:{A:"Comprimir la mitad de la profundidad torácica excede la recomendación estándar de RCP pediátrica de alta calidad.",B:"Dos tercios de la profundidad torácica es una compresión excesiva respecto a la recomendación de un tercio.",D:"Un cuarto de la profundidad torácica es insuficiente para lograr una compresión eficaz durante la RCP pediátrica."}},
{id:"21b2-p28",area:"PED",q:"En la evaluación pediátrica, dentro de la nemotecnia SAMPLE, la E corresponde a:",opts:[["A","Equipos"],["B","Evaluación"],["C","Exposición"],["D","Eventos"]],ans:"C",exp:"En la nemotecnia SAMPLE de evaluación pediátrica, la \"E\" corresponde a Exposición (examen completo del paciente sin ropa, buscando lesiones).",wrong:{A:"'Equipos' no corresponde a ninguna letra de la nemotecnia SAMPLE de evaluación pediátrica.",B:"'Evaluación' no es el término correspondiente a la letra E dentro de la nemotecnia SAMPLE.",D:"'Eventos' relacionados con el cuadro corresponden a otra parte de la historia clínica, no a la letra E de SAMPLE, que es Exposición."}},
{id:"21b2-p29",area:"PED",q:"¿Cuál de las siguientes localizaciones no es sugerente de quemadura por maltrato infantil?",opts:[["A","Nalgas"],["B","Manos"],["C","Cara"],["D","Pies"]],ans:"C",exp:"Las quemaduras en la cara no son una localización especialmente sugerente de maltrato infantil, a diferencia de nalgas, manos o pies (zonas de inmersión forzada o castigo).",wrong:{A:"Las quemaduras en nalgas sí son altamente sugerentes de maltrato, típicas de inmersión forzada en agua caliente.",B:"Las quemaduras en manos, especialmente en patrón de guante, sí son sugerentes de maltrato infantil.",D:"Las quemaduras en pies, en patrón de calcetín, sí son características de quemaduras por inmersión forzada asociadas a maltrato."}},
{id:"21b2-p30",area:"PED",q:"Es característica esencial del trastorno del espectro autista",opts:[["A","Episodios depresivos recurrentes"],["B","Retraso congnitivo"],["C","Deterioro de la interacción social"],["D","Intentos de autoagresión"]],ans:"C",exp:"El deterioro de la interacción social es una característica esencial y nuclear del trastorno del espectro autista.",wrong:{A:"Los episodios depresivos recurrentes no constituyen una característica nuclear ni definitoria del trastorno del espectro autista.",B:"El retraso cognitivo puede coexistir pero no es una característica esencial ni universal del trastorno del espectro autista.",D:"Los intentos de autoagresión pueden presentarse asociados, pero no son la característica esencial que define el trastorno del espectro autista."}}
];

var COUNTS = {CIR:0,GO:0,SP:0,MI:0,PED:0};
Q.forEach(function(q){COUNTS[q.area]++;});

{id:"mi1",deck:"MI",front:"¿Cuáles son los 4 principios básicos de la ética clínica?",back:"Autonomía, beneficencia, no maleficencia y justicia."},
{id:"mi2",deck:"MI",front:"¿Qué es el consentimiento informado?",back:"El proceso por el cual el paciente recibe información suficiente sobre un procedimiento (riesgos, beneficios, alternativas) para decidir libremente si lo acepta."},
{id:"mi3",deck:"MI",front:"En cuidados paliativos, ¿qué diferencia hay entre sedación paliativa y eutanasia?",back:"La sedación paliativa busca aliviar síntomas refractarios reduciendo el nivel de conciencia sin intención de acortar la vida; la eutanasia busca deliberadamente causar la muerte."},
{id:"mi4",deck:"MI",front:"¿Qué es un evento adverso en seguridad del paciente?",back:"Un daño no intencionado al paciente causado por la atención médica (no por la enfermedad de base), que puede ser prevenible o no."},

{id:"mi6",deck:"MI",front:"¿Qué es un síndrome paraneoplásico?",back:"Un conjunto de manifestaciones clínicas a distancia del tumor y sus metástasis, producidas por sustancias secretadas por el tumor o por respuesta inmune cruzada."},
{id:"mi7",deck:"MI",front:"¿Cuál es la causa más común de anemia ferropénica en el adulto?",back:"La pérdida crónica de sangre, sobre todo por el tracto gastrointestinal (en hombres y mujeres posmenopáusicas) o menstrual (en mujeres en edad fértil)."},
{id:"mi8",deck:"MI",front:"¿Qué hallazgo en el frotis de sangre periférica es característico de la anemia megaloblástica?",back:"Neutrófilos hipersegmentados y macrocitosis (VCM elevado)."},
{id:"mi9",deck:"MI",front:"¿Cuál es la diferencia bioquímica principal entre deficiencia de vitamina B12 y de folato?",back:"La deficiencia de B12 eleva tanto el ácido metilmalónico como la homocisteína; la deficiencia de folato solo eleva la homocisteína."},
{id:"mi10",deck:"MI",front:"¿Qué prueba confirma una anemia hemolítica autoinmune?",back:"La prueba de Coombs directa (antiglobulina directa) positiva."},
{id:"mi11",deck:"MI",front:"¿Qué hemoglobinopatía se caracteriza por sustitución de ácido glutámico por valina en la cadena beta?",back:"La anemia de células falciformes (drepanocitosis)."},
{id:"mi12",deck:"MI",front:"¿Cuál es la urgencia oncológica más frecuente asociada a lisis tumoral masiva?",back:"El síndrome de lisis tumoral, con hiperpotasemia, hiperfosfatemia, hiperuricemia e hipocalcemia."},
{id:"mi13",deck:"MI",front:"¿Qué es el síndrome de vena cava superior y cuál es su causa más común?",back:"Obstrucción del retorno venoso por la vena cava superior, con edema facial y de miembros superiores; la causa más común es el cáncer de pulmón."},
{id:"mi14",deck:"MI",front:"¿Cómo se define fiebre de origen desconocido (FOD)?",back:"Temperatura ≥38.3°C en varias ocasiones, de más de 3 semanas de duración, sin diagnóstico tras una semana de estudio hospitalario adecuado."},
{id:"mi15",deck:"MI",front:"¿Cuál es el germen más frecuente de neumonía adquirida en la comunidad?",back:"Streptococcus pneumoniae."},
{id:"mi16",deck:"MI",front:"¿Qué criterios se usan para decidir el manejo ambulatorio vs. hospitalario de una neumonía?",back:"Escalas como CURB-65 o el Pneumonia Severity Index (PSI), que evalúan confusión, urea, frecuencia respiratoria, presión arterial y edad."},
{id:"mi17",deck:"MI",front:"¿Cuáles son los criterios de Duke para endocarditis infecciosa?",back:"Combinan criterios mayores (hemocultivos positivos persistentes, evidencia de afectación endocárdica en ecocardiograma) y menores (fiebre, fenómenos vasculares e inmunológicos, factores predisponentes) para clasificar el diagnóstico como definitivo, posible o rechazado."},
{id:"mi18",deck:"MI",front:"¿Cuál es el agente causal más frecuente de ITU no complicada en mujeres?",back:"Escherichia coli."},
{id:"mi19",deck:"MI",front:"¿Qué distingue clínicamente a la pielonefritis aguda de la cistitis?",back:"La presencia de fiebre, dolor lumbar (puñopercusión positiva) y afectación del estado general, además de los síntomas urinarios bajos."},
{id:"mi20",deck:"MI",front:"¿Cuál es la tríada clásica de la meningitis bacteriana?",back:"Fiebre, cefalea y rigidez de nuca (signos meníngeos), que puede acompañarse de alteración del sensorio."},
{id:"mi21",deck:"MI",front:"¿Qué hallazgo en el LCR es típico de meningitis bacteriana vs. viral?",back:"Bacteriana: pleocitosis con predominio de polimorfonucleares, glucosa baja y proteínas altas. Viral: pleocitosis linfocitaria, glucosa normal."},
{id:"mi22",deck:"MI",front:"¿Cuál es el esquema de tratamiento acortado estándar para tuberculosis pulmonar sensible?",back:"2 meses de HRZE (isoniazida, rifampicina, pirazinamida, etambutol) seguidos de 4 meses de HR (isoniazida y rifampicina)."},
{id:"mi23",deck:"MI",front:"¿Qué define un diagnóstico de SIDA en un paciente VIH positivo?",back:"Un recuento de linfocitos CD4 menor a 200 cél/mm³ o la presencia de una enfermedad definitoria de SIDA."},
{id:"mi24",deck:"MI",front:"¿Cuál es el vector de la enfermedad de Chagas y cómo se transmite principalmente en zonas endémicas rurales?",back:"El triatomino (vinchuca); se transmite por contacto de heces del insecto infectado con mucosas o piel lesionada tras la picadura."},
{id:"mi25",deck:"MI",front:"¿Cuál es el agente causal del paludismo más grave y potencialmente mortal?",back:"Plasmodium falciparum."},
{id:"mi26",deck:"MI",front:"¿Qué es el signo de Romaña y en qué enfermedad aparece?",back:"Edema bipalpebral unilateral indoloro, signo de puerta de entrada ocular en la fase aguda de la enfermedad de Chagas."},
{id:"mi27",deck:"MI",front:"¿Qué marcador bioquímico es más sensible y específico para infarto agudo de miocardio?",back:"La troponina cardíaca (T o I) de alta sensibilidad."},
{id:"mi28",deck:"MI",front:"¿Cuál es la diferencia electrocardiográfica clave entre SCA con elevación del ST y sin elevación del ST?",back:"El SCACEST muestra elevación persistente del segmento ST (u onda Q nueva/BRIHH nuevo); el SCASEST no presenta elevación del ST, pudiendo tener descenso del ST o inversión de T."},
{id:"mi29",deck:"MI",front:"¿Cuál es el mecanismo de la fibrilación auricular?",back:"Múltiples circuitos de reentrada auriculares desorganizados que generan una activación auricular caótica e irregular, sin contracción auricular efectiva."},
{id:"mi30",deck:"MI",front:"¿Cuáles son los 4 pilares farmacológicos del tratamiento de la insuficiencia cardíaca con fracción de eyección reducida?",back:"IECA/ARA-II o ARNI, betabloqueante, antagonista de mineralocorticoides e inhibidores de SGLT2."},
{id:"mi31",deck:"MI",front:"¿Cuál es la valvulopatía más frecuentemente asociada a fiebre reumática?",back:"La estenosis mitral."},
{id:"mi32",deck:"MI",front:"¿Cómo se clasifica la hipertensión arterial según las guías actuales (valores generales para adultos)?",back:"Normal <120/80, elevada 120-129/<80, HTA estadio 1 130-139/80-89, HTA estadio 2 ≥140/90 mmHg."},
{id:"mi33",deck:"MI",front:"¿Qué es el soplo de Austin Flint y en qué patología se ausculta?",back:"Un soplo mesodiastólico apical funcional causado por el chorro de regurgitación aórtica que choca contra la válvula mitral; se observa en la insuficiencia aórtica severa."},
{id:"mi34",deck:"MI",front:"¿Cuál es el criterio espirométrico diagnóstico de EPOC?",back:"Un cociente FEV1/FVC posbroncodilatador menor a 0.70."},
{id:"mi35",deck:"MI",front:"¿Qué caracteriza fisiopatológicamente al asma bronquial?",back:"Inflamación crónica de la vía aérea con hiperreactividad bronquial y obstrucción reversible del flujo aéreo."},
{id:"mi36",deck:"MI",front:"¿Qué patrón funcional respiratorio predomina en las enfermedades pulmonares intersticiales?",back:"Patrón restrictivo, con disminución de la capacidad pulmonar total y de la capacidad de difusión de monóxido de carbono (DLCO)."},
{id:"mi37",deck:"MI",front:"¿Cuál es la escala clínica más usada para estimar la probabilidad de tromboembolismo pulmonar?",back:"La escala de Wells."},
{id:"mi38",deck:"MI",front:"¿Cuál es el estudio de elección para confirmar el diagnóstico de TEP en un paciente estable?",back:"La angiotomografía computarizada de tórax (angio-TC pulmonar)."},
{id:"mi39",deck:"MI",front:"¿Cómo se clasifica la lesión renal aguda según su origen?",back:"Prerrenal (hipoperfusión), renal o intrínseca (daño parenquimatoso) y posrenal (obstrucción del tracto urinario)."},
{id:"mi40",deck:"MI",front:"¿Qué criterio de tasa de filtración glomerular y tiempo define la enfermedad renal crónica?",back:"TFG menor a 60 mL/min/1.73m² durante más de 3 meses, con o sin marcadores de daño renal."},
{id:"mi41",deck:"MI",front:"¿Cuál es la causa más común de hiponatremia en pacientes hospitalizados?",back:"El síndrome de secreción inadecuada de hormona antidiurética (SIADH)."},
{id:"mi42",deck:"MI",front:"¿Cómo se interpreta un pH bajo con bicarbonato bajo y compensación respiratoria (PCO2 baja)?",back:"Acidosis metabólica con compensación respiratoria (hiperventilación compensadora)."},
{id:"mi43",deck:"MI",front:"¿Cuál es el trastorno electrolítico más peligroso asociado a arritmias graves y cambios en el ECG (ondas T picudas)?",back:"La hiperpotasemia."},
{id:"mi44",deck:"MI",front:"¿Cuál es la causa más frecuente de cirrosis hepática a nivel mundial?",back:"La hepatitis viral crónica (B y C) y la enfermedad hepática por alcohol; en países desarrollados también la esteatohepatitis no alcohólica."},
{id:"mi45",deck:"MI",front:"¿Qué escala se usa para estimar la gravedad y pronóstico de la pancreatitis aguda al ingreso?",back:"Los criterios de Ranson (o APACHE II, BISAP)."},
{id:"mi46",deck:"MI",front:"¿Cuáles son los dos principales tipos de enfermedad inflamatoria intestinal y su diferencia clave en la extensión de la afectación?",back:"Enfermedad de Crohn (afectación transmural, discontinua, cualquier segmento del tubo digestivo) y colitis ulcerosa (afectación continua limitada a la mucosa del colon y recto)."},
{id:"mi47",deck:"MI",front:"¿Cuál es la causa más común de hemorragia digestiva alta no varicosa?",back:"La úlcera péptica (gástrica o duodenal)."},
{id:"mi48",deck:"MI",front:"¿Qué escala se usa para estratificar el riesgo de resangrado y mortalidad en hemorragia digestiva alta?",back:"La escala de Rockall (o Glasgow-Blatchford para necesidad de intervención)."},
{id:"mi49",deck:"MI",front:"¿Cuáles son los criterios diagnósticos de diabetes mellitus según glucemia en ayunas y HbA1c?",back:"Glucemia en ayunas ≥126 mg/dL, glucemia al azar ≥200 mg/dL con síntomas, PTOG a las 2h ≥200 mg/dL, o HbA1c ≥6.5%."},
{id:"mi50",deck:"MI",front:"¿Cuál es la causa más frecuente de hipertiroidismo?",back:"La enfermedad de Graves-Basedow (de origen autoinmune)."},
{id:"mi51",deck:"MI",front:"¿Qué anticuerpos son característicos de la tiroiditis de Hashimoto?",back:"Anticuerpos antiperoxidasa tiroidea (anti-TPO) y antitiroglobulina."},
{id:"mi52",deck:"MI",front:"¿Cuál es la causa más común de insuficiencia suprarrenal primaria (enfermedad de Addison) en países desarrollados?",back:"La adrenalitis autoinmune."},
{id:"mi53",deck:"MI",front:"¿Qué tríada clínica sugiere feocromocitoma?",back:"Cefalea, palpitaciones y sudoración episódica, asociadas a hipertensión paroxística."},
{id:"mi54",deck:"MI",front:"¿Cuál es la ventana terapéutica estándar para trombólisis intravenosa en ACV isquémico agudo?",back:"Hasta 4.5 horas desde el inicio de los síntomas."},
{id:"mi55",deck:"MI",front:"¿Qué diferencia clínica principal distingue un ACV isquémico de uno hemorrágico en la presentación inicial?",back:"No pueden distinguirse solo por clínica con certeza; se requiere neuroimagen (TC de cráneo sin contraste), aunque la hemorragia suele tener inicio más súbito con cefalea intensa y deterioro rápido de conciencia."},
{id:"mi56",deck:"MI",front:"¿Cuál es el mecanismo fisiopatológico del síndrome de Guillain-Barré?",back:"Una polineuropatía desmielinizante inflamatoria aguda de origen autoinmune, frecuentemente posinfecciosa, que produce debilidad ascendente y arreflexia."},
{id:"mi57",deck:"MI",front:"¿Cuál es el defecto fisiopatológico central en la miastenia gravis?",back:"Producción de autoanticuerpos contra los receptores de acetilcolina en la placa neuromuscular postsináptica, causando debilidad muscular fluctuante que empeora con el esfuerzo."},
{id:"mi58",deck:"MI",front:"¿Cómo se clasifican las crisis epilépticas según su origen inicial?",back:"Focales (inician en una red neuronal limitada a un hemisferio) y generalizadas (comprometen ambos hemisferios desde el inicio)."},
{id:"mi59",deck:"MI",front:"¿Cuál es el germen más frecuente causante de artritis séptica en adultos jóvenes sexualmente activos?",back:"Neisseria gonorrhoeae."},
{id:"mi60",deck:"MI",front:"¿Qué autoanticuerpo es más específico para el diagnóstico de artritis reumatoide?",back:"El anticuerpo anti-péptido citrulinado cíclico (anti-CCP)."},
{id:"mi61",deck:"MI",front:"¿Cuál es el criterio serológico más específico para el diagnóstico de lupus eritematoso sistémico?",back:"Los anticuerpos anti-ADN de doble cadena (anti-dsDNA) y anti-Sm."},
{id:"cir1",deck:"CIR",front:"¿Qué escala se usa universalmente para clasificar el riesgo preoperatorio según el estado físico del paciente?",back:"La clasificación del estado físico de la ASA (American Society of Anesthesiologists), de I a VI."},
{id:"cir2",deck:"CIR",front:"¿Cuáles son las 3 causas más frecuentes de fiebre en el postoperatorio inmediato (primeras 48h)?",back:"Atelectasia pulmonar, reacción inflamatoria a la cirugía y, con menor frecuencia, infección temprana de sitio quirúrgico."},
{id:"cir3",deck:"CIR",front:"¿Qué es la dehiscencia de una herida quirúrgica?",back:"La separación de los bordes de una herida previamente suturada, que puede ser superficial o comprometer la fascia (con riesgo de evisceración)."},
{id:"cir4",deck:"CIR",front:"¿Cuál es la profilaxis estándar para tromboembolismo venoso en cirugía mayor de riesgo moderado-alto?",back:"Heparina de bajo peso molecular subcutánea, asociada a medidas mecánicas (compresión neumática intermitente)."},
{id:"cir5",deck:"CIR",front:"¿Qué es el íleo paralítico postoperatorio y cuánto suele durar fisiológicamente?",back:"La inhibición transitoria de la motilidad intestinal tras la cirugía abdominal, que habitualmente se resuelve en 2 a 4 días."},
{id:"cir6",deck:"CIR",front:"¿Cuál es la secuencia del ABCDE en la evaluación primaria del politraumatizado?",back:"A: vía aérea con control cervical, B: ventilación/respiración, C: circulación y control de hemorragias, D: déficit neurológico, E: exposición y control de hipotermia."},
{id:"cir7",deck:"CIR",front:"¿Cuáles son los signos clásicos del neumotórax a tensión?",back:"Dificultad respiratoria severa, desviación traqueal contralateral, ausencia de murmullo vesicular, ingurgitación yugular e hipotensión."},
{id:"cir8",deck:"CIR",front:"¿Cuál es la conducta inmediata ante un neumotórax a tensión?",back:"Descompresión torácica inmediata con aguja (2° espacio intercostal, línea medioclavicular) seguida de colocación de tubo torácico."},
{id:"cir9",deck:"CIR",front:"¿Qué caracteriza a la tríada de Beck en el taponamiento cardíaco?",back:"Hipotensión arterial, ingurgitación yugular y ruidos cardíacos apagados."},
{id:"cir10",deck:"CIR",front:"¿Cómo se clasifica la profundidad de una quemadura de segundo grado superficial?",back:"Compromiso de epidermis y dermis papilar, con formación de flictenas (ampollas), dolorosa, de aspecto rosado y buen relleno capilar."},
{id:"cir11",deck:"CIR",front:"¿Qué fórmula se usa para calcular el requerimiento de líquidos en las primeras 24h en el gran quemado?",back:"La fórmula de Parkland: 4 mL x kg de peso x % de superficie corporal quemada, administrando la mitad en las primeras 8 horas."},
{id:"cir12",deck:"CIR",front:"¿Cuál es la secuencia clásica de síntomas de la apendicitis aguda (cronología de Murphy)?",back:"Dolor periumbilical vago, seguido de anorexia/náuseas, migración del dolor a fosa ilíaca derecha y luego fiebre."},
{id:"cir13",deck:"CIR",front:"¿Qué signo clínico es característico de la colecistitis aguda al examen físico?",back:"El signo de Murphy (interrupción de la inspiración profunda al palpar el hipocondrio derecho)."},
{id:"cir14",deck:"CIR",front:"¿Cuáles son los criterios de Ranson usados al ingreso para pancreatitis aguda?",back:"Edad, leucocitosis, glucemia, LDH y AST/TGO séricos, evaluados en las primeras 48 horas para estimar gravedad."},
{id:"cir15",deck:"CIR",front:"¿Cuál es la causa más frecuente de obstrucción de intestino delgado en pacientes con cirugía abdominal previa?",back:"Las bridas o adherencias postoperatorias."},
{id:"cir16",deck:"CIR",front:"¿Cuál es el signo radiológico clásico de perforación de víscera hueca en una radiografía simple de abdomen?",back:"El neumoperitoneo, visible como aire libre subdiafragmático."},
{id:"cir17",deck:"CIR",front:"¿Cuál es la tríada clásica de la obstrucción intestinal mecánica?",back:"Dolor abdominal cólico, distensión abdominal y vómitos, con ausencia de eliminación de gases y heces."},
{id:"cir18",deck:"CIR",front:"¿Qué es el signo de Blumberg y qué indica?",back:"Dolor a la descompresión brusca del abdomen, indicativo de irritación peritoneal."},
{id:"cir19",deck:"CIR",front:"¿Cuál es la diferencia anatómica entre hernia inguinal directa e indirecta?",back:"La directa protruye medial a los vasos epigástricos inferiores a través del triángulo de Hesselbach; la indirecta lo hace lateral a ellos, siguiendo el trayecto del conducto inguinal."},
{id:"cir20",deck:"CIR",front:"¿Cuál es la hernia abdominal más frecuente en mujeres adultas mayores y con mayor riesgo de estrangulación?",back:"La hernia femoral (crural)."},
{id:"cir21",deck:"CIR",front:"¿Qué es una hernia de Richter?",back:"Una hernia en la que solo un borde de la pared intestinal (no toda la circunferencia) queda atrapado en el saco herniario, pudiendo estrangularse sin producir obstrucción completa."},
{id:"cir22",deck:"CIR",front:"¿Cuál es el tratamiento definitivo de la hernia umbilical del adulto?",back:"La reparación quirúrgica, habitualmente con malla protésica para reducir la recurrencia."},
{id:"cir23",deck:"CIR",front:"¿Cuál es el factor de riesgo más importante para el desarrollo de una hernia incisional?",back:"La infección del sitio quirúrgico previo y la dehiscencia de la fascia."},
{id:"cir24",deck:"CIR",front:"¿Cuál es el mecanismo fisiopatológico principal de la enfermedad por reflujo gastroesofágico?",back:"La relajación transitoria inapropiada del esfínter esofágico inferior, que permite el paso retrógrado del contenido gástrico al esófago."},
{id:"cir25",deck:"CIR",front:"¿Cuál es la diferencia entre hernia hiatal por deslizamiento (tipo I) y por rodamiento (tipo II)?",back:"En la tipo I, la unión gastroesofágica se desplaza hacia el tórax; en la tipo II, el cardias permanece en su posición normal y es el fondo gástrico el que se hernia junto a él."},
{id:"cir26",deck:"CIR",front:"¿Cuál es la complicación más temida del esófago de Barrett?",back:"La progresión a adenocarcinoma esofágico."},
{id:"cir27",deck:"CIR",front:"¿Cuál es la localización más frecuente del cáncer gástrico?",back:"El antro gástrico (región distal)."},
{id:"cir28",deck:"CIR",front:"¿Cuál es la clasificación de Bormann usada en cáncer gástrico avanzado?",back:"Clasifica el aspecto macroscópico del tumor en 4 tipos: polipoide, ulcerado, ulcerado infiltrante y difusamente infiltrante (linitis plástica)."},
{id:"cir29",deck:"CIR",front:"¿Cuál es la causa más frecuente de sangrado digestivo bajo en adultos mayores?",back:"La enfermedad diverticular del colon."},
{id:"cir30",deck:"CIR",front:"¿Cuál es el tumor benigno más común del intestino delgado?",back:"El leiomioma (aunque los pólipos adenomatosos también son frecuentes según la serie)."},
{id:"cir31",deck:"CIR",front:"¿Cuál es la localización más frecuente del cáncer colorrectal?",back:"El colon sigmoide y el recto."},
{id:"cir32",deck:"CIR",front:"¿Cuál es la causa más frecuente de colecistitis aguda?",back:"La obstrucción del conducto cístico por un cálculo biliar (litiásica), que representa la gran mayoría de los casos."},
{id:"cir33",deck:"CIR",front:"¿Qué es la tríada de Charcot y en qué patología aparece?",back:"Fiebre, ictericia y dolor en hipocondrio derecho; característica de la colangitis aguda."},
{id:"cir34",deck:"CIR",front:"¿Qué agrega la péntada de Reynolds a la tríada de Charcot y qué indica?",back:"Confusión mental e hipotensión, indicando colangitis aguda supurativa/tóxica grave."},
{id:"cir35",deck:"CIR",front:"¿Cuáles son las dos causas más frecuentes de pancreatitis aguda?",back:"La litiasis biliar y el consumo excesivo de alcohol."},
{id:"cir36",deck:"CIR",front:"¿Cuál es el estudio de elección inicial ante sospecha de coledocolitiasis?",back:"La ecografía abdominal, complementada con colangioresonancia si persiste la sospecha."},
{id:"cir37",deck:"CIR",front:"¿Cuál es el tumor maligno más frecuente del páncreas y su localización habitual?",back:"El adenocarcinoma ductal, que se localiza con mayor frecuencia en la cabeza del páncreas."},
{id:"cir38",deck:"CIR",front:"¿Cuál es el ganglio centinela y para qué se usa en cáncer de mama?",back:"El primer ganglio linfático que recibe el drenaje de un tumor; su biopsia permite evaluar la diseminación axilar sin necesidad de vaciamiento axilar completo si es negativo."},
{id:"cir39",deck:"CIR",front:"¿Cuál es la variante histológica más frecuente de cáncer de tiroides?",back:"El carcinoma papilar de tiroides."},
{id:"cir40",deck:"CIR",front:"¿Qué marcador tumoral se eleva característicamente en el carcinoma medular de tiroides?",back:"La calcitonina."},
{id:"cir41",deck:"CIR",front:"¿Cuál es el principio quirúrgico oncológico básico en la resección de cáncer de colon?",back:"La resección del segmento afectado con márgenes adecuados junto con la linfadenectomía regional siguiendo el territorio vascular correspondiente."},
{id:"cir42",deck:"CIR",front:"¿Qué marcador tumoral se utiliza para el seguimiento del cáncer colorrectal?",back:"El antígeno carcinoembrionario (CEA)."},
{id:"cir43",deck:"CIR",front:"¿Cómo se clasifican las heridas quirúrgicas según su grado de contaminación?",back:"Limpias, limpias-contaminadas, contaminadas y sucias/infectadas."},
{id:"cir44",deck:"CIR",front:"¿Cuál es el momento óptimo para administrar la profilaxis antibiótica preoperatoria?",back:"Dentro de los 60 minutos previos a la incisión quirúrgica."},
{id:"cir45",deck:"CIR",front:"¿Cuál es el patógeno más frecuentemente implicado en la infección del sitio quirúrgico?",back:"Staphylococcus aureus."},
{id:"cir46",deck:"CIR",front:"¿Qué caracteriza a la fascitis necrotizante y por qué se considera una urgencia quirúrgica?",back:"Es una infección necrotizante rápidamente progresiva del tejido subcutáneo y la fascia, con dolor desproporcionado al examen físico y alta mortalidad; requiere desbridamiento quirúrgico urgente."},
{id:"cir47",deck:"CIR",front:"¿Cuál es el manejo básico de una herida contaminada por mordedura?",back:"Lavado abundante, desbridamiento del tejido desvitalizado, profilaxis antibiótica y evaluación del estado de vacunación antitetánica (y antirrábica si corresponde)."},
{id:"go1",deck:"GO",front:"¿Cuáles son las 3 fases del ciclo ovárico?",back:"Fase folicular, ovulación y fase lútea."},
{id:"go2",deck:"GO",front:"¿Qué hormona desencadena la ovulación y por qué mecanismo?",back:"El pico de LH (hormona luteinizante), desencadenado por la retroalimentación positiva del estradiol elevado en la fase folicular tardía."},
{id:"go3",deck:"GO",front:"¿Cómo se clasifica la amenorrea según el momento de presentación?",back:"Primaria (ausencia de menarca a los 15-16 años) y secundaria (ausencia de menstruación por más de 3-6 meses en mujer previamente menstruando)."},
{id:"go4",deck:"GO",front:"¿Cuál es la causa más frecuente de amenorrea secundaria en mujeres en edad fértil?",back:"El embarazo."},
{id:"go5",deck:"GO",front:"¿Qué es la metrorragia?",back:"El sangrado uterino anormal que ocurre fuera del período menstrual esperado, de forma irregular en cantidad y momento."},
{id:"go6",deck:"GO",front:"¿Cuál es la causa más común de sangrado uterino anormal en la adolescencia?",back:"La anovulación por inmadurez del eje hipotálamo-hipófisis-ovario."},
{id:"go7",deck:"GO",front:"¿Qué es el síndrome de ovario poliquístico y cuáles son sus criterios diagnósticos principales (Rotterdam)?",back:"Trastorno endocrino caracterizado por al menos 2 de 3 criterios: oligo/anovulación, hiperandrogenismo clínico o bioquímico, y morfología de ovario poliquístico en ecografía."},
{id:"go8",deck:"GO",front:"¿Cuál es la causa más frecuente de sangrado uterino anormal en mujeres en edad reproductiva no embarazadas?",back:"Los miomas uterinos (leiomiomas) y las alteraciones ovulatorias."},
{id:"go9",deck:"GO",front:"¿Cuál es el mecanismo principal de acción de los anticonceptivos hormonales combinados?",back:"La inhibición de la ovulación por supresión del eje hipotálamo-hipófisis-ovario (supresión de FSH y LH)."},
{id:"go10",deck:"GO",front:"¿Cuáles son las contraindicaciones absolutas más importantes para el uso de anticonceptivos combinados con estrógenos?",back:"Antecedente de trombosis venosa o arterial, migraña con aura, tabaquismo intenso después de los 35 años, hipertensión no controlada y cáncer de mama."},
{id:"go11",deck:"GO",front:"¿Cuál es el método anticonceptivo reversible más eficaz disponible?",back:"El dispositivo intrauterino (DIU) y el implante subdérmico, ambos de larga duración."},
{id:"go12",deck:"GO",front:"¿Cuál es el mecanismo de acción principal del DIU de cobre?",back:"Genera una reacción inflamatoria local espermicida y tóxica para el óvulo, impidiendo la fertilización."},
{id:"go13",deck:"GO",front:"¿Dentro de qué plazo debe administrarse la anticoncepción de emergencia para ser efectiva?",back:"Idealmente dentro de las 72 horas (levonorgestrel) o hasta 120 horas (acetato de ulipristal) tras la relación sexual sin protección."},
{id:"go14",deck:"GO",front:"¿Cuál es el agente causal más frecuente de vaginosis bacteriana?",back:"Gardnerella vaginalis, en el contexto de un desbalance de la flora vaginal normal."},
{id:"go15",deck:"GO",front:"¿Cuáles son los criterios de Amsel para el diagnóstico de vaginosis bacteriana?",back:"Flujo homogéneo, pH vaginal >4.5, prueba de aminas (whiff test) positiva y presencia de células clave (clue cells) en el examen microscópico."},
{id:"go16",deck:"GO",front:"¿Cuál es el tratamiento de elección para la candidiasis vulvovaginal no complicada?",back:"Antifúngicos azólicos tópicos o fluconazol oral en dosis única."},
{id:"go17",deck:"GO",front:"¿Cuál es el agente causal de la enfermedad pélvica inflamatoria más frecuentemente implicado?",back:"Chlamydia trachomatis y Neisseria gonorrhoeae."},
{id:"go18",deck:"GO",front:"¿Cuál es la principal complicación a largo plazo de la enfermedad pélvica inflamatoria no tratada?",back:"La infertilidad por daño y obstrucción tubárica, además de embarazo ectópico y dolor pélvico crónico."},
{id:"go19",deck:"GO",front:"¿A qué edad se recomienda iniciar el tamizaje de cáncer de cuello uterino con citología (Papanicolaou)?",back:"A partir de los 21-25 años, según la normativa local, o al inicio de la actividad sexual según el contexto."},
{id:"go20",deck:"GO",front:"¿Qué virus es el agente causal necesario para el desarrollo de cáncer de cuello uterino?",back:"El virus del papiloma humano (VPH), principalmente los genotipos oncogénicos 16 y 18."},
{id:"go21",deck:"GO",front:"¿Cuál es el método de tamizaje mamario recomendado en mujeres a partir de los 40-50 años?",back:"La mamografía de tamizaje periódica (anual o bienal según la guía)."},
{id:"go22",deck:"GO",front:"¿Qué significa un resultado BI-RADS 4 en una mamografía?",back:"Un hallazgo con sospecha intermedia de malignidad, que requiere biopsia para caracterización histológica."},
{id:"go23",deck:"GO",front:"¿Qué es la colposcopia y cuándo está indicada?",back:"Un examen que magnifica el cuello uterino para identificar lesiones sospechosas; se indica ante una citología anormal."},
{id:"go24",deck:"GO",front:"¿Cuáles son las principales causas de hemorragia del tercer trimestre?",back:"Placenta previa, desprendimiento prematuro de placenta normoinserta (DPPNI) y rotura uterina."},
{id:"go25",deck:"GO",front:"¿Cómo se diferencia clínicamente la placenta previa del DPPNI?",back:"La placenta previa cursa con sangrado indoloro, rojo brillante, sin hipertonía uterina; el DPPNI cursa con dolor abdominal intenso, sangrado oscuro y útero hipertónico/leñoso."},
{id:"go26",deck:"GO",front:"¿Cuál es el estudio de elección para diagnosticar placenta previa?",back:"La ecografía transvaginal."},
{id:"go27",deck:"GO",front:"¿Cuál es la causa más frecuente de hemorragia del primer trimestre?",back:"El aborto espontáneo."},
{id:"go28",deck:"GO",front:"¿Cuáles son los signos ecográficos de un embarazo ectópico?",back:"Ausencia de saco gestacional intrauterino con niveles de β-hCG por encima del umbral discriminatorio, y presencia de masa anexial o líquido libre."},
{id:"go29",deck:"GO",front:"¿Qué vitamina se recomienda suplementar desde antes de la concepción para prevenir defectos del tubo neural?",back:"El ácido fólico."},
{id:"go30",deck:"GO",front:"¿Cómo se define la preeclampsia?",back:"Hipertensión arterial de inicio después de las 20 semanas de gestación asociada a proteinuria significativa o a disfunción de órgano diana."},
{id:"go31",deck:"GO",front:"¿Cuáles son los criterios de gravedad de la preeclampsia?",back:"Presión arterial ≥160/110 mmHg, trombocitopenia, insuficiencia hepática o renal, edema pulmonar o síntomas cerebrales/visuales persistentes."},
{id:"go32",deck:"GO",front:"¿Qué es el síndrome HELLP?",back:"Una complicación grave de la preeclampsia caracterizada por hemólisis (H), enzimas hepáticas elevadas (EL) y plaquetopenia (LP)."},
{id:"go33",deck:"GO",front:"¿Cuál es el fármaco de elección para la prevención y tratamiento de las convulsiones eclámpticas?",back:"El sulfato de magnesio."},
{id:"go34",deck:"GO",front:"¿Cuál es el tratamiento definitivo de la preeclampsia?",back:"La finalización del embarazo (parto), individualizando el momento según la gravedad y la edad gestacional."},
{id:"go35",deck:"GO",front:"¿Cuáles son los 3 periodos clásicos del trabajo de parto?",back:"Dilatación (primer periodo), expulsivo (segundo periodo) y alumbramiento (tercer periodo, expulsión placentaria)."},
{id:"go36",deck:"GO",front:"¿Cuál es la causa más frecuente de hemorragia posparto?",back:"La atonía uterina."},
{id:"go37",deck:"GO",front:"¿Cuál es la primera medida terapéutica ante una atonía uterina?",back:"El masaje uterino bimanual junto con la administración de uterotónicos (oxitocina como primera línea)."},
{id:"go38",deck:"GO",front:"¿Qué es el puerperio y cuánto dura habitualmente?",back:"El período que sigue al parto hasta el retorno del organismo materno a su estado pregestacional, aproximadamente 6 semanas."},
{id:"go39",deck:"GO",front:"¿Cuál es la infección puerperal más frecuente?",back:"La endometritis puerperal."},
{id:"go40",deck:"GO",front:"¿Qué es la rotura uterina y cuál es su principal factor de riesgo?",back:"La solución de continuidad de la pared uterina durante el embarazo o el parto; el principal factor de riesgo es una cesárea previa."},
{id:"go41",deck:"GO",front:"¿Qué es el prolapso de cordón umbilical y por qué es una urgencia obstétrica?",back:"El descenso del cordón por delante de la presentación fetal, con riesgo de compresión y asfixia fetal aguda; requiere cesárea de urgencia."},
{id:"go42",deck:"GO",front:"¿Cuál es la conducta inicial ante una distocia de hombros durante el parto?",back:"La maniobra de McRoberts (flexión e hiperabducción de caderas maternas) junto con presión suprapúbica."},
{id:"go43",deck:"GO",front:"¿Qué es la embolia de líquido amniótico?",back:"Una complicación obstétrica catastrófica en la que líquido amniótico y componentes fetales ingresan a la circulación materna, provocando colapso cardiovascular y coagulopatía aguda."},
{id:"go44",deck:"GO",front:"¿Cuál es la definición de shock hemorrágico obstétrico según la pérdida sanguínea estimada?",back:"Pérdida sanguínea que compromete la estabilidad hemodinámica materna, habitualmente considerada mayor a 1000-1500 mL o con signos clínicos de hipoperfusión."},
{id:"ped1",deck:"PED",front:"¿A qué edad aproximada un lactante duplica su peso de nacimiento?",back:"Alrededor de los 4-5 meses de edad."},
{id:"ped2",deck:"PED",front:"¿A qué edad triplica su peso de nacimiento?",back:"Alrededor del año de vida."},
{id:"ped3",deck:"PED",front:"¿A qué edad se espera que un lactante sostenga la cabeza de forma estable?",back:"Alrededor de los 3-4 meses."},
{id:"ped4",deck:"PED",front:"¿A qué edad se espera que un lactante se siente sin apoyo?",back:"Alrededor de los 6-7 meses."},
{id:"ped5",deck:"PED",front:"¿A qué edad se espera la marcha independiente?",back:"Entre los 12 y 15 meses."},
{id:"ped6",deck:"PED",front:"¿A qué edad aparecen las primeras palabras con intención comunicativa?",back:"Alrededor de los 12 meses."},
{id:"ped7",deck:"PED",front:"¿Qué caracteriza el desarrollo psicomotor en la franja de 2 a 4 años?",back:"Consolidación del lenguaje en frases, control de esfínteres, juego simbólico y mayor autonomía motora (correr, saltar, subir escaleras)."},
{id:"ped8",deck:"PED",front:"¿Qué cambios puberales caracterizan el inicio de la adolescencia en la niña y en el varón?",back:"En la niña, la telarquia (botón mamario) suele ser el primer signo; en el varón, el aumento del volumen testicular."},
{id:"ped9",deck:"PED",front:"¿En qué etapa del desarrollo embrionario ocurre la organogénesis y por qué es crítica?",back:"Entre la 3ª y 8ª semana de gestación; es el período de mayor vulnerabilidad a teratógenos porque se forman los principales órganos y sistemas."},
{id:"ped10",deck:"PED",front:"¿Qué estructura fetal conecta la circulación de la aorta con la arteria pulmonar durante la vida intrauterina?",back:"El conducto arterioso (ductus arteriosus)."},
{id:"ped11",deck:"PED",front:"¿Cuál es la función del foramen oval en la circulación fetal?",back:"Permitir el paso de sangre oxigenada desde la aurícula derecha a la izquierda, evitando la circulación pulmonar no funcional del feto."},
{id:"ped12",deck:"PED",front:"¿Qué es la restricción del crecimiento intrauterino (RCIU)?",back:"Un feto cuyo peso estimado está por debajo del percentil 10 para su edad gestacional, por causas placentarias, maternas o fetales."},
{id:"ped13",deck:"PED",front:"¿Hasta qué edad se recomienda la lactancia materna exclusiva según la OMS?",back:"Hasta los 6 meses de vida."},
{id:"ped14",deck:"PED",front:"¿Cuáles son los principales beneficios inmunológicos de la lactancia materna?",back:"Aporte de inmunoglobulina A secretora, factores antiinfecciosos y modulación de la microbiota, que reducen el riesgo de infecciones respiratorias y gastrointestinales."},
{id:"ped15",deck:"PED",front:"¿A qué edad se recomienda iniciar la alimentación complementaria?",back:"A partir de los 6 meses de vida, manteniendo la lactancia materna."},
{id:"ped16",deck:"PED",front:"¿Cuáles son los principios básicos de una alimentación complementaria adecuada?",back:"Introducción oportuna, adecuada en cantidad y consistencia, inocua y variada en nutrientes, respetando las señales de hambre y saciedad del niño."},
{id:"ped17",deck:"PED",front:"¿Qué recomendaciones nutricionales especiales aplican durante el embarazo respecto al ácido fólico y el hierro?",back:"Suplementación de ácido fólico preconcepcional y durante el primer trimestre, y suplementación de hierro durante todo el embarazo para prevenir anemia."},
{id:"ped18",deck:"PED",front:"¿Cuáles son las necesidades nutricionales características de la adolescencia?",back:"Aumento de requerimientos calóricos, proteicos, de calcio y hierro debido al estirón puberal y, en las mujeres, al inicio de la menstruación."},
{id:"ped19",deck:"PED",front:"¿Cuáles son las principales causas de mortalidad infantil (menores de 1 año) en Paraguay?",back:"Las afecciones perinatales (prematuridad, asfixia) y las malformaciones congénitas son las causas predominantes."},
{id:"ped20",deck:"PED",front:"¿Qué indicador se usa para medir la desnutrición crónica en la niñez?",back:"La talla para la edad (retraso de talla o stunting)."},
{id:"ped21",deck:"PED",front:"¿Qué indicador se usa para medir la desnutrición aguda?",back:"El peso para la talla (emaciación o wasting)."},
{id:"ped22",deck:"PED",front:"¿Cómo varían los indicadores de morbimortalidad infantil entre las regiones urbanas y rurales de Paraguay?",back:"Las zonas rurales y de menor desarrollo socioeconómico presentan tasas más altas de mortalidad infantil y desnutrición, reflejando inequidades en el acceso a servicios de salud."},
{id:"ped23",deck:"PED",front:"¿Qué mide la tasa de mortalidad neonatal y por qué es relevante en el perfil epidemiológico infantil?",back:"Mide las muertes ocurridas dentro de los primeros 28 días de vida; es relevante porque concentra gran parte de la mortalidad infantil total y refleja la calidad de la atención perinatal."},
{id:"ped24",deck:"PED",front:"¿Cuál es la causa más frecuente de infección respiratoria aguda baja en lactantes?",back:"La bronquiolitis, causada principalmente por el virus sincicial respiratorio."},
{id:"ped25",deck:"PED",front:"¿Cuáles son los signos de alarma de neumonía grave en un niño según la estrategia AIEPI?",back:"Tiraje subcostal, estridor en reposo, incapacidad para beber, convulsiones, letargia o inconsciencia."},
{id:"ped26",deck:"PED",front:"¿Cuál es el pilar fundamental del tratamiento de la enfermedad diarreica aguda en pediatría?",back:"La hidratación oral con sales de rehidratación oral, para prevenir y corregir la deshidratación."},
{id:"ped27",deck:"PED",front:"¿Cómo se clasifica el grado de deshidratación en un niño con diarrea según AIEPI?",back:"Sin deshidratación, con algún grado de deshidratación, y deshidratación grave, según signos clínicos como sed, elasticidad de la piel y estado de conciencia."},
{id:"ped28",deck:"PED",front:"¿Cuál es el agente causal más frecuente de diarrea aguda grave en lactantes y niños pequeños?",back:"El rotavirus."},
{id:"ped29",deck:"PED",front:"¿Cuál es la complicación más temida de la faringoamigdalitis por Streptococcus pyogenes no tratada?",back:"La fiebre reumática y la glomerulonefritis postestreptocócica."},
{id:"ped30",deck:"PED",front:"¿Cuáles son los criterios de Centor/McIsaac usados para sospechar faringitis estreptocócica?",back:"Fiebre, exudado amigdalino, adenopatía cervical anterior dolorosa y ausencia de tos."},
{id:"ped31",deck:"PED",front:"¿Cuál es la causa más frecuente de convulsión en la infancia?",back:"La convulsión febril, asociada a fiebre sin infección del sistema nervioso central."},
{id:"ped32",deck:"PED",front:"¿Qué vacuna se administra al nacer según el calendario nacional de vacunación?",back:"BCG y la primera dosis de hepatitis B."},
{id:"ped33",deck:"PED",front:"¿Cuál es el esquema básico de vacunación pentavalente (DPT-HB-Hib) en lactantes?",back:"Tres dosis, habitualmente a los 2, 4 y 6 meses de edad."},
{id:"ped34",deck:"PED",front:"¿A qué edad se administra la primera dosis de la vacuna contra el sarampión, paperas y rubéola (SPR/triple viral)?",back:"Al año de edad (12 meses), con un refuerzo posterior según el calendario nacional."},
{id:"ped35",deck:"PED",front:"¿Qué es una vacuna de virus vivo atenuado y qué contraindicación general comparten?",back:"Una vacuna elaborada con el microorganismo debilitado que conserva capacidad inmunogénica; están contraindicadas en general en pacientes con inmunosupresión severa y en el embarazo."},
{id:"ped36",deck:"PED",front:"¿Cuál es la importancia de la cobertura de vacunación de rebaño (inmunidad colectiva)?",back:"Al alcanzar coberturas suficientemente altas se interrumpe la cadena de transmisión, protegiendo indirectamente a quienes no pueden vacunarse."},
{id:"ped37",deck:"PED",front:"¿Qué vacuna protege específicamente contra el virus del papiloma humano y a qué edad se recomienda iniciar el esquema?",back:"La vacuna contra el VPH, recomendada habitualmente entre los 9 y 14 años, antes del inicio de la actividad sexual."},
{id:"sp1",deck:"SP",front:"¿Cuál es el ente rector del sistema de salud en Paraguay?",back:"El Ministerio de Salud Pública y Bienestar Social (MSPBS)."},
{id:"sp2",deck:"SP",front:"¿Qué caracteriza a un sistema de salud segmentado?",back:"La coexistencia de subsistemas diferenciados (público, seguridad social, privado) según la capacidad de pago o inserción laboral de las personas, con beneficios desiguales."},
{id:"sp3",deck:"SP",front:"¿Qué caracteriza a un sistema de salud fragmentado?",back:"La coexistencia de servicios de distintos subsistemas que operan sin coordinación entre sí, generando duplicidades y vacíos de atención."},
{id:"sp4",deck:"SP",front:"¿Cuál es la diferencia entre seguridad social y sistema nacional de salud en cuanto a su población beneficiaria?",back:"La seguridad social cubre a los contribuyentes (trabajadores formales y sus dependientes); el sistema nacional de salud, en su concepción universal, cubre a toda la población."},
{id:"sp5",deck:"SP",front:"¿Qué ley establece el Sistema Nacional de Salud en Paraguay y qué organismo crea para su financiamiento?",back:"La Ley 1032/96, que crea el Sistema Nacional de Salud y establece el Fondo Nacional de Salud como organismo responsable de su financiamiento."},
{id:"sp6",deck:"SP",front:"¿Qué son las Redes Integradas e Integrales de Servicios de Salud (RIISS)?",back:"Un modelo organizativo que articula los servicios de salud en una red coordinada, con el objetivo de mejorar el acceso, la cobertura universal y la calidad de atención."},
{id:"sp7",deck:"SP",front:"¿Qué es la Unidad de Salud Familiar (USF) en el modelo de atención paraguayo?",back:"La estructura física donde se desarrolla la estrategia de Atención Primaria de la Salud, a cargo de un Equipo de Salud de la Familia responsable de un territorio social definido."},
{id:"sp8",deck:"SP",front:"¿Cuál es la diferencia entre una USF categoría Estándar y una Satélite?",back:"La Estándar tiene ubicación fija y atiende entre 3.500 y 5.000 habitantes en zonas urbanas; la Satélite atiende poblaciones dispersas o de menor densidad, frecuentemente en zonas rurales."},
{id:"sp9",deck:"SP",front:"¿Qué documento internacional estableció formalmente los principios de la Atención Primaria de la Salud?",back:"La Declaración de Alma-Ata (1978)."},
{id:"sp10",deck:"SP",front:"¿Cuáles son los prerrequisitos para la salud según la Carta de Ottawa?",back:"La paz, la educación, la vivienda, la alimentación, la renta, un ecosistema estable, la justicia social y la equidad."},
{id:"sp11",deck:"SP",front:"¿Qué es la territorialización en el modelo de Atención Primaria de la Salud?",back:"La herramienta que permite planificar y actuar sobre la salud de una población según las necesidades detectadas en un territorio social específico."},
{id:"sp12",deck:"SP",front:"¿Qué es la dispensarización y cuáles son sus principios?",back:"Un método de vigilancia epidemiológica individual y familiar continuo; sus principios son ser profiláctico, dinámico, continuo e individualizado."},
{id:"sp13",deck:"SP",front:"¿Qué significa que la atención en APS debe ser accesible y de puerta de entrada?",back:"Que constituye el primer contacto del individuo, la familia y la comunidad con el sistema de salud, cercano a donde la gente vive y trabaja."},
{id:"sp14",deck:"SP",front:"¿Cuáles son ejemplos de barreras reconocidas para el acceso efectivo a la Atención Primaria de la Salud?",back:"Condiciones inadecuadas de empleo, desarrollo deficiente de competencias del recurso humano, y barreras geográficas, económicas o socioculturales."},
{id:"sp15",deck:"SP",front:"¿Cómo define la Carta de Ottawa a la promoción de la salud?",back:"Como el proceso que permite a las personas incrementar el control sobre su salud y mejorarla, actuando sobre sus determinantes."},
{id:"sp16",deck:"SP",front:"¿Cuál es la técnica cualitativa más adecuada para explorar creencias, miedos y comportamientos de una comunidad?",back:"Los grupos focales."},
{id:"sp17",deck:"SP",front:"¿Qué diferencia hay entre promoción de la salud y prevención de la enfermedad?",back:"La promoción busca actuar sobre los determinantes sociales para mejorar la salud en general; la prevención busca específicamente evitar la aparición o progresión de enfermedades concretas."},
{id:"sp18",deck:"SP",front:"¿Qué es la programación comunitaria en salud pública?",back:"Aquella que permite la participación de diversos actores de la colectividad (líderes, religiosos, educadores, profesionales de salud) en la planificación de acciones sanitarias."},
{id:"sp19",deck:"SP",front:"¿Qué es la razón de mortalidad materna y cómo se calcula?",back:"El número de muertes maternas por cada 100.000 nacidos vivos en un período determinado."},
{id:"sp20",deck:"SP",front:"¿Cuál es el indicador que evalúa la calidad del control prenatal?",back:"El porcentaje de madres con 4 o más controles prenatales."},
{id:"sp21",deck:"SP",front:"¿Qué vacunas se recomiendan durante el embarazo según la norma de cuidados prenatales?",back:"La vacuna Td o Tdpa (tétanos, difteria, tos ferina) y la vacuna antigripal."},
{id:"sp22",deck:"SP",front:"¿Cuáles son los principios rectores de la Política Nacional de la Niñez y Adolescencia (POLNA)?",back:"El interés superior del niño y la niña, y la participación protagónica de niños, niñas y adolescentes."},
{id:"sp23",deck:"SP",front:"¿Qué proporción aproximada de nacidos vivos por cesárea se reportó en Paraguay según datos oficiales recientes?",back:"Alrededor del 50% de los nacimientos."},
{id:"sp24",deck:"SP",front:"¿Qué estudia la epidemiología según su definición clásica?",back:"La frecuencia, distribución y determinantes de los eventos de salud en poblaciones, con el fin de planificar la prevención y el control."},
{id:"sp25",deck:"SP",front:"¿Cuál es la diferencia entre vigilancia epidemiológica de rutina y vigilancia centinela?",back:"La vigilancia de rutina cubre todos los establecimientos de forma sistemática; la centinela se realiza en sitios seleccionados que aportan información más específica sobre agentes, reservorios o vectores."},
{id:"sp26",deck:"SP",front:"¿Cuál es la tasa bruta de mortalidad general y qué expresa?",back:"El número de defunciones por cada 1.000 habitantes en un período determinado, sin ajustar por la estructura etaria de la población."},
{id:"sp27",deck:"SP",front:"¿Para qué sirve ajustar una tasa de mortalidad por edad?",back:"Para poder comparar la mortalidad entre poblaciones con estructuras etarias distintas, eliminando el efecto del envejecimiento poblacional."},
{id:"sp28",deck:"SP",front:"¿Cuál es el criterio de causalidad considerado estrictamente indispensable en epidemiología?",back:"La secuencia temporal: la exposición debe ocurrir antes que el desenlace."},
{id:"sp29",deck:"SP",front:"¿Qué es el período de incubación en el contexto de un brote epidémico?",back:"El tiempo transcurrido entre la exposición a un agente infeccioso y la aparición de los primeros síntomas."},
{id:"sp30",deck:"SP",front:"¿Cuál es la principal causa de mortalidad general en Paraguay según los indicadores oficiales?",back:"Las enfermedades del sistema circulatorio (cardiovasculares)."},

function svgVirusSpikes(cx,cy,r,n,len){
  var out = "";
  for(var i=0;i<n;i++){
    var a = (Math.PI*2/n)*i;
    var x1 = cx+Math.cos(a)*r, y1 = cy+Math.sin(a)*r;
    var x2 = cx+Math.cos(a)*(r+len), y2 = cy+Math.sin(a)*(r+len);
    out += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
    out += '<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="2.4" fill="currentColor" stroke="none"/>';
  }
  return out;
}

function shuffleCopy(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

var BLOQUES = {
  BLOQUE1:{ label:"Bloque I", parts:[["CIR",30],["GO",30],["SP",20]] },
  BLOQUE2:{ label:"Bloque II", parts:[["MI",30],["PED",30]] }
};

function pickN(area,n){
  var pool = Q.filter(function(q){return q.area===area;});
  return shuffleCopy(pool).slice(0,n);
}

function buildSet(mode){
  if(BLOQUES[mode]){
    var combined = [];
    BLOQUES[mode].parts.forEach(function(part){
      combined = combined.concat(pickN(part[0],part[1]));
    });
    return combined;
  }
  var list = Q.filter(function(q){return q.area===mode;});
  return shuffleCopy(list);
}

function fmtClock(sec){
  if(sec<0) sec=0;
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

function isSimulacro(mode){
  return !!BLOQUES[mode];
}

/* ======================= EXAM ======================= */
function startExam(mode){
  state.mode = mode;
  state.set = buildSet(mode);
  state.answers = {};
  state.cur = 0;
  state.startedAt = Date.now();
  state.screen = "exam";
  var sim = isSimulacro(mode);
  if(sim){
    state.timeBudget = state.set.length*60;
    state.timeLeft = state.timeBudget;
  } else {
    state.timeBudget = 0;
    state.timeLeft = 0;
  }
  render();
  if(state.timerHandle) clearInterval(state.timerHandle);
  if(state.questionTimerHandle) clearInterval(state.questionTimerHandle);
  if(sim){
    state.timerHandle = setInterval(function(){
      state.timeLeft--;
      updateClockOnly();
      if(state.timeLeft<=0){
        clearInterval(state.timerHandle);
        finishExam();
      }
    },1000);
    startQuestionTimer();
  }
}

function updateClockOnly(){
  var clockEl = document.getElementById("examClock");
  if(!clockEl) return;
  clockEl.textContent = fmtClock(state.timeLeft);
  clockEl.classList.toggle("crit", state.timeLeft<=300);
}

function startQuestionTimer(){
  if(state.questionTimerHandle) clearInterval(state.questionTimerHandle);
  state.questionElapsed = 0;
  updateQClockOnly();
  state.questionTimerHandle = setInterval(function(){
    state.questionElapsed++;
    updateQClockOnly();
  },1000);
}

function updateQClockOnly(){
  var el = document.getElementById("qClock");
  if(!el) return;
  el.textContent = fmtClock(state.questionElapsed);
  el.classList.toggle("crit", state.questionElapsed>=60);
}

function goToQuestion(i){
  state.cur = i;
  if(isSimulacro(state.mode)) startQuestionTimer();
  renderExam();
}

function renderExam(){

  '<div class="case-bar">'+
    '<button class="btn subtle" id="menuBtn" style="flex:0 0 auto;">&larr; Menú principal</button>'+
    '<div class="id"><span class="label">'+AREAS[q.area].label+'</span><span class="num display">'+(sim?"Simulacro en curso":"Práctica en curso")+'</span></div>'+

    '<div class="stamp">'+answered+' / '+state.set.length+' respondidas</div>'+
  '</div>'+
  '<div class="exam-top"><div class="prog">Pregunta <b>'+(state.cur+1)+'</b> de <b>'+state.set.length+'</b></div>'+
    (sim ? '<div class="prog">Tiempo en esta pregunta <span class="clock mono" id="qClock" style="font-size:1rem;">'+fmtClock(state.questionElapsed)+'</span></div>' : '')+
  '</div>'+
  '<div class="desk">'+
    '<div class="doc">'+
      '<p class="label q-area">'+AREAS[q.area].short+'</p>'+
      '<p class="q-text">'+q.q+'</p>'+
      '<div class="options" id="optsWrap"></div>'+
      '<div class="doc-actions">'+
        '<div style="display:flex;gap:8px;">'+
          '<button class="btn subtle" id="prevBtn" '+(state.cur===0?'disabled':'')+'>&larr; Anterior</button>'+
        '</div>'+
        '<div style="display:flex;gap:8px;">'+
          (state.cur<state.set.length-1 ? '<button class="btn subtle" id="finishBtnMain">Finalizar</button>' : '')+
          (state.cur<state.set.length-1 ? '<button class="btn" id="nextBtn">Siguiente &rarr;</button>' : '<button class="btn" id="finishBtn">'+(sim?"Finalizar simulacro":"Finalizar práctica")+'</button>')+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="navpanel">'+
      '<p class="label">Navegador</p>'+
      '<div class="navgrid" id="navGrid"></div>'+
      '<div class="navlegend">'+
        '<span><span class="dot a"></span>Respondida</span>'+
      '</div>'+
      '<div style="margin-top:14px;"><button class="btn ghost" id="finishBtnSide" style="width:100%;">Finalizar</button></div>'+
    '</div>'+
  '</div>';
  appEl.innerHTML = html;

  renderOptions(q);
  renderNavGrid();

  var prevBtn=document.getElementById("prevBtn");
  if(prevBtn) prevBtn.addEventListener("click",function(){ goToQuestion(state.cur-1); });
  var nextBtn=document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click",function(){ goToQuestion(state.cur+1); });
  var finishBtn=document.getElementById("finishBtn");
  if(finishBtn) finishBtn.addEventListener("click",confirmFinish);
  var finishBtnMain=document.getElementById("finishBtnMain");
  if(finishBtnMain) finishBtnMain.addEventListener("click",confirmFinish);
  var finishBtnSide=document.getElementById("finishBtnSide");
  if(finishBtnSide) finishBtnSide.addEventListener("click",confirmFinish);

  if(menuBtn) menuBtn.addEventListener("click",exitToMenu);

function renderOptions(q){
  var wrap = document.getElementById("optsWrap");
  wrap.innerHTML = "";
  q.opts.forEach(function(opt){
    var key=opt[0], text=opt[1];
    var b = document.createElement("button");
    b.className = "opt"+(state.answers[q.id]===key?" selected":"");
    b.innerHTML = '<span class="k">'+key+'.</span><span>'+text+'</span>';
    b.addEventListener("click",function(){
      state.answers[q.id] = key;
      renderExam();
    });
    wrap.appendChild(b);
  });
}

function renderNavGrid(){
  var grid = document.getElementById("navGrid");
  grid.innerHTML = "";
  state.set.forEach(function(q,i){
    var cell = document.createElement("div");
    var cls = "navcell";
    if(state.answers[q.id]!==undefined) cls+=" answered";
    if(i===state.cur) cls+=" current";
    cell.className = cls;
    cell.textContent = i+1;
    cell.addEventListener("click",function(){ goToQuestion(i); });
    grid.appendChild(cell);
  });
}

function confirmFinish(){
  var unanswered = state.set.length - Object.keys(state.answers).length;
  var label = isSimulacro(state.mode) ? "simulacro" : "práctica";
  if(unanswered>0){
    showConfirm(
      "Finalizar "+label,
      "Tenés "+unanswered+" pregunta(s) sin responder. ¿Finalizar de todas formas?",
      function(){
        clearInterval(state.timerHandle);
        finishExam();
      }
    );
    return;
  }
  clearInterval(state.timerHandle);
  finishExam();
}

function exitToMenu(){
  var answered = Object.keys(state.answers).length;
  var tail = isSimulacro(state.mode) ? "del simulacro en curso." : "de la práctica en curso.";
  showConfirm(
    "¿Salir al menú principal?",
    "Vamos a registrar tu desempeño hasta ahora ("+answered+" de "+state.set.length+" respondidas) antes de salir "+tail,
    function(){
      clearInterval(state.timerHandle);
      state.exitedEarly = true;
      finishExam();
    }
  );
}

async function finishExam(){
  if(state.questionTimerHandle) clearInterval(state.questionTimerHandle);
  if(isSimulacro(state.mode)){
    state.usedSeconds = state.timeBudget - Math.max(state.timeLeft,0);
  } else {
    state.usedSeconds = Math.round((Date.now()-state.startedAt)/1000);
  }
  await saveAttemptRecord();
  state.screen = "report";
  render();
}

/* ======================= HISTORIAL (server-backed, see hydrateFromServer) ======================= */
function loadHistory(){
  return __historyCache;
}

async function saveAttemptRecord(){
  var byArea = {};
  var correct = 0;
  state.set.forEach(function(q){
    if(!byArea[q.area]) byArea[q.area] = {correct:0,total:0};
    byArea[q.area].total++;
    var given = state.answers[q.id];
    if(given===q.ans){ correct++; byArea[q.area].correct++; }
  });
  var modeLabel = BLOQUES[state.mode] ? BLOQUES[state.mode].label : (AREAS[state.mode] ? AREAS[state.mode].label : state.mode);
  var record = {
    mode: state.mode,
    modeLabel: modeLabel,
    total: state.set.length,
    answered: Object.keys(state.answers).length,
    correct: correct,
    usedSeconds: state.usedSeconds,
    timeBudget: state.timeBudget,
    exitedEarly: !!state.exitedEarly,
    isSimulacro: isSimulacro(state.mode),
    byArea: byArea
  };
  try{
    var res = await fetch('/api/history', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(record)
    });
    if(res.ok){
      var data = await res.json();
      __historyCache.unshift(data.record);
      state.lastXpResult = data.xpResult;
    }
  }catch(e){}
  state.exitedEarly = false;
}

function clearHistory(){
  showConfirm(
    "¿Borrar historial?",
    "Se va a borrar todo tu historial de desempeño guardado en tu cuenta. Esta acción no se puede deshacer.",
    async function(){
      try{ await fetch('/api/history', {method:'DELETE', credentials:'include'}); }catch(e){}
      __historyCache = [];
      render();
    }
  );
}

function scoreItem(label,val){
  return '<div class="score-item"><span class="label">'+label+'</span><div class="v mono">'+val+'</div></div>';
}
function chip(key,label){
  return '<button class="chip'+(reportFilter===key?' active':'')+'" id="chip-'+key+'">'+label+'</button>';
}

function renderReviewList(){
  var list = document.getElementById("reviewList");
  list.innerHTML = "";
  state.set.forEach(function(q){
    var given = state.answers[q.id];
    var status = given===undefined ? "skip" : (given===q.ans ? "right":"wrong");
    if(reportFilter==="wrong" && status!=="wrong") return;
    if(reportFilter==="skip" && status!=="skip") return;

    var div = document.createElement("div");
    div.className = "review-item "+status;
    var givenText = given ? (given+". "+optText(q,given)) : "—";
    var correctText = q.ans+". "+optText(q,q.ans);
    var expHtml = '<div class="exp-box"><b>Por qué '+q.ans+' es correcta:</b> '+q.exp+'</div>';
    var wrongHtml = "";
    if(status==="wrong" && q.wrong && q.wrong[given]){
      wrongHtml = '<div class="exp-box wrong-note"><b>Por qué '+given+' es incorrecta:</b> '+q.wrong[given]+'</div>';
    }
    div.innerHTML =
      '<div class="qt">'+q.q+'</div>'+
      '<div class="meta">'+
        '<span>'+AREAS[q.area].short+'</span>'+
        '<span>Tu respuesta: <b>'+givenText+'</b></span>'+
        (status!=="right" ? '<span>Correcta: <b>'+correctText+'</b></span>' : '')+
      '</div>'+
      wrongHtml+
      expHtml;
    list.appendChild(div);
  });
  if(list.children.length===0){
    list.innerHTML = '<p class="label">No hay preguntas en este filtro.</p>';
  }
}

function optText(q,key){
  var f = q.opts.filter(function(o){return o[0]===key;})[0];
  return f?f[1]:"";
}

/* ======================= FLASHCARDS (repetición espaciada) ======================= */
function loadSRS(){
  return __srsCache;
}
function cardSRS(srsData,id){
  return srsData[id] || {box:0,due:0,reps:0};
}
function isDue(srsData,id){
  return cardSRS(srsData,id).due <= Date.now();
}

function flashDeckCards(deck){
  return FLASHCARDS.filter(function(c){return c.deck===deck;});
}

function buildFlashQueue(deck,onlyDue){
  var srsData = loadSRS();
  var cards = flashDeckCards(deck);
  if(onlyDue) cards = cards.filter(function(c){ return isDue(srsData,c.id); });
  return shuffleCopy(cards).map(function(c){return c.id;});
}

function startFlashcards(deck,onlyDue){
  state.flashDeck = deck;
  state.flashQueue = buildFlashQueue(deck, onlyDue!==false);
  state.flashCur = 0;
  state.flashFlipped = false;
  state.flashStats = {again:0,hard:0,easy:0};
  state.flashXpEarned = 0;
  state.screen = "flashStudy";
  render();
}

async function rateFlashCard(rating){
  var id = state.flashQueue[state.flashCur];
  if(rating==="again"){
    state.flashStats.again++;
    state.flashQueue.push(id);
  } else if(rating==="hard"){
    state.flashStats.hard++;
  } else {
    state.flashStats.easy++;
  }
  // server owns the SRS scheduling math (box/due/reps) and the XP award —
  // see PUT /api/srs/:cardId — so the client only sends which button was pressed.
  try{
    var res = await fetch('/api/srs/'+encodeURIComponent(id), {
      method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rating:rating})
    });
    if(res.ok){
      var data = await res.json();
      __srsCache[id] = data.srsState;
      state.flashXpEarned += data.xpResult.gained;
    }
  }catch(e){}
  state.flashCur++;
  state.flashFlipped = false;
  if(state.flashCur>=state.flashQueue.length){
    state.screen = "flashSummary";
  }
  render();
}

    '<button class="btn subtle" id="rateHard" style="border-color:var(--warn);color:var(--warn);">Difícil</button>'+
    '<button class="btn" id="rateEasy">Fácil</button>'+
  '</div>';
  appEl.innerHTML = html;

  document.getElementById("menuBtn").addEventListener("click",exitFlashcards);
  var flashInner = document.getElementById("flashInner");
  var flashActions = document.getElementById("flashActions");
  flashInner.addEventListener("click",function(){
    if(state.flashFlipped) return;
    state.flashFlipped = true;
    flashInner.classList.add("flipped");
    flashActions.classList.add("show");
  });
  var rateAgain = document.getElementById("rateAgain");
  rateAgain.addEventListener("click",function(){ rateFlashCard("again"); });
  var rateHard = document.getElementById("rateHard");
  rateHard.addEventListener("click",function(){ rateFlashCard("hard"); });
  var rateEasy = document.getElementById("rateEasy");
  rateEasy.addEventListener("click",function(){ rateFlashCard("easy"); });
}
