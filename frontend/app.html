{id:"26f2-sp9",area:"SP",q:"Los Factores facilitadores para la atención primaria de salud, respecto a las características del sistema de salud, son entre otros:",opts:[["A","Cobertura universal como parte de la inclusión social, servicios basados en las necesidades de la población y coordinados en todos los niveles"],["B","Falta de coordinación y de sistemas de referencia"],["C","Reformas de salud que han dividido la población basándose en su capacidad de pago de los servicios de salud"],["D","Segmentación entre sectores público, social, y privado"]],ans:"A",exp:"La cobertura universal como parte de la inclusión social, junto con servicios coordinados según las necesidades poblacionales, es un factor facilitador para la Atención Primaria de Salud.",wrong:{B:"La falta de coordinación y de sistemas de referencia es una barrera reconocida, no un factor facilitador de la APS.",C:"Las reformas que dividen según capacidad de pago son una barrera que profundiza la inequidad, no un facilitador.",D:"La segmentación entre sectores es un obstáculo estructural para la APS, no un factor que la facilite."}},
{id:"26f2-sp10",area:"SP",q:"Los Factores considerados como barreras, respecto a los recursos humanos, para la atención primaria de salud, son entre otros:",opts:[["A","Educación profesional continua y desarrollo de equipos multidisciplinarios"],["B","Promoción de la investigación"],["C","Énfasis en la calidad y mejora continua"],["D","Condiciones inadecuadas de Empleo y desarrollo deficiente de competencias"]],ans:"D",exp:"Las condiciones inadecuadas de empleo y el desarrollo deficiente de competencias del recurso humano constituyen barreras reconocidas para la Atención Primaria de Salud.",wrong:{A:"La educación profesional continua es un factor facilitador reconocido, no una barrera para la APS.",B:"La promoción de la investigación constituye un elemento favorable, no un obstáculo para la APS.",C:"El énfasis en la calidad y mejora continua es una fortaleza reconocida, no una barrera del sistema."}},
{id:"26f2-sp11",area:"SP",q:"En el Certificado de Defunción, la secuencia correcta de consignación de causas debe reflejar:",opts:[["A","Todas las enfermedades crónicas del paciente"],["B","De la causa más antigua a la más reciente"],["C","Únicamente la causa final del fallecimiento"],["D","De la causa inmediata hacia la causa básica"]],ans:"D",exp:"En el certificado de defunción, las causas deben consignarse en secuencia desde la causa inmediata hacia la causa básica de muerte.",wrong:{A:"El certificado no debe listar todas las enfermedades crónicas, sino la secuencia causal específica que llevó a la muerte.",B:"La secuencia no se ordena por antigüedad temporal de las enfermedades, sino de la causa inmediata a la básica.",C:"Consignar solo la causa final omite la cadena causal completa exigida por el certificado de defunción."}},
{id:"26f2-sp12",area:"SP",q:"Una definición operativa útil para planificar prevención y control requiere estudiar frecuencia, distribución y determinantes de eventos de salud. Eso corresponde a:",opts:[["A","Estadística descriptiva"],["B","Microbiología clínica"],["C","Epidemiología"],["D","Auditoría de servicios"]],ans:"C",exp:"El estudio de la frecuencia, distribución y determinantes de eventos de salud para planificar prevención y control corresponde al campo de la epidemiología.",wrong:{A:"La estadística descriptiva es una herramienta metodológica, no la disciplina que estudia determinantes de salud en sí.",B:"La microbiología clínica estudia agentes infecciosos a nivel de laboratorio, no la distribución poblacional de eventos de salud.",D:"La auditoría de servicios evalúa la calidad de la atención prestada, no la frecuencia y determinantes de eventos de salud."}},
{id:"26f2-sp13",area:"SP",q:"La cobertura del seguro salud de la Seguridad Social en Paraguay, con marcadas asimetrías territoriales entre áreas urbanas y rurales, se aproxima a:",opts:[["A","El 10% de la población"],["B","El 40% de la población"],["C","El 30% de la población"],["D","El 20% de la población"]],ans:"D",exp:"La cobertura del seguro de la Seguridad Social en Paraguay se aproxima a un 20% de la población total, con marcadas diferencias entre zonas urbanas y rurales.",wrong:{A:"Subestima la cobertura real del seguro social en Paraguay, que es mayor a esta cifra.",B:"Sobrestima considerablemente la cobertura real de la Seguridad Social en el país.",C:"Sobrestima la proporción real de población cubierta por el IPS en Paraguay."}},
{id:"26f2-sp14",area:"SP",q:"La ley que crea el Sistema Nacional de Salud establece que el objetivo del Sistema es:",opts:[["A","Garantizar la gratuidad absoluta de todos los servicios de salud de alta complejidad"],["B","Centralizar todas las decisiones sanitarias en el Ministerio de Salud"],["C","Distribuir de manera equitativa y justa los recursos nacionales en el Sector Salud"],["D","Privatizar los servicios de salud para mejorar su eficiencia"]],ans:"C",exp:"La ley que crea el Sistema Nacional de Salud establece como objetivo distribuir de manera equitativa y justa los recursos nacionales del sector salud.",wrong:{A:"La ley no garantiza gratuidad absoluta de servicios de alta complejidad como objetivo central del sistema.",B:"La ley busca coordinación y descentralización, no la centralización de todas las decisiones en el Ministerio.",D:"La ley no plantea la privatización de los servicios como su objetivo; busca equidad y justicia distributiva."}},
{id:"26f2-sp15",area:"SP",q:"Cuando se desconoce la causa exacta de muerte, el profesional debe:",opts:[["A","Consignar paro cardiorrespiratorio"],["B","Registrar la causa más probable basada en criterios clínicos"],["C","Omitir la emisión del certificado"],["D","Dejar el certificado incompleto"]],ans:"B",exp:"Cuando se desconoce la causa exacta de muerte, el profesional debe registrar la causa más probable según criterios clínicos disponibles.",wrong:{A:"Consignar 'paro cardiorrespiratorio' es un modo de morir inespecífico, no una causa que refleje criterio clínico.",C:"Omitir la emisión del certificado incumple la obligación legal de registro vital ante cada defunción.",D:"Dejar el certificado incompleto vulnera el registro adecuado de la causa de muerte exigido por la norma."}},
{id:"26f2-sp16",area:"SP",q:"Una pirámide poblacional \"ensanchada\" en la parte superior sugiere principalmente:",opts:[["A","Mayor proporción de nacimientos recientes"],["B","Envejecimiento poblacional"],["C","Aumento súbito de mortalidad infantil"],["D","Brote epidémico agudo"]],ans:"B",exp:"Una pirámide poblacional ensanchada en su parte superior refleja un mayor peso relativo de adultos mayores, es decir, envejecimiento poblacional.",wrong:{A:"Un mayor número de nacimientos recientes ensancharía la base de la pirámide, no su parte superior.",C:"Un aumento de mortalidad infantil se refleja en la base de la pirámide, no en el ensanchamiento superior.",D:"Un brote epidémico agudo afecta la distribución de forma puntual y no configura un patrón estructural como el descrito."}},
{id:"26f2-sp17",area:"SP",q:"El objetivo primordial de la implementación de las Redes Integradas e Integrales de Servicios de Salud RIISS en Paraguay es",opts:[["A","Mejorar el acceso, la cobertura universal y la calidad de atención de la salud, a través de una red de servicios coordinados, equitativos e integrales a toda la población"],["B","Fomentar que cada paciente gestione su propia referencia entre niveles, así será más efectivo"],["C","Eliminar por completo el subsector privado de la atención médica, dentro del RIISS"],["D","Centralizar la toma de decisiones en el Ministerio de Salud, para optimizar el presupuesto, para el desarrollo de las Redes Integradas e Integrales de Servicios de Salud RIISS"]],ans:"A",exp:"El objetivo primordial de las RIISS en Paraguay es mejorar el acceso, la cobertura universal y la calidad de atención mediante una red coordinada de servicios.",wrong:{B:"Que cada paciente autogestione su referencia contradice el principio de coordinación en red que caracteriza a las RIISS.",C:"Las RIISS buscan articular al subsector privado dentro de la red, no eliminarlo del sistema.",D:"Las RIISS promueven la coordinación entre niveles, no la centralización total de decisiones en el Ministerio."}},
{id:"26f2-sp18",area:"SP",q:"Cuando en el contexto de los sistemas de salud basados en APS se habla de eliminar barreras geográficas, financieras y socioculturales, eso se define como:",opts:[["A","Acceso y cobertura universales"],["B","Atención integral"],["C","Orientación familiar"],["D","Atención longitudinal"]],ans:"A",exp:"Eliminar barreras geográficas, financieras y socioculturales para el uso de servicios de salud se define como acceso y cobertura universales.",wrong:{B:"La atención integral se refiere a abordar todas las dimensiones de la salud de la persona, no a eliminar barreras de acceso.",C:"La orientación familiar centra la atención en el núcleo familiar, un atributo distinto a la eliminación de barreras.",D:"La atención longitudinal implica seguimiento continuo en el tiempo, no la eliminación de barreras de acceso."}},
{id:"26f2-sp19",area:"SP",q:"Los determinantes intermedios de la salud incluyen principalmente:",opts:[["A","Sistemas de información en salud"],["B","Normativa sanitaria nacional"],["C","Condiciones materiales, factores psicosociales y servicios de salud"],["D","Políticas públicas macroeconómicas"]],ans:"C",exp:"Los determinantes intermedios de la salud incluyen las condiciones materiales de vida, los factores psicosociales y el acceso a servicios de salud.",wrong:{A:"Los sistemas de información en salud son herramientas de gestión, no determinantes intermedios de la salud.",B:"La normativa sanitaria nacional es un determinante estructural, relacionado con políticas, no intermedio.",D:"Las políticas macroeconómicas son determinantes estructurales, no intermedios, en el modelo de la OMS."}},
{id:"26f2-sp20",area:"SP",q:"Según la ley que crea el Sistema Nacional de Salud, ¿cuál es el fundamento que justifica su creación?",opts:[["A","La incorporación de Paraguay a organismos internacionales de salud"],["B","El cumplimiento de una política nacional que posibilite la plena vigencia del derecho a la salud de toda la población"],["C","La creación de un seguro médico obligatorio para trabajadores formales"],["D","La necesidad de reducir el gasto público en salud"]],ans:"B",exp:"La ley que crea el Sistema Nacional de Salud se fundamenta en el cumplimiento de una política nacional que garantice la plena vigencia del derecho a la salud.",wrong:{A:"La incorporación a organismos internacionales no es el fundamento que justifica la creación de la ley.",C:"La ley no se limita a crear un seguro para trabajadores formales; busca garantizar el derecho a la salud de toda la población.",D:"Reducir el gasto público no es el fundamento de la ley; su objetivo es garantizar el derecho a la salud."}},
{id:"26b2-p1",area:"PED",q:"La medición del perímetro cefálico",opts:[["A","Se realiza desde el occipucio a la región supraciliar"],["B","La cinta métrica debe tener una precisión de 5mm"],["C","Se utiliza como parámetro nutricional hasta los 2 años"],["D","Necesita una cinta métrica flexible y extensible"]],ans:"A",exp:"El perímetro cefálico se mide desde el occipucio hasta la región supraciliar (glabela), rodeando la circunferencia máxima del cráneo.",wrong:{B:"La precisión exigida para medir el perímetro cefálico es de 1 mm, no de 5 mm, para detectar variaciones sutiles del crecimiento craneal.",C:"El perímetro cefálico es un parámetro de crecimiento neurológico y craneal, no un indicador nutricional del niño.",D:"La cinta métrica debe ser flexible pero inextensible; una cinta extensible genera mediciones imprecisas."}},
{id:"26b2-p2",area:"PED",q:"Marque cuál de los siguientes componentes forma parte de una balanza pediátrica de mesa",opts:[["A","Cursor mayor y menor"],["B","Escala"],["C","Plataforma"],["D","Base móvil"]],ans:"A",exp:"El cursor mayor y menor son componentes característicos de una balanza pediátrica de mesa tipo pesa-bebé.",wrong:{B:"La escala es un elemento presente en cualquier instrumento de pesaje, no un componente distintivo de la balanza pediátrica de mesa.",C:"La plataforma es propia de las balanzas de pie usadas en niños mayores, no del modelo de mesa tipo pesabebé.",D:"La base móvil no describe un componente característico de este instrumento, que requiere una base fija y estable."}},
{id:"26b2-p3",area:"PED",q:"En los adolescentes varones, el primer signo visible de la pubertad es:",opts:[["A","Aparición de botones mamarios"],["B","Aparición de vello axilar"],["C","Aumento del tamaño testicular"],["D","Poluciones nocturnas"],["E","Aparición del vello pubiano"]],ans:"C",exp:"El aumento del tamaño testicular es el primer signo visible de pubertad en los varones.",wrong:{A:"Los botones mamarios (ginecomastia puberal) son un hallazgo transitorio posterior, no el primer signo de pubertad masculina.",B:"El vello axilar aparece en etapas más avanzadas de Tanner, después del inicio testicular y del vello pubiano.",D:"Las poluciones nocturnas son un evento tardío de la pubertad masculina, no el signo inicial.",E:"El vello pubiano aparece tras el aumento del volumen testicular, como segundo signo puberal, no el primero."}},
{id:"26b2-p4",area:"PED",q:"Seleccione la afirmación correcta respecto a la Ventilación a Presión Positiva en la reanimación neonatal",opts:[["A","Al utilizar PEEP se recomienda empezar con 8 cm de H2O"],["B","La FiO2 inicial en RN de más o igual a 35 semanas es de 21%"],["C","La presión de ventilación inicial recomendada es de 10 a 15 cm de H2O"],["D","La frecuencia de ventilación es de 30 por minuto, con ciclos de 1-2-3-ventilo"]],ans:"B",exp:"En la reanimación neonatal, la FiO2 inicial recomendada para recién nacidos de 35 semanas o más es de 21% (aire ambiente).",wrong:{A:"El PEEP recomendado para iniciar la ventilación neonatal es de 5 cm H2O, no de 8 cm H2O.",C:"La presión de ventilación inicial recomendada es de 20-25 cm H2O en la primera respiración, no de 10-15.",D:"La frecuencia de ventilación recomendada es de 40 a 60 por minuto, con el ciclo 'ventilo-dos-tres', no de 30."}},
{id:"26b2-p5",area:"PED",q:"Señale el principal estímulo para la producción de leche materna",opts:[["A","Características anatómicas adecuadas del pezón"],["B","Succión y/o extracción de la leche del pecho"],["C","Apoyo familiar y del entorno laboral"],["D","Ambiente tranquilo y cómodo para dar de mamar"]],ans:"B",exp:"La succión y/o extracción de leche del pecho es el principal estímulo fisiológico para la producción de leche materna (reflejo de prolactina).",wrong:{A:"La anatomía del pezón favorece el agarre pero no constituye el estímulo fisiológico que desencadena la producción láctea.",C:"El apoyo familiar favorece la continuidad de la lactancia pero no es el estímulo fisiológico productor de leche.",D:"Un ambiente tranquilo facilita el reflejo de eyección pero no es el principal estímulo para producir leche."}},
{id:"26b2-p6",area:"PED",q:"Durante la primera semana de la introducción de alimentos, señale la recomendación técnica para facilitar que el lactante de 6 meses acepte y trague el alimento:",opts:[["A","Ofrecer alimentos con grumos y trozos pequeños para estimular la masticación"],["B","Colocar el puré en la punta de la lengua para que el bebé lo succione"],["C","Mezclar el puré con jugo de fruta para mejorar el sabor"],["D","Colocar el puré en el centro de la lengua para evitar que el bebé lo escupa"]],ans:"D",exp:"Al iniciar la alimentación complementaria, colocar el puré en el centro de la lengua ayuda a evitar que el bebé lo escupa por reflejo de extrusión.",wrong:{A:"Ofrecer grumos y trozos en la primera semana no facilita la aceptación inicial; se recomienda comenzar con textura de puré suave.",B:"Colocar el puré en la punta de la lengua favorece que el bebé lo empuje hacia afuera por el reflejo de extrusión.",C:"Mezclar el puré con jugo no es una técnica recomendada para facilitar la aceptación ni el tragado del alimento."}},
{id:"26b2-p7",area:"PED",q:"Pío tiene 36 meses, al explorar su desarrollo, usted debe obtener información sobre su capacidad para:",opts:[["A","Preguntar el significado de las palabras"],["B","Escuchar historias con dibujos"],["C","Jugar con varios niños e interpretar un papel"],["D","Desarrollar ansiedad ante extraños"],["E","Jugar juegos sencillos en paralelo con otros niños"]],ans:"E",exp:"A los 36 meses se espera que el niño empiece a jugar en paralelo con otros niños, característico del desarrollo social a esa edad.",wrong:{A:"Preguntar el significado de las palabras es una habilidad del lenguaje propia de edades posteriores a los 3 años.",B:"Escuchar historias con dibujos corresponde a un hito de atención e interés más temprano, no específico de los 36 meses.",C:"Jugar con varios niños interpretando un papel (juego cooperativo con roles) es propio de edades posteriores, alrededor de 4-5 años.",D:"La ansiedad ante extraños es un hito propio del segundo semestre de vida, no de los 36 meses."}},
{id:"26b2-p8",area:"PED",q:"Evalúa a Gustavo de 7 meses, está pálido, mucosas secas, somnoliento, fontanela anterior plana y blanda, FR 45 rpm; FC 160 lpm, PA sistólica 40mmHg, llenado capilar 3s, abdomen distendido difícil de palpar. Plantee el manejo inicial.",opts:[["A","Canalizar vías periféricas e iniciar bolos de hidratación con cristaloides"],["B","Canalizar vías periféricas e iniciar bolos de hidratación con coloides"],["C","Administrar suero de rehidratación oral y antibióticos"],["D","Iniciar líquidos por vía oral y extracción de analítica sanguínea"],["E","Administrar SRO y derivar a centro de mayor complejidad"]],ans:"A",exp:"Palidez, mucosas secas, hipotensión y llenado capilar prolongado en un lactante son signos de shock; el manejo inicial es canalizar vía e iniciar bolos de cristaloides.",wrong:{B:"Los coloides no son la primera línea de reanimación en shock pediátrico; se prefieren los cristaloides isotónicos.",C:"La vía oral está contraindicada en un paciente en shock con compromiso hemodinámico grave; requiere reanimación endovenosa inmediata.",D:"Iniciar líquidos por vía oral es inadecuado ante signos de shock descompensado; se requiere acceso venoso urgente.",E:"Derivar sin estabilizar primero retrasa el manejo urgente del shock; debe iniciarse la reanimación con cristaloides antes de trasladar."}},
{id:"26b2-p9",area:"PED",q:"En la alimentación del niño de 1 a 2 años:",opts:[["A","El agua debe ser ofrecida antes y durante las comidas"],["B","No se deben administrar verduras crudas en trozos o enteras"],["C","Se deben ofrecer verduras cocinadas de todos los colores"],["D","Los alimentos se distribuyen en desayuno, almuerzo y cena"],["E","No se debe agregar aceite vegetal ni condimentos"]],ans:"C",exp:"En niños de 1 a 2 años se recomienda ofrecer verduras cocidas de todos los colores como parte de una alimentación variada.",wrong:{A:"Ofrecer agua antes y durante las comidas puede saciar al niño y reducir la ingesta de alimentos, por lo que no se recomienda.",B:"Las verduras crudas en trozos pequeños sí pueden introducirse progresivamente según la tolerancia masticatoria del niño a esta edad.",D:"A esta edad se recomiendan más de tres tiempos de comida, incluyendo colaciones, no solo desayuno, almuerzo y cena.",E:"Se recomienda agregar pequeñas cantidades de aceite vegetal a las preparaciones para aportar energía y ácidos grasos esenciales."}},
{id:"26b2-p10",area:"PED",q:"Santiago de 4 meses está internado por Bronquiolitis. Realiza controles de signos vitales FR: 45 rpm; FC: 130 lpm; sibilancias al final de la espiración; leve tiraje intercostal. Usted lo clasifica según escala de TAL:",opts:[["A","Bronquiolitis leve; score 3"],["B","Bronquiolitis moderada; score 6"],["C","Bronquiolitis leve; score 4"],["D","Bronquiolitis moderada; score 4"],["E","Bronquiolitis moderada; score 5"]],ans:"C",exp:"Según la escala de TAL, sibilancias al final de la espiración con leve tiraje y frecuencia respiratoria de 45 rpm corresponden a bronquiolitis leve con score 4.",wrong:{A:"Los hallazgos descritos (sibilancias fin de espiración, tiraje leve, FR 45) corresponden a un puntaje TAL de 4, no de 3.",B:"Un score de 6 en la escala de TAL corresponde a bronquiolitis moderada a grave, más severo que los hallazgos descritos.",D:"Con un score de 4 la clasificación correcta según la escala de TAL es leve, no moderada.",E:"Un score de 5 no corresponde a los hallazgos descritos y se ubicaría en el rango de bronquiolitis moderada."}},
{id:"26b2-p11",area:"PED",q:"La enfermedad hemolítica del RN por incompatibilidad RH:",opts:[["A","No suele presentarse en la primera gestación"],["B","Se caracteriza por aumento de bilirrubina conjugada"],["C","Requiere siempre de una exanguinotransfusión"],["D","Suele presentarse con Ictericia al 7° día de vida"],["E","Es menos severa que la incompatibilidad por ABO"]],ans:"A",exp:"La enfermedad hemolítica por incompatibilidad Rh no suele presentarse en la primera gestación, ya que requiere sensibilización materna previa.",wrong:{B:"La enfermedad hemolítica por Rh se caracteriza por aumento de bilirrubina indirecta (no conjugada), producto de la hemólisis.",C:"No siempre requiere exanguinotransfusión; el tratamiento depende de la gravedad, pudiendo bastar con fototerapia en casos leves.",D:"La ictericia por incompatibilidad Rh suele aparecer precozmente, en las primeras 24 horas de vida, no al 7° día.",E:"La incompatibilidad Rh suele ser más severa que la incompatibilidad ABO, no menos severa."}},
{id:"26b2-p12",area:"PED",q:"Norma, de 5 años, con cefalea de 2 meses de evolución, holocraneana, la despierta de noche, en ocasiones con vómitos. Signos vitales. PA: 150/90. FC: 50. FR: 24 rpm. Que diagnóstico plantea:",opts:[["A","Intoxicación aguda probable"],["B","Cefalea tensional"],["C","Hipertensión arterial primaria"],["D","Sindrome de hipertensión endocraneana"]],ans:"D",exp:"Cefalea holocraneana progresiva, nocturna, con hipertensión y bradicardia (Cushing) sugiere síndrome de hipertensión endocraneana.",wrong:{A:"Una intoxicación aguda no explicaría la cronicidad de dos meses ni el patrón nocturno progresivo de la cefalea.",B:"La cefalea tensional no suele despertar al paciente por la noche ni asociarse a vómitos y signos de hipertensión.",C:"La hipertensión arterial primaria es infrecuente en niños y no explica por sí sola el patrón cefalálgico descrito."}},
{id:"26b2-p13",area:"PED",q:"En la Hepatitis por Virus A:",opts:[["A","El tratamiento con corticoides en fase aguda aporta beneficios"],["B","La Insuficiencia Hepática Aguda es frecuente"],["C","El diagnóstico en fase aguda se hace con anti-VHA IgG"],["D","Existe un tratamiento específico y efectivo"],["E","Se contagia hasta 7 días después del comienzo de la ictericia"]],ans:"E",exp:"La hepatitis A se contagia hasta 7 días después del inicio de la ictericia, período durante el cual persisten precauciones de contacto.",wrong:{A:"Los corticoides no aportan beneficio en la fase aguda de la hepatitis A y no forman parte de su manejo.",B:"La insuficiencia hepática aguda es una complicación infrecuente de la hepatitis A, que suele ser autolimitada.",C:"El diagnóstico de la fase aguda se realiza con anti-VHA IgM, no con IgG, que indica infección pasada o inmunidad.",D:"No existe un tratamiento antiviral específico para la hepatitis A; el manejo es de sostén."}},
{id:"26b2-p14",area:"PED",q:"El eritema tóxico del Recién nacido:",opts:[["A","Tiene un tratamiento específico"],["B","Tiene un curso prolongado"],["C","Su etiología es conocida"],["D","Es una erupción benigna"],["E","Se presenta en palmas y plantas"]],ans:"D",exp:"El eritema tóxico del recién nacido es una erupción benigna y autolimitada, de etiología no completamente aclarada.",wrong:{A:"El eritema tóxico del recién nacido no requiere tratamiento específico, ya que es autolimitado y benigno.",B:"El curso del eritema tóxico es breve, resolviéndose espontáneamente en días, no prolongado.",C:"La etiología del eritema tóxico del recién nacido no está completamente esclarecida.",E:"El eritema tóxico respeta característicamente palmas y plantas, a diferencia de otras erupciones neonatales."}},
{id:"26b2-p15",area:"PED",q:"Mariana, de 3 años, acude por diarrea de 1 mes de evolución, 2 a 3 veces al día. La madre refiere cuadros similares intermitentes desde los 1 año. Examen físico sin signos de deshidratación. Los percentiles de crecimiento la clasifican en P/T (-1-2DS), T/E (-2-3DS). El diagnóstico es:",opts:[["A","Diarrea crónica, desnutrición leve, talla baja"],["B","Diarrea persistente agudizada, riesgo de talla baja"],["C","Diarrea persistente, desnutrición moderada, talla baja"],["D","Diarrea crónica persistente, talla muy baja"]],ans:"A",exp:"Diarrea con cuadros intermitentes de larga evolución y percentiles P/T y T/E descendidos corresponden a diarrea crónica con desnutrición leve y talla baja.",wrong:{B:"El cuadro descrito, de más de un mes con episodios intermitentes desde el año, corresponde a diarrea crónica, no a un episodio persistente agudizado.",C:"Los percentiles P/T (-1 a -2 DS) corresponden a desnutrición leve, no moderada.",D:"La talla T/E (-2 a -3 DS) corresponde a talla baja, no a talla muy baja, que requeriría un descenso mayor."}},
{id:"26b2-p16",area:"PED",q:"Esteban de 2 años consulta por fiebre alta, rechazo alimentario. Luce pálido, aumento del esfuerzo respiratorio y se encuentra irritable pero no consolable en brazos de la madre. Clasifique según el Triángulo de evaluación pediátrica (TEP)",opts:[["A","Insuficiencia respiratoria"],["B","Falla cardio respiratoria"],["C","Shock compensado"],["D","Dificultad respiratoria"],["E","Shock descompensado"]],ans:"B",exp:"Palidez, taquipnea e irritabilidad no consolable en un niño febril orientan, según el TEP, a falla cardiorrespiratoria.",wrong:{A:"La insuficiencia respiratoria implica solo compromiso del vértice respiratorio del TEP, sin explicar la palidez y alteración del estado circulatorio.",C:"El shock compensado no suele acompañarse de aumento marcado del esfuerzo respiratorio como el descrito en este caso.",D:"La dificultad respiratoria aislada no incluye el compromiso circulatorio (palidez) evidenciado en la evaluación del TEP.",E:"El shock descompensado se acompaña típicamente de hipotensión y alteración marcada de conciencia, no descritas en este caso."}},
{id:"26b2-p17",area:"PED",q:"Recién nacido de término, producto de embarazo y parto normal, 36 horas de vida, en alojamiento conjunto, en plan de alta. Señale cuál de los siguientes hallazgos constituye un signo de alarma que requiere evaluación",opts:[["A","Ausencia de eliminación de meconio dentro de las 12 horas"],["B","Diuresis de coloración rosada a las 24 horas de vida"],["C","Episodios de pausas respiratorias con piel rosada"],["D","Presencia de sangrado activo del cordón umbilical"]],ans:"D",exp:"El sangrado activo persistente del cordón umbilical en un RN es un signo de alarma que requiere evaluación inmediata.",wrong:{A:"La eliminación de meconio puede ocurrir hasta las 24-48 horas de vida; su ausencia a las 12 horas no es, por sí sola, un signo de alarma.",B:"La diuresis de coloración rosada (uratos) a las 24 horas es un hallazgo benigno y transitorio en el recién nacido.",C:"Las pausas respiratorias breves con buen color (piel rosada) suelen ser periódicas y fisiológicas en el recién nacido."}},
{id:"26b2-p18",area:"PED",q:"Mónica de 5 años acude a control y usted al evaluar el desarrollo adecuado para su edad debe constatar:",opts:[["A","En el área social, el juego que lo caracteriza es el simbólico"],["B","En el área cognitiva-adaptativa escribe garabatos"],["C","En el área motora, empieza a correr de forma rígida"],["D","En el área del lenguaje, repite frases de 20 a 30 sílabas"]],ans:"A",exp:"A los 5 años, el juego simbólico es característico del área social del desarrollo infantil.",wrong:{B:"Escribir garabatos es un hito de la etapa preescolar temprana (2-3 años), no del desarrollo cognitivo-adaptativo a los 5 años.",C:"Correr de forma rígida es característico de la etapa del segundo año de vida, no de los 5 años.",D:"A los 5 años el lenguaje es mucho más complejo y fluido; repetir frases cortas de pocas sílabas corresponde a edades menores."}},
{id:"26b2-p19",area:"PED",q:"La ansiedad frente a extraños en un niño suele aparecer con mayor frecuencia alrededor de:",opts:[["A","2-3 meses"],["B","4-5 meses"],["C","6-8 meses"],["D","12-14 meses"]],ans:"C",exp:"La ansiedad frente a extraños suele aparecer con mayor frecuencia entre los 6 y 8 meses de edad.",wrong:{A:"A los 2-3 meses el lactante aún no ha desarrollado el reconocimiento diferencial de cuidadores frente a extraños.",B:"A los 4-5 meses el bebé todavía suele mostrarse sociable con personas desconocidas, sin ansiedad marcada.",D:"A los 12-14 meses la ansiedad ante extraños ya suele estar disminuyendo respecto a su pico entre los 6 y 8 meses."}},
{id:"26b2-p20",area:"PED",q:"El criterio obligatorio para considerar el diagnóstico de LES, según la clasificación EULAR/ACR 2019 es:",opts:[["A","Presencia de artritis en 2 o más articulaciones"],["B","Rash malar en \"alas de mariposa\""],["C","Proteinuria superior a 500 mg en 24 horas"],["D","ANA positivo a título ≥1:80 en células HEp-2"]],ans:"D",exp:"Según la clasificación EULAR/ACR 2019, un ANA positivo a título ≥1:80 es criterio de entrada obligatorio para considerar el diagnóstico de LES.",wrong:{A:"La artritis en dos o más articulaciones es un criterio de clasificación adicional, no el criterio de entrada obligatorio.",B:"El rash malar es un criterio clínico adicional dentro de la clasificación, no el requisito de entrada obligatorio.",C:"La proteinuria mayor a 500 mg/24h es un criterio de dominio renal, no el criterio de entrada obligatorio."}},
{id:"26b2-p21",area:"PED",q:"Tadeo de 4 años, 20 kg. Consulta por debilidad, vómitos y diarrea desde hace 48hs. Tiene ojos hundidos, piel y mucosas secas, orina poco. Usted lo ve letárgico y solicita glicemia capilar por tira reactiva (HGT) que arroja 40mg/dl. Su conducta primaria es:",opts:[["A","Administrar SRO y control de HGT en 30 minutos"],["B","Administrar 80 cc de dextrosa al 10% endovenoso"],["C","Administrar 40 cc de suero cristaloide endovenoso"],["D","Administrar 40 cc de dextrosa al 10 % endovenoso"],["E","Administrar 40 cc de dextrosa al 5% endovenoso"]],ans:"D",exp:"En un niño deshidratado con hipoglicemia (HGT 40 mg/dL), la conducta primaria es administrar dextrosa al 10% endovenosa para corregir la hipoglicemia de forma urgente.",wrong:{A:"La vía oral con SRO no es adecuada en un paciente letárgico con hipoglicemia sintomática, que requiere corrección endovenosa inmediata.",B:"80 cc de dextrosa al 10% excede la dosis calculada (2 mL/kg) para corregir la hipoglicemia en este niño de 20 kg.",C:"El suero cristaloide no corrige la hipoglicemia; se requiere aporte de dextrosa endovenosa para revertir el HGT de 40 mg/dL.",E:"La dextrosa al 5% aporta una concentración de glucosa insuficiente para la corrección rápida de la hipoglicemia sintomática."}},
{id:"26b2-p22",area:"PED",q:"Según el Plan A de AIEPI, para tratar la diarrea en el hogar, las reglas que el personal de salud debe enseñar al cuidador son:",opts:[["A","Dar líquidos adicionales, continuar alimentación, dar Zinc, conocer signos de alarma y acudir a consulta de seguimiento"],["B","Dar antiparasitarios, seguir con la lactancia materna, dar agua a demanda, vigilar el peso"],["C","Dar antibióticos, infusiones de hierbas, suspender líquidos si vomita, vigilar la orina y volver a los 2 días"],["D","Dar solo Sales de Rehidratación Oral, evitar alimentos sólidos, sólo caldos por 24 horas, dar vitaminas"]],ans:"A",exp:"El Plan A de AIEPI para tratar la diarrea en el hogar incluye dar líquidos adicionales, continuar la alimentación, administrar zinc y enseñar a reconocer signos de alarma.",wrong:{B:"El Plan A no incluye antiparasitarios de rutina; se centra en líquidos adicionales, alimentación continuada, zinc y signos de alarma.",C:"El Plan A no recomienda antibióticos ni infusiones de hierbas, y nunca indica suspender líquidos durante un episodio de diarrea.",D:"El Plan A no indica evitar alimentos sólidos ni limitarse a caldos; se debe continuar la alimentación habitual del niño."}},
{id:"26b2-p23",area:"PED",q:"En sala de partos nace un recién nacido con llanto vigoroso, que respira, tiene buen tono, latidos cardíacos 140/minuto, cianosis de tronco y miembros inferiores. Indique la acción a realizar en los primeros minutos de vida",opts:[["A","Retirar el unto sebáceo y secar las manos"],["B","Aspirar fosas nasales y boca"],["C","Realizar antropometría y vitamina K"],["D","Colocar en contacto piel a piel con su madre"]],ans:"D",exp:"En un RN con buen tono y FC>100 pese a líquido meconial, se recomienda el contacto piel a piel con la madre, sin aspiración traqueal rutinaria.",wrong:{A:"Retirar el unto sebáceo no es una prioridad inmediata en un RN vigoroso; tampoco se limita el secado solo a las manos.",B:"La aspiración rutinaria de fosas nasales y boca no está indicada en un RN vigoroso con buen tono y llanto.",C:"La antropometría y la vitamina K son procedimientos diferidos, posteriores al contacto piel a piel inicial con la madre."}},
{id:"26b2-p24",area:"PED",q:"Evalúa a Roger de 10 meses; consulta por vómitos, rechazo de pecho materno y escasa ingesta de días de evolución. La presión arterial es: 60/40 mmHg. Por debajo de qué valor de presión arterial sistólica en mmHg, considera hipotenso al paciente:",opts:[["A","80"],["B","70"],["C","60"],["D","50"],["E","65"]],ans:"B",exp:"En lactantes, se considera hipotensión una presión arterial sistólica por debajo de 70 mmHg aproximadamente.",wrong:{A:"80 mmHg está por encima del umbral de hipotensión definido para lactantes, dentro del rango normal esperado.",C:"60 mmHg corresponde a un valor menor al límite de hipotensión (70 mmHg), no al punto de corte definido.",D:"50 mmHg está por debajo del punto de corte real de 70 mmHg utilizado para definir hipotensión en lactantes.",E:"65 mmHg no corresponde al valor de corte estandarizado (70 mmHg) usado para definir hipotensión sistólica en lactantes."}},
{id:"26b2-p25",area:"PED",q:"José de 15 meses que reside en zona rural con saneamiento deficiente, trae un resultado de coproparasitológico positivo para Strongyloides stercoralis. Determine el mecanismo principal por el cual pudo adquirir esta infección:",opts:[["A","Picadura de un vector que deposita larvas en el torrente sanguíneo"],["B","Ingestión de huevos del parásito presentes en alimentos contaminados"],["C","Penetración de larvas filariformes por la piel por tierra contaminada"],["D","Transmisión directa de persona a persona a través de la saliva"]],ans:"C",exp:"La penetración de larvas filariformes de Strongyloides stercoralis a través de la piel en contacto con tierra contaminada es el mecanismo principal de infección.",wrong:{A:"Strongyloides stercoralis no se transmite por picadura de vector; su ciclo depende de larvas del suelo, no de insectos hematófagos.",B:"La transmisión por ingestión de huevos es propia de otros geohelmintos como Ascaris, no del ciclo de Strongyloides.",D:"No existe transmisión persona a persona por saliva para Strongyloides stercoralis; su infección depende del contacto con tierra contaminada."}},
{id:"26b2-p26",area:"PED",q:"La lactancia a demanda o guiada por el bebé, es aquella en la cual el bebé se alimenta",opts:[["A","Según las señales de hambre del recién nacido"],["B","Cada vez que el niño llora"],["C","Cada 3 horas con periodos de sueños largos"],["D","Los primeros días cada 1 hora y luego cada 3 horas"]],ans:"A",exp:"La lactancia a demanda se basa en alimentar al bebé según sus propias señales de hambre, no según un horario fijo.",wrong:{B:"Guiarse solo por el llanto ignora las señales tempranas de hambre (búsqueda, chupeteo), que preceden al llanto como señal tardía.",C:"Un horario fijo de cada 3 horas corresponde a lactancia programada, no a demanda, que se guía por las señales del bebé.",D:"Establecer intervalos fijos de 1 hora y luego 3 horas corresponde a un esquema pautado, no a la lactancia a libre demanda."}},
{id:"26b2-p27",area:"PED",q:"El shock obstructivo en el niño, puede estar producido por:",opts:[["A","Sepsis grave"],["B","Anemia grave"],["C","Miocardiopatías"],["D","Cardiopatía congénita"],["E","Embolia pulmonar"]],ans:"E",exp:"La embolia pulmonar es una causa reconocida de shock obstructivo en el niño, al obstruir mecánicamente el flujo sanguíneo.",wrong:{A:"La sepsis grave produce típicamente un shock distributivo o séptico, no obstructivo.",B:"La anemia grave produce un shock de tipo hipovolémico/hipóxico funcional, no obstructivo.",C:"Las miocardiopatías producen shock cardiogénico por falla de la bomba cardíaca, no obstructivo.",D:"La cardiopatía congénita se asocia a shock cardiogénico, no a la obstrucción mecánica característica del shock obstructivo."}},
{id:"26b2-p28",area:"PED",q:"La posición recomendada para acostar al Recién Nacido y disminuir el riesgo de muerte súbita del lactante es:",opts:[["A","Decúbito preferencial"],["B","Decúbito lateral derecho"],["C","Decúbito supino"],["D","Decúbito ventral"]],ans:"C",exp:"El decúbito supino es la posición recomendada para acostar al recién nacido y reducir el riesgo de muerte súbita del lactante.",wrong:{A:"El término 'decúbito preferencial' no corresponde a una recomendación específica basada en evidencia para reducir la muerte súbita.",B:"El decúbito lateral es inestable y puede rotar hacia la posición prona, aumentando el riesgo, por lo que no se recomienda.",D:"El decúbito ventral (boca abajo) es la posición asociada a mayor riesgo de muerte súbita del lactante."}},
{id:"26b2-p29",area:"PED",q:"Indique las cantidades recomendadas de leche en niños de 2 a 8 años",opts:[["A","1-1½ tazas"],["B","3 tazas"],["C","2-2½ tazas"],["D","⅔-2 tazas"],["E","½-1 taza"]],ans:"C",exp:"Para niños de 2 a 8 años se recomienda un consumo diario de leche de aproximadamente 2 a 2½ tazas.",wrong:{A:"1 a 1½ tazas queda por debajo de la cantidad diaria recomendada de leche para niños de 2 a 8 años.",B:"3 tazas excede la recomendación diaria de leche establecida para este grupo de edad.",D:"⅔ a 2 tazas es una cantidad inferior a la recomendación diaria establecida para niños de 2 a 8 años.",E:"½ a 1 taza corresponde a una recomendación muy por debajo de la ingesta diaria de leche sugerida para esta edad."}},
{id:"26b2-p30",area:"PED",q:"Al inicio de la alimentación complementaria en un niño de 6 meses, la frecuencia diaria del consumo de alimentos sólidos es:",opts:[["A","Una vez"],["B","Tres veces"],["C","Dos veces"],["D","Cuatro veces"],["E","Cinco veces"]],ans:"A",exp:"Al iniciar la alimentación complementaria a los 6 meses, se recomienda ofrecer alimentos sólidos una vez al día, aumentando gradualmente.",wrong:{B:"Tres veces al día es la frecuencia recomendada más adelante, no al inicio de la alimentación complementaria a los 6 meses.",C:"Dos veces al día corresponde a una frecuencia posterior al período de introducción inicial de alimentos sólidos.",D:"Cuatro veces al día excede ampliamente la frecuencia recomendada al iniciar la alimentación complementaria.",E:"Cinco veces al día es una frecuencia propia de etapas más avanzadas, no del inicio de la alimentación complementaria."}},
{id:"26b2-g1",area:"GO",q:"Durante el embarazo normal, el volumen sanguíneo materno aumenta aproximadamente después de las 32-34 semanas:",opts:[["A","40–45 %"],["B","10–15 %"],["C","20–25 %"],["D","60–70 %"]],ans:"A",exp:"El volumen sanguíneo materno aumenta entre un 40-45% respecto al basal hacia el final del embarazo (después de las 32-34 semanas).",wrong:{B:"Subestima notablemente el incremento; el aumento real hacia el final del embarazo es mayor.",C:"Se aproxima a incrementos de etapas más tempranas del embarazo, no al pico observado tras las 32-34 semanas.",D:"Sobreestima el incremento fisiológico documentado del volumen sanguíneo materno."}},
{id:"26b2-g2",area:"GO",q:"El embarazo ovárico se considera diagnosticado cuando se cumplen criterios descritos originalmente por:",opts:[["A","Asherman"],["B","Pritchard"],["C","Spiegelberg"],["D","Hertig"]],ans:"C",exp:"El embarazo ovárico se diagnostica siguiendo los criterios clásicos descritos originalmente por Spiegelberg.",wrong:{A:"Asherman describe las sinequias uterinas intrauterinas, no los criterios de embarazo ovárico.",B:"Pritchard es reconocido por el esquema de sulfato de magnesio en eclampsia, no por criterios de embarazo ovárico.",D:"Hertig es conocido por su clasificación del desarrollo embrionario temprano, no por el embarazo ovárico."}},
{id:"26b2-g3",area:"GO",q:"El anillo de retracción patológica (anillo de Bandl) se asocia con:",opts:[["A","Trabajo de parto normal en segunda etapa"],["B","Segmento pasivo fisiológico"],["C","Trabajo de parto obstruido"],["D","Útero gestante al término"]],ans:"C",exp:"El anillo de Bandl (retracción patológica del segmento uterino) se asocia a trabajo de parto obstruido.",wrong:{A:"El anillo de Bandl es un hallazgo patológico, no una característica del trabajo de parto normal.",B:"Refleja sobredistensión patológica del segmento inferior, no un segmento pasivo fisiológico normal.",D:"Describe únicamente el útero gestante a término sin señalar la condición obstructiva que genera el anillo patológico."}},
{id:"26b2-g4",area:"GO",q:"Durante una hemorragia postparto por atonía uterina, si la administración de oxitocina y ergometrina no controla el sangrado, ¿cuál es el siguiente paso farmacológico recomendado?",opts:[["A","Realizar compresión bimanual del útero"],["B","Administrar una dosis de 800 ug de misoprostol preferentemente por vía sublingual"],["C","Administrar una segunda dosis de carga de oxitocina"],["D","Iniciar la infusión de cristaloides a 1L en 15 minutos"]],ans:"B",exp:"Si oxitocina y ergometrina no controlan la atonía uterina, el siguiente escalón farmacológico recomendado es misoprostol 800 mcg, preferentemente por vía sublingual.",wrong:{A:"Es una maniobra física, no el siguiente paso farmacológico solicitado tras el fallo de la uterotonía inicial.",C:"Repetir oxitocina no es el escalón recomendado; el algoritmo indica avanzar a un segundo uterotónico distinto.",D:"La reposición de cristaloides es reanimación de soporte, no el siguiente fármaco uterotónico indicado."}},
{id:"26b2-g5",area:"GO",q:"La clasificación de anomalías de los conductos de Müller incluye como una categoría independiente sin sub divisiones:",opts:[["A","Útero didelfo"],["B","Hipoplasia o agenesia de los conductos de Müller"],["C","Útero unicorne"],["D","Útero tabicado"]],ans:"A",exp:"El útero didelfo es una categoría independiente y completa dentro de la clasificación de anomalías müllerianas, sin subdivisiones adicionales.",wrong:{B:"Esta categoría sí incluye subdivisiones (vaginal, cervical, fúndica, tubárica, combinada), a diferencia del útero didelfo.",C:"El útero unicorne se subdivide según el cuerno rudimentario (comunicante, no comunicante, sin cavidad o ausente).",D:"El útero tabicado se subdivide en completo y parcial, a diferencia de la categoría única del útero didelfo."}},
{id:"26b2-g6",area:"GO",q:"Según el protocolo de transfusión masiva (PTM) descrito para la hemorragia no controlada, ¿cuál es la secuencia y los componentes que deben administrarse inmediatamente después del ácido tranexámico?",opts:[["A","1 unidad de Plaquetas por aféresis y 2 unidades de CGR"],["B","2 unidades de PFC y repetir la dosis de ácido tranexámico"],["C","2 unidades de Concentrados Globulares (CGR) y 1 de Plasma Fresco Congelado (PFC)"],["D","4 a 6 unidades de Crioprecipitados o 1 gramo de Fibrinógeno"]],ans:"D",exp:"Tras el ácido tranexámico, el protocolo de transfusión masiva indica continuar con 4 a 6 unidades de crioprecipitados o 1 gramo de fibrinógeno para sostener la coagulación.",wrong:{A:"Las plaquetas por aféresis corresponden a una fase posterior del protocolo, no al paso inmediato tras el ácido tranexámico.",B:"Repetir el ácido tranexámico no forma parte de la secuencia estándar inmediatamente posterior a su administración.",C:"Esta combinación de hemoderivados corresponde a otra etapa del protocolo de transfusión masiva, no a la inmediata tras el tranexámico."}},
{id:"26b2-g7",area:"GO",q:"En la maniobra de Ritgen modificada, se aplica presión moderada hacia arriba sobre:",opts:[["A","El cuello fetal"],["B","El mentón fetal"],["C","El occipucio"],["D","El maxilar superior"]],ans:"B",exp:"En la maniobra de Ritgen modificada se ejerce presión moderada hacia arriba sobre el mentón fetal para controlar la salida de la cabeza.",wrong:{A:"La maniobra no se dirige al cuello fetal sino al mentón, para controlar la deflexión de la cabeza.",C:"El occipucio se maneja con la otra mano para controlar la deflexión; no es donde se aplica la presión ascendente descrita.",D:"El maxilar superior no es la estructura sobre la que se ejerce la presión en la maniobra de Ritgen modificada."}},
{id:"26b2-g8",area:"GO",q:"En una paciente con sepsis grave, la guía indica el uso de qSOFA para identificar aquellas con riesgo de evolución desfavorable. ¿Qué combinación de criterios define un qSOFA positivo, según CODIGO ROJO?",opts:[["A","PAS ≤ 90 mmHg, Frecuencia Respiratoria ≥ 25 rpm, y Glasgow ≤ 14"],["B","PAS ≤ 95 mmHg, oliguria, y necesidad de oxígeno suplementario"],["C","PAS ≤ 110 mmHg, Frecuencia Cardíaca ≥ 120 lpm, y temperatura > 38.3°C"],["D","PAS ≤ 100 mmHg, Frecuencia Respiratoria ≥ 22 rpm, y transtorno de la conciencia"]],ans:"D",exp:"Según CODIGO ROJO, el qSOFA positivo se define por PAS ≤100 mmHg, frecuencia respiratoria ≥22 rpm y alteración del estado de conciencia.",wrong:{A:"Los umbrales de presión y frecuencia respiratoria no coinciden con los definidos para el qSOFA en CODIGO ROJO.",B:"Oliguria y necesidad de oxígeno no forman parte de los tres criterios que componen el qSOFA.",C:"Frecuencia cardíaca y temperatura corresponden a criterios de SIRS, no a los tres componentes del qSOFA."}},
{id:"26b2-g9",area:"GO",q:"En la aplicación del Traje Antishock No Neumático (TANN), ¿cuál es el procedimiento correcto para su retiro una vez que la paciente ha estado hemodinámicamente estable durante al menos dos horas?",opts:[["A","Iniciar por los segmentos inferiores (segmento 1), con intervalos de 20 minutos, vigilando la PAS y la frecuencia cardíaca"],["B","Iniciar por el segmento abdominal (segmento 5), con intervalos de 20 minutos entre cada segmento"],["C","Retirar los segmentos en orden inverso a la colocación, con intervalos de 10 minutos"],["D","Retirar todos los segmentos simultáneamente y observar la respuesta por 20 minutos"]],ans:"A",exp:"El retiro del TANN, una vez estabilizada la paciente, se realiza comenzando por los segmentos inferiores (segmento 1), con intervalos de 20 minutos mientras se vigila la presión arterial y frecuencia cardíaca.",wrong:{B:"El retiro debe iniciarse por los segmentos distales (inferiores), no por el segmento abdominal, para evitar descompensación brusca.",C:"El intervalo recomendado entre segmentos es de 20 minutos, no de 10.",D:"Retirar todos los segmentos simultáneamente puede provocar descompensación hemodinámica brusca; el retiro debe ser gradual."}},
{id:"26b2-g10",area:"GO",q:"¿Cuál es la localización más frecuente de los quistes de inclusión epitelial en el área genital?",opts:[["A","Vagina"],["B","Glándulas de Bartholin"],["C","Clítoris"],["D","Vulva"]],ans:"D",exp:"La vulva es la localización más frecuente de los quistes de inclusión epitelial en el área genital.",wrong:{A:"La vagina es una localización posible pero menos frecuente que la vulva para este tipo de quiste.",B:"Los quistes de Bartholin se originan por obstrucción glandular, un mecanismo distinto al quiste de inclusión epitelial.",C:"El clítoris no es la localización más frecuente descrita para los quistes de inclusión epitelial."}},
{id:"26b2-g11",area:"GO",q:"Las estructuras derivadas de los conductos paramesonéfricos en la mujer incluyen:",opts:[["A","Útero, trompas de Falopio y porción superior de la vagina"],["B","Ovarios"],["C","Conductos eferentes y paradídimo"],["D","Epidídimo y conducto deferente"]],ans:"A",exp:"Los conductos paramesonéfricos (de Müller) dan origen al útero, las trompas de Falopio y la porción superior de la vagina.",wrong:{B:"Los ovarios se originan de la cresta gonadal, no de los conductos paramesonéfricos.",C:"Estas estructuras derivan del conducto mesonéfrico (de Wolff), no del paramesonéfrico.",D:"El epidídimo y el conducto deferente son derivados masculinos del conducto mesonéfrico, no del paramesonéfrico."}},
{id:"26b2-g12",area:"GO",q:"Según el protocolo de Compromiso del Bienestar Fetal, ¿cuál es la conducta recomendada ante un Perfil Biofísico Fetal (PBF) con un puntaje de 4/10 en un feto con más de 32 semanas?",opts:[["A","Repetir el PBF en 2 horas y si persiste, finalizar el embarazo"],["B","Repetir el PBF en 24 horas"],["C","Finalizar el embarazo"],["D","Solicitar un Doppler de arteria umbilical y controlar en 7 días"]],ans:"C",exp:"Un PBF de 4/10 en un feto de más de 32 semanas es indicación de finalizar el embarazo, dado el alto riesgo de compromiso fetal.",wrong:{A:"Repetir en 2 horas se reserva para puntajes intermedios (6/10); un 4/10 en >32 semanas amerita finalización directa.",B:"Repetir en 24 horas subestima la gravedad de un puntaje de 4/10, que indica compromiso fetal significativo.",D:"Diferir con Doppler y control en 7 días retrasa inapropiadamente la conducta urgente que amerita este puntaje."}},
{id:"26b2-g13",area:"GO",q:"La histeroscopia diagnóstica está indicada principalmente para:",opts:[["A","Manejo de embarazo ectópico"],["B","Tratamiento definitivo de miomatosis múltiple"],["C","Evaluación de hemorragia uterina anormal"],["D","Tratamiento de cáncer cervical invasor"]],ans:"C",exp:"La histeroscopia diagnóstica está indicada principalmente para el estudio de la hemorragia uterina anormal, al permitir visualización directa de la cavidad endometrial.",wrong:{A:"El embarazo ectópico no se maneja ni diagnostica mediante histeroscopia.",B:"La histeroscopia resuelve miomas submucosos aislados, no constituye tratamiento definitivo de miomatosis múltiple.",D:"El cáncer cervical invasor no se trata mediante histeroscopia; esta técnica evalúa la cavidad endometrial."}},
{id:"26b2-g14",area:"GO",q:"A menudo la mola hidatiforme completa se caracteriza por",opts:[["A","Cariotipo 46,XX"],["B","Cariotipo triploide"],["C","Cariotipo 46,XY sin feto viable"],["D","Cariotipo 46,XY con feto viable"]],ans:"A",exp:"La mola hidatiforme completa se caracteriza típicamente por un cariotipo 46,XX de origen paterno (por duplicación androgenética).",wrong:{B:"El cariotipo triploide es característico de la mola parcial, no de la completa.",C:"Aunque existe una variante 46,XY, el patrón predominante y característico de la mola completa es 46,XX.",D:"La mola completa se caracteriza por ausencia de tejido fetal, no por coexistir con un feto viable."}},
{id:"26b2-g15",area:"GO",q:"Sobre la técnica de compresión abdominal de la aorta (CAA) en el choque hipovolémico, ¿cómo debe verificarse que la presión ejercida es la adecuada?",opts:[["A","La presión arterial sistólica debe mantenerse por encima de 90 mmHg"],["B","La paciente debe experimentar alivio inmediato del dolor abdominal"],["C","El pulso femoral no debe ser palpable durante la compresión"],["D","El pulso carotídeo de la paciente debe ser palpable y fuerte"]],ans:"C",exp:"Durante la compresión aórtica abdominal en el choque hipovolémico, la ausencia de pulso femoral confirma que la presión ejercida es adecuada.",wrong:{A:"La presión sistólica es un objetivo de reanimación general, no el signo específico que confirma la compresión aórtica adecuada.",B:"El alivio del dolor es subjetivo y no constituye el signo objetivo de verificación de la técnica.",D:"El pulso carotídeo refleja la circulación proximal a la compresión y no confirma su eficacia distal."}},
{id:"26b2-g16",area:"GO",q:"El hipertelorismo es un hallazgo frecuente en:",opts:[["A","Trisomía 21"],["B","Trisomía 18"],["C","Monosomía X"],["D","Trisomía 13"]],ans:"B",exp:"El hipertelorismo es un hallazgo frecuente en la trisomía 18 (síndrome de Edwards).",wrong:{A:"En la trisomía 21 predominan otros rasgos faciales (fisuras palpebrales oblicuas), no el hipertelorismo como hallazgo característico.",C:"La monosomía X se asocia a otros rasgos como cuello alado y linfedema, no al hipertelorismo como hallazgo típico.",D:"La trisomía 13 se asocia más a hipotelorismo y defectos de la línea media (holoprosencefalia), no a hipertelorismo."}},
{id:"26b2-g17",area:"GO",q:"¿Cuál es el método más confiable y standard para seguimiento post-mola?",opts:[["A","Ecografía abdominal"],["B","Resonancia magnética"],["C","Radiografía de tórax"],["D","Dosificación seriada de ß-hCG"]],ans:"D",exp:"La dosificación seriada de ß-hCG es el método estándar y más confiable para el seguimiento post-mola.",wrong:{A:"La ecografía es útil en el diagnóstico inicial, pero no constituye el método estándar de seguimiento post-mola.",B:"La resonancia magnética se reserva para evaluar sospecha de enfermedad metastásica, no como seguimiento de rutina.",C:"La radiografía de tórax se emplea para descartar metástasis pulmonares, pero no es el método principal de seguimiento."}},
{id:"26b2-g18",area:"GO",q:"Una paciente consulta por galactorrea sin embarazo. ¿Cuál de los siguientes fármacos puede ser causa?",opts:[["A","Ibuprofeno"],["B","Verapamilo"],["C","Levonorgestrel"],["D","Metformina"]],ans:"B",exp:"El verapamilo, entre otros fármacos, puede producir galactorrea al interferir con la regulación dopaminérgica de la prolactina.",wrong:{A:"El ibuprofeno es un antiinflamatorio no esteroideo, no se asocia a hiperprolactinemia ni galactorrea.",C:"El levonorgestrel no es un fármaco reconocido como causa relevante de galactorrea por hiperprolactinemia.",D:"La metformina es un antidiabético que no se asocia a elevación de prolactina ni galactorrea."}},
{id:"26b2-g19",area:"GO",q:"Cuadro autoinmunitario mediado por linfocitos T en el que las citocinas proinflamatorias inducen la proliferación de queratinocitos y células endoteliales que en ocasiones afecta a la vulva. Corresponde a:",opts:[["A","Psoriasis"],["B","Intertrigo"],["C","Dermatitis atípica"],["D","Liquen plano"]],ans:"A",exp:"La psoriasis es un trastorno autoinmunitario mediado por linfocitos T donde las citocinas proinflamatorias inducen proliferación de queratinocitos y células endoteliales, pudiendo afectar la vulva.",wrong:{B:"El intertrigo es una dermatitis irritativa por fricción y humedad, no un cuadro autoinmunitario mediado por linfocitos T.",C:"La dermatitis atópica se relaciona con mecanismos alérgicos, no con la proliferación de queratinocitos mediada por linfocitos T descrita.",D:"El liquen plano, aunque mediado por linfocitos T, provoca destrucción de queratinocitos basales, no la proliferación epidérmica descrita."}},
{id:"26b2-g20",area:"GO",q:"Para una paciente con un aborto diferido de 12 semanas, sin signos de infección, ¿cuál es el régimen de misoprostol recomendado por la FIGO 2017 previo a la Aspiración Manual Endouterina (AMEU)?",opts:[["A","800 ug vía vaginal cada 3 horas (hasta 2 dosis)"],["B","600 ug vía oral en 1 sola dosis"],["C","200 ug por vía vaginal cada 4 a 6 horas (hasta 5 dosis)"],["D","400 ug vía oral en dosis única"]],ans:"A",exp:"Para un aborto diferido de 12 semanas sin infección, la FIGO 2017 recomienda misoprostol 800 mcg vía vaginal cada 3 horas (hasta 2 dosis) previo a la AMEU.",wrong:{B:"600 mcg en dosis única oral no corresponde al esquema de preparación cervical recomendado por FIGO para esta edad gestacional.",C:"Este esquema de dosis múltiples corresponde a otro protocolo, no a la preparación previa a AMEU en un aborto diferido de 12 semanas.",D:"400 mcg en dosis única oral es insuficiente para la preparación cervical recomendada a esta edad gestacional."}},
{id:"26b2-g21",area:"GO",q:"Una mujer de 24 años con cervicitis mucopurulenta tiene diagnóstico confirmado de infección gonocócica no complicada. ¿Cuál es el esquema terapéutico recomendado?",opts:[["A","Ceftriaxona 250 mg IM más azitromicina 1 g VO dosis única"],["B","Cefixima 400 mg VO dosis única"],["C","Azitromicina 1 g VO dosis única"],["D","Cefotaxima 500 mg IM dosis única"]],ans:"A",exp:"La cervicitis gonocócica no complicada se trata con ceftriaxona 250 mg IM más azitromicina 1 g VO en dosis única, para cubrir también posible coinfección por Chlamydia.",wrong:{B:"La cefixima ya no es de primera línea por menor eficacia frente a cepas resistentes, y no cubre coinfección por Chlamydia.",C:"La azitromicina sola no es el tratamiento recomendado como monoterapia para la infección gonocócica.",D:"La cefotaxima IM no es el esquema de primera línea recomendado en las guías actuales para gonococia."}},
{id:"26b2-g22",area:"GO",q:"En pacientes con dolor pélvico crónico con o sin endometriosis, los estudios de resonancia magnética cerebral han mostrado:",opts:[["A","Aumento de volumen hipotalámico"],["B","Reducción constante del volumen de sustancia gris talámica"],["C","Incremento del volumen talámico"],["D","Ausencia de cambios estructurales"]],ans:"B",exp:"En el dolor pélvico crónico con o sin endometriosis, la RM cerebral ha mostrado reducción constante del volumen de sustancia gris talámica, reflejando sensibilización central.",wrong:{A:"El aumento de volumen hipotalámico no es el hallazgo descrito en estos estudios de neuroimagen.",C:"Los estudios muestran reducción, no incremento, del volumen de sustancia gris talámica.",D:"Los estudios sí documentan cambios estructurales consistentes, no su ausencia."}},
{id:"26b2-g23",area:"GO",q:"¿Un mioma completamente intramural que contacta el endometrio corresponde a qué clasificación FIGO?",opts:[["A","Tipo 2"],["B","Tipo 5"],["C","Tipo 4"],["D","Tipo 3"]],ans:"D",exp:"Un mioma completamente intramural que contacta el endometrio, sin distorsionar la cavidad, corresponde al tipo 3 de la clasificación FIGO.",wrong:{A:"El tipo 2 es un mioma submucoso con menos del 50% de componente intramural, no uno completamente intramural.",B:"El tipo 5 es intramural sin contacto con el endometrio, a diferencia del descrito.",C:"El tipo 4 es intramural puro, sin contacto con el endometrio ni con la serosa."}},
{id:"26b2-g24",area:"GO",q:"En la fase de compensación de una emergencia obstétrica, ante la imposibilidad de lograr un acceso venoso periférico, ¿cuántos intentos sin éxito se recomienda realizarse antes de pasar a una vía intraósea?",opts:[["A","3 intentos"],["B","2 intentos"],["C","1 intento"],["D","4 intentos"]],ans:"A",exp:"Ante la imposibilidad de acceso venoso periférico tras 3 intentos, se recomienda pasar a la colocación de una vía intraósea en la emergencia obstétrica.",wrong:{B:"Subestima el número de intentos recomendados; el protocolo indica agotar 3 antes de la vía intraósea.",C:"Un solo intento es insuficiente según el protocolo antes de recurrir a la vía intraósea.",D:"Cuatro intentos retrasa innecesariamente el acceso alternativo respecto al número recomendado."}},
{id:"26b2-g25",area:"GO",q:"La conización cervical con asa electroquirúrgica en \"sombrero de copa\" implica:",opts:[["A","Ablación superficial del epitelio escamoso"],["B","Resección exclusiva del canal endocervical"],["C","Extirpación completa del cuello uterino"],["D","Resección ectocervical seguida de resección endocervical"]],ans:"D",exp:"La conización en \"sombrero de copa\" implica una resección ectocervical amplia seguida de resección adicional del canal endocervical, dando esa forma característica a la pieza.",wrong:{A:"La conización implica resección en profundidad, no una ablación superficial del epitelio.",B:"La técnica incluye también la porción ectocervical, no se limita exclusivamente al canal endocervical.",C:"La extirpación completa del cuello uterino describe una traquelectomía, no una conización."}},
{id:"26b2-g26",area:"GO",q:"Durante el pinzamiento vaginal de las arterias uterinas, ¿cuál es la indicación específica para la recolocación de las pinzas y la progresión a una histerectomía obstétrica?",opts:[["A","Si el sangrado no cesa en los primeros 10 minutos de pinzamiento"],["B","Si la paciente presenta signos de infección intrauterina"],["C","Cuando se verifica la presencia de orina en el colector, indicando lesión vesical"],["D","En casos refractarios al manejo"]],ans:"D",exp:"La recolocación de pinzas y progresión a histerectomía obstétrica durante el pinzamiento vaginal de arterias uterinas se indica en los casos refractarios al manejo conservador.",wrong:{A:"El criterio no es un tiempo fijo de 10 minutos, sino la falta de respuesta al manejo conservador en su conjunto.",B:"La infección intrauterina no es la indicación específica descrita para progresar a histerectomía en este contexto hemostático.",C:"La presencia de orina indicaría una lesión vesical, una complicación distinta al criterio de refractariedad hemostática."}},
{id:"26b2-g27",area:"GO",q:"¿Qué segmento de la trompa de Falopio es el más largo?",opts:[["A","Ampolla"],["B","Porción intersticial"],["C","Istmo"],["D","Infundíbulo"]],ans:"A",exp:"La ampolla es el segmento más largo de la trompa de Falopio.",wrong:{B:"La porción intersticial es el segmento más corto y estrecho de la trompa, no el más largo.",C:"El istmo es más corto y estrecho que la ampolla, no el segmento de mayor longitud.",D:"El infundíbulo es la porción distal con las fimbrias, más corta que la ampolla."}},
{id:"26b2-g28",area:"GO",q:"En una gestante con anemia ferropénica severa (Hb < 7 g/dl) que requiere una recuperación rápida y no tolera la vía oral, ¿cuál es la dosis máxima recomendada de hierro sacarosa que se puede infundir en un solo día?",opts:[["A","200 mg"],["B","300 mg"],["C","100 mg"],["D","500 mg"]],ans:"B",exp:"En anemia ferropénica severa que no tolera vía oral, la dosis máxima recomendada de hierro sacarosa en un solo día es de 300 mg.",wrong:{A:"Subestima la dosis máxima diaria recomendada de hierro sacarosa en anemia severa.",C:"Subestima considerablemente la dosis máxima permitida en infusión diaria.",D:"Excede la dosis máxima diaria recomendada, con mayor riesgo de reacciones adversas."}},
{id:"26b2-g29",area:"GO",q:"Entre las causas de polihidramnios por obstrucción gastrointestinal se incluye:",opts:[["A","Miocardiopatía"],["B","Atresia esofágica"],["C","Taquiarritmia fetal"],["D","Síndrome de Bartter"]],ans:"B",exp:"La atresia esofágica, al impedir la deglución normal del líquido amniótico, es una causa de polihidramnios por obstrucción gastrointestinal alta.",wrong:{A:"La miocardiopatía produce polihidramnios por mecanismo cardíaco (hidrops), no por obstrucción digestiva.",C:"La taquiarritmia fetal genera polihidramnios por insuficiencia cardíaca e hidrops, no por obstrucción gastrointestinal.",D:"El síndrome de Bartter causa poliuria fetal por mecanismo renal, no obstrucción del tracto digestivo."}},
{id:"26b2-g30",area:"GO",q:"Durante la gestación normal, las concentraciones de fibrinógeno plasmático al final del embarazo alcanzan en promedio:",opts:[["A","150 mg/100 mL"],["B","450 mg/100 mL"],["C","800 mg/100 mL"],["D","200 mg/100 mL"]],ans:"B",exp:"Al final del embarazo, las concentraciones de fibrinógeno plasmático aumentan fisiológicamente hasta un promedio cercano a 450 mg/100 mL.",wrong:{A:"Corresponde aproximadamente al valor basal no gestante; subestima el incremento fisiológico del embarazo.",C:"Sobreestima ampliamente el valor promedio alcanzado por el fibrinógeno al final de la gestación.",D:"Subestima notablemente el incremento fisiológico del fibrinógeno observado en el embarazo avanzado."}},
{id:"23f1-c1",area:"CIR",q:"Un sujeto de 35 años consulta por sensación de que el alimento se atora en la parte inferior del tórax o el epigastro, de un mes de evolución y ocasionalmente odinofagia. Refiere que está siendo medicado con omeprazol 20 mg/día, pero sin mejoría. ¿Qué estudio inicial le solicitaría?",opts:[["A","Manometría esofágica"],["B","Vigilancia de pH esofágica de 24 horas"],["C","Esofagograma"],["D","Endoscopía digestiva"]],ans:"D",exp:"La disfagia progresiva sin respuesta a IBP obliga a descartar causa orgánica (tumoral, estenosis) mediante endoscopía digestiva alta como primer estudio.",wrong:{A:"La manometría se indica tras descartar causa orgánica por endoscopía, no como primer estudio.",B:"La pHmetría de 24 horas evalúa reflujo ácido, pero no es el estudio inicial ante sospecha de causa estructural.",C:"El esofagograma es útil pero menos sensible que la endoscopía para detectar y biopsiar lesiones mucosas tempranas."}},
{id:"23f1-c2",area:"CIR",q:"Ante una masa dura y solitaria, de márgenes mal definidos, no dolorosa, en la mama de una mujer perimenopáusica, se debe pensar que se trata de:",opts:[["A","Carcinoma medular"],["B","Carcinoma mucinoso"],["C","Carcinoma ductal invasivo"],["D","Carcinoma lobulillar"]],ans:"C",exp:"Una masa mamaria dura, sólida, de márgenes mal definidos en mujer perimenopáusica es el cuadro clínico típico del carcinoma ductal invasivo, el subtipo más frecuente de cáncer de mama.",wrong:{A:"El carcinoma medular suele presentarse como una masa bien circunscripta y de bordes definidos, no mal delimitada.",B:"El carcinoma mucinoso típicamente se presenta como una masa blanda y bien circunscripta, de mejor pronóstico.",D:"El carcinoma lobulillar suele infiltrar de forma difusa sin formar una masa palpable bien definida."}},
{id:"23f1-c3",area:"CIR",q:"Las diverticulitis complicadas forman fístulas. ¿Cuál es la más frecuente?",opts:[["A","Colo-cutánea"],["B","Colo-entérica"],["C","Colo-vaginal"],["D","Colo-vesical"]],ans:"D",exp:"La fístula colo-vesical es la más frecuente entre las complicaciones fistulosas de la diverticulitis, favorecida por la proximidad anatómica del colon sigmoides con la vejiga.",wrong:{A:"La fístula colocutánea es infrecuente en comparación con la colovesical en la diverticulitis complicada.",B:"La fístula coloentérica es menos común que la colovesical dentro de las complicaciones fistulosas de la diverticulitis.",C:"La fístula colovaginal ocurre principalmente en mujeres histerectomizadas y es menos frecuente que la colovesical en general."}},
{id:"23f1-c4",area:"CIR",q:"¿En cuál de los siguientes casos, el dosaje de amilasemia puede ser normal en las pancreatitis agudas?",opts:[["A","En pancreatitis aguda traumática"],["B","En pacientes con hiperlipidemia"],["C","Cuando la necrosis pancreática es extensa"],["D","Cuando la necrosis pancreática es mínima"]],ans:"B",exp:"En pacientes con hiperlipidemia marcada, la hipertrigliceridemia puede interferir con el método de medición y dar valores de amilasa falsamente normales pese a pancreatitis aguda verdadera.",wrong:{A:"La pancreatitis traumática habitualmente eleva la amilasemia de forma proporcional al daño glandular.",C:"La necrosis pancreática extensa suele acompañarse de amilasa elevada, no normal, salvo en fases tardías.",D:"La necrosis mínima generalmente aún eleva la amilasa sérica, a diferencia de la interferencia analítica por hiperlipidemia."}},
{id:"23f1-c5",area:"CIR",q:"¿Cuál es la principal causa de hemoconcentración con elevación del hematocrito en pancreatitis aguda grave?",opts:[["A","Hemorragia intraperitoneal"],["B","Vómitos repetidos"],["C","Secuestro de líquido en el retroperitoneo en forma de líquido de edema"],["D","Retención de líquidos en forma de ascitis"]],ans:"C",exp:"En la pancreatitis aguda grave, el líquido se secuestra en el retroperitoneo (edema/tercer espacio), lo que reduce el volumen intravascular y eleva el hematocrito por hemoconcentración.",wrong:{A:"La hemorragia intraperitoneal produciría anemia y caída del hematocrito, no elevación por hemoconcentración.",B:"Los vómitos repetidos contribuyen a la depleción de volumen, pero el mecanismo principal en la pancreatitis grave es el secuestro retroperitoneal.",D:"La ascitis retiene líquido en la cavidad peritoneal, pero el mecanismo predominante de hemoconcentración es el edema retroperitoneal masivo."}},
{id:"23f1-c6",area:"CIR",q:"Entre las siguientes opciones, ¿cuál es el factor más frecuente que predispone a la aparición de las hernias incisionales?",opts:[["A","El tipo de sutura utilizado"],["B","La extensión de la incisión cutánea"],["C","La infección del sitio quirúrgico"],["D","La duración del acto quirúrgico"]],ans:"C",exp:"La infección del sitio quirúrgico es el factor más consistentemente asociado a la aparición posterior de hernias incisionales.",wrong:{A:"El tipo de sutura influye menos que la infección en el desarrollo de hernias incisionales.",B:"La extensión de la incisión cutánea no es el factor predisponente más consistente descrito para las hernias incisionales.",D:"La duración de la cirugía se relaciona indirectamente con mayor riesgo de infección, pero no es el factor predisponente principal en sí."}},
{id:"23f1-c7",area:"CIR",q:"¿Cuál de las siguientes, es una técnica quirúrgica indicada en hernias femorales y cuando esté contraindicado el uso de material protésico?",opts:[["A","Reparación de Bassini"],["B","Reparación de Shouldice"],["C","Reparación de McVay"],["D","Reparación de Lichtenstein"]],ans:"C",exp:"La técnica de McVay (aproximación al ligamento de Cooper) es de elección en hernias femorales, especialmente cuando el uso de malla protésica está contraindicado (por ejemplo, campo contaminado).",wrong:{A:"La técnica de Bassini se emplea en hernias inguinales, no está indicada específicamente para hernias femorales.",B:"La técnica de Shouldice es una reparación inguinal con tejido propio, no la de elección para hernias femorales.",D:"La técnica de Lichtenstein usa malla protésica, contraindicada precisamente en el escenario que plantea la pregunta."}},
{id:"23f1-c8",area:"CIR",q:"Sujeto sufre una agresión por terceros, con arma blanca, a nivel del tercer espacio intercostal izquierdo. Llega a la urgencia presentando hipotensión (PA 80/40 mm/Hg) e ingurgitación yugular. El médico sospecha taponamiento cardíaco por hemo pericardio. ¿Cuál es el mejor método para confirmar la sospecha diagnóstica?",opts:[["A","Radiografía de tórax"],["B","Electrocardiograma"],["C","Eco Fast"],["D","Tomografía de tórax"]],ans:"C",exp:"El eco-FAST permite detectar líquido pericárdico de forma rápida a pie de cama, siendo el método más práctico y oportuno para confirmar taponamiento cardíaco en trauma.",wrong:{A:"La radiografía de tórax tiene baja sensibilidad para detectar líquido pericárdico agudo en trauma.",B:"El electrocardiograma puede mostrar alteraciones inespecíficas, pero no confirma directamente el taponamiento cardíaco.",D:"La tomografía de tórax requiere tiempo y traslado, no es práctica en un paciente inestable con sospecha de taponamiento."}},
{id:"23f1-c9",area:"CIR",q:"La reanimación masiva de pacientes quemados puede precipitar el síndrome compartimental intraabdominal que se caracteriza por:",opts:[["A","Elevación de la presión en las vías respiratorias"],["B","Hiperventilación"],["C","Aumento de la diuresis"],["D","Presión intraabdominal de 5 mm Hg"]],ans:"A",exp:"La reanimación masiva con grandes volúmenes en quemados puede generar edema visceral y de la pared abdominal, elevando la presión intraabdominal y comprimiendo la vía aérea (elevación de presiones respiratorias).",wrong:{B:"El síndrome compartimental abdominal reduce la ventilación por compresión diafragmática, generando hipoventilación, no hiperventilación.",C:"La hipertensión intraabdominal reduce el retorno venoso renal, disminuyendo la diuresis, no aumentándola.",D:"Una presión intraabdominal de 5 mmHg es normal; el síndrome compartimental se define con presiones sostenidas mayores a 20 mmHg."}},
{id:"23f1-c10",area:"CIR",q:"La acalasia es un trastorno motor del esófago, marque la opción correcta en relación a esta afección.",opts:[["A","Una característica manométrica de la acalasia es la ausencia de peristalsis en el cuerpo esofágico"],["B","La acalasia es una afección del músculo esofágico longitudinal inicialmente que luego afecta al esfínter esofágico superior"],["C","La disfagia a sólidos es el primer síntoma que se presenta, y suele ser de instauración abrupta"],["D","La presión del esfínter esofágico inferior está disminuida por debajo de 10 mmHg"]],ans:"A",exp:"La característica manométrica distintiva de la acalasia es la ausencia de peristalsis normal en el cuerpo esofágico, junto con relajación incompleta del esfínter esofágico inferior.",wrong:{B:"La acalasia afecta primariamente el músculo liso del cuerpo esofágico y el EEI, no el esfínter esofágico superior.",C:"La disfagia en la acalasia es de instauración progresiva e insidiosa, no abrupta, y afecta sólidos y líquidos por igual.",D:"En la acalasia la presión del EEI suele estar elevada o normal-alta, no disminuida por debajo de 10 mmHg."}},
{id:"23f1-c11",area:"CIR",q:"En relación al cáncer de tiroides, es correcto afirmar:",opts:[["A","La tiroidectomía total es el tratamiento quirúrgico de elección para la mayoría de los cánceres tiroideos, ya que los índices de complicación son bajos"],["B","La tomografía está indicada ante la sospecha ecográfica de cáncer tiroideo para seleccionar el nódulo apropiado para punzar"],["C","Rara vez los canceres foliculares son lesiones solitarias y es aún más infrecuente que estos se hallen rodeados por una capsula"],["D","El carcinoma de células de Hürthle representa casi 32 % de todos los tumores tiroideos malignos"]],ans:"A",exp:"La tiroidectomía total es el tratamiento quirúrgico de elección para la mayoría de los cánceres de tiroides, con bajas tasas de complicación en manos experimentadas.",wrong:{B:"La tomografía no se usa para seleccionar el nódulo a punzar; ese rol corresponde a la ecografía tiroidea.",C:"Los carcinomas foliculares suelen presentarse como lesiones solitarias encapsuladas, contrario a lo que afirma la opción.",D:"El carcinoma de células de Hürthle representa solo una pequeña fracción, no un 32%, de los cánceres tiroideos malignos."}},
{id:"23f1-c12",area:"CIR",q:"Las hemorroides son lesiones que se clasifican en grados. En relación a éstas, marque la opción:",opts:[["A","Las hemorroides de primer grado prolapsan espontáneamente por arriba de la línea dentada"],["B","Las hemorroides de segundo grado se prolapsan por el ano pero se reducen manualmente"],["C","Las hemorroides de tercer grado se prolapsan por el conducto anal y no pueden reducirse en forma manual"],["D","Las hemorroides de cuarto grado se prolapsan pero no pueden reducirse y tienen riesgo de estrangularse"]],ans:"D",exp:"Las hemorroides de cuarto grado están permanentemente prolapsadas, no se pueden reducir manualmente y tienen riesgo de estrangulación.",wrong:{A:"Las hemorroides de primer grado no prolapsan; solo sangran sin protruir por el ano.",B:"Las hemorroides de segundo grado se reducen espontáneamente, no requieren reducción manual.",C:"Las hemorroides de tercer grado sí pueden reducirse manualmente, a diferencia de las de cuarto grado."}},
{id:"23f1-c13",area:"CIR",q:"El 90 al 95 % de la colecistitis aguda es secundaria a cálculos biliares, en relación a esta patología, es correcto afirmar que:",opts:[["A","La inflamación de la vesícula produce aumento de presión y provoca la obstrucción del conducto cístico por un lito"],["B","La contaminación bacteriana secundaria no está documentada, por lo que no está claro si se produce infección"],["C","La ecografía es el estudio imagenológico más útil para el diagnóstico de colecistitis aguda"],["D","El tratamiento de la colecistitis aguda litiásica es únicamente médico en diabéticos"]],ans:"C",exp:"La ecografía abdominal es el estudio de elección inicial para el diagnóstico de colecistitis aguda por su alta disponibilidad, sensibilidad y ausencia de radiación.",wrong:{A:"La obstrucción del cístico antecede al aumento de presión vesicular, no al revés como plantea la opción.",B:"La contaminación bacteriana secundaria en la colecistitis aguda está bien documentada en un porcentaje significativo de casos.",D:"El tratamiento de la colecistitis aguda litiásica es quirúrgico incluso en diabéticos, dado su mayor riesgo de complicaciones."}},
{id:"23f1-c14",area:"CIR",q:"Con relación al aneurisma de aorta abdominal es correcto afirmar que:",opts:[["A","La ubicación más común es la suprarrenal, y su tratamiento constituye el más sencillo dentro de la patología"],["B","La endoprótesis cubierta endovascular constituye un tratamiento revolucionario para los de localización infrarrenal"],["C","La limitación de las prótesis endovasculares es que son colocadas mediante grandes incisiones"],["D","Se define como una zona de estrechamiento de la luz focal de la aorta abdominal"]],ans:"B",exp:"Las endoprótesis cubiertas endovasculares (EVAR) revolucionaron el tratamiento del aneurisma de aorta abdominal infrarrenal al evitar la cirugía abierta y sus grandes incisiones.",wrong:{A:"La ubicación más común del aneurisma de aorta abdominal es infrarrenal, no suprarrenal, y su manejo es más complejo cuando es yuxta o suprarrenal.",C:"Las endoprótesis se colocan por vía percutánea o pequeñas incisiones inguinales, no por grandes incisiones.",D:"El aneurisma se define como una dilatación, no un estrechamiento, de la luz aórtica."}},
{id:"23f1-c15",area:"CIR",q:"El hígado debido a su gran tamaño puede ser el más susceptible al traumatismo cerrado, en relación al trauma hepático es correcto afirmar que:",opts:[["A","La colangiopancreatografía retrógrada endoscópica es un método auxiliar que carece de utilidad en el manejo no quirúrgico de lesiones hepáticas"],["B","La angiografía con embolización puede utilizarse para controlar la hemorragia hepática"],["C","En lesiones hepáticas, la mayoría de las veces se debe realizar hepatectomía debido al sangrado, es imposible manejar con taponamiento"],["D","Las lesiones del hilio hepático deben repararse en un segundo tiempo, debido a que son lesiones pequeñas"]],ans:"B",exp:"La angioembolización arterial es una herramienta eficaz para controlar hemorragias hepáticas activas en el manejo no quirúrgico del trauma hepático.",wrong:{A:"La CPRE sí tiene utilidad en el manejo no quirúrgico de lesiones biliares asociadas al trauma hepático.",C:"La mayoría de las lesiones hepáticas se manejan de forma no quirúrgica u observación, no con hepatectomía sistemática.",D:"Las lesiones del hilio hepático requieren reparación inmediata por su gravedad, no diferirse a un segundo tiempo."}},
{id:"23f1-c16",area:"CIR",q:"Son mecanismos para tratar de reducir la formación de adherencias peritoneales:",opts:[["A","Uso liberal del electrocauterio (electrobisturí)"],["B","Una lesión térmica o isquémica de la superficie peritoneal"],["C","Evitar desecación e isquemia de los tejidos"],["D","La presencia de inflamación peritoneal"]],ans:"C",exp:"Evitar la desecación e isquemia del peritoneo durante la cirugía es una medida reconocida para reducir la formación de adherencias postoperatorias.",wrong:{A:"El uso liberal de electrocauterio provoca lesión térmica tisular que favorece la formación de adherencias, no la reduce.",B:"La lesión térmica o isquémica peritoneal promueve la formación de adherencias; es un factor causal, no preventivo.",D:"La inflamación peritoneal es un factor que favorece las adherencias, no un mecanismo para reducirlas."}},
