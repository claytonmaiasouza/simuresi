{id:"23b2-m23",area:"MI",q:"Sabiendo que es de especial importancia el tratamiento del Dolor Neuropatico de distintas causas, el analgésico complementario no opioide considerado de primera línea hoy día es:",opts:[["A","Amitriptilina"],["B","Morfina"],["C","Lamotrigina"],["D","Gabapentina"],["E","Ketorolac"]],ans:"D",exp:"La gabapentina es el analgésico complementario no opioide considerado de primera línea para el tratamiento del dolor neuropático.",wrong:{A:"La amitriptilina es eficaz pero con más efectos adversos anticolinérgicos, no la de primera línea preferida hoy.",B:"La morfina es un opioide, no un analgésico complementario no opioide.",C:"La lamotrigina tiene uso limitado a la neuralgia del trigémino, no es primera línea general en dolor neuropático.",E:"El ketorolac es un AINE sin indicación establecida en el manejo del dolor neuropático."}},
{id:"23b2-m24",area:"MI",q:"En el caso particular en que una enfermedad pueda ser letal, surgen innumerables momentos con gran carga emocional y que pueden generar conflictos, que en forma global han sido llamadas situaciones de \"malas noticias\" en tal sentido, el acrónimo P-SPIKES se ha elaborado como un procedimiento organizado y eficaz que incluye siete fases para comunicar esta mala noticia. Según este acrónimo la letra \"K\" corresponde a:",opts:[["A","Conocimiento de la enfermedad"],["B","Empatía y exploración"],["C","Iniciar la sesión de percepción y preparativos por parte del paciente"],["D","Resumen y planes"],["E","Indagar lo correspondiente a invitación y necesidades de información"]],ans:"A",exp:"En el acrónimo P-SPIKES, la letra K corresponde a \"Knowledge\" (conocimiento), es decir, transmitir la información sobre la enfermedad al paciente.",wrong:{B:"La empatía y exploración corresponde a la fase E (Emotions) del acrónimo, no a la K.",C:"Iniciar la sesión de percepción corresponde a la fase P (Perception), no a la K.",D:"El resumen y planes corresponde a la fase final S (Strategy/Summary), no a la K.",E:"Indagar invitación y necesidades de información corresponde a la fase I (Invitation), no a la K."}},
{id:"23b2-m25",area:"MI",q:"La frecuencia del Dolor varía en forma significativa entre los pacientes con enfermedades terminales, en relación a su manejo terapéutico con el uso de analgésicos, es correcto afirmar:",opts:[["A","Es necesario prever y tratar de forma anticipatoria los efectos secundarios de los opioides, donde casi todos los pacientes muestran estreñimiento, que puede ser debilitante"],["B","En enfermos terminales la sospecha de adicción a opioides debe ser motivo para interrumpir el uso de analgésicos"],["C","Las intervenciones farmacológicas para manejo del dolor cumplen con el esquema de tres pasos de la OMS, y comprende la escalera de analgésicos. En primer lugar a los opioides \"débiles\" como la codeína"],["D","Los analgésicos no opioides son los fármacos preferidos contra el dolor de gran intensidad, en particular los antiinflamatorios no esteroideos (NSAID, nonsteroidal anti-inflammatory drugs)"],["E","El paracetamol en dosis incluso de 2 400 mg/día, tiene riesgo mínimo de ocasionar hemorragia y falla renal y constituye un producto satisfactorio en la selección inicial"]],ans:"A",exp:"En el manejo del dolor con opioides en cuidados paliativos, es fundamental anticipar y tratar el estreñimiento, efecto secundario prácticamente universal.",wrong:{B:"En cuidados paliativos la sospecha de adicción no debe motivar la interrupción del analgésico opioide.",C:"El primer escalón de la OMS son los analgésicos no opioides, no los opioides débiles como la codeína.",D:"Los AINE se reservan para dolor leve a moderado, no son los preferidos para dolor de gran intensidad.",E:"El paracetamol en dosis altas y sostenidas sí conlleva riesgo hepático y renal, no es inocuo."}},
{id:"23b2-m26",area:"MI",q:"En lo referente a la compresión maligna de la médula espinal, definida como la compresión por una masa tumoral extradural, es correcto afirmar:",opts:[["A","La columna torácica es el sitio más frecuente"],["B","Los tumores de riñón, tiroides y colon son los tumores primarios más comunes que hacen metástasis a columna"],["C","El colapso vertebral (aplastamiento) es un indicador confiable de la presencia de tumor; en particular aquellos presentes en pacientes de edad avanzada"],["D","La imagen completa de la médula proporcionada por la tomografía es el procedimiento diagnóstico de elección"],["E","La radiografía simple de columna es suficiente para hacer diagnóstico"]],ans:"A",exp:"La columna torácica es el sitio más frecuente de compresión medular maligna por metástasis extradural.",wrong:{B:"Los tumores primarios más frecuentes que metastatizan a columna son mama, pulmón y próstata, no riñón, tiroides y colon.",C:"El colapso vertebral es un hallazgo inespecífico, frecuente por osteoporosis en ancianos, no un indicador confiable de tumor.",D:"La RM, no la tomografía, es el procedimiento diagnóstico de elección por su mejor definición del tejido neural.",E:"La radiografía simple tiene baja sensibilidad y no es suficiente para descartar compresión medular."}},
{id:"23b2-m27",area:"MI",q:"El término síndromes para neoplásicos alude a los trastornos que acompañan a los tumores que pueden generar diversos productos que estimulan respuestas hormonales, hematológicas, dermatológicas, reumatológicas, renales y neurológicas. En relación a estos síndromes, es correcto afirmar:",opts:[["A","La hipercalcemia tumoral está relacionada en relación directa con la secreción inadecuada de hormona anti-diurética"],["B","Los síndromes para neoplásicos pueden aparecer con tumores benignos o malignos"],["C","El síndrome de Cushing para neoplásico causado por la producción ectópica de ACTH se manifiesta por hiponatremia"],["D","Las eritrocitosis para neoplásicas donde el aumenta el hematocrito (>52% en varones y >48% en mujeres) esta mayormente asociado a linfomas"],["E","La hipocalcemia es un dato a tener en cuenta en cuadros de metástasis óseas"]],ans:"B",exp:"Los síndromes paraneoplásicos pueden presentarse tanto con tumores benignos como malignos, aunque son más frecuentes con estos últimos.",wrong:{A:"La hipercalcemia tumoral se relaciona con la PTHrp, no con la secreción inadecuada de hormona antidiurética.",C:"El Cushing ectópico paraneoplásico cursa con hipopotasemia y alcalosis, no con hiponatremia.",D:"La eritrocitosis paraneoplásica se asocia más al carcinoma renal, hepatocarcinoma y hemangioblastoma, no principalmente a linfomas.",E:"Las metástasis óseas osteolíticas cursan típicamente con hipercalcemia, no con hipocalcemia."}},
{id:"23b2-m28",area:"MI",q:"Cuando hablamos de reacciones no inmunitarias de las trasfusiones, es correcto afirmar:",opts:[["A","Los hemoderivados son malos expansores de volumen circulante"],["B","Las trasfusiones pueden producir hipocalemia e hipercalcemia"],["C","La inmunomodulación hace referencia al uso de sangre alógena y produce mejoría de la inmunidad"],["D","En pacientes que usan IECAs, con la trasfusión pueden sufrir episodios de hipotensión"],["E","La hipotermia con el uso de hemoderivados es ocasionada por la sobrecarga de hierro que contiene cada volumen globular"]],ans:"D",exp:"En pacientes tratados con IECA, la transfusión de hemoderivados puede desencadenar episodios de hipotensión por activación del sistema de bradicinina.",wrong:{A:"Los hemoderivados son buenos expansores de volumen circulante, no malos.",B:"Las transfusiones masivas se asocian a hipocalcemia por citrato e hiperpotasemia, no a hipocalemia.",C:"La inmunomodulación transfusional se asocia a inmunosupresión, no a una mejoría de la inmunidad.",E:"La hipotermia transfusional se debe a la infusión de hemoderivados fríos, no a una sobrecarga de hierro."}},
{id:"23b2-m29",area:"MI",q:"La septicemia puede surgir tanto de infecciones adquiridas en la comunidad como en el hospital y cuando hablamos de la etiología es correcto afirmar lo siguiente:",opts:[["A","Los hemocultivos son positivos en un 90%"],["B","Staphylococcus aureus y Streptococcus pneumoniae son los Gram negativos más frecuentes"],["C","En el ambiente hospitalario predominan las infecciones por hongos"],["D","La neumonía es la más común"]],ans:"D",exp:"La neumonía es la causa más común de septicemia, tanto de origen comunitario como hospitalario.",wrong:{A:"Los hemocultivos son positivos en una minoría de los casos de sepsis, no en el 90%.",B:"S. aureus y S. pneumoniae son cocos Gram positivos, no Gram negativos.",C:"Las bacterias siguen predominando sobre los hongos incluso en el ambiente hospitalario."}},
{id:"23b2-m30",area:"MI",q:"Cuando hablamos de Hemorragia Subaracnoidea es correcto afirmar:",opts:[["A","Puede desencadenar una insuficiencia cardiaca y aumento de Troponinas"],["B","La causa principal de las complicaciones tardías y la muerte es la hidrocefalia obstructiva"],["C","La hiponatremia cursa con normo volemia y se trata con restricción hídrica"],["D","El dato clave de un aneurisma roto es la convulsión y parálisis del segundo par"],["E","La Xantocromía del LCR alcanza su máxima intensidad a los 7 días después del sangrado"]],ans:"A",exp:"La hemorragia subaracnoidea puede desencadenar complicaciones cardíacas, incluyendo insuficiencia cardíaca y elevación de troponinas por miocardio aturdido (\"tako-tsubo like\").",wrong:{B:"El resangrado y el vasoespasmo son las causas principales de complicación tardía, no la hidrocefalia.",C:"La hiponatremia en la HSA suele ser hipovolémica por síndrome perdedor de sal cerebral; la restricción hídrica está contraindicada por riesgo de vasoespasmo.",D:"La parálisis característica del aneurisma roto afecta al tercer par craneal, no al segundo.",E:"La xantocromía aparece ya entre las 6 y 12 horas y persiste, no alcanza recién su máximo a los 7 días."}},
{id:"23b2-p1",area:"PED",q:"Indique la afirmación correcta con respecto al sueño en lactantes de 6 meses",opts:[["A","El requerimiento total es de 24 horas diarias"],["B","2 a 3 horas corresponden al sueño nocturno"],["C","El 70% de ellos duermen 6 a 8 horas seguidas"],["D","El electroencefalograma del sueño muestra un patrón inmaduro"]],ans:"C",exp:"Alrededor del 70% de los lactantes de 6 meses ya duermen entre 6 y 8 horas seguidas durante la noche.",wrong:{A:"24 horas diarias de sueño corresponde a un recién nacido, no al requerimiento total de un lactante de 6 meses.",B:"2 a 3 horas de sueño nocturno es una duración muy inferior a la real, que alcanza varias horas seguidas a esta edad.",D:"El patrón electroencefalográfico del sueño ya está bien organizado a los 6 meses, no es inmaduro."}},
{id:"23b2-p2",area:"PED",q:"La sonrisa social es una habilidad que se explora en el área:",opts:[["A","Motora fina"],["B","Motora gruesa"],["C","Cognitiva"],["D","Lenguaje"]],ans:"C",exp:"La sonrisa social es una habilidad del área cognitiva/social del desarrollo, no motora ni de lenguaje.",wrong:{A:"La sonrisa social no implica destreza manual ni de coordinación fina, por lo que no corresponde al área motora fina.",B:"La sonrisa social no depende del control postural o de grandes grupos musculares propio del área motora gruesa.",D:"La sonrisa social es un hito social/cognitivo previo a la aparición de palabras, no del área de lenguaje."}},
{id:"23b2-p3",area:"PED",q:"Indique cuál de las siguientes formas de estimular la respiración en el recién nacido (RN) no corresponde:",opts:[["A","Golpecitos en la planta de los pies"],["B","Frotar las extremidades del RN"],["C","Frotar vigorosamente la espalda o tronco"],["D","Secar al RN y limpiar las vías aéreas"]],ans:"C",exp:"Frotar vigorosamente la espalda o el tronco no corresponde a las maniobras recomendadas para estimular la respiración en el RN, que incluyen golpecitos plantares y frotar extremidades suavemente.",wrong:{A:"Los golpecitos suaves en la planta de los pies sí son una maniobra válida y recomendada de estimulación táctil neonatal.",B:"Frotar las extremidades del recién nacido es una maniobra de estimulación aceptada, a diferencia de frotar vigorosamente el tronco.",D:"Secar al recién nacido y limpiar las vías aéreas es un paso correcto y recomendado en la atención inicial."}},
{id:"23b2-p4",area:"PED",q:"Indique a qué edad desaparecen los reflejos primitivos",opts:[["A","Prensión palmar, 2-3 meses postnatal"],["B","Reflejo de búsqueda, 5 a 6 meses post natal"],["C","Reflejo de Moro, después del primer mes postnatal"],["D","Reflejo tónico cervical, permanece toda la vida"]],ans:"A",exp:"El reflejo de prensión palmar desaparece fisiológicamente entre los 2 y 3 meses de vida postnatal.",wrong:{B:"El reflejo de búsqueda desaparece mucho antes, alrededor de los 3-4 meses, no a los 5-6 meses.",C:"El reflejo de Moro persiste hasta aproximadamente los 4-6 meses, no que 'desaparece después del primer mes'.",D:"El reflejo tónico cervical asimétrico desaparece hacia los 4-6 meses de vida; no permanece de forma permanente."}},
{id:"23b2-p5",area:"PED",q:"El vocabulario de los niños se amplía de 10-15 palabras a entre 50 y 100, esto ocurre a la edad de:",opts:[["A","24 meses"],["B","12 meses"],["C","18 meses"],["D","36 meses"]],ans:"A",exp:"El vocabulario se amplía de 10-15 a entre 50-100 palabras alrededor de los 24 meses de edad.",wrong:{B:"A los 12 meses el vocabulario es aún muy limitado, de apenas una o pocas palabras, lejos de las 50-100.",C:"A los 18 meses el vocabulario ronda entre 10 y 50 palabras, sin alcanzar todavía las 50 a 100.",D:"A los 36 meses el vocabulario ya supera ampliamente las 100 palabras, superando el rango descrito."}},
{id:"23b2-p6",area:"PED",q:"Indique la opción correcta respecto de la vacuna contra la Fiebre Amarilla",opts:[["A","La inmunogenicidad es pobre con una sola dosis"],["B","Está contraindicada en menores de 6 meses"],["C","Sus efectos adversos son más frecuentes con las dosis subsecuentes que con la primera dosis"],["D","Los anticuerpos aparecen a las 48hs de la aplicada la vacuna"]],ans:"B",exp:"La vacuna contra la fiebre amarilla está contraindicada en menores de 6 meses de edad.",wrong:{A:"La vacuna contra la fiebre amarilla tiene una inmunogenicidad alta con una sola dosis, considerada de protección prolongada.",C:"Los efectos adversos de la vacuna de fiebre amarilla son más frecuentes tras la primera dosis, no con las subsecuentes.",D:"Los anticuerpos protectores tardan aproximadamente 10 días en desarrollarse tras la vacunación, no 48 horas."}},
{id:"23b2-p7",area:"PED",q:"Juan tiene actualmente 24 meses de edad y mide 85 cm. Calcule la talla adulta final",opts:[["A","165 cm"],["B","160 cm"],["C","175 cm"],["D","170 cm"]],ans:"D",exp:"Con 85 cm a los 24 meses, la talla adulta estimada (duplicando aproximadamente la talla a los 2 años) es de 170 cm.",wrong:{A:"165 cm subestima la talla adulta proyectada al duplicar la talla registrada a los 24 meses de edad.",B:"160 cm subestima considerablemente la proyección de talla adulta calculada a partir de los 85 cm a los 2 años.",C:"175 cm sobreestima la talla adulta proyectada respecto al cálculo esperado a partir de la talla a los 2 años."}},
{id:"23b2-p8",area:"PED",q:"Aylén es una niña de 14 meses que al acudir a urgencias por un cuadro febril se constata que el esquema de vacunación está completo hasta los 4 meses, en cuanto a esta situación lo más recomendable es:",opts:[["A","Reiniciar todo el esquema al superar el cuadro agudo"],["B","Continuar con el esquema desde donde se ha quedado"],["C","Si han pasado más de 4 meses las dosis anteriores son anuladas"],["D","Siempre se debe tener en cuenta los intervalos máximos entre las dosis"]],ans:"B",exp:"Ante un esquema de vacunación incompleto, lo recomendado es continuar desde donde se quedó, sin reiniciar el esquema completo.",wrong:{A:"Reiniciar todo el esquema no es necesario ni recomendado; las dosis previas ya aplicadas conservan su validez inmunológica.",C:"Las dosis previas no se anulan por el paso del tiempo; los esquemas de vacunación no tienen intervalos máximos entre dosis.",D:"A diferencia de los intervalos mínimos, no existen intervalos máximos que invaliden dosis administradas previamente."}},
{id:"23b2-p9",area:"PED",q:"El niño debería consumir agua:",opts:[["A","Desde que nace"],["B","Sólo si toma leche de fórmula"],["C","Si toma leche materna y de fórmula"],["D","Desde que inicia alimentación complementaria"]],ans:"D",exp:"El niño debe comenzar a consumir agua desde el inicio de la alimentación complementaria (alrededor de los 6 meses).",wrong:{A:"Ofrecer agua desde el nacimiento no es necesario, ya que la leche materna exclusiva cubre los requerimientos hídricos del lactante.",B:"El agua no se limita a los lactantes con fórmula; ambos grupos inician su consumo con la alimentación complementaria.",C:"No es la combinación de leches lo que determina el inicio de agua, sino el comienzo de la alimentación complementaria."}},
{id:"23b2-p10",area:"PED",q:"En cuanto al Zinc como micronutriente podemos afirmar:",opts:[["A","La dosis recomendada en niños de 1 a 3 años es de 8 mg/día"],["B","Es esencial para el adecuado crecimiento lineal y como catalizador de enzimas específicas"],["C","Los suplementos de Zinc se pueden administrar en multivitaminas con Hierro y otros micronutrientes"],["D","Está presente en vegetales de color, cítricos y aceites vegetales"]],ans:"B",exp:"El zinc es esencial para el crecimiento lineal adecuado y actúa como catalizador de enzimas específicas del metabolismo.",wrong:{A:"La dosis recomendada de zinc en niños de 1 a 3 años es menor, de aproximadamente 3 mg/día, no 8 mg/día.",C:"El zinc y el hierro compiten por su absorción, por lo que no se recomienda su suplementación conjunta en la misma preparación.",D:"El zinc se encuentra principalmente en carnes, mariscos y legumbres, no en vegetales de color, cítricos o aceites vegetales."}},
{id:"23b2-p11",area:"PED",q:"Todos los recién nacidos y sus madres deben ser controlados tras el alta, para comprobar que la lactancia exclusiva progresa adecuadamente. ¿A los cuántos días posteriores al alta se debería controlar?",opts:[["A","2 a 3"],["B","8 a 10"],["C","10 a 15"],["D","15 a 30"]],ans:"A",exp:"Se recomienda el control del recién nacido y su madre entre los 2 y 3 días posteriores al alta para verificar que la lactancia exclusiva progresa bien.",wrong:{B:"Un control a los 8-10 días es tardío para detectar precozmente problemas de la lactancia exclusiva tras el alta.",C:"Esperar 10 a 15 días retrasa la detección de dificultades tempranas en la lactancia, que deben evaluarse antes.",D:"Un control a los 15-30 días es demasiado tardío para el seguimiento inicial recomendado tras el alta neonatal."}},
{id:"23b2-p12",area:"PED",q:"En una punción lumbar traumática, la concentración de proteínas en el LCR se incrementa en aproximadamente",opts:[["A","1 mg/dl por cada 1.000 hematíes/mm³"],["B","2 mg/dl por cada 1.000 hematíes/mm³"],["C","1 mg/dl por cada 500 hematíes/mm³"],["D","2 mg/dl por cada 500 hematíes/mm³"]],ans:"A",exp:"En una punción lumbar traumática, la concentración de proteínas en LCR se incrementa aproximadamente 1 mg/dL por cada 1.000 hematíes/mm³ presentes por el sangrado.",wrong:{B:"El incremento real es de 1 mg/dL por cada 1.000 hematíes/mm³, no de 2 mg/dL, lo que sobreestima la corrección.",C:"Calcular 1 mg/dL por cada 500 hematíes/mm³ duplica el efecto real de la contaminación hemática sobre las proteínas.",D:"2 mg/dL por cada 500 hematíes/mm³ sobreestima considerablemente el incremento proteico esperado por sangre traumática."}},
{id:"23b2-p13",area:"PED",q:"Un niño de 8 kilos con diarrea aguda que no se encuentra deshidratado, debe recibir:",opts:[["A","Líquidos 800 ml por día y suero oral 200 ml luego de cada deposición"],["B","Líquidos 800 ml por día y suero oral 100 ml luego de cada deposición"],["C","Sólo debe recibir sus necesidades basales ya que no está deshidratado"],["D","Con 400 ml en 4 a 6 horas de suero oral se evita la deshidratación"]],ans:"B",exp:"Un niño de 8 kg con diarrea aguda sin deshidratación debe recibir líquidos de mantenimiento (800 mL/día) más 100 mL de suero oral por cada deposición adicional.",wrong:{A:"200 mL de suero oral por cada deposición excede la cantidad recomendada de reposición adicional, que es de 100 mL.",C:"Limitarse a las necesidades basales sin reposición adicional no compensa las pérdidas continuas por las deposiciones diarreicas.",D:"El esquema de 400 mL en 4-6 horas corresponde al Plan B de rehidratación en niños ya deshidratados, no al de mantenimiento sin deshidratación."}},
{id:"23b2-p14",area:"PED",q:"Amelia de 8 meses de edad fue ingresada por presentar irritabilidad, vómitos y rechazo alimentario, al segundo día de internación presenta dificultad para despertar, signos vitales normales, distención abdominal y al examen rectal, heces con sangre por dedo de guante. El diagnóstico más probable es:",opts:[["A","Intoxicación alimentaria"],["B","Cólicos del lactante"],["C","Diarrea disenteriforme"],["D","Invaginación intestinal"]],ans:"D",exp:"Distensión abdominal, dificultad para despertar y sangre oculta en heces en un lactante orientan a invaginación intestinal.",wrong:{A:"Una intoxicación alimentaria no suele producir distensión abdominal marcada ni sangre en heces en dedo de guante ni letargia.",B:"Los cólicos del lactante no cursan con distensión abdominal, alteración del sensorio ni sangrado rectal.",C:"La diarrea disenteriforme cursa con deposiciones con sangre y moco visibles, no con el hallazgo aislado en dedo de guante ni letargia marcada."}},
{id:"23b2-p15",area:"PED",q:"Además del lupus eritematoso sistémico, ¿Qué otra enfermedad del tejido conectivo se asocia a fiebre de origen desconocido?",opts:[["A","Enfermedad inflamatoria intestinal"],["B","Síndrome de Sjögren"],["C","Artritis idiopática juvenil"],["D","Dermatomiositis"]],ans:"C",exp:"La artritis idiopática juvenil, además del LES, es una enfermedad del tejido conectivo que puede presentarse como fiebre de origen desconocido.",wrong:{A:"La enfermedad inflamatoria intestinal no se clasifica como enfermedad del tejido conectivo, aunque puede causar fiebre prolongada.",B:"El síndrome de Sjögren es infrecuente como causa de fiebre de origen desconocido en la edad pediátrica.",D:"La dermatomiositis juvenil es una causa infrecuente de fiebre de origen desconocido comparada con la artritis idiopática juvenil."}},
{id:"23b2-p16",area:"PED",q:"¿Cuál de las siguientes afirmaciones con respecto a la Glomerulonefritis postestreptocócica es correcta?",opts:[["A","Es común en niños de 2 a 5 años"],["B","La fase aguda generalmente se resuelve en 2 a 4 semanas"],["C","La hematuria microscópica puede persistir hasta 1-2 meses después de la presentación inicial"],["D","El nivel sérico de C3 generalmente aumenta en la fase aguda de la enfermedad"]],ans:"A",exp:"La glomerulonefritis postestreptocócica es común en niños de 2 a 5 años, típicamente tras una infección faríngea o cutánea previa.",wrong:{B:"La fase aguda de la glomerulonefritis postestreptocócica suele resolverse en 1 a 2 semanas, más rápido que lo indicado.",C:"La hematuria microscópica puede persistir mucho más allá de 1-2 meses, incluso hasta un año tras el episodio agudo.",D:"El C3 sérico característicamente disminuye durante la fase aguda de la enfermedad, no aumenta."}},
{id:"23b2-p17",area:"PED",q:"Un recién nacido de término, de 4 horas de vida, grande para la edad gestacional, presenta hiporreactividad y convulsiones en una oportunidad. Al examen físico se observa hiporreactivo e hipotónico, sin otros hallazgos. La primera medida a tomar es:",opts:[["A","Solicitar hemograma, hemocultivos y punción lumbar"],["B","Solicitar ecoencéfalograma"],["C","Administrar suero fisiológico y antibióticos endovenosos"],["D","Realizar control de glicemia"]],ans:"D",exp:"En un RN con hiporreactividad y convulsiones sin otros hallazgos, la primera medida es descartar hipoglicemia mediante control de glicemia.",wrong:{A:"Solicitar hemograma, hemocultivos y punción lumbar es razonable en un segundo momento, pero no la primera medida en un GEG con convulsiones.",B:"El ecoencefalograma no aporta información inmediata para la causa más probable y frecuente de convulsiones en un RN macrosómico.",C:"Iniciar antibióticos sin antes descartar hipoglicemia, causa más frecuente en RN grandes para la edad gestacional, no es la primera medida."}},
{id:"23b2-p18",area:"PED",q:"Blanca es una niña de 3,6 kg de peso, 42 semanas de edad gestacional, presenta hiperbilirrubinemia persistente a las 2 semanas de vida. Al examen físico no ha ganado peso, tiene tono reducido, presenta hernia umbilical y fontanela anterior de 4 x 6 cm. El diagnóstico más probable es:",opts:[["A","Enfermedad de Gilbert"],["B","Hipotiroidismo"],["C","Atresia de vías biliares"],["D","Síndrome de Crigler – Najjar"]],ans:"B",exp:"Hiperbilirrubinemia persistente, hernia umbilical, fontanela amplia y tono reducido en un lactante son hallazgos característicos de hipotiroidismo congénito.",wrong:{A:"El síndrome de Gilbert no se asocia a hernia umbilical, fontanela amplia ni retraso ponderal como los descritos.",C:"La atresia de vías biliares cursa con hiperbilirrubinemia de predominio directo (colestasis), no con los hallazgos sistémicos descritos aquí.",D:"El síndrome de Crigler-Najjar no explica la hernia umbilical, la fontanela amplia ni el tono reducido presentes en este caso."}},
{id:"23b2-p19",area:"PED",q:"Indique cuál de los siguientes es un signo alarma en niños con Covid 19",opts:[["A","Deshidratación o rechazo alimentario"],["B","Saturación de Oxígeno ≥ 95%"],["C","Fiebre"],["D","Tos persistente"]],ans:"A",exp:"La deshidratación o el rechazo alimentario son signos de alarma reconocidos en niños con COVID-19.",wrong:{B:"Una saturación de oxígeno ≥95% es un valor normal, no un signo de alarma en COVID-19 pediátrico.",C:"La fiebre aislada es un síntoma común de la infección, no un signo de alarma por sí solo.",D:"La tos persistente es un síntoma frecuente de la enfermedad, sin constituir en sí un signo de alarma."}},
{id:"23b2-p20",area:"PED",q:"Paciente de 8 años con antecedente de traumatismo en miembro inferior izquierdo 12 días antes consulta por fiebre de 38°C, dolor en pierna izquierda e impotencia funcional de 3 días. ¿Qué conducta tomaría al ingreso hospitalario del paciente?",opts:[["A","Solicita hemograma, PCR, 2 hemocultivos, radiografía de miembro inferior y mantener conducta expectante hasta que estén los cultivos"],["B","Dar ibuprofeno, iniciar antibióticos, radiografía de miembro inferior e interconsulta con Traumatología"],["C","Solicitar hemograma, PCR, 2 hemocultivos, radiografía de miembro inferior e indicar tratamiento antibiótico empírico endovenoso"],["D","Solicitar hemograma, PCR, radiografía de miembro inferior e interconsulta con Traumatología"]],ans:"C",exp:"Ante sospecha de osteomielitis (fiebre, dolor óseo, antecedente traumático), corresponde solicitar hemograma, PCR, hemocultivos e imagen, e iniciar tratamiento antibiótico empírico endovenoso sin demora.",wrong:{A:"Mantener conducta expectante sin iniciar antibióticos retrasa el tratamiento de una probable osteomielitis, que requiere manejo precoz.",B:"El ibuprofeno no sustituye el estudio microbiológico previo (hemocultivos) que debe solicitarse antes de iniciar el antibiótico.",D:"No solicitar antibioticoterapia empírica retrasa el tratamiento oportuno de una osteomielitis aguda sospechada clínicamente."}},
{id:"23b2-p21",area:"PED",q:"Usted atiende un niño de 2 años que acude por fiebre alta, exantema marcado, tos y conjuntivitis. No tiene vacuna triple viral y ante sospecha de sarampión, indique qué muestras debe enviar para confirmar su sospecha.",opts:[["A","Suero para PCR para Sarampión e IgG anti-sarampión"],["B","Aspirado nasofaríngeo y orina para PCR para sarampión"],["C","Serología pareada IgM – IgG para sarampión"],["D","Suero para IgM anti-sarampión, orina y secreción nasofaríngea para PCR"]],ans:"D",exp:"Ante sospecha clínica de sarampión, deben enviarse muestras de suero para IgM, y orina y secreción nasofaríngea para PCR, con el fin de confirmar el diagnóstico.",wrong:{A:"La IgG sérica indica inmunidad pasada o vacunación, no permite confirmar una infección aguda como la IgM.",B:"El aspirado nasofaríngeo y la orina para PCR son útiles pero incompletos sin la determinación sérica de IgM.",C:"La serología pareada requiere dos muestras espaciadas en el tiempo, retrasando la confirmación diagnóstica que se busca de forma temprana."}},
{id:"23b2-p22",area:"PED",q:"Las formas graves de dengue se definen por uno o más de los siguientes criterios:",opts:[["A","Fiebre persistente, vómitos, dolor abdominal"],["B","Choque por extravasación del plasma"],["C","Fiebre persistente, epistaxis, vómitos"],["D","Mialgias, sangrado, cefalea intensa"]],ans:"B",exp:"El choque por extravasación de plasma es el criterio que define las formas graves de dengue.",wrong:{A:"Fiebre persistente, vómitos y dolor abdominal son signos de alarma, pero no el criterio que define la forma grave del dengue.",C:"Fiebre persistente, epistaxis y vómitos corresponden a signos de alarma, no al criterio definitorio de gravedad del dengue.",D:"Mialgias, sangrado y cefalea intensa son manifestaciones del dengue con signos de alarma, no el criterio de forma grave."}},
{id:"23b2-p23",area:"PED",q:"¿Cuál de los siguientes trastornos no cursa con disminución de las plaquetas?",opts:[["A","Purpura trombcitopenica idiopática"],["B","Purpura de Henoch-Shönlein"],["C","Coagulación intravascular diseminada"],["D","Síndrome de Kasabach-Merrit"]],ans:"B",exp:"La púrpura de Henoch-Schönlein cursa con recuento de plaquetas normal, a diferencia de las otras opciones que sí presentan trombocitopenia.",wrong:{A:"La púrpura trombocitopénica idiopática cursa característicamente con disminución marcada del recuento plaquetario.",C:"La coagulación intravascular diseminada consume plaquetas y factores de coagulación, cursando con trombocitopenia.",D:"El síndrome de Kasabach-Merritt cursa con trombocitopenia por atrapamiento plaquetario dentro del hemangioma."}},
{id:"23b2-p24",area:"PED",q:"Un recién nacido de 5 horas de vida, presenta ictericia que afecta la cara y el tronco. El resto del examen físico es normal. La conducta más adecuada es:",opts:[["A","Solicitar pruebas hepáticas (GPT/GOT), test de Coombs indirecto"],["B","Solicitar bilirrubinemia, hemograma, grupo sanguíneo y Rh, prueba de Coombs directo"],["C","Iniciar fototerapia ya que teniendo en cuenta las zonas de Kramer tiene una bilirrubina aproximadamente de 20 mg/dl"],["D","Debe realizar una exanguinotransfusión precoz"]],ans:"B",exp:"Ante ictericia en las primeras horas de vida que afecta cara y tronco, corresponde solicitar bilirrubinemia, hemograma, grupo/Rh y prueba de Coombs directa para investigar la causa.",wrong:{A:"El test de Coombs indirecto detecta anticuerpos en el suero materno, no en el recién nacido; se requiere el Coombs directo.",C:"Estimar la bilirrubina solo por las zonas de Kramer sin confirmación de laboratorio no es la conducta inicial adecuada.",D:"Indicar exanguinotransfusión de entrada, sin estudios previos que confirmen la causa y gravedad, no es la conducta inicial correcta."}},
{id:"23b2-p25",area:"PED",q:"Pedro de 5 años, acude a la consulta por dolor abdominal de 48hs de evolución acompañado de detención de heces y gases, vómitos de 24hs en varias ocasiones la última vez con expulsión de lombrices, al examen físico abdomen distendido, ruidos hidroaéreos ausentes ¿Cuál es su sospecha diagnóstica y en qué germen piensa como causante?",opts:[["A","Síndrome de hiperinfección por Estrongiloides estercoralis"],["B","Obstrucción intestinal por Áscaris lumbricoides"],["C","Síndrome de malabsorción por Giardia lamblia"],["D","Anemia severa por Uncinaria"]],ans:"B",exp:"Dolor abdominal con detención de heces/gases y expulsión de lombrices sugiere obstrucción intestinal por Áscaris lumbricoides.",wrong:{A:"El síndrome de hiperinfección por Strongyloides se presenta típicamente en inmunocomprometidos, no con expulsión de lombrices y obstrucción mecánica.",C:"El síndrome de malabsorción por Giardia lamblia cursa con diarrea crónica, no con cuadro obstructivo agudo.",D:"La anemia por Uncinaria se manifiesta con palidez y fatiga crónica, no con obstrucción intestinal aguda."}},
{id:"23b2-p26",area:"PED",q:"En nuestro medio, en una neumonía bacteriana no complicada de un niño de 7 años con retorno de PCR con S. Pneumoniae ¿Qué antibiótico dejaría usted como tratamiento?",opts:[["A","Cefotaxima a 200mg/kg/día"],["B","Clindamicina a 40mg/kg/día"],["C","Vancomicina a 40mg/kg/día"],["D","Ampicilina a 300mg/kg/día"]],ans:"D",exp:"En neumonía no complicada por S. pneumoniae, la ampicilina a dosis altas (300 mg/kg/día) es el tratamiento antibiótico de elección en nuestro medio.",wrong:{A:"La cefotaxima se reserva para neumonías complicadas o con sospecha de resistencia, no como primera línea en casos no complicados.",B:"La clindamicina no es de primera línea para neumonía neumocócica no complicada, se reserva para sospecha de S. aureus u otros gérmenes.",C:"La vancomicina se reserva para neumococo con alta resistencia a penicilina o complicaciones graves, no para casos no complicados."}},
{id:"23b2-p27",area:"PED",q:"Con relación a las quemaduras, La Regla de los Nueve usada en adultos, puede utilizarse solo en niños a partir de:",opts:[["A","6 meses"],["B","12 meses"],["C","12 años"],["D","14 años"]],ans:"D",exp:"La Regla de los Nueve, diseñada para adultos, puede aplicarse en niños recién a partir de los 14 años, dada la diferente proporción corporal en edades menores.",wrong:{A:"A los 6 meses la proporción corporal es muy distinta a la del adulto, por lo que la Regla de los Nueve no es aplicable.",B:"A los 12 meses las proporciones corporales infantiles aún difieren sustancialmente de las del adulto, invalidando esta regla.",C:"A los 12 años las proporciones corporales todavía no equivalen a las del adulto necesarias para aplicar esta regla."}},
{id:"23b2-p28",area:"PED",q:"Ingresa a urgencias adolescente de 13 años con antecedente de ingesta intencional de insecticida (organofosforado), taquicárdica, con sudoración profusa, somnolienta. La medicación indicada como antídoto es:",opts:[["A","Atropina"],["B","Naloxona"],["C","N-acetilcisteina"],["D","Lidocaína"]],ans:"A",exp:"La atropina es el antídoto indicado ante intoxicación por organofosforados (síndrome colinérgico).",wrong:{B:"La naloxona es el antídoto de la intoxicación por opioides, no por organofosforados.",C:"La N-acetilcisteína es el antídoto de la intoxicación por paracetamol, no del síndrome colinérgico por organofosforados.",D:"La lidocaína no tiene indicación como antídoto en la intoxicación por organofosforados."}},
{id:"23b2-p29",area:"PED",q:"Con relación al Trastorno del espectro autista, una de las características principales es un patrón anómalo del desarrollo:",opts:[["A","Físico"],["B","Lenguaje"],["C","Motor grueso"],["D","Cognitivo"]],ans:"B",exp:"Una de las características principales del trastorno del espectro autista es un patrón anómalo del desarrollo del lenguaje.",wrong:{A:"El desarrollo físico no es la característica nuclear afectada en el trastorno del espectro autista.",C:"El desarrollo motor grueso no constituye una de las características principales que definen el trastorno del espectro autista.",D:"Aunque puede haber compromiso cognitivo asociado, no es la característica definitoria principal del trastorno del espectro autista."}},
{id:"23b2-p30",area:"PED",q:"En la valoración neurológica primaria durante un evento de emergencias la D de las siglas AVDA corresponde a",opts:[["A","El niño no responde a ningún estímulo"],["B","El niño responde solamente si lo llaman por su nombre o en voz alta"],["C","El niño responde cuando le aprietan el lecho ungueal o un dedo del pie"],["D","El niño está despierto"]],ans:"C",exp:"En la nemotecnia AVDA de valoración neurológica, la \"D\" (dolor) corresponde a que el niño responde solo ante estímulos dolorosos, como presión en el lecho ungueal.",wrong:{A:"No responder a ningún estímulo corresponde a la letra 'A' de Arreactivo en la escala AVDA, no a la 'D'.",B:"Responder solo al llamado por su nombre o en voz alta corresponde a la letra 'V' de Verbal, no a la 'D'.",D:"Estar despierto de forma espontánea corresponde a la letra 'A' de Alerta en la escala AVDA, no a la 'D'."}},
{id:"21b2-m1",area:"MI",q:"La respiración de Cheyne Stokes casi siempre se relaciona con:",opts:[["A","Insuficiencia cardiaca con fracción de eyección conservada"],["B","Insuficiencia cardiaca con gasto cardiaco bajo"],["C","Insuficiencia cardiaca relacionada con un estado de gasto alto"],["D","Presión arterial de anhídrido carbónico disminuida"],["E","Presión arterial de oxígeno aumentada"]],ans:"B",exp:"La respiración de Cheyne-Stokes casi siempre se relaciona con insuficiencia cardíaca con gasto cardíaco bajo, por el retraso en la circulación entre pulmones y centro respiratorio.",wrong:{A:"La Cheyne-Stokes se asocia clásicamente a insuficiencia cardíaca con bajo gasto, no con fracción de eyección conservada.",C:"Los estados de gasto cardíaco alto no se asocian característicamente a la respiración de Cheyne-Stokes.",D:"La hipocapnia es una consecuencia de la hiperventilación cíclica, no la condición causal con la que se relaciona el patrón.",E:"La hipoxemia, no la hiperoxemia, es la que se asocia a los ciclos de Cheyne-Stokes en la insuficiencia cardíaca."}},
{id:"21b2-m2",area:"MI",q:"La aparición de ascitis en un paciente con insuficiencia cardiaca constituye:",opts:[["A","Un signo precoz de insuficiencia cardiaca"],["B","Un signo tardío de insuficiencia cardiaca"],["C","Un signo de disminución de presión en venas hepáticas"],["D","Un signo que predice la aparición de ictericia grave"],["E","Se acompaña con frecuencia de circulación colateral"]],ans:"B",exp:"La ascitis en insuficiencia cardíaca es un signo tardío, que refleja congestión venosa sistémica avanzada.",wrong:{A:"La ascitis en insuficiencia cardíaca es un signo tardío, no precoz.",C:"La ascitis se debe a un aumento, no a una disminución, de la presión en las venas hepáticas.",D:"No existe tal asociación predictiva establecida entre la ascitis cardiogénica y la aparición de ictericia grave.",E:"La circulación colateral es típica de la hipertensión portal por cirrosis, no de la insuficiencia cardíaca."}},
{id:"21b2-m3",area:"MI",q:"Paciente de 60 años de edad, de sexo femenino, que en reposo presenta disnea de inicio brusco, con sudoración profusa, acompañado de dolor en epigastrio. Evaluada en la sala de urgencias, 3 horas después del inicio de los síntomas referidos, se le practica un electrocardiograma encontrándose supra desnivel en las derivaciones DII, DIII, AVF, el médico realiza el diagnostico de:",opts:[["A","Infarto agudo de miocardio de cara diafragmática"],["B","Infarto agudo de miocardio de cara lateral inferior"],["C","Infarto agudo de miocardio de cara lateral alta"],["D","Infarto agudo de miocardio de cara anterior"],["E","Infarto agudo de miocardio de cara posterior"]],ans:"A",exp:"Supradesnivel del ST en DII, DIII y aVF corresponde a infarto agudo de miocardio de cara diafragmática (inferior).",wrong:{B:"Cara lateral inferior no es una denominación estándar que corresponda a las derivaciones DII, DIII y aVF.",C:"La cara lateral alta corresponde a DI y aVL, no a DII, DIII y aVF.",D:"La cara anterior corresponde a las derivaciones precordiales V1-V4, no a las derivaciones inferiores.",E:"La cara posterior se diagnostica por cambios especulares en V1-V3, no por supradesnivel en DII-DIII-aVF."}},
{id:"21b2-m4",area:"MI",q:"Los ataques de cefaleas neuralgiforme unilateral de acción corta con hiperemia conjuntival y epifora es un síndrome de cefalea primaria poco común, los síntomas se pueden detener en pacientes hospitalizados con el siguiente fármaco:",opts:[["A","Lidocaína"],["B","Metoclopramida"],["C","Proclorperazina"],["D","Clorpromazina"],["E","Propafenol"]],ans:"A",exp:"La cefalea en racimos (neuralgiforme unilateral con hiperemia conjuntival y epífora) puede detenerse en pacientes hospitalizados con lidocaína intravenosa.",wrong:{B:"La metoclopramida es un antiemético, sin indicación para abortar la cefalea en racimos.",C:"La proclorperazina es un antiemético/antipsicótico, no el fármaco hospitalario de elección para este cuadro.",D:"La clorpromazina es un antipsicótico sedante, no el tratamiento específico descrito para este cuadro.",E:"El propafenol es un antiarrítmico, sin relación con el manejo de la cefalea en racimos."}},
{id:"21b2-m5",area:"MI",q:"En la enfermedad de Alzheimer, los estudios por imágenes en fase temprana pueden demostrar los siguientes datos:",opts:[["A","Infartos corticales"],["B","Hiperdensidad cortical"],["C","Normal"],["D","Atrofia occipital"]],ans:"C",exp:"En fase temprana de la enfermedad de Alzheimer, los estudios de imagen suelen ser normales, sin hallazgos estructurales evidentes todavía.",wrong:{A:"Los infartos corticales sugieren demencia vascular, no la fase temprana de la enfermedad de Alzheimer.",B:"La hiperdensidad cortical no es un hallazgo característico de la fase temprana del Alzheimer.",D:"En Alzheimer la atrofia predomina en el hipocampo y el lóbulo temporal medial, no en la región occipital."}},
{id:"21b2-m6",area:"MI",q:"Son criterios diagnósticos simplificados para la migraña: crisis repetidas de cefaleas en pacientes con exploración física normal, sin otra causa razonable de cefalea con duración de:",opts:[["A","4 a 72 hs, más dolor unilateral, agravado por los movimientos y acompañado de fotofobia"],["B","8 a 48 hs, más dolor bilateral, agravado por los movimientos acompañado de nauseas"],["C","1 a 24 hs, más dolor pulsátil, agravado por movimientos, acompañado de fonofobia"],["D","4 a 72 hs, más dolor unilateral, agravado por los movimientos sin otros síntomas"]],ans:"A",exp:"Los criterios simplificados de migraña incluyen crisis de 4 a 72 horas, dolor unilateral, agravado por el movimiento y acompañado de fotofobia (u otros síntomas asociados).",wrong:{B:"La duración de 8 a 48 horas y el dolor bilateral no coinciden con los criterios diagnósticos de migraña.",C:"La duración mínima de la migraña es de 4 horas, no 1 hora como plantea esta opción.",D:"Los criterios de migraña requieren síntomas asociados como fotofobia o náuseas, no su ausencia."}},
{id:"21b2-m7",area:"MI",q:"Es una condición de riesgo para el desarrollo de trombosis venosa profunda de extremidad superior:",opts:[["A","Cirugía ortopédica de cadera"],["B","Cirugía no ortopédica de alto riesgo"],["C","Cirugía oncológica ginecológica"],["D","Pacientes hospitalizados"],["E","Colocación de marcapasos"]],ans:"E",exp:"La colocación de marcapasos es una condición de riesgo reconocida para trombosis venosa profunda de la extremidad superior, por el catéter/electrodo intravascular.",wrong:{A:"La cirugía ortopédica de cadera es un factor de riesgo clásico para TVP de miembro inferior, no superior.",B:"La cirugía no ortopédica de alto riesgo se asocia predominantemente a TVP de miembros inferiores.",C:"La cirugía oncológica ginecológica se asocia a riesgo de TVP pélvica o de miembro inferior, no superior.",D:"La hospitalización general es un riesgo inespecífico que predomina en miembros inferiores, no superiores."}},
{id:"21b2-m8",area:"MI",q:"El antiepiléptico que no posee ninguna interacción conocida con otros fármacos es:",opts:[["A","Carbamazepina"],["B","Lamotrigina"],["C","Levetiracetam"],["D","Acido valproico"],["E","Difenilhidantoinato"]],ans:"C",exp:"El levetiracetam no posee interacciones farmacocinéticas relevantes conocidas con otros fármacos, a diferencia de los inductores/inhibidores enzimáticos clásicos.",wrong:{A:"La carbamazepina es un potente inductor enzimático con múltiples interacciones farmacocinéticas conocidas.",B:"La lamotrigina presenta interacciones relevantes, especialmente con ácido valproico y anticonceptivos orales.",D:"El ácido valproico es un inhibidor enzimático con múltiples interacciones farmacológicas conocidas.",E:"La fenitoína es un inductor enzimático potente con numerosas interacciones documentadas."}},
{id:"21b2-m9",area:"MI",q:"Para un caso leve de leptospirosis se recomienda:",opts:[["A","Doxiciclina"],["B","Vancomicina"],["C","Rifampicina"],["D","Metronidazol"],["E","Cloranfenicol"]],ans:"A",exp:"Para un caso leve de leptospirosis se recomienda tratamiento ambulatorio con doxiciclina oral.",wrong:{B:"La vancomicina carece de actividad frente a Leptospira.",C:"La rifampicina no es el tratamiento estándar recomendado para la leptospirosis.",D:"El metronidazol es activo frente a anaerobios y protozoos, no frente a Leptospira.",E:"El cloranfenicol no es el fármaco de elección actual para los casos leves de leptospirosis."}},
{id:"21b2-m10",area:"MI",q:"Un paciente con Neumonía extrahospitalaria con Índice de Gravedad de Neumonía (PSI) clase 1 presenta una tasa de mortalidad de:",opts:[["A","0,1 %"],["B","0,6 %"],["C","2,8 %"],["D","8,2 %"],["E","29,2 %"]],ans:"A",exp:"Un paciente con PSI (índice de gravedad de neumonía) clase I tiene una tasa de mortalidad muy baja, cercana al 0,1%.",wrong:{B:"El 0.6% de mortalidad corresponde a la clase II del PSI, no a la clase I.",C:"El 2.8% de mortalidad corresponde a la clase III del PSI, no a la clase I.",D:"El 8.2% de mortalidad corresponde a la clase IV del PSI, no a la clase I.",E:"El 29.2% de mortalidad corresponde a la clase V del PSI, no a la clase I."}},
{id:"21b2-m11",area:"MI",q:"La localización más frecuente de la artritis infecciosa no gonocócica es:",opts:[["A","Rodilla"],["B","Cadera"],["C","Hombro"],["D","Muñeca"],["E","Codo"]],ans:"A",exp:"La rodilla es la localización más frecuente de la artritis infecciosa no gonocócica.",wrong:{B:"La cadera es más frecuente en artritis séptica pediátrica, no la localización más común en general.",C:"El hombro es una localización menos frecuente de artritis infecciosa no gonocócica.",D:"La muñeca es una localización menos frecuente de artritis infecciosa no gonocócica.",E:"El codo es una localización menos frecuente de artritis infecciosa no gonocócica."}},
{id:"21b2-m12",area:"MI",q:"En el tratamiento de la osteoporosis se ha demostrado que el alendronato disminuye el recambio óseo e incrementa la masa ósea de la columna vertebral en 8% en comparación con lo observado con placebo y el riesgo de fractura de cadera en 6% en comparación con placebo. El mecanismo de acción de la droga es:",opts:[["A","Aumenta la absorción intestinal de calcio"],["B","Aumenta la reabsorción renal de calcio"],["C","Alteran de manera específica la función de los osteoclastos y reducen su número"],["D","Alteran de manera específica la función de los osteoblastos y aumentan su número"],["E","Bloquean el efecto de estrógenos y progesterona"]],ans:"C",exp:"Los bisfosfonatos como el alendronato actúan alterando específicamente la función de los osteoclastos y reduciendo su número, disminuyendo así la resorción ósea.",wrong:{A:"El aumento de la absorción intestinal de calcio es el mecanismo de la vitamina D, no de los bisfosfonatos.",B:"El aumento de la reabsorción renal de calcio no es el mecanismo de acción del alendronato.",D:"Los bisfosfonatos actúan sobre los osteoclastos, no aumentan el número ni la función de los osteoblastos.",E:"Bloquear estrógenos y progesterona describe fármacos antiestrógenos, no el mecanismo de los bisfosfonatos."}},
{id:"21b2-m13",area:"MI",q:"En un paciente con clínica y laboratorio de hipertiroidismo. Con sospecha por examen físico y ecografía de tiroides de un nódulo solitario de tiroides, como prueba diagnóstica definitiva de nódulo hiperfuncionante usted solicitará:",opts:[["A","Resonancia magnética nuclear de cuello y tiroides"],["B","Punción biopsia del nódulo tiroideo"],["C","Gamagrafía tiroidea"],["D","Tomografía computarizada de cuello"],["E","Biopsia quirúrgica del nódulo"]],ans:"C",exp:"Ante sospecha de nódulo tiroideo hiperfuncionante, la gammagrafía tiroidea es la prueba diagnóstica definitiva para confirmarlo.",wrong:{A:"La RMN de cuello no diferencia la funcionalidad ni la autonomía hormonal del nódulo tiroideo.",B:"La punción biopsia evalúa citología, no función, y no está indicada como confirmación de nódulo hiperfuncionante.",D:"La tomografía de cuello no evalúa la captación ni la función del nódulo tiroideo.",E:"La biopsia quirúrgica es invasiva e innecesaria para confirmar la autonomía funcional del nódulo."}},
{id:"21b2-m14",area:"MI",q:"En relación a los datos hallados a través de los métodos auxiliares de diagnósticos en el síndrome de Guillain Barre, señale la opción correcta:",opts:[["A","La cifra de proteínas en el líquido cefalorraquídeo se encuentra entre 8 y 15 g/L"],["B","No se observa pleocitosis en el líquido cefalorraquídeo"],["C","Se observa un aumento sostenido de los glóbulos blancos en el líquido cefalorraquídeo"],["D","Los datos de los estudios de electrodiagnóstico acompañan a la evolución clínica"]],ans:"B",exp:"En el síndrome de Guillain-Barré es característico no observar pleocitosis en el LCR, a pesar de la elevación de proteínas (disociación albúmino-citológica).",wrong:{A:"El valor de proteínas de 8 a 15 g/L es exageradamente alto respecto a la elevación real observada en el Guillain-Barré.",C:"El aumento sostenido de leucocitos en LCR contradice la disociación albúmino-citológica característica del síndrome.",D:"Los hallazgos electrofisiológicos suelen ir por detrás o no correlacionar directamente con la evolución clínica."}},
{id:"21b2-m15",area:"MI",q:"Paciente con nódulo tiroideo sólido, duro, con niveles elevados de calcitonina en sangre. Antecedentes familiares de cáncer de tiroides. Su sospecha diagnóstica sería de:",opts:[["A","Cáncer medular de tiroides"],["B","Cáncer folicular de tiroides"],["C","Cáncer papilar de tiroides"],["D","Cáncer de paratiroides"],["E","Linfoma tiroideo"]],ans:"A",exp:"Un nódulo tiroideo sólido y duro con calcitonina elevada y antecedentes familiares sugiere fuertemente cáncer medular de tiroides.",wrong:{B:"El cáncer folicular de tiroides no eleva la calcitonina, tiene un perfil de diseminación hematógena distinto.",C:"El cáncer papilar, aunque el más frecuente, no se asocia a elevación de la calcitonina.",D:"El cáncer de paratiroides se relaciona con PTH y calcio, no con la calcitonina.",E:"El linfoma tiroideo no se asocia a hipercalcitoninemia."}},
{id:"21b2-m16",area:"MI",q:"Existen tres datos antropométricos fundamentales que son importantes para valorar el grado de obesidad: peso, talla y perímetro abdominal. Con el índice de masa corporal (BMI, body mass index), que se calcula a partir del peso (kg)/talla (m)2 se clasifica a la obesidad en estadíos. Hablamos de estadío I de obesidad con índice de masa corporal de:",opts:[["A","35 a 39,9 Kg/m2"],["B","25 a 29,9 Kg/m2"],["C","Más de 40 Kg/m2"],["D","30 a 34,9 Kg/m2"],["E","18,5 a 24,9 Kg/m2"]],ans:"D",exp:"Un índice de masa corporal entre 30 y 34,9 kg/m² corresponde a obesidad estadío I.",wrong:{A:"El rango de 35 a 39.9 kg/m2 corresponde a la obesidad estadío II, no al estadío I.",B:"El rango de 25 a 29.9 kg/m2 corresponde a sobrepeso, no a obesidad.",C:"Más de 40 kg/m2 corresponde a la obesidad estadío III o mórbida, no al estadío I.",E:"El rango de 18.5 a 24.9 kg/m2 corresponde a peso normal, no a obesidad."}},
{id:"21b2-m17",area:"MI",q:"Paciente diabético de 48 años de edad, cumple estrictamente el tratamiento indicado con dieta, actividad física regular y triple terapia anti diabética oral con metformina, glimepirida y sitagliptina. Tiene buen control metabólico con cifras de glicemia en ayunas de 98 mg/100 ml y HbA1c de 6,3%. Presenta episodios de hipoglicemia antes del almuerzo. Como primera causa usted atribuiría estos episodios de hipoglicemia a:",opts:[["A","La actividad física"],["B","A la dieta para diabéticos"],["C","A la metformina"],["D","A la glimepirida"],["E","A la sitagliptina"]],ans:"D",exp:"En un paciente diabético con buen control global, la hipoglicemia antes del almuerzo se atribuye con mayor frecuencia a la glimepirida (sulfonilurea), por su riesgo intrínseco de hipoglicemia.",wrong:{A:"La actividad física no justifica un patrón horario específico de hipoglucemia previo al almuerzo con buen control global.",B:"La dieta para diabéticos no es una causa típica de hipoglucemia en un paciente con buen control metabólico.",C:"La metformina no produce hipoglucemia como monoterapia, actúa por sensibilización sin estimular la secreción de insulina.",E:"La sitagliptina, inhibidor de DPP-4, tiene bajo riesgo intrínseco de producir hipoglucemia."}},
{id:"21b2-m18",area:"MI",q:"Paciente de sexo femenino de 16 años de edad, ingresa al servicio de urgencias por cuadro confusional, aliento a manzanas con respiración de Kussmaul, glicemia de 650 mg/100 ml, Ph arterial de 7,10. Como primera medida terapéutica usted realizará:",opts:[["A","Corrección del Ph arterial con infusión endovenosa de bicarbonato de sodio"],["B","Antes que nada administrar dosis subcutánea de insulina basal"],["C","Corrección de nivel de glicemia con insulina cristalina subcutánea"],["D","Hidratación con suero fisiológico 2 a 3 litros en la primera hora"],["E","Intubación orotraqueal y asistencia respiratoria mecánica"]],ans:"D",exp:"En cetoacidosis diabética grave, la primera medida terapéutica es la hidratación enérgica con suero fisiológico (2-3 litros en la primera hora) antes de iniciar insulina.",wrong:{A:"El bicarbonato IV no está indicado de rutina salvo acidosis extrema y no es la primera medida en la CAD.",B:"La insulina no debe administrarse antes que la hidratación inicial en la cetoacidosis diabética grave.",C:"La vía de elección para la insulina en CAD es intravenosa, no subcutánea, y tampoco es la primera medida.",E:"La intubación no está indicada de entrada sin compromiso respiratorio franco establecido."}},
{id:"21b2-m19",area:"MI",q:"Paciente masculino de 70 años de edad, antecedente de hipertensión arterial mal controlada, con insuficiencia renal crónica hipertensiva con cifras de clearence de creatinina de 27 ml/minuto. Actualmente se encuentra con cifras de glicemia 190 mg/100 ml y Hb A1c de 8,4%. Usted iniciará tratamiento farmacológico antidiabético con",opts:[["A","Metformina"],["B","Insulina basal"],["C","Sulfonilurea"],["D","Empaglifozina"],["E","Acarbosa"]],ans:"B",exp:"En un paciente diabético con insuficiencia renal crónica avanzada (clearance de 27 mL/min), la insulina basal es la opción más segura frente a fármacos orales contraindicados en ese contexto.",wrong:{A:"La metformina está contraindicada con un clearance tan reducido por el riesgo de acidosis láctica.",C:"Las sulfonilureas tienen riesgo aumentado de hipoglucemia prolongada en la insuficiencia renal avanzada.",D:"La eficacia y seguridad de la empagliflozina se reducen significativamente con un filtrado glomerular tan bajo.",E:"La acarbosa tiene eficacia limitada y no es de elección en el contexto de nefropatía avanzada."}},
{id:"21b2-m20",area:"MI",q:"Mujer de 38 años de edad, antecedente de dolores poliarticulares, decaimiento del estado general, fatiga, eritema malar, edema de miembros inferiores hasta raíz de muslo, en laboratorio hemoglobina 8 g/dl, leucopenia y linfopenia, cifras de urea y creatinina en ascenso progresivo, en biopsia renal se detecta nefritis lúpica. Como terapia farmacológica inicial usted optaría por:",opts:[["A","Dosis altas de Hidroxicloroquina más Antiinflamatorios por 15 días"],["B","Pulsos endovenosos de Metilprednisolona 1 gramo por día por 3 días"],["C","Metotrexate 15 mg 1 vez por semana por 2 a 3 meses"],["D","Rituximab 375 mg por metro cuadrado semanal por 4 semanas"],["E","Observar evolución espontánea por un mes"]],ans:"B",exp:"Ante nefritis lúpica activa y grave, se indican pulsos endovenosos de metilprednisolona a altas dosis como terapia de inducción inicial.",wrong:{A:"Hidroxicloroquina más antiinflamatorios por 15 días es insuficiente para una nefritis lúpica activa con deterioro renal.",C:"El metotrexato semanal no constituye la terapia de inducción indicada en la nefritis lúpica grave.",D:"El rituximab se reserva para casos refractarios, no como primera línea de inducción inicial.",E:"Observar la evolución espontánea está contraindicado ante nefritis activa con deterioro renal progresivo."}},
{id:"21b2-m21",area:"MI",q:"Paciente de 65 años de edad, diabético e hipertenso, presentó un cuadro de neumonía grave Covid 19 por SARS CoV -2. Estuvo en asistencia respiratoria mecánica durante 15 días y fue tratado con dexametasona por 10 días y luego con metilprednisolona durante 7 días más. Fue de alta sin medicación y en buenas condiciones. A la semana del alta reingresa con historia de astenia marcada, somnolencia, PA: 70/40 mmHg, glicemia: 55 mg/dl, Na: 122 mEq/L. El diagnóstico a considerar es:",opts:[["A","Neumonía bacteriana sobre agregada"],["B","Probable complicación hemorrágica intracerebral"],["C","Probable tromboembolia pulmonar"],["D","Probable síndrome de supresión suprarrenal"],["E","Hipotiroidismo severo pos COVID"]],ans:"D",exp:"El cuadro de hipotensión, hipoglicemia e hiponatremia tras suspender corticoides usados por tiempo prolongado sugiere un síndrome de supresión (insuficiencia) suprarrenal secundaria.",wrong:{A:"Una neumonía bacteriana sobreagregada no explica la hipoglucemia ni la hiponatremia del cuadro descrito.",B:"Una hemorragia intracerebral no justifica el patrón hormonal de hipotensión, hipoglucemia e hiponatremia.",C:"El tromboembolismo pulmonar no explica la combinación de hipotensión, hipoglucemia e hiponatremia presentada.",E:"El hipotiroidismo severo post-COVID no produce típicamente hipoglucemia ni el cuadro agudo descrito."}},
{id:"21b2-m22",area:"MI",q:"El estudio de imagen más útil en la valoración inicial de los pacientes con nefropatía crónica (CKD) es:",opts:[["A","Radiografía"],["B","Ecografía"],["C","Tomografía del Sistema Urinario"],["D","Resonancia Magnética Nuclear"],["E","Cistograma miccional"]],ans:"B",exp:"La ecografía renal es el estudio de imagen más útil en la valoración inicial de la enfermedad renal crónica, por su seguridad y accesibilidad.",wrong:{A:"La radiografía simple no aporta información funcional ni estructural renal adecuada para la valoración inicial.",C:"La tomografía del sistema urinario implica mayor costo y radiación, no es de primera línea inicial.",D:"La RMN se reserva para casos específicos, no es el estudio inicial de elección en la ERC.",E:"El cistograma miccional evalúa reflujo vesicoureteral, no es el estudio inicial general de la ERC."}},
{id:"21b2-m23",area:"MI",q:"La manifestación clínica más constante del síndrome de colon irritable es:",opts:[["A","Alteración de los hábitos intestinales"],["B","Flatulencia"],["C","Dolor abdominal"],["D","Diarrea"],["E","Esfuerzo durante la defecación"]],ans:"A",exp:"La alteración de los hábitos intestinales es la manifestación clínica más constante del síndrome de colon irritable.",wrong:{B:"La flatulencia es un síntoma acompañante, no la manifestación más constante del síndrome de colon irritable.",C:"El dolor abdominal es un criterio definitorio frecuente, pero no el hallazgo más constante de forma aislada.",D:"La diarrea solo está presente en el subtipo con predominio diarreico, no en todos los pacientes.",E:"El esfuerzo defecatorio es un síntoma variable, no el más constante del síndrome."}},
{id:"21b2-m24",area:"MI",q:"El método diagnóstico con la mayor sensibilidad y especificidad para el diagnóstico de la pancreatitis crónica es:",opts:[["A","Ecografía endoscópica"],["B","Arteriografía selectiva del tronco celíaco"],["C","Prueba endoscópica de la función del páncreas"],["D","Colangiopancreatografía retrógrada endoscópica"],["E","Estimulación hormonal con secretina"]],ans:"E",exp:"La estimulación hormonal con secretina es el método con mayor sensibilidad y especificidad para el diagnóstico funcional de pancreatitis crónica temprana.",wrong:{A:"La ecografía endoscópica es sensible, pero no supera a la prueba de secretina en la detección funcional temprana.",B:"La arteriografía selectiva del tronco celíaco no es un método diagnóstico estándar para pancreatitis crónica.",C:"La prueba endoscópica de función pancreática tiene menor rendimiento que la estimulación clásica con secretina.",D:"La CPRE es un método invasivo con riesgo de pancreatitis, superado por otras técnicas en primera línea."}},
{id:"21b2-m25",area:"MI",q:"En un paciente afectado por síndrome de Goodpasture ¿qué se identifica en la biopsia renal en forma típica?",opts:[["A","Proliferación mesangial"],["B","Nefritis membranosa"],["C","Necrosis focal o segmentaria"],["D","Nefritis mesangial mínima"],["E","Nefritis proliferativa difusa"]],ans:"C",exp:"En el síndrome de Goodpasture, la biopsia renal muestra típicamente necrosis focal o segmentaria con depósitos lineales de anticuerpos antimembrana basal.",wrong:{A:"La proliferación mesangial es típica de otras glomerulopatías, como la nefropatía por IgA, no del Goodpasture.",B:"La nefritis membranosa presenta depósitos subepiteliales, no los depósitos lineales anti-membrana basal del Goodpasture.",D:"La nefritis mesangial mínima es hallazgo de la enfermedad de cambios mínimos, no del síndrome de Goodpasture.",E:"La nefritis proliferativa difusa es típica de la nefritis lúpica clase IV, no del síndrome de Goodpasture."}},
{id:"21b2-m26",area:"MI",q:"En la hepatitis inducida por tóxicos y fármacos, un indicador de hepatotoxicidad grave es:",opts:[["A","Ictericia"],["B","Hipoalbuminemia"],["C","Colestasis"],["D","Aumento del tiempo de protrombina"],["E","Hematomas espontáneos"]],ans:"A",exp:"La ictericia marcada es un indicador clínico de hepatotoxicidad grave en la hepatitis inducida por tóxicos o fármacos.",wrong:{B:"La hipoalbuminemia es marcador de síntesis hepática crónica, menos específico de gravedad aguda que la ictericia.",C:"La colestasis es un patrón bioquímico, no un indicador aislado de gravedad en la hepatotoxicidad.",D:"El aumento del tiempo de protrombina es relevante, pero la ictericia asociada a lesión hepatocelular es el indicador clásico de gravedad (ley de Hy).",E:"Los hematomas espontáneos son una manifestación tardía de coagulopatía, menos utilizada como indicador temprano."}},
{id:"21b2-m27",area:"MI",q:"¿Cuál de los siguientes es el inhibidor del ácido clorhídrico más potente para el tratamiento de la enfermedad por úlcera péptica?",opts:[["A","Omeprazol"],["B","Lansoprazol"],["C","Esomeprazol"],["D","Dexlansoprazol"],["E","Rabeprazol"]],ans:"D",exp:"El dexlansoprazol es, entre los inhibidores de bomba de protones listados, el que ofrece mayor potencia de inhibición ácida sostenida.",wrong:{A:"El omeprazol es un IBP estándar, pero de potencia sostenida comparativamente menor.",B:"El lansoprazol tiene una potencia similar al omeprazol, menor que la formulación de liberación dual descrita.",C:"El esomeprazol es un isómero potente, pero no supera a la formulación de liberación dual en potencia sostenida.",E:"El rabeprazol tiene un inicio de acción rápido, pero no la mayor potencia de inhibición ácida descrita."}},
{id:"21b2-m28",area:"MI",q:"Marque la característica que no corresponde al derrame de la tuberculosis pleural:",opts:[["A","Es de color rojizo, y en ocasiones hemorrágico"],["B","Es de tipo exudado, con proteínas alrededor de 4 a 6 g/100mL"],["C","Glucosa normal o baja"],["D","pH de casi 7.3 (en ocasiones <7.2)"],["E","Leucocitos con predominio de polimorfonucleares en etapas tardías"]],ans:"E",exp:"En el derrame de la tuberculosis pleural, el predominio celular es linfocitario incluso en etapas tardías, por lo que el predominio de polimorfonucleares NO corresponde a este cuadro.",wrong:{A:"El aspecto rojizo o hemorrágico sí es un hallazgo característico del derrame pleural tuberculoso, por lo que no es la excepción.",B:"Las proteínas en rango de exudado (4 a 6 g/dL) sí son típicas del derrame tuberculoso, no corresponde a la excepción.",C:"La glucosa normal o baja sí es un hallazgo descrito en el derrame tuberculoso, no es la excepción buscada.",D:"Un pH cercano a 7.3, a veces menor, sí es característico del derrame tuberculoso, no corresponde a la excepción."}},
{id:"21b2-m29",area:"MI",q:"En un paciente con Enfermedad de Von Willebrand tipo 1 que va a ser sometido a una extracción dental, usted recomendaría previo al procedimiento:",opts:[["A","Transfusión de plaquetas"],["B","Desmopresina intravenosa o en aerosol"],["C","Plasmaféresis"],["D","Inmunoglobulinas"],["E","Transfusión de factor VIII"]],ans:"B",exp:"En la enfermedad de Von Willebrand tipo 1, la desmopresina (intravenosa o en aerosol nasal) es la profilaxis de elección previa a procedimientos como una extracción dental.",wrong:{A:"La transfusión de plaquetas no está indicada en la enfermedad de Von Willebrand tipo 1, que no es una trombocitopenia.",C:"La plasmaféresis no tiene rol en el manejo profiláctico de la enfermedad de Von Willebrand.",D:"Las inmunoglobulinas se usan en trombocitopenia inmune, no están indicadas en la enfermedad de Von Willebrand.",E:"La transfusión de factor VIII se reserva para casos más graves o tipo 3, no como primera línea en el tipo 1 leve."}},
{id:"21b2-m30",area:"MI",q:"Paciente de 60 años de edad portador de diabetes mellitus en tratamiento con antidiabéticos orales, presenta albuminuria en aumento progresivo y cifras de presión arterial elevadas. En el consultorio se constata presión arterial de 160/95 mmHg. Usted iniciaría tratamiento farmacológico con:",opts:[["A","Enalapril"],["B","Amlodipina"],["C","Bisoprolol"],["D","Hidroclorotiazida"],["E","Alfa metildopa"]],ans:"A",exp:"En diabéticos con albuminuria progresiva e hipertensión, los IECA (como enalapril) son de primera elección por su efecto nefroprotector.",wrong:{B:"La amlodipina no ofrece el efecto nefroprotector antiproteinúrico específico que sí tienen los IECA.",C:"El bisoprolol no es de primera elección para la nefroprotección en el contexto de albuminuria diabética progresiva.",D:"La hidroclorotiazida es un diurético sin el efecto antiproteinúrico específico de los IECA.",E:"La alfa metildopa se emplea principalmente en el embarazo, sin el efecto nefroprotector demostrado de los IECA."}},
{id:"21b2-p1",area:"PED",q:"Athea de 2 años tiene rabietas que duran más de 15 minutos o se repiten con regularidad más de tres veces al día, motivo por el cual la madre la lleva a la consulta y el pediatra le explica lo siguiente:",opts:[["A","No es para preocuparse es un comportamiento normal a esa edad"],["B","Generalmente disminuyen o desaparecen entre los 2 y 3 años"],["C","Pueden reflejar problemas médicos, emocionales o sociales subyacentes"],["D","Inmediatamente debe iniciar tratamiento con risperidona"]],ans:"C",exp:"Rabietas prolongadas y muy frecuentes en un niño de 2 años pueden reflejar problemas médicos, emocionales o sociales subyacentes, y no deben minimizarse sistemáticamente.",wrong:{A:"Minimizar rabietas de esta intensidad y frecuencia como normales ignora que pueden reflejar problemas subyacentes que requieren evaluación.",B:"Afirmar que disminuyen espontáneamente entre los 2 y 3 años no aplica cuando las rabietas son intensas y muy frecuentes, como en este caso.",D:"Iniciar risperidona de forma inmediata es una conducta desproporcionada; primero deben evaluarse causas médicas, emocionales o sociales subyacentes."}},
{id:"21b2-p2",area:"PED",q:"¿Cuál de los siguientes componentes del aspecto del Triángulo de evaluación pediátrica no corresponde?",opts:[["A","Tono"],["B","Llanto/lenguaje"],["C","Reactividad"],["D","Palidez"]],ans:"D",exp:"La palidez no forma parte de los componentes clásicos del Triángulo de Evaluación Pediátrica (apariencia/tono, trabajo respiratorio, circulación cutánea).",wrong:{A:"El tono sí forma parte del componente de apariencia del Triángulo de Evaluación Pediátrica.",B:"El llanto/lenguaje sí integra el componente de apariencia dentro del Triángulo de Evaluación Pediátrica.",C:"La reactividad sí es uno de los elementos evaluados dentro del componente de apariencia del TEP."}},
{id:"21b2-p3",area:"PED",q:"En niños mayores de 2 años el indicador de desnutrición aguda teniendo en cuenta la gráfica de crecimiento es:",opts:[["A","El peso del niño por debajo del 5° percentil"],["B","El peso para la talla inferior al 5° percentil"],["C","El peso para la talla inferior al 10° percentil"],["D","El peso del niño por debajo del 10° percentil"]],ans:"B",exp:"En niños mayores de 2 años, el peso para la talla inferior al 5º percentil es el indicador de desnutrición aguda según las curvas de crecimiento.",wrong:{A:"El peso aislado por debajo del percentil 5, sin relacionarlo con la talla, no es el indicador específico de desnutrición aguda.",C:"El punto de corte estandarizado para desnutrición aguda es el percentil 5, no el percentil 10.",D:"El peso aislado por debajo del percentil 10 no constituye el indicador validado de desnutrición aguda en esta edad."}},
{id:"21b2-p4",area:"PED",q:"Con respecto al desarrollo lingüístico a los 2 años, es correcto:",opts:[["A","El lenguaje receptivo precede al expresivo"],["B","El lenguaje expresivo precede al receptivo"],["C","Exhiben una jerga monosilábica e inentendible"],["D","La mayor parte de la comunicación es verbal"]],ans:"A",exp:"El lenguaje receptivo (comprensión) siempre precede al lenguaje expresivo (producción) en el desarrollo normal.",wrong:{B:"Es el lenguaje receptivo el que precede al expresivo en el desarrollo normal del lenguaje, no al revés.",C:"A los 2 años el niño ya combina palabras de forma comprensible, superando la etapa de jerga inentendible.",D:"A los 2 años la comunicación aún depende considerablemente de gestos y señalización, no predominantemente verbal."}},
{id:"21b2-p5",area:"PED",q:"En el caso de la leche artificial de soja para lactantes, es necesario el suplemento del siguiente aminoácido limitante:",opts:[["A","Alanina"],["B","Tirosina"],["C","Metionina"],["D","Cisteina"]],ans:"C",exp:"En las fórmulas de soja para lactantes es necesario suplementar metionina, el aminoácido limitante de la proteína de soja.",wrong:{A:"La alanina no es un aminoácido limitante de la proteína de soja que requiera suplementación en fórmulas infantiles.",B:"La tirosina no es el aminoácido limitante característico de las fórmulas de soja para lactantes.",D:"La cisteína no constituye el aminoácido deficitario que deba suplementarse en las fórmulas de soja infantiles."}},
{id:"21b2-p6",area:"PED",q:"Son característica de la infancia media, excepto",opts:[["A","Crecimiento medio durante el período es de 5kg /año"],["B","La ganancia de altura durante el período es de 6cm/año"],["C","Los tejidos linfoides se hipertrofian dando amígdalas y adenoides grandes"],["D","Adquisición de la lectoescritura y matemáticas básicas"]],ans:"A",exp:"Un crecimiento medio de 5 kg/año es excesivo para la infancia media, que se caracteriza por un crecimiento más lento y estable (esta es la afirmación que NO corresponde).",wrong:{B:"Una ganancia de 6 cm/año en altura sí es característica válida del crecimiento durante la infancia media.",C:"La hipertrofia de tejidos linfoides con amígdalas y adenoides grandes sí es un rasgo característico de esta etapa.",D:"La adquisición de lectoescritura y matemáticas básicas sí corresponde a un logro esperado durante la infancia media."}},
{id:"21b2-p7",area:"PED",q:"Anualmente a nivel mundial casi un millón de niños y adolescentes fallecen por:",opts:[["A","Cáncer"],["B","Lesiones y violencia"],["C","Neumonías"],["D","Cardiopatías"]],ans:"B",exp:"Lesiones y violencia son la principal causa de muerte en niños y adolescentes a nivel mundial, con casi un millón de fallecimientos anuales.",wrong:{A:"El cáncer, aunque relevante, no representa la principal causa de mortalidad global en niños y adolescentes.",C:"Las neumonías afectan principalmente a la primera infancia, pero no son la causa líder de muerte en niños y adolescentes en conjunto.",D:"Las cardiopatías no constituyen la principal causa de mortalidad a nivel mundial en esta franja etaria."}},
{id:"21b2-p8",area:"PED",q:"Los adyuvantes se utilizan en algunas vacunas para aumentar la respuesta inmune. Actualmente, los únicos adyuvantes autorizados por la FDA para formar parte de las vacunas son:",opts:[["A","Sales de aluminio y arseniato"],["B","Timerosal y etil mercurio"],["C","Gelatina, y 2-fenoxietanol"],["D","Neomicina y embrión de pollo"]],ans:"A",exp:"Las sales de aluminio (y compuestos relacionados) son los únicos adyuvantes autorizados por la FDA para su uso en vacunas.",wrong:{B:"El timerosal es un conservante, no un adyuvante inmunológico autorizado por la FDA.",C:"La gelatina y el 2-fenoxietanol son estabilizantes o conservantes de las vacunas, no adyuvantes inmunológicos.",D:"La neomicina y el embrión de pollo son componentes residuales del proceso de producción, no adyuvantes autorizados."}},
{id:"21b2-p9",area:"PED",q:"Acude a la consulta un niño de 4 años que tuvo una convulsión febril hace una semana, trae el electroencefalograma (EEG) que le realizaron ayer, en el cual se observa un enlentecimiento inespecífico. La madre preocupada por este hallazgo en el estudio le pregunta qué conductas se debe seguir.",opts:[["A","Quedar internado e iniciar inmediatamente tratamiento"],["B","Repetir en dos semanas el EEG y consultar nuevamente para evaluar el tratamiento"],["C","Solicitar otros estudios como resonancia magnética y evaluar el tratamiento según el resultado"],["D","Solicitar una Tomografía Axial Computarizada (TAC) de cráneo urgente e iniciar tratamiento"]],ans:"B",exp:"Ante un EEG con enlentecimiento inespecífico tras una convulsión febril simple, la conducta recomendada es repetirlo en dos semanas y reevaluar clínicamente antes de decidir tratamiento.",wrong:{A:"Internar e iniciar tratamiento inmediato es desproporcionado ante un enlentecimiento inespecífico tras una convulsión febril simple.",C:"Solicitar una resonancia magnética no está indicada de rutina ante un EEG con hallazgo inespecífico tras convulsión febril simple.",D:"Una tomografía urgente y el inicio de tratamiento no están justificados por un hallazgo inespecífico y transitorio en el EEG."}},
{id:"21b2-p10",area:"PED",q:"En la malabsorción de carbohidratos, la forma de identificar el azúcar sospechoso es solicitando:",opts:[["A","Sustancias reductoras en heces por clinitest"],["B","Frotis de sangre periférica"],["C","Test de hidrógeno exhalado"],["D","Dosaje de nitrógeno en el aliento"]],ans:"C",exp:"El test de hidrógeno exhalado permite identificar el azúcar específico responsable de la malabsorción de carbohidratos.",wrong:{A:"Las sustancias reductoras en heces detectan malabsorción de carbohidratos en general, pero no identifican el azúcar específico sospechoso.",B:"El frotis de sangre periférica no aporta información sobre la malabsorción de carbohidratos ni identifica el azúcar involucrado.",D:"El dosaje de nitrógeno en el aliento no es el estudio utilizado para identificar el azúcar malabsorbido."}},
{id:"21b2-p11",area:"PED",q:"La respuesta al tratamiento con corticoides en un Síndrome Nefrótico a cambios mínimos se define como remisión de la clínica y mejoría de la función renal en:",opts:[["A","2 semanas"],["B","4 semanas"],["C","8 semanas"],["D","12 semanas"]],ans:"B",exp:"La respuesta al tratamiento corticoide en el síndrome nefrótico a cambios mínimos se define como remisión clínica y mejoría de la función renal dentro de las 4 semanas.",wrong:{A:"Dos semanas es un plazo insuficiente para establecer la remisión completa con corticoides en el síndrome nefrótico a cambios mínimos.",C:"Ocho semanas excede el plazo estándar definido para considerar la respuesta al tratamiento corticoide inicial.",D:"Doce semanas es un plazo mucho mayor al establecido habitualmente para definir la respuesta terapéutica inicial."}},
{id:"21b2-p12",area:"PED",q:"La ictericia con aumento sérico de la bilirrubina directa durante las primeras 24 horas de vida justifica una evaluación diagnóstica y puede considerarse una manifestación de:",opts:[["A","Hemólisis"],["B","Ictericia fisiológica"],["C","Ictericia por lactancia"],["D","Atresia biliar"]],ans:"D",exp:"El aumento de bilirrubina directa en las primeras 24 horas de vida es anormal y sugiere atresia biliar, requiriendo evaluación diagnóstica urgente.",wrong:{A:"La hemólisis eleva característicamente la bilirrubina indirecta, no la directa, que es la descrita en este caso.",B:"La ictericia fisiológica se debe a elevación de bilirrubina indirecta y no aparece habitualmente en las primeras 24 horas.",C:"La ictericia por lactancia se relaciona con bilirrubina indirecta y aparece más tardíamente, no en las primeras 24 horas."}},
{id:"21b2-p13",area:"PED",q:"Sofía de 12 meses estuvo en contacto con un paciente con hepatitis A en la guardería. Consulta con su pediatra quien le indica el siguiente esquema de profilaxis post exposición:",opts:[["A","De preferencia debe recibir la inmunización"],["B","Solo puede administrarse inmunoglobulina"],["C","De preferencia debe recibir la inmunoglobulina"],["D","Recibe tanto la inmunización como la inmunoglobulina"]],ans:"C",exp:"Tras exposición a hepatitis A, se prefiere administrar inmunoglobulina como profilaxis post-exposición, especialmente en menores de 12 meses.",wrong:{A:"En menores de 12 meses se prefiere la inmunoglobulina sobre la vacuna, ya que la respuesta inmune a la vacunación puede ser subóptima.",B:"No es que 'solo pueda' administrarse inmunoglobulina de forma exclusiva; existe preferencia por ella, pero no es la única opción posible en otros grupos etarios.",D:"No se indica la combinación rutinaria de vacuna e inmunoglobulina como esquema estándar de profilaxis post-exposición."}},
{id:"21b2-p14",area:"PED",q:"Indique cuál de las siguientes entidades es un factor predisponente de Leucemia Infantil:",opts:[["A","Enteropatía autoinmune"],["B","Neumonía recurrente"],["C","Síndrome de Down"],["D","Síndrome de Pierre Robin"]],ans:"C",exp:"El síndrome de Down es un factor predisponente reconocido para el desarrollo de leucemia infantil.",wrong:{A:"La enteropatía autoinmune no es un factor de riesgo reconocido para el desarrollo de leucemia infantil.",B:"La neumonía recurrente no constituye un factor predisponente establecido para la leucemia infantil.",D:"El síndrome de Pierre Robin no se asocia como factor de riesgo reconocido de leucemia infantil."}},
{id:"21b2-p15",area:"PED",q:"En relación a las sibilancias frecuentes o persistentes en niños podemos afirmar que:",opts:[["A","Si inician en el momento del nacimiento o poco después y son benignas"],["B","Las sibilancias asociadas a la fibrosis quística son más frecuentes durante el primer año de vida"],["C","La aparición de sibilancias intensas en un niño previamente sano debe sugerir traqueobroncomalacia"],["D","Se deben a una enfermedad obstructiva de la vía respiratoria superior en niños"]],ans:"B",exp:"Las sibilancias asociadas a fibrosis quística son más frecuentes durante el primer año de vida, por la afectación temprana de la vía aérea.",wrong:{A:"Las sibilancias que inician al nacer o poco después no son necesariamente benignas y requieren evaluación por causas estructurales.",C:"Sibilancias intensas de aparición súbita en un niño previamente sano sugieren más un cuerpo extraño que traqueobroncomalacia.",D:"Las sibilancias se originan por obstrucción de la vía aérea inferior, no de la vía respiratoria superior."}},
