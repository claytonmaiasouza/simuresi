<title>Simulación de Exámen de Residencia — Bloque I</title>
<style>
  :root{
    --paper:#EEF0EA; --paper-raised:#F8F9F4; --paper-deep:#E3E6DD;
    --ink:#1B2621; --ink-soft:#4B5750; --accent:#0E6E56; --accent-soft:#DCEAE4;
    --accent-ink:#0A4B3C; --critical:#A8362B; --critical-soft:#F3DEDA; --warn:#96631A; --warn-soft:#F1E6D2;
    --line:#C9CFC3; --shadow: 0 1px 0 rgba(27,38,33,.06), 0 8px 20px -12px rgba(27,38,33,.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0F1613; --paper-raised:#172420; --paper-deep:#0B100D;
      --ink:#E7EDE7; --ink-soft:#A9B6AE; --accent:#59D9B3; --accent-soft:#16352C;
      --accent-ink:#8FE9CD; --critical:#E2695C; --critical-soft:#3A211D; --warn:#D9A94E; --warn-soft:#3A2E14;
      --line:#2B3A34; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1613; --paper-raised:#172420; --paper-deep:#0B100D;
    --ink:#E7EDE7; --ink-soft:#A9B6AE; --accent:#59D9B3; --accent-soft:#16352C;
    --accent-ink:#8FE9CD; --critical:#E2695C; --critical-soft:#3A211D; --warn:#D9A94E; --warn-soft:#3A2E14;
    --line:#2B3A34; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --paper:#EEF0EA; --paper-raised:#F8F9F4; --paper-deep:#E3E6DD;
    --ink:#1B2621; --ink-soft:#4B5750; --accent:#0E6E56; --accent-soft:#DCEAE4;
    --accent-ink:#0A4B3C; --critical:#A8362B; --critical-soft:#F3DEDA; --warn:#96631A; --warn-soft:#F1E6D2;
    --line:#C9CFC3; --shadow: 0 1px 0 rgba(27,38,33,.06), 0 8px 20px -12px rgba(27,38,33,.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; line-height:1.5;
  }
  .display{ font-family:Rockwell,"Roboto Slab",Georgia,serif; font-weight:700; text-wrap:balance; }
  .mono{ font-family:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace; font-variant-numeric:tabular-nums; }
  .label{ font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  button{font-family:inherit;}

  #app{ max-width:1080px; margin:0 auto; padding:20px 16px 64px; }

  .case-bar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:14px 18px; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .case-bar .id{display:flex;flex-direction:column;gap:2px;}
  .case-bar .id .num{font-size:1.05rem;letter-spacing:.02em;}
  .clock{font-size:1.3rem;letter-spacing:.02em;color:var(--ink);}
  .clock.crit{color:var(--critical);}
  .stamp{
    display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border:2px solid var(--accent);
    color:var(--accent-ink); border-radius:5px; transform:rotate(-3deg); font-family:Rockwell,"Roboto Slab",Georgia,serif;
    font-weight:700; letter-spacing:.08em; font-size:.78rem; text-transform:uppercase;
  }

  /* ---- selection screen ---- */
  .intro-hero{padding:8px 0 4px;}
  .intro-hero h1{font-size:2rem;margin:6px 0 10px;max-width:20ch;}
  .intro-hero p{max-width:64ch;color:var(--ink-soft);font-size:.98rem;}
  .folder-tag{
    display:inline-block; background:var(--critical-soft); color:var(--critical); padding:3px 10px;
    border-radius:5px; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; margin-bottom:10px;
  }
  .mode-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:22px;
  }
  .mode-card{
    text-align:left; padding:18px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper-raised); cursor:pointer; color:var(--ink); box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px;
  }
  .mode-card:hover{border-color:var(--accent);}
  .mode-card .area{font-size:1.05rem;font-weight:700;}
  .mode-card .meta{display:flex;gap:12px;font-size:.8rem;color:var(--ink-soft);}
  .mode-card.all{background:var(--accent-soft);border-color:var(--accent);}
  .mode-card.all .area{color:var(--accent-ink);}
  .mode-card.centered{text-align:center;align-items:center;}
  .mode-card.centered .meta{justify-content:center;}

  /* ---- exam screen ---- */
  .exam-top{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-bottom:14px;
  }
  .exam-top .prog{font-size:.9rem;color:var(--ink-soft);}
  .exam-top .prog b{color:var(--ink);}

  .desk{ display:grid; grid-template-columns:1fr 220px; gap:16px; align-items:start; }
  @media (max-width:760px){ .desk{grid-template-columns:1fr;} }

  .doc{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px 10px 10px 10px;
    box-shadow:var(--shadow); padding:24px 26px 26px; min-height:360px; position:relative;
  }
  .doc::before{ content:""; position:absolute; top:-1px; left:-1px; width:34px; height:6px; background:var(--accent); border-radius:0 0 3px 0; }

  .q-area{margin-bottom:4px;}
  .q-text{font-size:1.05rem;font-weight:600;margin:6px 0 18px;}

  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{
    text-align:left; padding:11px 14px; border:1.5px solid var(--line); background:var(--paper);
    border-radius:8px; color:var(--ink); cursor:pointer; font-size:.92rem; display:flex; gap:10px;
    align-items:flex-start; transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover{border-color:var(--accent);}
  .opt .k{ font-family:Rockwell,"Roboto Slab",Georgia,serif; font-weight:700; color:var(--ink-soft); flex:0 0 auto; }
  .opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .opt.selected .k{color:var(--accent-ink);}

  .doc-actions{
    margin-top:22px; padding-top:16px; border-top:1px dashed var(--line);
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .btn{
    padding:10px 18px; border-radius:8px; border:1.5px solid var(--accent); background:var(--accent);
    color:var(--paper-raised); font-weight:700; font-size:.86rem; cursor:pointer; letter-spacing:.02em;
  }
  .btn.ghost{background:transparent;color:var(--accent-ink);}
  .btn.subtle{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .navpanel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
    padding:14px; position:sticky; top:16px;
  }
  .navgrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:10px; }
  @media (max-width:760px){ .navgrid{grid-template-columns:repeat(10,1fr);} }
  .navcell{
    aspect-ratio:1; border-radius:5px; border:1.5px solid var(--line); background:var(--paper);
    font-size:.72rem; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .navcell.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
  .navcell.current{outline:2px solid var(--accent);outline-offset:1px;}
  .navlegend{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:.72rem;color:var(--ink-soft);}
  .navlegend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);display:inline-block;}
  .dot.a{background:var(--accent-soft);border-color:var(--accent);}

  /* ---- report screen ---- */
  .score-row{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0;}
  .score-item .v{font-size:1.7rem;}
  .score-item .v.mono{letter-spacing:.01em;}
  .area-breakdown{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
  .area-row{display:flex;align-items:center;gap:12px;}
  .area-row .name{width:150px;font-size:.85rem;color:var(--ink-soft);flex:0 0 auto;}
  .bar-track{flex:1;height:10px;background:var(--paper-deep);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);}
  .area-row .frac{width:56px;text-align:right;font-size:.82rem;flex:0 0 auto;}

  .review-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .review-item{
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--paper);
  }
  .review-item.wrong{border-left:4px solid var(--critical);}
  .review-item.right{border-left:4px solid var(--accent);}
  .review-item.skip{border-left:4px solid var(--line);}
  .review-item .qt{font-size:.88rem;font-weight:600;margin-bottom:6px;}
  .review-item .meta{font-size:.78rem;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;}
  .review-item .meta b{color:var(--ink);}
  .filter-row{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap;}
  .chip{
    padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);
    font-size:.78rem;color:var(--ink-soft);cursor:pointer;
  }
  .chip.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}

  .note{font-size:.85rem;color:var(--ink-soft);}
  footer.note{margin-top:22px;font-size:.76rem;text-align:center;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,12,.55); backdrop-filter:blur(1px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000;
  }
  .modal-box{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:22px 24px; max-width:420px; width:100%;
  }
  .modal-box h3{margin:0 0 10px;font-size:1.15rem;}
  .modal-box p{margin:0 0 20px;font-size:.92rem;color:var(--ink-soft);line-height:1.5;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .exp-box{
    margin-top:8px; padding:10px 12px; border-radius:8px; background:var(--paper-deep);
    border:1px solid var(--line); font-size:.82rem; color:var(--ink-soft); line-height:1.5;
  }
  .exp-box b{color:var(--ink);}
  .exp-box.wrong-note{border-color:var(--critical);background:var(--critical-soft);margin-bottom:6px;}

  /* ---- flashcards ---- */
  .flashcard-scene{ perspective:1600px; margin:4px 0 20px; }
  .flashcard-inner{
    position:relative; width:100%; min-height:320px;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.25,.8,.3,1);
    cursor:pointer;
  }
  .flashcard-inner.flipped{ transform:rotateY(180deg); cursor:default; }
  .flashcard-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:1.5px solid var(--line); border-radius:4px 14px 14px 14px; background:var(--paper-raised);
    box-shadow:var(--shadow); padding:26px 24px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px; overflow-y:auto;
  }
  .flashcard-front::before{ content:""; position:absolute; top:-1px; left:-1px; width:34px; height:6px; background:var(--accent); border-radius:0 0 3px 0; }
  .flashcard-back{ transform:rotateY(180deg); background:var(--accent-soft); border-color:var(--accent); }
  .flash-icon{
    width:64px; height:64px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .flashcard-back .flash-icon{ display:none; }
  .flash-icon svg{ width:36px; height:36px; }
  .flash-front-text{ font-size:1.08rem; font-weight:600; max-width:46ch; }
  .flash-back-text{ font-size:1rem; color:var(--ink); max-width:46ch; line-height:1.55; }
  .flash-tap-hint{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-top:auto; }
  .flash-actions{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .3s ease .15s, transform .3s ease .15s;
  }
  .flash-actions.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
  @media (max-width:520px){
    .flashcard-inner{ min-height:280px; }
    .flash-icon{ width:52px; height:52px; }
    .flash-icon svg{ width:30px; height:30px; }
  }
  @media (prefers-reduced-motion:reduce){ .flashcard-inner{ transition:none; } }

  /* ---- gamification: XP, streak, league ---- */
  .stats-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .stat-pill{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--paper-raised); box-shadow:var(--shadow);
    cursor:pointer; font-size:.85rem; font-weight:700; color:var(--ink);
  }
  .stat-pill:hover{ border-color:var(--accent); }
  .stat-pill .flame{ font-size:1rem; filter:saturate(1.3); }
  .stat-pill .lvl-badge{ color:var(--accent-ink); }
  .gem-dot{ width:13px; height:13px; border-radius:50%; display:inline-block; flex:0 0 auto; box-shadow:0 0 0 1.5px rgba(0,0,0,.18) inset; }
  .xp-banner{
    margin:14px 0 4px; padding:10px 14px; border-radius:8px; background:var(--accent-soft);
    border:1px solid var(--accent); color:var(--accent-ink); font-weight:700; font-size:.9rem;
  }
  .league-banner{
    padding:12px 16px; border-radius:8px; background:var(--paper-raised); border:1px solid var(--line);
    margin-bottom:14px; font-size:.9rem;
  }
  .league-banner.promo{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .league-banner.demo{ background:var(--warn-soft); border-color:var(--warn); color:var(--ink); }
  .league-list{ display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .league-row{
    display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper); font-size:.88rem;
  }
  .league-row .rank{ width:22px; flex:0 0 auto; color:var(--ink-soft); font-weight:700; }
  .league-row .pname{ flex:1; }
  .league-row .pxp{ flex:0 0 auto; color:var(--ink-soft); }
  .league-row.promo{ border-color:var(--accent); background:var(--accent-soft); }
  .league-row.demo{ border-color:var(--warn); background:var(--warn-soft); }
  .league-row.me{ outline:2px solid var(--accent); outline-offset:1px; font-weight:700; }

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>

<div id="app"></div>

<script>
(function(){

/* ======================= DATA ======================= */
/* Preguntas de práctica basadas en exámenes reales de residente médico (Paraguay). */

var AREAS = {
  CIR:{label:"Cirugía", short:"Cirugía"},
  GO:{label:"Gineco-Obstetricia", short:"Gineco-Obst."},
  SP:{label:"Salud Pública", short:"Salud Pública"},
  MI:{label:"Medicina Interna", short:"Medicina Interna"},
  PED:{label:"Pediatría", short:"Pediatría"}
};

var Q = [
{id:1,area:"CIR",q:"Dentro de las pérdidas diarias de líquidos de un paciente, la mayor parte de las pérdidas insensibles ocurren a través de:",opts:[["A","Pulmones"],["B","Sudor"],["C","Orina"],["D","Piel"]],ans:"D",exp:"La mayor parte de las pérdidas insensibles diarias ocurre a través de la piel (evaporación cutánea), superando a las pérdidas por vía respiratoria.",wrong:{A:"Las pérdidas respiratorias insensibles existen pero son menores en volumen que las cutáneas, no la vía principal.",B:"El sudor es una pérdida sensible y variable, regulada por la termorregulación, no una pérdida insensible fija.",C:"La orina es la principal pérdida sensible, regulada por el riñón, y no se contabiliza como pérdida insensible."}},
{id:2,area:"CIR",q:"De acuerdo a la clasificación de heridas quirúrgicas, ¿a qué clase de herida corresponde una colectomía derecha programada?",opts:[["A","Limpia"],["B","Limpia contaminada"],["C","Contaminada"],["D","Sucia"]],ans:"B",exp:"Una colectomía programada que abre el tubo digestivo de forma controlada, sin contaminación importante ni infección previa, se clasifica como limpia-contaminada (clase II).",wrong:{A:"La clase limpia (I) excluye cirugías que abren el tracto digestivo, como ocurre en la colectomía.",C:"La clase contaminada (III) requiere ruptura de la técnica estéril o derrame importante de contenido intestinal, no una apertura controlada.",D:"La clase sucia (IV) implica infección purulenta o víscera perforada preexistente, ausente en una cirugía electiva."}},
{id:3,area:"CIR",q:"El valor plasmático de cuál de los siguientes electrólitos no es un buen indicador de los depósitos corporales totales del mismo en presencia de hipoalbuminemia:",opts:[["A","Sodio"],["B","Potasio"],["C","Magnesio"],["D","Fósforo"]],ans:"C",exp:"El magnesio circula en parte unido a albúmina; con hipoalbuminemia su valor sérico puede aparecer bajo sin reflejar el verdadero depósito corporal, a diferencia de sodio y potasio.",wrong:{A:"El sodio sérico refleja el balance hídrico, no se une significativamente a albúmina, por lo que sigue siendo confiable.",B:"El potasio es predominantemente intracelular y su valor sérico no depende de la unión a proteínas plasmáticas.",D:"El fósforo circula mayormente libre en plasma, sin la dependencia de albúmina que distorsiona la medición del magnesio."}},
{id:4,area:"CIR",q:"Paciente presenta una quemadura que afecta todo el espesor de la piel. En base a la clasificación de la profundidad de las quemaduras, ¿a qué grado pertenece?",opts:[["A","Primer grado"],["B","Segundo grado"],["C","Tercer grado"],["D","Cuarto grado"]],ans:"C",exp:"Una quemadura que compromete todo el espesor de la piel (epidermis y dermis completas) corresponde por definición a tercer grado.",wrong:{A:"El primer grado solo compromete la epidermis, como en una quemadura solar, sin afectar la dermis.",B:"El segundo grado afecta epidermis y parte variable de la dermis, pero no todo el espesor cutáneo.",D:"El cuarto grado sobrepasa la piel e involucra músculo, fascia o hueso subyacente."}},
{id:5,area:"CIR",q:"¿Cuál es un síndrome paraneoplásico en paciente con cáncer pulmonar?",opts:[["A","Hipocalcemia"],["B","Síndrome de Cushing"],["C","Hiperuricemia"],["D","Hipotiroidismo"]],ans:"B",exp:"El síndrome de Cushing por secreción ectópica de ACTH es un síndrome paraneoplásico clásico del cáncer pulmonar, sobre todo del carcinoma microcítico.",wrong:{A:"El cáncer pulmonar, sobre todo el escamoso, produce típicamente hipercalcemia por PTHrP, no hipocalcemia.",C:"La hiperuricemia paraneoplásica se asocia más a neoplasias hematológicas de alto recambio celular, no al cáncer pulmonar.",D:"El cáncer pulmonar no se asocia clásicamente a hipotiroidismo como síndrome paraneoplásico reconocido."}},
{id:6,area:"CIR",q:"Con referencia al nódulo pulmonar solitario, marque la opción correcta:",opts:[["A","Es una lesión esférica única bien circunscripta mayor a 3cm"],["B","Presenta aumento de tamaño del hilio pulmonar"],["C","No se observa atelectasia pulmonar adyacente"],["D","Presenta derrame pleural concomitante"]],ans:"C",exp:"El nódulo pulmonar solitario clásico es una lesión bien circunscripta sin atelectasia adyacente, sin agrandamiento hiliar ni derrame pleural asociado.",wrong:{A:"El nódulo pulmonar solitario se define como una lesión ≤3 cm; si supera ese tamaño se denomina masa pulmonar.",B:"El agrandamiento hiliar sugiere adenopatías asociadas, hallazgo atípico de un nódulo solitario no complicado.",D:"El derrame pleural concomitante sugiere invasión pleural o enfermedad avanzada, ajeno a la definición de nódulo simple."}},
{id:7,area:"CIR",q:"Sobre el aneurisma de la aorta torácica, señale lo correcto:",opts:[["A","Se define como una dilatación local permanente que genera un incremento de por lo menos 30% del diámetro normal de la aorta"],["B","Los aneurismas torácicos nunca aumentan de tamaño"],["C","Los aneurismas falsos pueden ser saculares o fusiformes"],["D","Los aneurismas afectan un solo segmento de la aorta o varios de ellos"]],ans:"C",flag:1,exp:"Los aneurismas falsos (pseudoaneurismas) resultan de una rotura contenida y pueden tener morfología sacular o fusiforme según cómo se organice el hematoma.",wrong:{A:"La definición clásica de aneurisma exige un incremento de al menos 50%, no 30%, del diámetro normal de la aorta.",B:"Los aneurismas torácicos tienden a crecer progresivamente con el tiempo, por lo que requieren vigilancia y eventual reparación.",D:"Esta opción describe la extensión anatómica del aneurisma, no la morfología sacular o fusiforme característica de los falsos aneurismas."}},
{id:8,area:"CIR",q:"Según la clasificación de Rutherford de la enfermedad oclusiva de las arterias de las extremidades inferiores, cuando hay una claudicación grave corresponde a:",opts:[["A","Grado I Categoría 3"],["B","Grado II Categoría 4"],["C","Grado III Categoría 5"],["D","Grado III Categoría 6"]],ans:"A",exp:"Según Rutherford, la claudicación grave corresponde a Grado I, Categoría 3 (la claudicación ocupa las categorías 1 a 3 dentro del grado I; el dolor de reposo y la pérdida tisular son grados II y III).",wrong:{B:"Grado II corresponde al dolor isquémico de reposo, no a la claudicación, que se clasifica dentro del grado I.",C:"Grado III categoría 5 corresponde a pérdida tisular menor (isquemia crítica), no a la claudicación.",D:"Grado III categoría 6 corresponde a pérdida tisular mayor con isquemia crítica avanzada, no a la claudicación."}},
{id:9,area:"CIR",q:"Señale lo correcto con respecto a la hernia hiatal por rodamiento o tipo II. Seleccione una:",opts:[["A","Existe una herniación del fondo gástrico"],["B","Generalmente los síntomas están relacionados con el reflujo gastroesofágico"],["C","Una de las complicaciones es la aparición del epitelio de Barret"],["D","La unión cardioesofágica se encuentra desplazada hacia el tórax"]],ans:"A",exp:"En la hernia hiatal por rodamiento (tipo II) el fondo gástrico se hernia junto a un cardias que permanece en posición normal, a diferencia de la hernia por deslizamiento.",wrong:{B:"Los síntomas relacionados con reflujo son característicos de la hernia por deslizamiento (tipo I), no de la tipo II.",C:"El esófago de Barrett es complicación típica del reflujo crónico de la hernia por deslizamiento, no de la paraesofágica pura.",D:"En la hernia tipo II la unión cardioesofágica permanece en su posición normal; lo que se hernia es el fondo gástrico."}},
{id:10,area:"CIR",q:"Un paciente portador de cáncer de esófago, y que es capaz de deglutir sólo líquidos, presenta una disfagia grado:",opts:[["A","III"],["B","IV"],["C","V"],["D","VI"]],ans:"A",exp:"La disfagia grado III implica que el paciente aún tolera líquidos pero no sólidos ni semisólidos; la imposibilidad de deglutir hasta la saliva corresponde a grado IV (afagia).",wrong:{B:"Grado IV corresponde a la incapacidad de deglutir incluso saliva (afagia), no a tolerar solo líquidos.",C:"El grado V no existe en la escala habitual de disfagia utilizada para el cáncer de esófago.",D:"El grado VI tampoco forma parte de la clasificación estándar de disfagia empleada clínicamente."}},
{id:11,area:"CIR",q:"Con referencia a la clasificación de Johnson de las úlceras pépticas, marque la alternativa correcta:",opts:[["A","Las tipo 1 se localizan en la unión gastroesofágica"],["B","Las tipo 2 y 3 presentan acidez normal o elevada"],["C","Las tipo 4 se localizan en la curvatura mayor"],["D","Las tipo 1 presentan acidez normal o elevada"]],ans:"B",exp:"En la clasificación de Johnson, las úlceras tipo 2 (cuerpo gástrico + duodenal) y tipo 3 (prepilóricas) cursan con acidez normal o elevada, a diferencia de la tipo 1 que es hipo/normoclorhídrica.",wrong:{A:"Las úlceras tipo 1 de Johnson se localizan en la curvatura menor del cuerpo gástrico, no en la unión gastroesofágica.",C:"Las úlceras tipo 4 se localizan cerca de la unión gastroesofágica (curvatura menor alta), no en la curvatura mayor.",D:"Las úlceras tipo 1 cursan con acidez normal o baja, a diferencia de las tipo 2 y 3."}},
{id:12,area:"CIR",q:"Se considera un cáncer gástrico temprano cuando:",opts:[["A","Está limitado a la mucosa"],["B","Está limitado a la mucosa y submucosa"],["C","Está limitado a la mucosa, submucosa y muscular propia"],["D","No sobrepasa la serosa"]],ans:"B",exp:"El cáncer gástrico temprano se define por invasión limitada a mucosa y submucosa, independientemente del compromiso ganglionar.",wrong:{A:"Limitar la definición solo a la mucosa excluye los casos con invasión submucosa que también se consideran cáncer temprano.",C:"La invasión de la muscular propia corresponde a cáncer gástrico avanzado, no temprano.",D:"No sobrepasar la serosa describe un criterio de resecabilidad, no la definición histológica de cáncer gástrico temprano."}},
{id:13,area:"CIR",q:"Paciente de sexo masculino de 45 años de edad sometido a una gastrectomía total con D2, presenta hace 2 meses 15 a 30 minutos después de los alimentos, diaforesis, debilidad, mareo y taquicardia. Estos síntomas mejoran cuando se recuesta o si se le administra una solución salina. ¿Qué diagnóstico le podemos dar al paciente?",opts:[["A","Dumping gástrico"],["B","Síndrome de Asa eferente"],["C","Síndrome Asa aferente"],["D","Vólvulo gástrico"]],ans:"A",exp:"El cuadro (síntomas vasomotores 15-30 min posprandiales que mejoran en decúbito, tras gastrectomía) es el síndrome de dumping precoz por vaciamiento rápido de contenido hiperosmolar al intestino.",wrong:{B:"El síndrome de asa eferente cursa con obstrucción y vómitos biliosos, no con síntomas vasomotores posprandiales.",C:"El síndrome de asa aferente se manifiesta con dolor y vómito bilioso en proyectil, no con diaforesis y taquicardia.",D:"El vólvulo gástrico se presenta con dolor agudo y distensión brusca, no con este cuadro posprandial recurrente."}},
{id:14,area:"CIR",q:"Señale la afirmación correcta en la enfermedad de Crohn:",opts:[["A","Es una enfermedad que afecta solamente la parte distal del íleon"],["B","Lo característico es la afectación de todo el grosor del intestino (transmural)"],["C","La afectación mucosa es continua"],["D","La característica diferencial con la colitis ulcerosa es la ausencia de seudopólipos"]],ans:"B",exp:"La enfermedad de Crohn se caracteriza por inflamación transmural (todo el espesor de la pared intestinal), a diferencia de la colitis ulcerosa que solo afecta la mucosa.",wrong:{A:"El Crohn puede afectar cualquier segmento del tubo digestivo desde la boca hasta el ano, no solo el íleon distal.",C:"La afectación mucosa del Crohn es discontinua, en parches salteados, a diferencia de la colitis ulcerosa.",D:"Los seudopólipos pueden observarse también en el Crohn; no constituyen un rasgo diferencial exclusivo de la colitis ulcerosa."}},
{id:15,area:"CIR",q:"¿Cuál es una indicación de cirugía de urgencia en un paciente portador de colitis ulcerosa?",opts:[["A","Falta de respuesta a pesar del tratamiento médico eficaz"],["B","Riesgo alto de necrosis aséptica de articulaciones secundaria al uso prolongado de esteroides"],["C","Riesgo alto de carcinoma colorrectal"],["D","Colitis fulminante que no responde con rapidez al tratamiento médico"]],ans:"A",exp:"La falta de respuesta al tratamiento médico óptimo es indicación clásica de cirugía de urgencia en colitis ulcerosa grave.",wrong:{B:"El riesgo de necrosis ósea por esteroides es indicación relativa a largo plazo, no una urgencia quirúrgica inmediata.",C:"El riesgo de cáncer colorrectal es indicación de cirugía electiva de vigilancia, no de urgencia.",D:"La colitis fulminante refractaria es un subtipo particular incluido dentro del criterio más amplio de falta de respuesta al tratamiento médico eficaz."}},
{id:16,area:"CIR",q:"En el cáncer de recto, ¿qué estudio tiene mayor sensibilidad para la estadificación? Señale uno:",opts:[["A","Ecografía pelviana"],["B","Tomografía axial computarizada con doble contraste de abdomen y pelvis"],["C","Resonancia magnética nuclear de abdomen y pelvis"],["D","Rectosigmoidoscopia"]],ans:"C",exp:"La resonancia magnética de abdomen y pelvis tiene la mayor sensibilidad para evaluar la profundidad de invasión y el compromiso ganglionar/mesorrectal en la estadificación local del cáncer de recto.",wrong:{A:"La ecografía pelviana tiene menor resolución de los planos mesorrectales que la resonancia magnética.",B:"La tomografía con doble contraste es útil para metástasis a distancia, pero tiene menor sensibilidad local que la resonancia.",D:"La rectosigmoidoscopia permite el diagnóstico y biopsia, pero no evalúa la profundidad de invasión parietal ni ganglios."}},
{id:17,area:"CIR",q:"En un politraumatizado, ¿cuál de las siguientes lesiones no pone en riesgo la vida del paciente en un corto plazo?",opts:[["A","Neumotórax hipertensivo"],["B","Taponamiento cardiaco"],["C","Contusión pulmonar bilateral"],["D","Hemotórax masivo"]],ans:"C",exp:"La contusión pulmonar bilateral, aunque grave, no compromete la vida de forma tan inmediata como el neumotórax hipertensivo, el taponamiento cardíaco o el hemotórax masivo, que requieren descompresión urgente.",wrong:{A:"El neumotórax hipertensivo compromete el retorno venoso y el gasto cardíaco de forma inmediata, con riesgo de muerte en minutos.",B:"El taponamiento cardíaco reduce el gasto cardíaco de forma aguda y requiere descompresión inmediata para evitar la muerte.",D:"El hemotórax masivo puede causar shock hipovolémico rápido por la pérdida sanguínea acumulada en el tórax."}},
{id:18,area:"CIR",q:"Con relación a la apendicitis aguda durante el embarazo marque la afirmación correcta:",opts:[["A","Puede ocurrir en cualquier momento y es más frecuente en el tercer trimestre"],["B","Las tasas más altas de apendicectomías negativas ocurren durante el segundo trimestre"],["C","Cuando hay duda diagnóstica la tomografía axial computada es el método auxiliar de elección"],["D","El riesgo de óbito fetal es mayor con la operación abierta en comparación con la laparoscópica"]],ans:"C",exp:"Ante duda diagnóstica de apendicitis en el embarazo, la tomografía es el método auxiliar de elección quando la ecografía no es concluyente.",wrong:{A:"La apendicitis en el embarazo puede ocurrir en cualquier trimestre, pero es más frecuente en el segundo, no en el tercero.",B:"Las tasas más altas de apendicectomía negativa ocurren en el tercer trimestre, por la dificultad diagnóstica del útero grávido, no en el segundo.",D:"El riesgo de pérdida fetal se relaciona con la apendicitis complicada en sí, sin diferencia demostrada entre la vía laparoscópica y la abierta."}},
{id:19,area:"CIR",q:"La tumoración sólida benigna más común en el hígado es:",opts:[["A","Quiste hepático"],["B","Adenoma"],["C","Hemangioma"],["D","Hiperplasia nodular focal"]],ans:"C",exp:"El hemangioma es la tumoración sólida benigna más frecuente del hígado.",wrong:{A:"El quiste hepático simple es una lesión líquida, no sólida, por lo que no corresponde a una tumoración sólida.",B:"El adenoma hepático es una neoplasia sólida benigna, pero mucho menos frecuente que el hemangioma.",D:"La hiperplasia nodular focal es la segunda lesión sólida benigna más común del hígado, después del hemangioma."}},
{id:20,area:"CIR",q:"¿Qué conoce sobre el Adenoma hepático? Marque lo correcto:",opts:[["A","Son neoplasias sólidas malignas"],["B","Se ven más en mujeres entre 50-60 años"],["C","Está relacionado con el uso de anticonceptivos"],["D","Se recomienda el tratamiento conservador una vez diagnosticado"]],ans:"C",exp:"El adenoma hepatocelular está fuertemente asociado al uso prolongado de anticonceptivos orales, sobre todo en mujeres jóvenes.",wrong:{A:"El adenoma hepatocelular es una neoplasia benigna, no maligna, aunque tiene potencial de malignización y ruptura.",B:"El adenoma hepático predomina en mujeres jóvenes en edad fértil, no en el grupo de 50-60 años.",D:"Dado el riesgo de hemorragia y transformación maligna, se recomienda resección quirúrgica y no manejo conservador exclusivo."}},
{id:21,area:"CIR",q:"La colangitis esclerosante primaria en casi dos tercios de los individuos se acompaña de:",opts:[["A","Tiroiditis de Hashimoto"],["B","Anemia perniciosa"],["C","Fibrosis quística"],["D","Colitis ulcerosa"]],ans:"D",exp:"La colangitis esclerosante primaria se asocia en cerca de dos tercios de los casos a enfermedad inflamatoria intestinal, principalmente colitis ulcerosa.",wrong:{A:"La tiroiditis de Hashimoto no es la asociación característica de la colangitis esclerosante primaria.",B:"La anemia perniciosa no forma parte de las asociaciones clásicas descritas para la colangitis esclerosante primaria.",C:"La fibrosis quística no es una comorbilidad típicamente asociada a la colangitis esclerosante primaria."}},
{id:22,area:"CIR",q:"Marque lo correcto con respecto a la colecistitis aguda:",opts:[["A","Todas se originan por la obstrucción calculosa del conducto cístico"],["B","Desde el inicio la colecistitis ya es un proceso infeccioso"],["C","La presencia de ictericia se debe siempre a un cálculo coledociano"],["D","La colecistostomía es una opción terapéutica en ciertos casos"]],ans:"D",exp:"La colecistostomía (drenaje percutáneo de la vesícula) es una opción terapéutica válida en pacientes de alto riesgo quirúrgico con colecistitis aguda.",wrong:{A:"No todas las colecistitis agudas se deben a obstrucción litiásica del cístico; existe también la forma alitiásica.",B:"La colecistitis inicia como un proceso inflamatorio químico por obstrucción, y la infección bacteriana suele ser secundaria, no inicial.",C:"La ictericia en colecistitis puede deberse a compresión extrínseca (síndrome de Mirizzi) y no siempre a un cálculo coledociano."}},
{id:23,area:"CIR",q:"En mujeres embarazadas con cálculos biliares sintomáticos se realiza la colecistectomía laparoscópica durante:",opts:[["A","El 1er trimestre"],["B","El 2do trimestre"],["C","El 3er trimestre"],["D","Posterior al parto"]],ans:"B",exp:"En embarazadas con colelitiasis sintomática, la colecistectomía laparoscópica se prefiere realizar durante el segundo trimestre, cuando el riesgo de parto prematuro y de teratogénesis es menor.",wrong:{A:"El primer trimestre conlleva mayor riesgo de teratogenicidad anestésica y de aborto espontáneo asociado a la cirugía.",C:"El tercer trimestre aumenta el riesgo técnico por el útero grávido y de parto prematuro tras la cirugía.",D:"Diferir la cirugía hasta después del parto expone a la paciente a recurrencias y complicaciones como colecistitis o pancreatitis durante el embarazo."}},
{id:24,area:"CIR",q:"¿Cuál de estas afirmaciones sobre la coledocolitiasis es correcta?",opts:[["A","En occidente la mayoría son cálculos primarios"],["B","Los cálculos coledocianos siempre se manifiestan con ictericia"],["C","Su complicación más grave es un absceso hepático"],["D","Cuando sospechamos clínicamente una litiasis coledociana, el primer estudio a realizar es una ecografía"]],ans:"D",exp:"Ante sospecha clínica de litiasis coledociana, la ecografía abdominal es el primer estudio a realizar por su disponibilidad y bajo costo, aunque tenga limitaciones para ver el colédoco distal.",wrong:{A:"En occidente predominan los cálculos secundarios migrados desde la vesícula, no los primarios formados en el colédoco.",B:"Los cálculos coledocianos pueden ser asintomáticos o cursar sin ictericia manifiesta, sobre todo si son parciales o intermitentes.",C:"La complicación más grave de la coledocolitiasis es la colangitis aguda/sepsis biliar, no el absceso hepático."}},
{id:25,area:"CIR",q:"Con relación a la etiología yatrógena de la pancreatitis aguda, ¿cuál de los siguientes procedimientos quirúrgicos no se consideraría como una causa potencial?",opts:[["A","Gastrectomía distal"],["B","Nefrectomía"],["C","Válvula antirreflujo gastroesofágica"],["D","Trasplante cardíaco"]],ans:"B",exp:"La nefrectomía no es un procedimiento anatómicamente relacionado al páncreas y no figura entre las causas quirúrgicas yatrógenas reconocidas de pancreatitis aguda, a diferencia de la cirugía gástrica, biliar o cardíaca.",wrong:{A:"La gastrectomía distal puede lesionar el páncreas o su irrigación durante la disección, siendo causa quirúrgica reconocida.",C:"La cirugía antirreflujo puede lesionar el páncreas por su proximidad anatómica durante la disección del hiato.",D:"El trasplante cardíaco se asocia a pancreatitis por hipoperfusión esplácnica e inmunosupresión, siendo causa yatrógena descrita."}},
{id:26,area:"CIR",q:"¿Por dónde protruyen las hernias inguinales directas?",opts:[["A","Por fuera de los vasos epigástricos inferiores"],["B","Por dentro de los vasos epigástricos inferiores"],["C","Por dentro del anillo femoral superficial"],["D","Por dentro de los vasos epigástricos superiores"]],ans:"B",exp:"Las hernias inguinales directas protruyen mediales a los vasos epigástricos inferiores (a través del triángulo de Hesselbach), mientras que las indirectas lo hacen por fuera de ellos.",wrong:{A:"Por fuera de los vasos epigástricos inferiores es el trayecto de las hernias indirectas, no de las directas.",C:"Por dentro del anillo femoral describe el trayecto de las hernias femorales, no de las inguinales directas.",D:"Los vasos epigástricos superiores no son el reparo anatómico usado para clasificar las hernias inguinales."}},
{id:27,area:"CIR",q:"Señale lo correcto con respecto a la técnica de Bassini en la reparación herniaria.",opts:[["A","Aproxima el tendón conjunto a la arcada crural"],["B","Aproxima el tendón conjunto al ligamento de Cooper"],["C","Está indicada en las hernias sobre todo crurales"],["D","Se la puede utilizar con una malla protésica"]],ans:"A",exp:"La técnica de Bassini aproxima el tendón conjunto al ligamento inguinal (arcada crural), a diferencia de la técnica de McVay que lo aproxima al ligamento de Cooper.",wrong:{B:"Aproximar el tendón conjunto al ligamento de Cooper describe la técnica de McVay, no la de Bassini.",C:"La técnica indicada específicamente en hernias crurales/femorales es la de McVay, no la de Bassini.",D:"La técnica de Bassini es una reparación con tejido propio, sin uso de malla protésica."}},
{id:28,area:"CIR",q:"¿En cuál de los tumores malignos de la glándula tiroides la afectación de los ganglios linfáticos cervicales es menos frecuente?",opts:[["A","Carcinoma papilar"],["B","Carcinoma folicular"],["C","Carcinoma medular"],["D","Carcinoma de células de Hürthle"]],ans:"B",exp:"El carcinoma folicular de tiroides se disemina predominantemente por vía hematógena, por lo que el compromiso de ganglios linfáticos cervicales es menos frecuente que en el papilar o el medular.",wrong:{A:"El carcinoma papilar se disemina predominantemente por vía linfática, con alta frecuencia de metástasis ganglionares cervicales.",C:"El carcinoma medular también tiene diseminación linfática temprana y frecuente a ganglios cervicales.",D:"El carcinoma de células de Hürthle, variante más agresiva del folicular, también presenta diseminación linfática significativa."}},
{id:29,area:"CIR",q:"La prueba de Trendelemburg sirve para:",opts:[["A","Estudiar la competencia del sistema venoso profundo y perforante"],["B","Estudiar la competencia del sistema venoso de la vena safena magna"],["C","Estudiar la competencia del sistema venoso de la ilíaca externa"],["D","Estudiar la competencia del sistema venoso de la femoral profunda"]],ans:"A",exp:"La prueba de Trendelenburg evalúa la competencia valvular del sistema venoso superficial (safena) y de las venas perforantes, diferenciando el reflujo superficial del profundo.",wrong:{B:"Evaluar específicamente la safena magna corresponde a otras pruebas de reflujo segmentario, no a la prueba de Trendelenburg clásica.",C:"El sistema venoso ilíaco externo no se evalúa mediante la prueba de Trendelenburg, orientada al sistema superficial y perforantes.",D:"La femoral profunda pertenece al sistema venoso profundo proximal, no es el objetivo específico de esta prueba clínica."}},
{id:30,area:"CIR",q:"Un paciente es portador de una enfermedad sistémica grave y debe ser sometido a una cirugía programada de cáncer de colon. Teniendo en cuenta la escala de la ASA para la valoración del riesgo preoperatorio, este paciente corresponde a una puntuación:",opts:[["A","2"],["B","3"],["C","4"],["D","5"]],ans:"B",exp:"Una enfermedad sistémica grave, sin ser una amenaza constante para la vida, corresponde a ASA III según la escala de valoración del riesgo preoperatorio.",wrong:{A:"ASA II corresponde a enfermedad sistémica leve a moderada, sin limitación funcional importante, no a enfermedad grave.",C:"ASA IV corresponde a enfermedad sistémica grave que constituye una amenaza constante para la vida, más severa que el caso descrito.",D:"ASA V corresponde al paciente moribundo con expectativa de vida menor a 24 horas sin la cirugía."}},
{id:31,area:"GO",q:"El examen microscópico de la mola hidatiforme completa tiene aspecto de:",opts:[["A","Vellosidades crecidas y edematosas, y proliferación trofoblástica anormal"],["B","Vesículas de dimensiones variables acumuladas con vellosidades de aspecto normal"],["C","Cúmulos vesiculares en racimo de uvas"],["D","Cúmulos vesiculares con aspecto de tormenta de nieve"]],ans:"A",flag:1,exp:"El estudio microscópico de la mola completa muestra vellosidades edematosas con proliferación trofoblástica anormal; el patrón en \"tormenta de nieve\" es el hallazgo ecográfico, no histológico.",wrong:{B:"Describe vesículas con vellosidades de aspecto normal; en la mola están edematosas y alteradas, no normales.",C:"El patrón en racimo de uvas es la apariencia macroscópica de la mola, no el hallazgo microscópico.",D:"La imagen en tormenta de nieve corresponde al hallazgo ecográfico, no al examen histológico."}},
{id:32,area:"GO",q:"De las siguientes afirmaciones, es característico de los sarcomas del estroma endometrial:",opts:[["A","Se manifiestan como tumor solitario"],["B","Simulan células de estroma endometrial en fase secretora"],["C","Son más polipoideos con poca tendencia a invasión miometrial extensa"],["D","En su extensión extrauterina simula una leiomiomatosis intravenosa"]],ans:"D",exp:"Los sarcomas del estroma endometrial pueden extenderse fuera del útero simulando una leiomiomatosis intravenosa, un patrón de crecimiento característico.",wrong:{A:"En realidad suelen ser multifocales o difusos dentro del miometrio, no un tumor único y circunscrito.",B:"Las células recuerdan al estroma endometrial en fase proliferativa, no secretora.",C:"Característicamente infiltran el miometrio de forma extensa con invasión vascular, no un crecimiento polipoideo limitado."}},
{id:33,area:"GO",q:"Corresponde a características de carcinoma endometrial tipo II:",opts:[["A","El subtipo específico es el endometroide"],["B","Es de comportamiento estable"],["C","Invasión miometrial mínima"],["D","Se da en estado posmenopáusico"]],ans:"D",exp:"El carcinoma endometrial tipo II (seroso/células claras) ocurre típicamente en mujeres posmenopáusicas, es de comportamiento agresivo y no está ligado al estímulo estrogénico como el tipo I.",wrong:{A:"El subtipo endometrioide corresponde al carcinoma tipo I, no al tipo II (seroso/células claras).",B:"El tipo II tiene comportamiento agresivo y de alto grado, no estable como el tipo I.",C:"El tipo II se asocia típicamente a invasión miometrial profunda, no mínima."}},
{id:34,area:"GO",q:"El elemento pronóstico de mayor importancia en el cáncer de vulva es:",opts:[["A","Tamaño de la lesión"],["B","Profundidad de infiltración"],["C","Estado del borde de extirpación"],["D","Metástasis en ganglios linfáticos"]],ans:"D",exp:"La presencia de metástasis en ganglios linfáticos es el factor pronóstico aislado más importante en el cáncer de vulva.",wrong:{A:"El tamaño tumoral influye en el estadio, pero no es el factor pronóstico aislado más determinante.",B:"La profundidad de infiltración condiciona el riesgo de metástasis ganglionar, pero no es el factor pronóstico principal.",C:"El estado del margen quirúrgico predice recurrencia local, no la supervivencia global como el estado ganglionar."}},
{id:35,area:"GO",q:"Clínicamente, a la especuloscopía se constata tumor que reemplaza cérvix uterino que mide 5 cm. con claro compromiso del tercio superior de la vagina. Al tacto se descarta compromiso de la pared pélvica; y los estudios de extensión no arrojan más datos de interés. ¿A qué estadío según la clasificación de la FIGO correspondería?",opts:[["A","E IB1"],["B","E IB2"],["C","E IIA1"],["D","E IIA2"]],ans:"D",exp:"Un tumor cervical de 5 cm con compromiso del tercio superior de la vagina, sin invasión de pared pélvica, corresponde a estadio IIA2 de la FIGO (IIA2 cuando el tumor mide ≥4 cm).",wrong:{A:"El estadio IB1 corresponde a tumores confinados al cérvix, sin el compromiso vaginal descrito.",B:"El estadio IB2 también se limita al cérvix; aquí ya existe extensión al tercio superior de la vagina.",C:"El estadio IIA1 se reserva para tumores menores de 4 cm con compromiso vaginal; este mide 5 cm."}},
{id:36,area:"GO",q:"El factor de riesgo significativo e independiente para la incontinencia urinaria corresponde a:",opts:[["A","El índice de masa corporal"],["B","La menopausia"],["C","El parto y el embarazo"],["D","El grupo étnico"]],ans:"C",exp:"El parto vaginal y el embarazo son factores de riesgo independientes y significativos para incontinencia urinaria por el trauma que generan sobre el piso pélvico.",wrong:{A:"El índice de masa corporal es un factor de riesgo asociado, pero no el más independiente y significativo descrito.",B:"La menopausia se relaciona con cambios del piso pélvico, pero no es el factor independiente de mayor peso.",D:"El grupo étnico influye poco comparado con el trauma obstétrico del parto y el embarazo."}},
{id:37,area:"GO",q:"De las siguientes, corresponde a un factor de riesgo mayor para el desarrollo de osteoporosis:",opts:[["A","Glucocorticoides sistémicos más de tres meses"],["B","Consumo excesivo de alcohol"],["C","Artritis reumatoide"],["D","Terapia crónica con heparina o anticonvulsivantes"]],ans:"A",exp:"El uso de glucocorticoides sistémicos por más de tres meses es un factor de riesgo mayor reconocido para osteoporosis secundaria.",wrong:{B:"El consumo excesivo de alcohol se clasifica como factor de riesgo menor, no mayor, para osteoporosis.",C:"La artritis reumatoide es un factor de riesgo menor reconocido, no uno de los mayores.",D:"La terapia crónica con heparina o anticonvulsivantes se considera un factor de riesgo menor, no mayor."}},
{id:38,area:"GO",q:"En el contexto de PCOS (Síndrome de ovarios poliquísticos), en el mecanismo de reducción de la biotransformación de los andrógenos a estrógenos está implicada:",opts:[["A","El aumento relativo de estrógenos intrafoliculares que resulta en el crecimiento folicular inadecuado"],["B","La alteración en la liberación pulsátil de la GnRH con un incremento relativo de LH sobre la FSH"],["C","El aumento de la LH estimula la aromatización dentro de las células de la granulosa"],["D","El aumento de los andrógenos intrafoliculares favorece proliferación de las células de la granulosa"]],ans:"B",exp:"En el SOP, la alteración en la pulsatilidad de GnRH genera un predominio relativo de LH sobre FSH, lo que reduce la actividad aromatasa dependiente de FSH y limita la conversión de andrógenos a estrógenos.",wrong:{A:"Describe un aumento estrogénico intrafolicular; en el SOP predomina el ambiente androgénico con déficit de aromatización, no lo opuesto.",C:"La aromatización depende de FSH sobre la granulosa; el exceso de LH favorece la síntesis de andrógenos tecales, no la aromatización.",D:"El exceso de andrógenos intrafoliculares favorece la atresia folicular, no la proliferación de la granulosa."}},
{id:39,area:"GO",q:"En el hipogonadismo hipergonadotrófico, es característico:",opts:[["A","Una disfunción primaria de la hipófisis"],["B","Una disfunción primaria del hipotálamo"],["C","Una disfunción primaria de los ovarios"],["D","Una disfunción secundaria del hipotálamo y primario de la hipófisis"]],ans:"C",exp:"El hipogonadismo hipergonadotrófico refleja una falla primaria de los ovarios, con gonadotrofinas elevadas de forma compensatoria.",wrong:{A:"Una disfunción hipofisaria primaria produce hipogonadismo hipogonadotrófico, con gonadotrofinas bajas, no elevadas.",B:"Una falla hipotalámica primaria genera hipogonadismo hipogonadotrófico, con gonadotrofinas bajas.",D:"Esta combinación describe un eje hipotálamo-hipofisario alterado, no la falla gonadal primaria que define al hipergonadotrófico."}},
{id:40,area:"GO",q:"Corresponde al criterio diagnóstico de POF (insuficiencia ovárica prematura):",opts:[["A","Pérdida de los ovocitos y de las células de sostén ováricas evidenciados a la ecografía antes de los 40 años"],["B","Dos determinaciones séricas de FSH menores a 20 mU/mL, obtenidas en intervalos de al menos 15 días, antes de los 40 años"],["C","Dos determinaciones séricas de FSH mayores a 30 mU/mL pero menores a 40 mU/mL, obtenidas en intervalos de al menos 30 días, antes de los 40 años"],["D","Dos determinaciones séricas de FSH mayores a 40 mU/mL pero menores a 100 mU/mL, obtenidas en intervalos de al menos 7 días, antes de los 40 años"]],ans:"C",flag:1,exp:"El diagnóstico de insuficiencia ovárica prematura (POF) requiere dos determinaciones de FSH elevada (habitualmente >30-40 mUI/mL) separadas por al menos 30 días, antes de los 40 años, junto con amenorrea.",wrong:{A:"La ecografía no constituye el criterio diagnóstico estándar de POF; el diagnóstico se basa en determinaciones hormonales.",B:"Un FSH menor a 20 mUI/mL está dentro de rango normal y no cumple el criterio de insuficiencia ovárica.",D:"El intervalo mínimo exigido entre determinaciones es de 30 días, no de 7, y el umbral habitual no llega a 100 mUI/mL."}},
{id:41,area:"GO",q:"De los péptidos gonadales, el que circula en concentraciones significativas, críticas para la retroalimentación negativa de la FSH en la fase folicular, corresponde a:",opts:[["A","Activina A"],["B","Inhibina B"],["C","Folistatina"],["D","Foliculina"]],ans:"B",exp:"La inhibina B, producida por las células de la granulosa, es el péptido gonadal más relevante en la retroalimentación negativa de la FSH durante la fase folicular.",wrong:{A:"La activina A estimula la secreción de FSH, un efecto opuesto a la retroalimentación negativa descrita.",C:"La folistatina actúa neutralizando la activina, un mecanismo indirecto distinto de la inhibición directa de FSH por inhibina B.",D:"La foliculina no constituye un péptido gonadal con relevancia establecida en esta retroalimentación."}},
{id:42,area:"GO",q:"El síndrome de retención ovárica se diferencia del síndrome de remanente ovárico por:",opts:[["A","La cantidad de tejido ovárico"],["B","La sintomatología"],["C","El tratamiento hormonal"],["D","La edad de presentación"]],ans:"D",flag:1,exp:"El síndrome de remanente ovárico y el de retención ovárica se diferencian principalmente por la edad/momento de presentación tras la cirugía, más que por la cantidad de tejido.",wrong:{A:"La cantidad de tejido ovárico no es el criterio diferenciador entre ambos síndromes, que pueden compartir presentación clínica similar.",B:"Ambos síndromes pueden cursar con sintomatología dolorosa similar; no es el elemento que los distingue.",C:"El manejo hormonal no constituye el criterio diferenciador entre retención y remanente ovárico."}},
{id:43,area:"GO",q:"En un embarazo ectópico, ¿en qué caso se puede realizar tratamiento farmacológico (no quirúrgico)?",opts:[["A","Sangrado moderado a severo"],["B","Dolor abdominal intenso"],["C","Dosaje de B-HCG mayor a 9.000 mU/mL"],["D","Diámetro de la masa ectópica no > 40 mm"]],ans:"D",exp:"El tratamiento médico (metotrexato) del embarazo ectópico es apropiado cuando la masa ectópica es pequeña (habitualmente ≤3.5-4 cm), criterio que favorece el éxito del tratamiento no quirúrgico.",wrong:{A:"El sangrado moderado a severo es una contraindicación para el tratamiento médico, que requiere estabilidad hemodinámica.",B:"El dolor abdominal intenso sugiere posible rotura y contraindica el manejo farmacológico.",C:"Una β-hCG tan elevada (>9.000) se asocia a menor éxito del metotrexato; se prefieren valores más bajos para el tratamiento médico."}},
{id:44,area:"GO",q:"Los mecanismos hormonales implicados en la génesis de los implantes endometriósicos:",opts:[["A","Conversión de androstenediona a estrona por la 17-ß hidroesteroide deshidrogenasa tipo 1"],["B","Se incrementa la actividad de 17-ß hidroesteroide deshidrogenasa tipo 2"],["C","Se reprime la actividad de las MMP (metaloproteinasas de la matriz) resultante de la resistencia a la progesterona"],["D","Se suprime la expresión del receptor α estrogénico, lo cual disminuye la inducción del receptor de progesterona"]],ans:"D",flag:1,exp:"En la endometriosis, la resistencia a la progesterona se asocia a menor inducción del receptor de progesterona y a supresión relativa del receptor estrogénico α, alterando la regulación hormonal local.",wrong:{A:"La conversión de androstenediona a estrona es catalizada por la aromatasa, no por la 17-ß-HSD tipo 1, que actúa después convirtiendo estrona en estradiol.",B:"En la endometriosis se reduce la actividad de la 17-ß-HSD tipo 2 (inactivadora de estradiol), no se incrementa.",C:"La resistencia a la progesterona desinhibe (aumenta), no reprime, la actividad de las metaloproteinasas de matriz."}},
{id:45,area:"GO",q:"De las siguientes afirmaciones, corresponde a una contraindicación para ablación endometrial en la disfunción endometrial primaria:",opts:[["A","Hiperplasia endometrial"],["B","Paridad satisfecha"],["C","Congestión vascular endometrial"],["D","Pacientes en tratamiento con antiinflamatorios no esteroideos"]],ans:"A",exp:"La hiperplasia endometrial es una contraindicación para la ablación endometrial, ya que primero debe descartarse malignidad.",wrong:{B:"La paridad satisfecha es, por el contrario, un requisito previo favorable para indicar la ablación, no una contraindicación.",C:"La congestión vascular endometrial es una causa de sangrado tratable con ablación, no una contraindicación al procedimiento.",D:"El uso de antiinflamatorios no esteroideos no contraindica la ablación endometrial."}},
{id:46,area:"GO",q:"Definimos como muerte materna directa:",opts:[["A","Muerte materna ocurrida a consecuencia de una enfermedad pre existente o que se desarrolla durante el embarazo, trabajo de parto o puerperio, y que se agrava por las modificaciones fisiológicas inducidas por el embarazo"],["B","Es el fallecimiento de la madre que es producto de causas accidentales o incidentales no vinculadas con el embarazo"],["C","La muerte de una mujer por cualquier causa durante la gestación o en el primer año después de la conclusión de esta, independientemente de la duración y el sitio del embarazo"],["D","La muerte de la madre que resulta de complicaciones obstétricas del embarazo, el trabajo de parto o puerperio, así como de intervenciones, omisiones, tratamiento incorrecto o una cadena de sucesos que son consecuencia de cualesquiera de esos factores"]],ans:"D",exp:"La muerte materna directa es la que resulta de complicaciones obstétricas del embarazo, parto o puerperio, o de intervenciones, omisiones o tratamientos incorrectos relacionados con ellas.",wrong:{A:"Esta definición corresponde a la muerte materna indirecta, por enfermedad preexistente agravada por el embarazo.",B:"Esta definición corresponde a la muerte materna incidental o no relacionada, no a la muerte materna directa.",C:"Esta es la definición general de muerte materna (cualquier causa), no la definición específica de muerte materna directa."}},
{id:47,area:"GO",q:"Con respecto al riego sanguíneo del útero, es correcto afirmar que:",opts:[["A","Las arteriolas basales responden a influencias hormonales"],["B","Las arterias espirales irrigan la capa funcional del endometrio"],["C","Las arterias arqueadas dan origen a la arteria tubárica"],["D","La arteria fúndica ingresa al ligamento ancho a través del ligamento infundíbulo pélvico"]],ans:"B",exp:"Las arterias espirales, a diferencia de las basales (que no responden a hormonas), irrigan la capa funcional del endometrio y son sensibles a los cambios del ciclo.",wrong:{A:"Las arteriolas basales, a diferencia de las espirales, no responden a estímulos hormonales del ciclo.",C:"La arteria tubárica se origina de la rama ascendente de la arteria uterina, no directamente de las arterias arqueadas.",D:"Es la arteria ovárica la que ingresa al ligamento ancho por el ligamento infundíbulo pélvico, no la rama fúndica uterina."}},
{id:48,area:"GO",q:"Se define distocia dinámica:",opts:[["A","Conjunto de alteraciones de la estática fetal que impide el progreso del trabajo de parto"],["B","Alteración de la forma, dimensión o inclinación de la pelvis materna que dificulta o imposibilita el trabajo de parto"],["C","Conjunto de alteraciones, frecuencias, intensidad, regularidad de las contracciones uterinas que interfieren en la progresión normal del parto"],["D","Alteración de los tejidos blandos que participan en el trabajo de parto y cuya disfunción anatomo estructural dificulta el trabajo de parto normal"]],ans:"C",exp:"La distocia dinámica se define por alteraciones en la frecuencia, intensidad o regularidad de las contracciones uterinas que interfieren con el progreso normal del parto.",wrong:{A:"Esta descripción corresponde a la distocia de presentación o estática fetal, no a la dinámica.",B:"Esta descripción corresponde a la distocia ósea (pelvis estrecha), no a la distocia dinámica.",D:"Esta descripción corresponde a la distocia de partes blandas, no a la alteración de la contractilidad uterina."}},
{id:49,area:"GO",q:"Con relación a la Restricción del Crecimiento Intrauterino Asimétrico, es correcto afirmar que:",opts:[["A","El agente causal aparece de forma inicial, con decremento relativo en el número y tamaño de las células"],["B","Crecimiento proporcional entre la cabeza, huesos largos y abdomen fetal"],["C","La exposición química afecta proporcionalmente el tamaño de cabeza y cuerpo"],["D","El agente causal aparece de forma tardía, influyendo en el tamaño de las células no en su número"]],ans:"D",exp:"En la restricción de crecimiento intrauterino asimétrica, el agente causal actúa tardíamente en la gestación, afectando más el tamaño celular que el número total de células (efecto de \"ahorro cerebral\").",wrong:{A:"Un agente que actúa desde el inicio, reduciendo número y tamaño celular, define la RCIU simétrica, no la asimétrica.",B:"El crecimiento proporcional entre segmentos es característico de la RCIU simétrica, no de la asimétrica.",C:"Una afectación proporcional de cabeza y cuerpo corresponde al patrón simétrico, no al asimétrico, donde se preserva la cabeza."}},
{id:50,area:"GO",q:"El virus Zika es de transmisión sexual. ¿Hasta cuántos meses puede permanecer el virus en el semen, luego de la aparición de los síntomas?",opts:[["A","3 meses"],["B","6 meses"],["C","9 meses"],["D","12 meses"]],ans:"B",exp:"Se ha documentado persistencia del virus Zika en semen hasta 6 meses después del inicio de síntomas, lo que fundamenta las recomendaciones de prevención de transmisión sexual por ese período.",wrong:{A:"Subestima el período; se ha documentado persistencia viral en semen más allá de los 3 meses.",C:"Sobreestima el tiempo; la evidencia respalda hasta 6 meses, no 9.",D:"Sobreestima ampliamente el período de persistencia documentado del virus en semen."}},
{id:51,area:"GO",q:"Los loquios, durante los primeros días después del parto, la sangre los tiñe de color rojo y se conocen como lochia:",opts:[["A","Rubra"],["B","Serosa"],["C","Alba"],["D","Mucosa"]],ans:"A",exp:"Los loquios de los primeros días, teñidos de sangre roja, se denominan lochia rubra.",wrong:{B:"La lochia serosa aparece después, entre el 4º y 10º día, con tono más pálido, no en los primeros días.",C:"La lochia alba es la fase más tardía, de color blanco-amarillento, no la del inicio del puerperio.",D:"Mucosa no corresponde a ninguna de las fases clásicas de clasificación de los loquios."}},
{id:52,area:"GO",q:"Es característico de la Hiperemesis Gravídica la siguiente afirmación:",opts:[["A","Cinco vómitos diarios"],["B","Náuseas persistentes, con poca tolerancia oral"],["C","Vómitos continuos, con o sin cambios de peso corporal"],["D","Trastornos hidroelectrolíticos"]],ans:"D",exp:"Los trastornos hidroelectrolíticos son una manifestación característica y clínicamente relevante de la hiperemesis gravídica grave, secundarios a los vómitos persistentes.",wrong:{A:"Un número fijo de episodios no define la hiperemesis; lo relevante es la repercusión metabólica, no la cifra exacta.",B:"Esto describe náuseas y vómitos leves del embarazo, no la forma grave con repercusión sistémica de la hiperemesis.",C:"La sola presencia de vómitos sin especificar la repercusión hidroelectrolítica no distingue la hiperemesis de las náuseas comunes del embarazo."}},
{id:53,area:"GO",q:"Las suturas compresivas en el útero para controlar la hemorragia por atonía puerperal intensa, que comprende la colocación de puntos de sutura con material reabsorbible, es conocido como puntos de:",opts:[["A","B-Lynch"],["B","Mc Leon"],["C","Schwarcz"],["D","B Bling"]],ans:"A",exp:"Las suturas de compresión uterina con material reabsorbible para atonía puerperal grave se conocen como puntos de B-Lynch.",wrong:{B:"Mc Leon no es un epónimo reconocido de sutura compresiva uterina para atonía.",C:"Schwarcz es un epónimo asociado a la monitorización obstétrica, no a las suturas compresivas uterinas.",D:"B Bling no corresponde a ninguna técnica descrita de sutura compresiva uterina."}},
{id:54,area:"GO",q:"Para el diagnóstico de la diabetes gestacional, se solicita glucemia basal en la primera consulta prenatal. Si la misma es menor a 92 mg/dL, se indica:",opts:[["A","Test de Tolerancia a la Glucosa (TTOG) entre las 24-28 semanas de gestación"],["B","Repetir la Glucemia basal dentro de los 7 días para asumir el diagnóstico de Diabetes Gestacional"],["C","Confirmar con una segunda Glucemia en ayunas o con una TTOG dentro de los 7 días"],["D","Remitir al especialista para iniciar tratamiento y monitoreo de glicemia"]],ans:"A",exp:"Si la glucemia basal en la primera consulta prenatal es menor a 92 mg/dL, se indica realizar la prueba de tolerancia a la glucosa (TTOG) entre las semanas 24 y 28.",wrong:{B:"Repetir la glucemia no está indicado cuando el valor basal es normal (<92 mg/dL); ese abordaje aplica a valores diagnósticos.",C:"La confirmación inmediata solo se requiere ante valores alterados; con <92 mg/dL se difiere la evaluación a la TTOG de las 24-28 semanas.",D:"Remitir para tratamiento inmediato no corresponde, ya que una glucemia basal <92 mg/dL no confirma diabetes gestacional."}},
{id:55,area:"GO",q:"La Infección Puerperal se define como: proceso infeccioso de origen obstétrico, que ocurre",opts:[["A","Dentro de las primeras 24 horas, del nacimiento"],["B","Entre el 2do y 10mo día del nacimiento"],["C","Entre los 45 y 60 días después del nacimiento"],["D","Entre los 61 y 90 días después del nacimiento"]],ans:"B",exp:"La infección puerperal se define como el proceso infeccioso de origen obstétrico que ocurre entre el 2º y 10º día posteriores al nacimiento.",wrong:{A:"Las primeras 24 horas son demasiado tempranas; el criterio temporal exige entre el 2º y 10º día.",C:"45 a 60 días excede el periodo puerperal definido para esta infección.",D:"61 a 90 días está muy fuera de la ventana temporal que define la infección puerperal."}},
{id:56,area:"GO",q:"Hablamos de Shock hipovolémico moderado cuando:",opts:[["A","Hay una pérdida de volumen mayor a 35%, sensorio: letárgica, palidez, frialdad, sudoración. Pulso mayor a 120 por minuto, presión sistólica menor a 70 mmHg"],["B","Pérdida de volumen entre 1500 a 2000 ml, sensorio: agitada, palidez, frialdad, sudoración, pulso 101 a 120 por minuto, presión sistólica entre 70 a 90 mmHg"],["C","Pérdida de volumen de 1000 a 1500 ml., sensorio: normal y/o agitada, palidez, frialdad, Pulso de 91 a 100 por minuto, presión sistólica 80 a 90 mmHg"],["D","Pérdida de volumen de 500 a 1000 ml., sensorio normal, perfusión normal, pulso 60 – 90 por minuto, presión sistólica mayor a 90 mmHg"]],ans:"B",exp:"Una pérdida de volumen de 1500 a 2000 mL, con taquicardia moderada (101-120 lpm) y presión sistólica entre 70-90 mmHg, corresponde a shock hipovolémico moderado.",wrong:{A:"Esta descripción corresponde al shock hipovolémico grave (pérdida >35%, PAS <70 mmHg), no al moderado.",C:"Esta descripción corresponde al shock hipovolémico leve, con menor pérdida de volumen y mejor perfusión.",D:"Esta descripción corresponde a una pérdida leve o compensada, con signos vitales prácticamente normales."}},
{id:57,area:"GO",q:"La Fase 3 del trabajo de parto activo posee tres etapas. Las mismas son:",opts:[["A","Etapa de relajación uterina y Etapa de contracción uterina"],["B","Etapa de borramiento y dilatación, etapa de separación de la placenta y etapa de descenso fetal"],["C","Etapa de dilatación y borramiento, etapa de expulsión fetal y etapa de separación de la placenta"],["D","Etapa de descenso de la cabeza fetal, etapa de rotación de cabeza fetal y etapa de alumbramiento"]],ans:"C",flag:1,exp:"Las tres etapas descritas para esta fase del parto activo corresponden a dilatación y borramiento, expulsión fetal, y separación/alumbramiento de la placenta.",wrong:{A:"Relajación y contracción uterina son fenómenos fisiológicos continuos, no las tres etapas descritas de esta fase.",B:"El borramiento y la dilatación corresponden a la fase 1, no a las etapas de la fase 3 del trabajo de parto activo.",D:"Estos son mecanismos del descenso y rotación cefálica, no las tres etapas que definen la fase 3 del parto activo."}},
{id:58,area:"GO",q:"La citocina implicada en el metabolismo de lípidos que también ayuda a regular el crecimiento fetal se denomina:",opts:[["A","Relaxina"],["B","Progesterona"],["C","Adiponectina"],["D","Creatina"]],ans:"C",exp:"La adiponectina es la citocina derivada del tejido adiposo implicada en el metabolismo lipídico que también participa en la regulación del crecimiento fetal.",wrong:{A:"La relaxina actúa sobre el tejido conectivo y el cérvix, no es la citocina reguladora del metabolismo lipídico descrita.",B:"La progesterona es una hormona esteroidea gestacional, no una citocina del metabolismo lipídico.",D:"La creatina es un metabolito energético muscular, no una citocina reguladora del crecimiento fetal."}},
{id:59,area:"GO",q:"Usted tiene una paciente con gestación de 10 semanas. Consulta por dolor en hipogastrio. Al examen físico se constata el cuello uterino reblandecido, sin modificaciones. Se realiza ecografía de urgencia y se constata saco gestacional compatible con 9 semanas sin actividad embriocárdica presente. Su diagnóstico es:",opts:[["A","Aborto incompleto"],["B","Connato de aborto"],["C","Aborto en curso"],["D","Aborto diferido"]],ans:"D",exp:"Un saco gestacional sin actividad cardíaca embrionaria, con cuello uterino sin modificaciones y sin expulsión de tejido, corresponde a un aborto diferido (retenido).",wrong:{A:"El aborto incompleto implica expulsión parcial de restos ovulares, no descrita en este cuadro.",B:"El conato de aborto (amenaza) cursa con embrión viable; aquí no hay actividad cardíaca embrionaria.",C:"El aborto en curso presenta modificaciones cervicales activas; aquí el cuello está sin modificaciones."}},
{id:60,area:"GO",q:"En el Síndrome de Klinefelter:",opts:[["A","Ocurre 1 de cada 600 lactantes masculinos"],["B","El cromosoma X sobrante es exclusivamente de origen materno"],["C","No guarda relación con la edad materna"],["D","La ginecomastia es una característica típica"]],ans:"D",exp:"La ginecomastia es un hallazgo clínico típico y frecuente del síndrome de Klinefelter (47,XXY).",wrong:{A:"La incidencia real citada no corresponde a la reportada para el síndrome de Klinefelter en estas fuentes.",B:"El cromosoma X adicional puede tener origen tanto materno como paterno, no es exclusivamente materno.",C:"Sí existe relación con la edad materna avanzada, asociada a mayor riesgo de no disyunción cromosómica."}},
{id:61,area:"SP",q:"Cuando nos referimos al número de defunciones (D) ocurridas en un año dado y que fueron registradas por el Sistema de Estadísticas Vitales del Ministerio de Salud en relación a cada 1.000 habitantes, nos estamos refiriendo al concepto de:",opts:[["A","Razón bruta de Mortalidad ajustada"],["B","Tasa bruta de Mortalidad general"],["C","Tasa bruta de Mortalidad global ajustada"],["D","Razón bruta de Mortalidad ajustada"],["E","Razón bruta de Mortalidad general"]],ans:"B",exp:"La tasa bruta de mortalidad general expresa el número de defunciones por cada 1.000 habitantes en un período determinado, sin ajustar por estructura etaria.",wrong:{A:"Emplea el término 'razón' en vez de 'tasa', y agrega 'ajustada' cuando el indicador descrito es crudo, sin ajuste.",C:"El indicador descrito es la tasa bruta, no ajustada; 'ajustada' correspondería a una tasa estandarizada por edad.",D:"Repite el error de la opción A: usa 'razón' en lugar de 'tasa' y agrega 'ajustada' sin corresponder al indicador crudo.",E:"Usa 'razón' en lugar de 'tasa'; una razón no relaciona el evento con la población expuesta en un período de tiempo como esta medida."}},
{id:62,area:"SP",q:"Respecto al porcentaje de Nacidos Vivos por Tipo de Parto en Paraguay, la proporción de partos por vía cesárea durante el 2018, fue de:",opts:[["A","50,9"],["B","50,3"],["C","51,5"],["D","51,3"],["E","51,6"]],ans:"A",flag:1,exp:"Según los datos oficiales de Paraguay para 2018, la proporción de nacidos vivos por cesárea fue de aproximadamente 50,9%.",wrong:{B:"Subestima ligeramente el porcentaje real de cesáreas registrado en 2018, que fue mayor a esta cifra.",C:"Sobrestima el porcentaje real de partos por cesárea reportado para el año 2018.",D:"Es una cifra ligeramente superior a la reportada oficialmente para el año 2018.",E:"Es la cifra más alejada del valor real, sobrestimando notablemente la proporción de cesáreas de 2018."}},
{id:63,area:"SP",q:"De acuerdo a los tipos de vigilancia que se establecen en la Guía Nacional de Vigilancia y Control de Enfermedades, la vigilancia centinela es:",opts:[["A","Aquella que se emplea en caso de brotes o ante eventos que exigen sumar recursos adicionales a las actividades rutinarias de vigilancia"],["B","Aquella que se trata de estudios epidemiológicos que se realizan periódicamente para vigilar tendencias de eventos"],["C","Aquella en la cual todas las personas que residen o visitan el país, de cualquier edad y sexo, y que consultan en un establecimiento de salud por algún evento de notificación obligatoria, tiene la oportunidad de ser notificado al sistema"],["D","Aquella que añade especificidad y complementa la vigilancia clínica, aportando los diagnósticos de agentes etiológicos, reservorios, vectores y fuentes de contaminación"],["E","Aquella que se realiza para medir comportamientos específicos de acuerdo a cada evento y al objetivo buscado. Se puede realizar en una localidad o en establecimientos de salud"]],ans:"D",exp:"La vigilancia centinela se realiza en sitios seleccionados que aportan información más específica (agentes etiológicos, reservorios, vectores), complementando a la vigilancia clínica de rutina.",wrong:{A:"Describe la vigilancia intensificada o de brotes, que se activa ante eventos inusuales, no la vigilancia centinela.",B:"Corresponde a la vigilancia de tendencias mediante estudios periódicos, no a la vigilancia centinela basada en sitios seleccionados.",C:"Define la vigilancia universal, donde todo caso puede notificarse, justo lo opuesto al muestreo en sitios centinela.",E:"Describe la vigilancia de comportamientos específicos, un tipo distinto orientado a conductas y no a agentes etiológicos."}},
{id:64,area:"SP",q:"En Paraguay, las causas más frecuentes de defunciones en general en el 2018, son:",opts:[["A","Las enfermedades del sistema respiratorio"],["B","Las enfermedades del sistema circulatorio"],["C","Los tumores"],["D","Las causas externas"],["E","Las enfermedades transmisibles"]],ans:"B",exp:"Las enfermedades del sistema circulatorio son la principal causa de mortalidad general en Paraguay, patrón consistente con la mayoría de los países de la región.",wrong:{A:"Las enfermedades respiratorias ocupan un lugar relevante pero no son la primera causa de mortalidad general del país.",C:"Los tumores representan la segunda causa de muerte en Paraguay, por debajo de las enfermedades circulatorias.",D:"Las causas externas (accidentes, violencia) no encabezan las estadísticas de mortalidad general del país.",E:"Las enfermedades transmisibles han disminuido su peso relativo y no son la principal causa de muerte en Paraguay."}},
{id:65,area:"SP",q:"La Atención Primaria en Salud es una estrategia que tiene las siguientes características:",opts:[["A","Aborda la salud como derecho humano, territorio social definido, representa el inicio de un proceso permanente de asistencia sanitaria"],["B","Está basada en ocasiones, al trabajo en equipo, utiliza tecnología de alto nivel y costosas"],["C","Sus actuaciones son impredecibles, no se programan las actividades, no articula ni coordina intervenciones con otros sectores e instituciones"],["D","Se entiende al sistema de salud como parte del desarrollo cultural, aunque la participación de la comunidad no se considera importante"],["E","Estimula la participación comunitaria, aunque no considera sus opiniones, y considera el control social innecesario"]],ans:"A",exp:"La Atención Primaria de Salud aborda la salud como derecho humano dentro de un territorio social definido, siendo la puerta de entrada a un proceso continuo de atención.",wrong:{B:"La APS se basa en tecnología apropiada y de bajo costo, no en tecnología costosa y de alto nivel.",C:"Contradice la naturaleza programada y coordinada de la APS, que sí articula intervenciones con otros sectores.",D:"Contradice un pilar central de la APS: la participación comunitaria activa es fundamental, no irrelevante.",E:"Contradice el enfoque de la APS, que valora el control social y las opiniones de la comunidad como esenciales."}},
{id:66,area:"SP",q:"Es una herramienta de abordaje para ver y transformar la realidad, para crear capacidades nuevas, empoderarse colectivamente y generar los cambios y así dar respuesta a las necesidades de la gente, que permite materializar la responsabilidad social y sanitaria de los equipos de salud de la familia haciendo posible ordenar la acción y planificar en base a las necesidades detectadas en la zona. Lo anterior define a:",opts:[["A","Universalidad"],["B","Territorialización"],["C","Georreferencia"],["D","Promoción de salud"],["E","Educación para la salud"]],ans:"B",exp:"La territorialización es la herramienta que permite planificar y actuar sobre la salud según las necesidades detectadas en un territorio social específico.",wrong:{A:"La universalidad es un principio de cobertura para todos, no la herramienta de planificación territorial descrita.",C:"La georreferencia es solo una técnica de ubicación espacial, no la estrategia integral de empoderamiento descrita.",D:"La promoción de salud es un proceso más amplio de capacitación poblacional, no la herramienta de planificación territorial en sí.",E:"La educación para la salud se centra en el aprendizaje individual o grupal, no en la planificación basada en el territorio."}},
{id:67,area:"SP",q:"El proceso de dispensarización está regido por los siguientes principios, entre otros:",opts:[["A","Profiláctico, dinámico, continuo, individualizado"],["B","Discontinuo, vulnerable, profiláctico"],["C","Universal, discontinuo, individualizado"],["D","Atención en equipo, atención individual, profiláctico"],["E","Discontinuo, profiláctico, universal, individualizado"]],ans:"A",exp:"Los principios de la dispensarización incluyen ser profiláctico, dinámico, continuo e individualizado, característicos del modelo de atención por riesgo.",wrong:{B:"Discontinuo contradice el principio central de continuidad que define a la dispensarización.",C:"Introduce 'discontinuo', que contradice el carácter continuo y permanente propio del proceso de dispensarización.",D:"Mezcla modalidades de atención (en equipo, individual) con un solo principio, sin corresponder a los cuatro principios reales.",E:"Nuevamente introduce 'discontinuo', opuesto al principio de continuidad que caracteriza a la dispensarización."}},
{id:68,area:"SP",q:"Cuando hay coexistencia en un determinado país (o territorio) de servicios de salud dependientes del mismo o de distintos subsistemas, que actúan sin la necesaria coordinación y/o integración se denomina:",opts:[["A","Fragmentación"],["B","Segmentación"],["C","Integración"],["D","Desintegración"],["E","Fraccionamiento"]],ans:"A",exp:"La fragmentación describe la coexistencia de servicios de salud de distintos subsistemas que actúan sin coordinación entre sí.",wrong:{B:"Segmentación se refiere a la existencia de subsistemas según capacidad de pago, no a la falta de coordinación entre ellos.",C:"Integración es el concepto opuesto: implica coordinación entre servicios, no su coexistencia desarticulada.",D:"Desintegración no es el término técnico usado en salud pública para describir esta falta de coordinación entre subsistemas.",E:"Fraccionamiento no es el término técnico estándar empleado para describir la coexistencia desarticulada de servicios."}},
{id:69,area:"SP",q:"Las Funciones Esenciales en Salud Pública son:",opts:[["A","Un conjunto de acciones sectoriales que deben ser realizadas, para la gestión medianamente mejorada de las poblaciones, en materia de salud pública"],["B","Referidos a la salud pública como disciplina académica con todos sus componentes"],["C","Procesos y movimientos que permiten un buen desempeño, solo en el área administrativa estatal de la salud pública"],["D","Son condiciones estructurales de desarrollo de políticas institucionales y locales que permiten un desempeño aceptable en el área"],["E","Las competencias y acciones necesarias por parte de los sistemas de salud para alcanzar su objetivo central que es el mejorar la salud de las poblaciones"]],ans:"E",exp:"Las Funciones Esenciales de Salud Pública son las competencias y acciones necesarias de los sistemas de salud para lograr su objetivo central: mejorar la salud de la población.",wrong:{A:"Es una descripción vaga e imprecisa ('gestión medianamente mejorada'), no la definición formal de las FESP.",B:"Confunde las FESP con la salud pública como disciplina académica, cuando son competencias operativas del sistema.",C:"Restringe incorrectamente las FESP solo al área administrativa estatal, cuando abarcan todo el sistema de salud.",D:"Describe condiciones estructurales previas, un componente parcial, no la definición completa de las FESP."}},
