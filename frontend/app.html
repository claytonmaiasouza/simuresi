{id:70,area:"SP",q:"Dentro de las 11 Funciones Esenciales en Salud Pública existe una que es la de elaborar leyes y otras normas mediante las cuales los Estados (y otros actores, por ejemplo, las corporaciones profesionales) tratan de influir en los comportamientos de los distintos agentes que constituyen el Sistema de Salud, nos referimos a:",opts:[["A","El monitoreo, la evaluación y el análisis del estado de salud de la población"],["B","La vigilancia, la investigación y el control de los riesgos y las amenazas para la salud pública"],["C","El acceso equitativo a servicios de salud"],["D","La participación social en la salud"],["E","La formulación de políticas y la regulación sanitaria"]],ans:"E",exp:"La formulación de políticas y la regulación sanitaria es la FESP relacionada con elaborar leyes y normas para influir en el comportamiento de los actores del sistema de salud.",wrong:{A:"Corresponde a la FESP 1 (monitoreo y análisis del estado de salud), no a la elaboración de leyes y normas.",B:"Corresponde a la FESP 2 (vigilancia, investigación y control de riesgos), distinta de elaborar leyes y normas.",C:"Corresponde a la FESP 7 (acceso equitativo a servicios), no a la función regulatoria y normativa descrita.",D:"Corresponde a la FESP 4 (participación social), centrada en la ciudadanía y no en la regulación sanitaria."}},
{id:71,area:"SP",q:"Para lograr una mejora en la salud de la población, es necesario basarse en algunos pre requisitos básicos a tener en cuenta, que son:",opts:[["A","La paz, educación, vivienda, alimentación, justicia social"],["B","El ecosistema inestable, la injusticia social, equidad"],["C","La edad, la raza y el territorio, el género"],["D","El género, alimentación, ecosistema inestable"],["E","La universalidad, el territorio, inequidad, justicia social"]],ans:"A",exp:"La Carta de Ottawa establece como prerrequisitos para la salud: la paz, la educación, la vivienda, la alimentación, la renta, un ecosistema estable, la justicia social y la equidad.",wrong:{B:"Invierte los conceptos: la Carta de Ottawa exige ecosistema estable y justicia social, no inestabilidad e injusticia.",C:"Edad, raza y género son variables sociodemográficas, no los prerrequisitos para la salud definidos en Ottawa.",D:"Mezcla un prerrequisito válido (alimentación) con 'ecosistema inestable', ajeno y contrario a la lista real de Ottawa.",E:"Incluye 'inequidad', contrario al prerrequisito real que es precisamente la equidad."}},
{id:72,area:"SP",q:"La Tasa Global de Fecundidad estimada en año 2018 fue de:",opts:[["A","2,2 hijos por mujer"],["B","3,1 hijos por mujer"],["C","3,9 hijos por mujer"],["D","2,5 hijos por mujer"],["E","2,8 hijos por mujer"]],ans:"D",flag:1,exp:"La Tasa Global de Fecundidad estimada para Paraguay en 2018 fue de aproximadamente 2,5 hijos por mujer.",wrong:{A:"Subestima la tasa global de fecundidad real estimada para Paraguay en 2018.",B:"Sobrestima considerablemente la tasa de fecundidad estimada para el país en 2018.",C:"Corresponde a un valor mucho más alto que el estimado real, propio de décadas anteriores.",E:"Es una cifra cercana pero superior al valor oficial estimado para 2018."}},
{id:73,area:"SP",q:"En la conferencia de Ottawa, el compromiso a favor de la promoción de la salud que realizaron los participantes fue:",opts:[["A","Apoyar las presiones que se ejerzan para favorecer los productos dañinos, los medios y condiciones de vida malsanos, la mala nutrición"],["B","Contemplar si existe contaminación, riesgos profesionales, la vivienda y la deforestación"],["C","Aumentar las diferencias entre las distintas sociedades y en el interior de las mismas, y a tomar medidas contra la igualdad"],["D","Apoyar y capacitar a los individuos, sus familias y comunidad que se mantengan en buen estado de salud"],["E","Reorientar los servicios sanitarios y sus recursos en términos del modo hospitalocentrismo"]],ans:"D",exp:"En la Carta de Ottawa, el compromiso de promoción de la salud incluye apoyar y capacitar a individuos, familias y comunidades para mantenerse en buen estado de salud.",wrong:{A:"Contradice el espíritu de Ottawa, que busca contrarrestar, no apoyar, las presiones hacia productos y hábitos dañinos.",B:"Describe un ítem de diagnóstico ambiental, no un compromiso de acción promovido por la Carta de Ottawa.",C:"Contradice directamente el objetivo de Ottawa de reducir, no aumentar, las diferencias e inequidades sociales.",E:"Ottawa propone alejarse del hospitalocentrismo y reorientar servicios hacia la promoción, no reforzar ese modelo."}},
{id:74,area:"SP",q:"Para conocer la situación-problema es conveniente usar técnicas de investigación sencillas que nos brinden datos confiables. Para conocer sobre las creencias, preocupaciones, dudas, miedos, y comportamientos. Indique cuál es la técnica más adecuada.",opts:[["A","Encuestas de opinión"],["B","Estudio histórico"],["C","Censo comunitario"],["D","Estudio longitudinal"],["E","Grupos focales"]],ans:"E",exp:"Los grupos focales son la técnica más adecuada para explorar creencias, preocupaciones, dudas, miedos y comportamientos de una comunidad.",wrong:{A:"Las encuestas de opinión recogen datos más estructurados y cuantitativos, menos aptos para explorar miedos y creencias en profundidad.",B:"El estudio histórico analiza eventos pasados documentados, no las percepciones actuales de la comunidad.",C:"El censo comunitario recolecta datos demográficos y de cobertura, no creencias ni comportamientos subjetivos.",D:"El estudio longitudinal sigue variables en el tiempo, no está diseñado para explorar percepciones cualitativas puntuales."}},
{id:75,area:"SP",q:"Algunos Principios rectores de la Política Nacional de Niñez y Adolescencia 2014-2024 (POLNA) son:",opts:[["A","Individualidad, desigualdad, inequidad"],["B","Se promueve respeto a la diversidad, desigualdad, ingobernabilidad"],["C","Supervivencia y desarrollo, no hace falta la participación, individualidad en las acciones"],["D","Poca exigibilidad de derechos, supervivencia, desarrollo, inequidad"],["E","Interés superior del niño/a, participación protagónica, gobernabilidad"]],ans:"E",exp:"Entre los principios rectores de la POLNA 2014-2024 se destacan el interés superior del niño/a y la participación protagónica de niños y adolescentes.",wrong:{A:"Individualidad, desigualdad e inequidad son antivalores, opuestos a los principios rectores de la POLNA.",B:"Desigualdad e ingobernabilidad contradicen los principios de equidad y gobernabilidad que sustenta la POLNA.",C:"Afirmar que 'no hace falta la participación' contradice el principio de participación protagónica de niños y adolescentes.",D:"La poca exigibilidad de derechos contradice el enfoque de derechos que caracteriza a la POLNA."}},
{id:76,area:"SP",q:"De entre las siguientes vacunas indique cuáles son las que debemos indicar en el embarazo, según la norma de cuidados preconcepcionales, prenatal, parto y puerperio, seguro e inclusivo:",opts:[["A","Td (antitetánica antidiftérica), o Tdpa (Tétanos, Difteria, Tos Ferina) y anti influenza"],["B","Td (antitetánica antidiftérica), anti rubéola"],["C","Antitetánica, anti hepatitis B"],["D","Antirubéola y anti hepatitis B"],["E","Tdpa, anti rubéola, anti SARS-CoV2"]],ans:"A",exp:"En el embarazo se recomienda la vacuna Td o Tdpa (tétanos, difteria, tos ferina) y la antigripal, según la norma nacional de cuidados prenatales.",wrong:{B:"Incluye anti rubéola, vacuna de virus vivo atenuado contraindicada durante el embarazo.",C:"No es la vacuna estándar priorizada por la norma nacional de cuidados prenatales para toda embarazada.",D:"Incluye antirubéola, contraindicada en el embarazo por tratarse de una vacuna de virus vivo.",E:"Incluye anti rubéola, contraindicada por ser vacuna viva atenuada, y omite la antigripal recomendada."}},
{id:77,area:"SP",q:"La Encuesta Global de Salud Escolar (GSHS) de Paraguay fue realizada por la Organización Panamericana de la Salud/Organización Mundial de la Salud (OPS/OMS). En este estudio la proporción de estudiantes que han tenido relaciones sexuales alguna vez en su vida es de:",opts:[["A","30,1%"],["B","39,0%"],["C","21,5%"],["D","28,6%"],["E","44,2%"]],ans:"C",flag:1,exp:"Según la Encuesta Global de Salud Escolar (GSHS) de Paraguay, la proporción de estudiantes que refirió haber tenido relaciones sexuales alguna vez fue de aproximadamente 21,5%.",wrong:{A:"Sobrestima la proporción real reportada por la encuesta GSHS en estudiantes paraguayos.",B:"Es la cifra más alejada por exceso del dato real reportado en la encuesta GSHS de Paraguay.",D:"Sobrestima ligeramente el porcentaje real registrado por la encuesta GSHS.",E:"Corresponde a un valor muy superior al reportado realmente por la encuesta GSHS en Paraguay."}},
{id:78,area:"SP",q:"Según la clasificación de los estudios epidemiológicos, los ensayos preventivos corresponden a un determinado tipo de estudio:",opts:[["A","Ensayos clínicos"],["B","Ensayos comunitarios"],["C","Ecológico"],["D","Ensayo de Intervención"],["E","Observacionales"]],ans:"B",flag:1,exp:"Los ensayos preventivos, realizados en poblaciones sanas a nivel comunitario, se clasifican como ensayos comunitarios dentro de los estudios epidemiológicos experimentales.",wrong:{A:"Los ensayos clínicos se realizan en pacientes individuales, no en poblaciones sanas a nivel comunitario.",C:"El estudio ecológico es observacional y usa datos agregados, no es un tipo de ensayo experimental preventivo.",D:"'Ensayo de Intervención' es un término genérico que incluye tanto ensayos clínicos como comunitarios, no la categoría específica pedida.",E:"Los estudios observacionales no involucran intervención activa, a diferencia de los ensayos preventivos."}},
{id:79,area:"SP",q:"Los valores de la Política Nacional de Salud 2015 – 2030, son:",opts:[["A","Derecho a la salud, Equidad, solidaridad, respeto a la diversidad"],["B","Intersectorialidad, equidad, solidaridad, respeto a la diversidad"],["C","Eficiencia, responsabilidad, respeto a la diversidad, eficiencia"],["D","Derecho a la salud, responsabilidad, respeto a la diversidad, eficiencia"],["E","Eficiencia, equidad, intersectorialidad, respeto a la diversidad"]],ans:"A",exp:"Los valores de la Política Nacional de Salud 2015-2030 incluyen el derecho a la salud, la equidad, la solidaridad y el respeto a la diversidad.",wrong:{B:"La intersectorialidad es un principio o estrategia de la política, no figura entre sus valores centrales listados.",C:"La eficiencia y la responsabilidad no figuran entre los valores fundamentales de la política, que priorizan derecho y equidad.",D:"Sustituye solidaridad y equidad por responsabilidad y eficiencia, que no son los valores explícitos de la política.",E:"Omite el derecho a la salud, valor central y explícito de la Política Nacional de Salud 2015-2030."}},
{id:80,area:"SP",q:"Dentro de la Ley 1032/96, el organismo responsable del financiamiento del sistema es:",opts:[["A","Superintendencia de Salud"],["B","Consejo Nacional de Salud"],["C","Fondo Nacional de Salud"],["D","Dirección Médica Nacional"],["E","Consejo Departamental de Salud"]],ans:"C",exp:"La Ley 1032/96 establece al Fondo Nacional de Salud como el organismo responsable del financiamiento del Sistema Nacional de Salud.",wrong:{A:"La Superintendencia de Salud cumple funciones de regulación y control, no de financiamiento del sistema.",B:"El Consejo Nacional de Salud tiene funciones de coordinación y rectoría, no de administración de los fondos.",D:"La Dirección Médica Nacional no existe como órgano de financiamiento en la estructura de la Ley 1032/96.",E:"El Consejo Departamental de Salud opera a nivel local descentralizado, no como organismo financiador del sistema nacional."}},
{id:"26f2-c1",area:"CIR",q:"¿Durante una reparación de hernia inguinal transabdominal preperitoneal (TAPP), se debe identificar estructuras críticas para evitar lesiones nerviosas y vasculares? El conocimiento de los límites anatómicos del \"triángulo del peligro\", el \"triángulo del dolor\" y el \"círculo de la muerte\" es vital para la colocación segura de grapas o tachuelas.¿Cuál de las siguientes opciones identifica correctamente los límites y el contenido de una de estas regiones críticas?",opts:[["A","El triángulo del dolor está bordeado medialmente por el conducto deferente y contiene los vasos ilíacos externos"],["B","El triángulo del peligro está bordeado medialmente por el conducto deferente y lateralmente por los vasos del cordón espermático"],["C","El triángulo del peligro contiene los nervios cutáneos femorales laterales y la rama femoral del nervio genitofemoral"],["D","El círculo de la muerte es una región nerviosa delimitada por el tracto iliopúbico y los vasos gonadales"]],ans:"B",exp:"El triángulo del peligro está limitado medialmente por el conducto deferente y lateralmente por los vasos del cordón espermático; contiene estructuras vasculares (vasos ilíacos) que deben evitarse al fijar grapas.",wrong:{A:"El triángulo del dolor está bordeado lateralmente por el tracto iliopúbico y contiene nervios, no los vasos ilíacos mediales.",C:"Los nervios cutáneo femoral lateral y genitofemoral pertenecen al triángulo del dolor, no al triángulo del peligro.",D:"El círculo de la muerte es una anastomosis vascular anómala entre los sistemas obturador e ilíaco, no una región nerviosa."}},
{id:"26f2-c2",area:"CIR",q:"¿Qué tipo de quemaduras provocan por lo general necrosis por coagulación?",opts:[["A","Químicas ácidas"],["B","Térmicas"],["C","Químicas alcalinas"],["D","Eléctricas"]],ans:"A",exp:"Las quemaduras químicas por ácidos producen típicamente necrosis por coagulación, que limita en cierta forma la penetración del agente, a diferencia de los álcalis que causan necrosis por licuefacción.",wrong:{B:"Las quemaduras térmicas producen necrosis por coagulación por acción directa del calor, sin el mecanismo cáustico específico de los ácidos.",C:"Las quemaduras alcalinas producen necrosis por licuefacción, no por coagulación, debido a la saponificación de las grasas tisulares.",D:"Las quemaduras eléctricas producen daño térmico profundo por efecto Joule, con necrosis variable, no coagulación como mecanismo distintivo."}},
{id:"26f2-c3",area:"CIR",q:"El riesgo de padecer un cáncer de estómago en el remanente gástrico posterior a una gastrectomía sub total, es mayor cuando la restitución del tránsito realizado fue:",opts:[["A","Gastroduodenostomía de Billroth I"],["B","Anastomosis Gastroyeyunal en Y de Roux"],["C","Interposición de asa yeyunal"],["D","Gastroenterostomía de Billroth II"]],ans:"D",exp:"Tras una gastrectomía subtotal con reconstrucción Billroth II, el remanente gástrico expuesto al reflujo biliopancreático tiene mayor riesgo de desarrollar cáncer a largo plazo.",wrong:{A:"La reconstrucción Billroth I mantiene el tránsito duodenal fisiológico, con menor exposición del remanente al reflujo biliar.",B:"La Y de Roux desvía el flujo biliopancreático lejos del remanente gástrico, reduciendo el riesgo de reflujo crónico y de cáncer.",C:"La interposición de asa yeyunal también limita el reflujo biliar directo hacia el remanente gástrico."}},
{id:"26f2-c4",area:"CIR",q:"¿Cuál es una característica de las alteraciones en el equilibrio de los líquidos en el paciente quirúrgico?",opts:[["A","El déficit de volumen intracelular es el trastorno de líquidos más común"],["B","La causa más común de déficit de volumen es la pérdida de líquidos a través del tracto gastrointestinal"],["C","Los déficits agudos muestran signos en los tejidos, como una disminución de la turgencia de la piel y ojos hundidos"],["D","La concentración sérica de sodio es el reflejo del estado del volumen"]],ans:"B",exp:"La pérdida de líquidos por el tracto gastrointestinal (vómitos, diarrea, sondas, fístulas) es la causa más común de déficit de volumen en el paciente quirúrgico.",wrong:{A:"El déficit de volumen extracelular, no el intracelular, es el trastorno de líquidos más frecuente en el paciente quirúrgico.",C:"Los signos tisulares de deshidratación aparecen en déficits crónicos, no en los agudos, donde predominan los signos hemodinámicos.",D:"El sodio sérico refleja la relación entre agua y soluto, no el volumen total, por lo que no es indicador fiable del volumen."}},
{id:"26f2-c5",area:"CIR",q:"¿Cuál de los siguientes trastornos esofágicos se podría mostrar mejor con una columna completa de bario?",opts:[["A","Pequeñas neoplasias esofágicas"],["B","Hernia hiatal pequeña paraesofágica"],["C","Várices esofágicas"],["D","Esofagitis leve"]],ans:"B",exp:"El esofagograma con columna completa de bario es particularmente útil para detectar hernias hiatales pequeñas, sobre todo las paraesofágicas, que pueden pasar desapercibidas con otras técnicas.",wrong:{A:"Las neoplasias pequeñas se detectan mejor con técnica de doble contraste (mucosa fina), no con columna completa de bario.",C:"Las várices esofágicas se visualizan mejor con técnica de mucosa fina o endoscopía, que la columna completa puede ocultar.",D:"La esofagitis leve requiere técnica de doble contraste o endoscopía para detectar cambios mucosos sutiles, no columna completa."}},
{id:"26f2-c6",area:"CIR",q:"¿Cuál es una característica de la Colangitis Esclerosante Primaria?",opts:[["A","Es por lo general una enfermedad autolimitada que no evoluciona a la cirrosis biliar secundaria"],["B","Puede ser consecuencia de cálculos del conducto biliar, colangitis aguda, cirugía biliar previa o agentes tóxicos"],["C","Se asocia frecuentemente con enfermedades autoinmunes como la tiroiditis de Riedel"],["D","Es una enfermedad infrecuente caracterizada por estenosis inflamatorias que afectan exclusivamente al árbol biliar intrahepático"]],ans:"C",exp:"La colangitis esclerosante primaria se asocia con otras enfermedades de base autoinmune, incluyendo entidades poco frecuentes como la tiroiditis de Riedel.",wrong:{A:"La colangitis esclerosante primaria es progresiva y frecuentemente evoluciona a cirrosis biliar y falla hepática, no es autolimitada.",B:"Esa descripción corresponde a la colangitis esclerosante secundaria, de causa identificable, no a la forma primaria idiopática.",D:"La colangitis esclerosante primaria afecta tanto la vía biliar intrahepática como la extrahepática, no exclusivamente la intrahepática."}},
{id:"26f2-c7",area:"CIR",q:"¿Durante una laparotomía exploradora por trauma abdominal, el cirujano identifica una laceración en el bazo? Al medir la profundidad de la lesión con respecto al parénquima, se determina que la herida tiene una profundidad de 2.5 cm. Siguiendo la escala de clasificación de lesiones esplénicas del AAST, ¿en qué grado debe categorizarse esta lesión específica?",opts:[["A","Grado I"],["B","Grado IV"],["C","Grado II"],["D","Grado III"]],ans:"C",exp:"Según la escala AAST, una laceración esplénica de 1-3 cm de profundidad de parénquima corresponde a grado II.",wrong:{A:"El grado I corresponde a laceraciones menores a 1 cm de profundidad de parénquima, menos extensas que la descrita.",B:"El grado IV corresponde a laceraciones con desvascularización mayor al 25% del bazo o afectación de vasos hiliares, más grave que 2.5 cm.",D:"El grado III corresponde a laceraciones de más de 3 cm de profundidad, mayor a la medida descrita en el caso."}},
{id:"26f2-c8",area:"CIR",q:"Paciente de sexo femenino, de 70 años, fue sometida a una cirugía de colectomía derecha extendida por un cáncer en la flexura hepática del colon. En los estudios pre operatorio y en el acto quirúrgico no se constataron metástasis a distancia y la anatomía patológica de la pieza operatoria informa que el tumor invade la muscularis propia y la presencia de tres ganglios linfáticos regionales positivos. ¿En qué estadificación TNM se encuentra la paciente?",opts:[["A","T1 N1a M0"],["B","T2 N1b M0"],["C","T3 N1c M0"],["D","T4 N1c M0"]],ans:"B",exp:"Invasión de la muscular propia (T2) con 3 ganglios regionales positivos (N1b, 1-3 ganglios) y sin metástasis a distancia (M0) corresponde al estadio T2 N1b M0.",wrong:{A:"T1 implica invasión limitada a submucosa, no a la muscular propia; N1a corresponde a un solo ganglio positivo, no a tres.",C:"T3 implica invasión a través de la muscular propia hacia la subserosa, más profunda que la descrita en el caso.",D:"T4 implica invasión de la serosa o estructuras adyacentes, hallazgo no descrito en este caso."}},
{id:"26f2-c9",area:"CIR",q:"¿Cuál de las siguientes afirmaciones es correcta con respecto al íleo biliar?",opts:[["A","Los cálculos proximales pueden impactar en el píloro o en el duodeno proximal y provocar una obstrucción de la salida gástrica (síndrome de Bouveret)"],["B","La valoración ecográfica es muy sensible y específica para el íleo biliar y ayuda a determinar la ubicación de la obstrucción"],["C","El íleo por cálculo biliar puede ocurrir cuando un cálculo biliar pequeño se erosiona a través de la pared de la vesícula biliar directamente en el intestino"],["D","Estos pacientes presentan síntomas de obstrucción, náuseas e ictericia"]],ans:"A",exp:"En el íleo biliar, un cálculo puede migrar y enclavarse a nivel pilórico o duodenal proximal, produciendo obstrucción de la salida gástrica (síndrome de Bouveret).",wrong:{B:"La ecografía tiene baja sensibilidad para detectar el íleo biliar, ya que el aire biliar y el cálculo pueden pasar desapercibidos.",C:"La erosión del cálculo suele producir una fístula colecistoduodenal establecida, no un paso directo inespecífico sin fístula.",D:"El íleo biliar cursa con obstrucción intestinal mecánica, pero la ictericia no es un síntoma característico frecuente del cuadro."}},
{id:"26f2-c10",area:"CIR",q:"¿Tras la reperfusión de un órgano trasplantado, el equipo quirúrgico observa una necrosis isquémica del injerto en cuestión de minutos? Se sospecha de una reacción mediada por anticuerpos preformados. ¿Cuál es el evento fisiopatológico final que causa directamente la necrosis isquémica del injerto?",opts:[["A","Fibrosis tisular progresiva"],["B","Infiltración por células presentadoras de antígeno"],["C","Coagulación intravascular difusa"],["D","Activación de linfocitos T citotóxicos"]],ans:"C",exp:"El rechazo hiperagudo mediado por anticuerpos preformados activa la cascada de coagulación de forma difusa dentro del injerto, produciendo trombosis microvascular y necrosis isquémica en minutos.",wrong:{A:"La fibrosis tisular progresiva es un proceso crónico, no el mecanismo agudo que causa necrosis en minutos.",B:"La infiltración por células presentadoras de antígeno es propia del rechazo celular agudo, un proceso de días, no de minutos.",D:"La activación de linfocitos T citotóxicos corresponde al rechazo celular agudo, mediado por células y no por anticuerpos preformados."}},
{id:"26f2-c11",area:"CIR",q:"¿En un paciente con pancreatitis aguda que presenta sospecha de complicación por infección local y no responde al tratamiento inicial, ¿cuál es la estrategia de intervención recomendada por el algoritmo antes de considerar una técnica quirúrgica mayor?",opts:[["A","Iniciar un tratamiento escalonado con drenaje guiado por imagen"],["B","Realizar una laparotomía exploradora de urgencia"],["C","Proceder de inmediato a un desbridamiento retroperitoneal asistido por video"],["D","Administrar antibióticos profilácticos de amplio espectro por 14 días"]],ans:"A",exp:"En necrosis pancreática infectada sin respuesta al tratamiento médico, la estrategia escalonada (drenaje mínimamente invasivo guiado por imagen antes de cirugía mayor) es la recomendada por reducir la morbimortalidad.",wrong:{B:"La laparotomía exploradora de urgencia se reserva para cuando fallan las medidas menos invasivas, no como primera línea.",C:"El desbridamiento retroperitoneal asistido por video se considera un paso posterior si el drenaje percutáneo fracasa, no de entrada.",D:"Los antibióticos profilácticos prolongados no reemplazan el control de foco necesario ante sospecha de necrosis infectada."}},
{id:"26f2-c12",area:"CIR",q:"Un paciente con diagnóstico de pancreatitis aguda de 5 semanas de evolución presenta una colección de contenido predominantemente sólido con una pared bien definida, sin evidencia de infección. Según la clasificación de complicaciones locales, ¿cómo se denomina esta lesión?",opts:[["A","Acumulación líquida aguda pancreática (APFC)"],["B","Acumulación necrótica aguda (ANC)"],["C","Pseudoquiste pancreático"],["D","Necrosis de la pared (WON)"]],ans:"D",exp:"Una colección con contenido predominantemente sólido y pared bien definida a las 4 semanas o más de evolución corresponde a necrosis de la pared (WON, walled-off necrosis).",wrong:{A:"La acumulación líquida aguda pancreática ocurre en las primeras 4 semanas, con contenido líquido y sin pared definida.",B:"La acumulación necrótica aguda también ocurre antes de las 4 semanas, con contenido heterogéneo pero sin pared bien formada.",C:"El pseudoquiste pancreático tiene contenido predominantemente líquido con pared definida, a diferencia del contenido sólido descrito."}},
{id:"26f2-c13",area:"CIR",q:"¿Cuáles son considerados tumores pulmonares de Pancoast?",opts:[["A","Todos los tumores ubicados en los segmentos latero basales"],["B","Los tumores que afectan la pared torácica en o debajo de la segunda costilla"],["C","Cualquiera de los tumores del surco superior"],["D","Los tumores en la superficie pulmonar medial o el hilio anterior"]],ans:"C",exp:"El término tumor de Pancoast se aplica a cualquier tumor del surco superior pulmonar, independientemente de su histología exacta.",wrong:{A:"Los tumores latero-basales no corresponden a la definición de Pancoast, específica del surco superior pulmonar.",B:"La afectación de la pared torácica bajo la segunda costilla no es el criterio definitorio; lo que define al Pancoast es su localización apical.",D:"Los tumores de superficie medial o hilio anterior no corresponden a la localización apical característica del tumor de Pancoast."}},
{id:"26f2-c14",area:"CIR",q:"¿Cuál es el subtipo de carcinoma basocelular más común y cómo se caracteriza clínicamente?",opts:[["A","Variante infiltrativa que aparece predominantemente en el tronco"],["B","Variante esclerodérmica con apariencia de cicatriz agrandada"],["C","Variante plana y rosada con escamas o costras"],["D","Variante nodular, caracterizada por pápulas rosadas elevadas y perladas"]],ans:"D",exp:"El carcinoma basocelular nodular, con pápulas rosadas, elevadas y de aspecto perlado, es el subtipo clínico más común.",wrong:{A:"La variante infiltrativa es menos frecuente y de comportamiento más agresivo, no el subtipo más común.",B:"La variante esclerodérmica (morfeiforme) es infrecuente y de difícil delimitación clínica, no la presentación típica.",C:"La variante superficial (plana, con escamas) es el segundo subtipo más frecuente, pero no el más común."}},
{id:"26f2-c15",area:"CIR",q:"¿Cuál de las siguientes afirmaciones es correcta con respecto a las infecciones intraabdominales?",opts:[["A","En la peritonitis bacteriana secundaria el control efectivo del origen y la terapia con antibióticos se asocian con bajas tasas de fracaso"],["B","En quienes falla la terapia estándar, conduce a peritonitis bacteriana secundaria"],["C","La peritonitis bacteriana secundaria son invariablemente monobacterianas"],["D","La peritonitis bacteriana secundaria es más común entre los pacientes que reciben tratamiento para la insuficiencia renal mediante diálisis peritoneal"]],ans:"A",exp:"En la peritonitis bacteriana secundaria, lograr un control efectivo del foco infeccioso junto con antibioticoterapia adecuada se asocia a bajas tasas de fracaso terapéutico.",wrong:{B:"El fracaso de la terapia estándar puede ocurrir, pero no define a la peritonitis secundaria, que ya está presente desde el inicio.",C:"La peritonitis bacteriana secundaria es típicamente polimicrobiana, con flora mixta aerobia y anaerobia, no monobacteriana.",D:"La peritonitis asociada a diálisis peritoneal corresponde a la forma relacionada a catéter, distinta de la secundaria clásica."}},
{id:"26f2-c16",area:"CIR",q:"El ácido tranexámico cada vez tiene más uso en cirugía. ¿Cuál es una de sus características?",opts:[["A","Tiene una vida media prolongada de más de 6hs en circulación"],["B","Es de uso primordial en pacientes con coagulación intravascular activa"],["C","Evita la descomposición del coágulo"],["D","Actúa principalmente sobre la agregación plaquetaria"]],ans:"C",exp:"El ácido tranexámico actúa como antifibrinolítico, evitando la degradación (lisis) del coágulo ya formado, en lugar de promover directamente la coagulación.",wrong:{A:"El ácido tranexámico tiene una vida media corta, de aproximadamente 2 horas, no mayor a 6 horas.",B:"Su uso principal es en hemorragia por hiperfibrinólisis, no en cuadros de coagulación intravascular activa como la CID.",D:"El ácido tranexámico no actúa sobre la agregación plaquetaria; su mecanismo es antifibrinolítico al inhibir la plasmina."}},
{id:"26f2-c17",area:"CIR",q:"¿Un paciente ingresa a la sala de urgencias tras recibir una herida por proyectil de arma de fuego en el muslo derecho? Durante la exploración física, el medico nota una hemorragia masiva que sale de la herida de forma rítmica y sincrónica con el latido cardiaco. ¿Cuál es la conducta terapéutica indicada inmediata para este paciente?",opts:[["A","Realización de angiografía por tomografía"],["B","Operación obligatoria"],["C","Evaluación adicional con índice A-A (Presión arterial sistólica del lado lesionado en comparación con la extremidad no lesionada)"],["D","Observación y control de hematoma"]],ans:"B",exp:"Una hemorragia externa pulsátil y sincrónica con el pulso cardíaco sugiere lesión arterial mayor, lo que constituye indicación de exploración quirúrgica obligatoria.",wrong:{A:"La angiografía por tomografía puede diferir la intervención en un paciente con hemorragia activa que requiere control quirúrgico inmediato.",C:"El índice de presiones comparativo se usa en lesiones sin signos duros de lesión vascular, no cuando hay hemorragia pulsátil evidente.",D:"La observación está contraindicada ante signos duros de lesión vascular como el sangrado pulsátil descrito."}},
{id:"26f2-c18",area:"CIR",q:"¿Cuál de las neoplasias del páncreas endócrino se manifiesta con un cuadro clínico que se caracteriza por la presencia de cálculos biliares, diabetes y esteatorrea secundaria?",opts:[["A","Insulinoma"],["B","VIPoma"],["C","Somatostatinoma"],["D","Glucagonoma"]],ans:"C",exp:"El cuadro de cálculos biliares, diabetes y esteatorrea es la tríada clásica del somatostatinoma, tumor neuroendocrino pancreático que inhibe la secreción biliar, insulínica y enzimática.",wrong:{A:"El insulinoma se manifiesta con hipoglucemia (tríada de Whipple), no con la tríada biliar-diabética-esteatorreica descrita.",B:"El VIPoma produce diarrea acuosa profusa, hipopotasemia y aclorhidria (síndrome WDHA), no la tríada descrita.",D:"El glucagonoma se manifiesta con eritema necrolítico migratorio, diabetes y pérdida de peso, no con cálculos biliares y esteatorrea."}},
{id:"26f2-c19",area:"CIR",q:"¿Un cirujano realiza una disección del ligamento hepatoduodenal durante una duodenopancreatectomía.¿Cuál es el origen de la arteria hepática común y cuál es la variante anatómica más frecuente (10-15% de los casos) que se debe buscar lateral a la vena porta?",opts:[["A","Surge de la arteria gástrica derecha; arteria hepática común anómala que nace directamente de la aorta"],["B","Surge de la arteria esplénica; arteria cística que nace de la arteria hepática izquierda"],["C","Surge del tronco celíaco; arteria hepática derecha reemplazada o accesoria que nace de la arteria mesentérica superior (SMA)"],["D","Surge de la arteria mesentérica superior; arteria hepática izquierda accesoria desde la gástrica izquierda"]],ans:"C",exp:"La arteria hepática común nace clásicamente del tronco celíaco; una variante frecuente es la arteria hepática derecha reemplazada o accesoria que se origina de la arteria mesentérica superior, pasando lateral a la vena porta.",wrong:{A:"La arteria hepática común no surge de la gástrica derecha, que en realidad es una de sus ramas terminales.",B:"La arteria hepática común no se origina en la esplénica; ambas son ramas del tronco celíaco.",D:"La arteria hepática común no nace de la mesentérica superior; esta última origina la variante anómala de la hepática derecha."}},
{id:"26f2-c20",area:"CIR",q:"La impedancia esofágica es una tecnología nueva que se usa selectivamente para el diagnóstico de:",opts:[["A","Cáncer de esófago"],["B","Esclerodermia"],["C","Acalasia"],["D","Reflujo gastro esofágico"]],ans:"D",exp:"La impedanciometría esofágica combinada con pHmetría se emplea de forma selectiva para el diagnóstico de reflujo gastroesofágico, incluyendo el reflujo no ácido.",wrong:{A:"El cáncer de esófago se diagnostica con endoscopía y biopsia, no con impedanciometría, que evalúa función, no estructura.",B:"La esclerodermia se evalúa mediante manometría por su afectación motora, no específicamente con impedanciometría.",C:"La acalasia se diagnostica principalmente por manometría de alta resolución, no por impedanciometría esofágica."}},
{id:"26f2-c21",area:"CIR",q:"¿Cuál de los siguientes trastornos tiene un mayor riesgo de transformación en cáncer de mama?",opts:[["A","Fibroadenoma gigante"],["B","Hiperplasia florida"],["C","Papiloma intraductal"],["D","Adenosis esclerosante"]],ans:"B",exp:"La hiperplasia ductal florida se asocia a mayor riesgo relativo de progresión a carcinoma de mama, en comparación con otras lesiones proliferativas benignas.",wrong:{A:"El fibroadenoma gigante es una lesión benigna sin potencial de transformación maligna significativo.",C:"El papiloma intraductal solitario confiere un riesgo levemente aumentado, menor que el de la hiperplasia florida con atipia.",D:"La adenosis esclerosante se asocia a un riesgo mínimamente elevado, inferior al de las lesiones proliferativas con atipia."}},
{id:"26f2-c22",area:"CIR",q:"¿Cuál es una indicación para la paratiroidectomía en pacientes con hiperparatiroidismo primario asintomático?",opts:[["A","GFR <80 mL/min"],["B","Calcio sérico >1 mg/dL por encima de los límites superiores de lo normal"],["C","Edad >50 años"],["D","Se desea la vigilancia médica a largo plazo o posible"]],ans:"B",exp:"Un calcio sérico mayor a 1 mg/dL por encima del límite superior normal es criterio quirúrgico para paratiroidectomía, incluso en hiperparatiroidismo primario asintomático.",wrong:{A:"Un GFR menor a 60 mL/min, no 80, es el criterio establecido de daño renal para indicar cirugía.",C:"La edad menor a 50 años, no mayor, es el criterio etario reconocido como indicación quirúrgica.",D:"La imposibilidad de garantizar seguimiento adecuado es indicación de cirugía, no la preferencia por vigilancia médica prolongada."}},
{id:"26f2-c23",area:"CIR",q:"¿Cuál de las siguientes afirmaciones es correcta con respecto a la vesícula biliar?",opts:[["A","El retorno venoso se realiza, la mayoría de las veces, a través de una vena cística grande que lleva la sangre de regreso a la vena porta"],["B","El moco secretado en la vesícula biliar se origina en las glándulas tubuloalveolares que se encuentran en el revestimiento mucoso del infundíbulo, cuello, cuerpo y fondo de la vesícula biliar"],["C","Cuando la arteria cística alcanza el cuello de la vesícula biliar, se fracciona en divisiones derechas e izquierdas"],["D","La vesícula biliar carece de mucosa muscular y submucosa"]],ans:"D",exp:"La mucosa de la vesícula biliar carece de muscularis mucosae y de submucosa verdaderas, a diferencia del resto del tubo digestivo.",wrong:{A:"El retorno venoso de la vesícula ocurre mayormente por pequeñas venas directas al hígado, no por una vena cística grande única.",B:"El moco vesicular se origina en glándulas mucosas del cuello e infundíbulo, no distribuidas uniformemente en cuerpo y fondo.",C:"La arteria cística se divide en ramas superficial y profunda al alcanzar la vesícula, no en divisiones derecha e izquierda."}},
{id:"26f2-c24",area:"CIR",q:"¿Un paciente de 45 años con disfagia a sólidos y líquidos es sometido a una manometría esofágica de alta resolución. Los resultados muestran una presión del esfínter esofágico inferior (LES) de 26 mm Hg, con una relajación incompleta del mismo (<75%) y ausencia de peristalsis en el cuerpo esofágico. ¿Cuál es el diagnóstico más probable para este paciente?",opts:[["A","Acalasia"],["B","Espasmo esofágico difuso (DES)"],["C","Esófago \"en cascanueces\""],["D","Esfínter esofágico inferior hipertenso"]],ans:"A",exp:"Una presión del EEI elevada (>15-20 mmHg) con relajación incompleta y ausencia de peristalsis esofágica en la manometría de alta resolución es diagnóstica de acalasia.",wrong:{B:"El espasmo esofágico difuso muestra contracciones simultáneas prematuras, pero conserva cierta relajación del EEI, a diferencia de la acalasia.",C:"El esófago en cascanueces se caracteriza por contracciones peristálticas de alta amplitud, sin ausencia de peristalsis.",D:"El EEI hipertenso aislado no incluye la ausencia de peristalsis del cuerpo esofágico descrita en este caso."}},
{id:"26f2-c25",area:"CIR",q:"¿De acuerdo con los resultados del Estudio Asintomático de Ateroesclerosis Carotídea (ACAS), ¿cuál es el porcentaje de reducción del riesgo relativo de accidente cerebrovascular ipsolateral que ofrece la endarterectomía carotídea frente al tratamiento médico en pacientes con estenosis superior al 60%?",opts:[["A","53%"],["B","11%"],["C","8%"],["D","43%"]],ans:"A",exp:"El estudio ACAS mostró una reducción del riesgo relativo de ACV ipsilateral de aproximadamente 53% con endarterectomía carotídea frente al tratamiento médico en estenosis asintomática >60%.",wrong:{B:"El 11% no corresponde a la reducción del riesgo relativo reportada por el estudio ACAS.",C:"El 8% no refleja el beneficio relativo demostrado por la endarterectomía en el estudio ACAS.",D:"El 43% no coincide con la cifra específica de reducción de riesgo relativo publicada en el estudio ACAS."}},
{id:"26f2-c26",area:"CIR",q:"¿Cuál de las siguientes afirmaciones es correcta con respecto al sistema de estadificación de Hinchey?",opts:[["A","El estadio IIa se asocia con peritonitis fecal"],["B","El estadio III se asocia con peritonitis purulenta"],["C","El estadio IV incluye inflamación del colon con un absceso retroperitoneal o pélvico"],["D","La etapa II incluye la inflamación del colon con un absceso pericólico asociado"]],ans:"B",exp:"En la clasificación de Hinchey de diverticulitis complicada, el estadio III corresponde a peritonitis purulenta generalizada (a diferencia del estadio IV, que es peritonitis fecal).",wrong:{A:"El estadio IIa de Hinchey corresponde a un absceso pélvico o a distancia, no a peritonitis fecal.",C:"El estadio IV de Hinchey corresponde a peritonitis fecal generalizada, no a un absceso retroperitoneal aislado.",D:"El estadio II de Hinchey corresponde a un absceso pélvico o a distancia, no a un absceso pericólico simple (estadio I)."}},
{id:"26f2-c27",area:"CIR",q:"¿Cuál de las siguientes afirmaciones es correcta con respecto a las indicaciones actuales para la toracotomía en urgencias?",opts:[["A","Pacientes que sufrieron un traumatismo penetrante en el cuello o las extremidades con >5 min de CPR prehospitalaria"],["B","Pacientes que sufrieron un traumatismo cerrado con >20 min de CPR prehospitalaria"],["C","Traumatismo penetrante: CPR >15 min y sin signos de vida"],["D","Pacientes que sufrieron un traumatismo penetrante en el torso con <15 min de CPR prehospitalaria"]],ans:"D",exp:"La toracotomía de urgencia (de reanimación) está indicada en trauma penetrante de torso con menos de 15 minutos de RCP prehospitalaria, cuando aún existe posibilidad razonable de recuperación.",wrong:{A:"El trauma penetrante de cuello o extremidades no es indicación clásica de toracotomía de reanimación, reservada para trauma de torso.",B:"El trauma cerrado con RCP prolongada tiene indicación muy limitada de toracotomía por su mal pronóstico, a diferencia del penetrante.",C:"Más de 15 minutos de RCP sin signos de vida se asocia a supervivencia prácticamente nula, por lo que no está indicada la toracotomía."}},
{id:"26f2-c28",area:"CIR",q:"¿Cuál de las siguientes afirmaciones es correcta con respecto a los criterios de Light para derrames pleurales?",opts:[["A","Un derrame es exudativo si la relación de proteínas del líquido pleural/plasma es mayor que 0.5 y la relación LDH es mayor que 0.6"],["B","Los niveles de glucosa en el líquido pleural disminuyen con frecuencia (<40 mg/dL) con los derrames paraneumónicos complejos o los derrames malignos"],["C","El nivel pleural absoluto de LDH es menor que dos tercios del límite superior normal para el suero"],["D","Un predominio de células mononucleares sugiere un proceso inflamatorio más agudo"]],ans:"A",exp:"Según los criterios de Light, un derrame es exudativo si la relación de proteínas pleura/plasma es mayor a 0.5 o la relación de LDH es mayor a 0.6 del límite sérico.",wrong:{B:"La glucosa baja en derrames complicados es un hallazgo asociado, pero no forma parte de los criterios de Light para exudado.",C:"Un LDH pleural absoluto elevado, no menor a dos tercios del límite sérico, es criterio de exudado según Light.",D:"El predominio celular no forma parte de los criterios de Light; estos se basan en proteínas y LDH."}},
{id:"26f2-c29",area:"CIR",q:"¿Cuál de los siguientes carcinomas de la glándula tiroides puede ir acompañado de un feocromocitoma e hiperparatiroidismo primario?",opts:[["A","Papilar"],["B","Folicular"],["C","Medular"],["D","De células de Hürthle"]],ans:"C",exp:"El carcinoma medular de tiroides puede asociarse a feocromocitoma e hiperparatiroidismo primario dentro del síndrome de neoplasia endocrina múltiple tipo 2 (MEN 2).",wrong:{A:"El carcinoma papilar no se asocia al síndrome MEN 2 con feocromocitoma e hiperparatiroidismo.",B:"El carcinoma folicular no forma parte de los síndromes de neoplasia endocrina múltiple asociados a feocromocitoma.",D:"El carcinoma de células de Hürthle no se relaciona con el síndrome MEN 2 descrito."}},
{id:"26f2-c30",area:"CIR",q:"¿Un paciente de 68 años con antecedente de neoplasia maligna es programado para una cirugía mayor abierta que durará aproximadamente 60 minutos. Según el modelo de Caprini, ¿cuántos puntos suma este paciente considerando únicamente su edad, el diagnóstico de neoplasia y el tipo de intervención?",opts:[["A","4 puntos"],["B","7 puntos"],["C","5 puntos"],["D","6 puntos"]],ans:"D",exp:"Según el modelo de Caprini, la combinación de edad avanzada, neoplasia activa y cirugía mayor de aproximadamente una hora suma 6 puntos de riesgo trombótico.",wrong:{A:"4 puntos subestima la suma de los tres factores de riesgo (edad, neoplasia y cirugía mayor) según el modelo de Caprini.",B:"7 puntos sobreestima el puntaje correspondiente a esta combinación específica de factores según Caprini.",C:"5 puntos no corresponde a la suma exacta de los puntos asignados a edad, neoplasia activa y cirugía mayor de una hora."}},
{id:"26f2-m1",area:"MI",q:"¿A qué causa se atribuye el 65% de los casos de hipotiroidismo neonatal permanente?",opts:[["A","Anticuerpos maternos contra el receptor de TSH"],["B","Disgenesia de la glándula tiroidea"],["C","Errores congénitos de la síntesis hormonal"],["D","Deficiencia severa de selenio"]],ans:"B",exp:"La disgenesia de la glándula tiroidea es la causa más frecuente (alrededor del 65%) de hipotiroidismo congénito permanente.",wrong:{A:"Los anticuerpos maternos anti-receptor de TSH causan hipotiroidismo neonatal transitorio, no la forma permanente.",C:"Los errores congénitos de la síntesis hormonal explican solo una minoría de los casos, no el 65%.",D:"La deficiencia severa de selenio no es una causa reconocida de hipotiroidismo congénito permanente."}},
{id:"26f2-m2",area:"MI",q:"Varón de 71 años, consulta por fiebre, tos productiva con expectoración herrumbrosa y dolor pleurítico. Radiografía de tórax: consolidación lobar en lóbulo inferior derecho. Gasometría arterial: PaO2 de 58 mmHg, PaCO2 de 32 mmHg y pH 7.48. El índice de gravedad de neumonía (PSI) lo clasifica como clase V, ¿cuál es el esquema antibiótico empírico de elección para este paciente hospitalizado en UCI?",opts:[["A","Betalactámico IV + azitromicina IV, o betalactámico + fluoroquinolona respiratoria IV"],["B","Amoxicilina-clavulánico 875/125 mg VO cada 12 horas"],["C","Vancomicina IV + piperacilina-tazobactam IV de inicio empírico"],["D","Ceftriaxona 1g IV cada 24 horas en monoterapia"]],ans:"A",exp:"En neumonía grave (PSI clase V) que requiere UCI, el esquema recomendado es un betalactámico IV combinado con azitromicina IV o una fluoroquinolona respiratoria IV.",wrong:{B:"La vía oral con amoxicilina-clavulánico es insuficiente y ambulatoria, no apta para un paciente PSI clase V en UCI.",C:"Vancomicina más piperacilina-tazobactam se reserva para sospecha de SARM o Pseudomonas, no es el esquema empírico inicial estándar.",D:"Ceftriaxona en monoterapia no cubre patógenos atípicos, insuficiente para neumonía grave en UCI."}},
{id:"26f2-m3",area:"MI",q:"Varón de 72 años con cáncer de pulmón en estadio IV sin opciones curativas, con plena capacidad de decisión, solicita información detallada sobre su pronóstico y desea discutir la limitación del esfuerzo terapéutico. La familia insiste en que no se le informe al paciente sobre su diagnóstico para \"protegerlo\". ¿Cuál es el principio bioético que prevalece en este escenario y la conducta médica más apropiada?",opts:[["A","El principio de autonomía del paciente prevalece; el médico debe informar al paciente de forma honesta y compasiva respetando su derecho a conocer su diagnóstico y participar en las decisiones sobre su atención"],["B","El principio de no maleficencia prevalece; el médico debe evitar cualquier información que pueda causar daño psicológico al paciente independientemente de su solicitud"],["C","El principio de beneficencia familiar prevalece; el médico debe respetar el deseo de la familia y omitir información al paciente para evitar sufrimiento innecesario"],["D","El principio de justicia distributiva prevalece; el médico debe priorizar el uso de recursos en pacientes con mayor expectativa de vida y limitar la información en casos terminales"]],ans:"A",exp:"En un paciente competente que solicita información sobre su pronóstico, prevalece el principio de autonomía: debe ser informado de forma honesta y compasiva, respetando su derecho a decidir.",wrong:{B:"La no maleficencia está mal aplicada aquí: ocultar información a un paciente competente que la solicita no evita daño, lo genera.",C:"La beneficencia familiar no es un principio bioético reconocido; antepone el deseo de terceros a la autonomía del paciente.",D:"La justicia distributiva no rige la decisión de informar y discrimina indebidamente por expectativa de vida."}},
{id:"26f2-m4",area:"MI",q:"¿Cuál de los siguientes fármacos ha demostrado beneficio consistente en la reducción de la mortalidad en pacientes con insuficiencia cardíaca con fracción de eyección reducida?",opts:[["A","Digoxina"],["B","Verapamilo"],["C","Carvedilol"],["D","Amiodarona"]],ans:"C",exp:"El carvedilol, betabloqueante con beneficio demostrado en mortalidad, es de los fármacos con mayor evidencia en insuficiencia cardíaca con fracción de eyección reducida.",wrong:{A:"La digoxina mejora síntomas y reduce hospitalizaciones, pero no ha demostrado reducir la mortalidad.",B:"El verapamilo está contraindicado en IC-FEr por su efecto inotrópico negativo, que empeora el pronóstico.",D:"La amiodarona es neutra respecto a la mortalidad, se usa solo para control de arritmias asociadas."}},
{id:"26f2-m5",area:"MI",q:"¿Cuál de las siguientes etiologías corresponde a síndrome de Cushing independiente de ACTH?",opts:[["A","Adenoma suprarrenal productor de cortisol"],["B","Hiperplasia hipofisaria secundaria"],["C","Síndrome de secreción ectópica de ACTH"],["D","Adenoma hipofisario corticotropo"]],ans:"A",exp:"El adenoma suprarrenal productor de cortisol es una causa de síndrome de Cushing independiente de ACTH.",wrong:{B:"La hiperplasia hipofisaria secundaria eleva ACTH, por lo que es una causa ACTH-dependiente de Cushing.",C:"La secreción ectópica de ACTH es por definición una causa ACTH-dependiente, no independiente.",D:"El adenoma hipofisario corticotropo (enfermedad de Cushing) actúa mediante exceso de ACTH, es ACTH-dependiente."}},
{id:"26f2-m6",area:"MI",q:"¿En la patogenia de la disfunción orgánica inducida por sepsis, ¿cuál de los siguientes mecanismos participa de forma central en la amplificación de la respuesta inflamatoria sistémica?",opts:[["A","Predominio de respuesta Th2 con aumento de IL-4 e IL-13"],["B","Supresión primaria del complemento como evento inicial"],["C","Inhibición directa de la glicólisis mitocondrial por endotoxinas"],["D","Activación de receptores de reconocimiento de patrones con liberación de citocinas proinflamatorias"]],ans:"D",exp:"La activación de receptores de reconocimiento de patrones con liberación masiva de citocinas proinflamatorias es el mecanismo central que amplifica la disfunción orgánica en la sepsis.",wrong:{A:"El predominio Th2 con IL-4/IL-13 corresponde a una respuesta antiinflamatoria compensadora, no a la amplificación inicial.",B:"En la sepsis el complemento se activa de forma temprana, no se suprime como evento inicial.",C:"La inhibición mitocondrial de la glicólisis es una consecuencia tardía de la disfunción celular, no el mecanismo amplificador central."}},
{id:"26f2-m7",area:"MI",q:"Varón de 64 años con HTA y dislipidemia presenta dolor precordial opresivo de 45 minutos de duración, irradiado al brazo izquierdo y diaforesis, con ingurgitación yugular con campos pulmonares limpios\" y/o \"ST en V4R. ECG: elevación del segmento ST en DII, DIII y aVF. Presión arterial: 90/60 mmHg y frecuencia cardíaca 48 lpm. ¿Cuál es la complicación más probable y su manejo inicial prioritario?",opts:[["A","Infarto de ventrículo derecho; expansión con solución salina. Bloqueo AV completo por infarto de ventrículo derecho; expansión con solución salina"],["B","Disección aórtica tipo A; cirugía de emergencia"],["C","Taponamiento cardíaco; pericardiocentesis de urgencia"],["D","Taquicardia ventricular; cardioversión eléctrica sincronizada inmediata"]],ans:"A",exp:"El cuadro de IAM inferior con hipotensión y bradicardia sugiere compromiso del ventrículo derecho; el manejo inicial prioritario es la expansión con solución salina, evitando vasodilatadores.",wrong:{B:"La disección aórtica tipo A no explica el supradesnivel localizado en cara inferior del ECG descrito.",C:"El taponamiento cardíaco no produce elevación del ST territorial como la observada en este caso.",D:"El paciente presenta bradicardia de 48 lpm, incompatible con una taquicardia ventricular."}},
{id:"26f2-m8",area:"MI",q:"¿Cuál es el fármaco antirreumático modificador de la enfermedad considerado de primera línea inicial en el tratamiento de la artritis reumatoide?",opts:[["A","Hidroxicloroquina"],["B","Prednisona"],["C","Metotrexato"],["D","Sulfasalazina"]],ans:"C",exp:"El metotrexato es el fármaco antirreumático modificador de la enfermedad (FARME) de primera línea en artritis reumatoide.",wrong:{A:"La hidroxicloroquina se reserva para enfermedad leve o en combinación, no es de primera línea aislada en AR.",B:"La prednisona actúa como puente sintomático, no es un FARME modificador del curso de la enfermedad.",D:"La sulfasalazina es una alternativa o fármaco de combinación, no la primera opción preferida en AR."}},
{id:"26f2-m9",area:"MI",q:"¿Cuál es la meta principal de hematocrito en el tratamiento de policitemia vera con flebotomía?",opts:[["A","Hematocrito < 55% en ambos sexos"],["B","Hematocrito < 50% en varones y < 45% en mujeres"],["C","Hematocrito < 45% en varones y < 42% en mujeres"],["D","Hematocrito < 42% en varones y < 45% en mujeres"]],ans:"C",exp:"En el tratamiento de la policitemia vera con flebotomía, la meta habitual de hematocrito es menor a 45% en varones y menor a 42% en mujeres.",wrong:{A:"Un umbral de hematocrito menor al 55% es demasiado alto y no constituye la meta terapéutica en policitemia vera.",B:"Los valores de 50% y 45% no corresponden a las metas de hematocrito por sexo establecidas en policitemia vera.",D:"Esta opción invierte los valores correctos: el umbral menor corresponde a varones y no a mujeres."}},
{id:"26f2-m10",area:"MI",q:"Mujer de 33 años VIH positiva con CD4 de 110 células/µL inicia terapia antirretroviral con tenofovir, emtricitabina y dolutegravir. A las 3 semanas presenta fiebre, adenopatías y empeoramiento clínico de una lesión pulmonar previamente estable. ¿Cuál es el mecanismo fisiopatológico más probable de este cuadro?",opts:[["A","Sobreinfección bacteriana oportunista nueva"],["B","Resistencia primaria a los antirretrovirales indicados"],["C","Síndrome inflamatorio de reconstitución inmune (IRIS)"],["D","Toxicidad mitocondrial por análogos de nucleósidos"]],ans:"C",exp:"El empeoramiento clínico paradójico tras iniciar TARV en un paciente con inmunosupresión avanzada sugiere síndrome inflamatorio de reconstitución inmune (IRIS).",wrong:{A:"Una sobreinfección bacteriana nueva no explica el empeoramiento de una lesión pulmonar previamente estable.",B:"La resistencia primaria a las tres semanas de iniciado el esquema es poco probable como mecanismo explicativo.",D:"La toxicidad mitocondrial por análogos de nucleósidos es de aparición tardía, no cursa con fiebre y adenopatías agudas."}},
{id:"26f2-m11",area:"MI",q:"En el linfoma de Hodgkin clásico, ¿cuál de las siguientes características histológicas es patognomónica y necesaria para el diagnóstico?",opts:[["A","Transformación folicular con centrocitos atípicos CD20+"],["B","Linfocitos en anillo de sello con inclusiones intranucleares"],["C","Presencia de granulomas no caseificantes con necrosis central"],["D","Células de Reed-Sternberg con inmunofenotipo CD30+ y con frecuencia CD15+"]],ans:"D",exp:"Las células de Reed-Sternberg (CD30+, con frecuencia CD15+) son el hallazgo histológico patognomónico del linfoma de Hodgkin clásico.",wrong:{A:"La transformación folicular con centrocitos CD20+ corresponde al linfoma folicular, un linfoma no Hodgkin.",B:"Los linfocitos en anillo de sello con inclusiones intranucleares no son un hallazgo reconocido del linfoma de Hodgkin.",C:"Los granulomas no caseificantes pueden verse de forma reactiva, pero no son patognomónicos ni necesarios para el diagnóstico."}},
{id:"26f2-m12",area:"MI",q:"¿Cuál de los siguientes autoanticuerpos posee mayor especificidad para artritis reumatoide y además valor pronóstico?",opts:[["A","Anticuerpos antinucleares"],["B","Anticuerpos anti-DNA de doble cadena"],["C","Factor reumatoide"],["D","Anticuerpos contra proteínas citrulinadas"]],ans:"D",exp:"Los anticuerpos contra proteínas citrulinadas (anti-CCP) tienen mayor especificidad y valor pronóstico que el factor reumatoide en la artritis reumatoide.",wrong:{A:"Los anticuerpos antinucleares son inespecíficos y se asocian a múltiples enfermedades autoinmunes, no solo a AR.",B:"Los anti-DNA de doble cadena son marcadores específicos de lupus eritematoso sistémico, no de artritis reumatoide.",C:"El factor reumatoide tiene menor especificidad y menor valor pronóstico que los anti-CCP en artritis reumatoide."}},
{id:"26f2-m13",area:"MI",q:"Varón de 52 años con trasplante renal hace 6 meses, en tratamiento inmunosupresor con tacrolimus y micofenolato, presenta fiebre, tos seca y disnea progresiva con hipoxemia (SatO2 88% en aire ambiente). LDH sérica elevada; en Radiografía de tórax infiltrado intersticial bilateral y la broncoscopía con lavado broncoalveolar confirma el diagnóstico de neumonía por Pneumocystis jirovecii. ¿Cuál es el tratamiento de primera línea?",opts:[["A","Anfotericina B liposomal 3-5 mg/kg/día"],["B","Trimetoprim-sulfametoxazol a dosis altas IV"],["C","Voriconazol 6 mg/kg IV cada 12 horas el primer día, luego 4 mg/kg"],["D","Fluconazol 400 mg/día VO"]],ans:"B",exp:"El trimetoprim-sulfametoxazol a dosis altas por vía intravenosa es el tratamiento de primera línea para la neumonía por Pneumocystis jirovecii.",wrong:{A:"La anfotericina B liposomal no es el tratamiento de elección para Pneumocystis jirovecii, se reserva para otras micosis.",C:"El voriconazol carece de actividad frente a Pneumocystis jirovecii.",D:"El fluconazol no tiene actividad frente a Pneumocystis jirovecii."}},
{id:"26f2-m14",area:"MI",q:"Varón de 38 años presenta úlcera genital indolora de base limpia y bordes indurados, junto con adenopatía inguinal bilateral no dolorosa. VDRL reactivo 1:64 y FTA-ABS positivo. ¿Cuál es el tratamiento de elección para este estadio de la enfermedad?",opts:[["A","Penicilina G benzatínica 2,4 millones UI IM dosis única"],["B","Ceftriaxona 1g IM por 10 días"],["C","Doxiciclina 100 mg VO cada 12 horas por 14 días"],["D","Azitromicina 1g VO dosis única"]],ans:"A",exp:"Una úlcera genital indolora con VDRL y FTA-ABS positivos corresponde a sífilis, cuyo tratamiento de elección es penicilina G benzatínica en dosis única.",wrong:{B:"Ceftriaxona por 10 días no es el esquema estándar recomendado para la sífilis temprana.",C:"La doxiciclina 14 días es la alternativa en pacientes alérgicos a penicilina, no el tratamiento de elección.",D:"La azitromicina en dosis única es una alternativa con resistencia creciente documentada, no de primera línea."}},
{id:"26f2-m15",area:"MI",q:"¿Cuál es la causa más frecuente de insuficiencia suprarrenal primaria en países desarrollados?",opts:[["A","Suprarrenalitis autoinmunitaria"],["B","Tuberculosis suprarrenal"],["C","Metástasis suprarrenales bilaterales"],["D","Hiperplasia suprarrenal congénita"]],ans:"A",exp:"La suprarrenalitis autoinmunitaria es la causa más frecuente de insuficiencia suprarrenal primaria en países desarrollados.",wrong:{B:"La tuberculosis suprarrenal es la causa más frecuente en países en desarrollo, no en países desarrollados.",C:"Las metástasis suprarrenales bilaterales son una causa infrecuente de insuficiencia suprarrenal primaria.",D:"La hiperplasia suprarrenal congénita es una causa genética infrecuente, no la principal en adultos de países desarrollados."}},
{id:"26f2-m16",area:"MI",q:"Mujer de 32 años presenta anemia hemolítica microangiopática, trombocitopenia severa, fiebre, alteraciones neurológicas y creatinina de 2,4 mg/dL y frotis con esquistocitos. La actividad de ADAMTS13 resulta menor al 10%. ¿Cuál es la conducta terapéutica más urgente?",opts:[["A","Plasmaféresis con plasma fresco congelado"],["B","Hemodiálisis de urgencia"],["C","Corticoterapia en altas dosis como única medida"],["D","Transfusión de plaquetas inmediata"]],ans:"A",exp:"Una actividad de ADAMTS13 menor al 10%, junto con anemia hemolítica microangiopática y trombocitopenia, es característica de púrpura trombocitopénica trombótica, cuyo tratamiento urgente es la plasmaféresis.",wrong:{B:"La hemodiálisis no trata la microangiopatía subyacente; la falla renal es secundaria al proceso trombótico.",C:"La corticoterapia aislada es insuficiente sin plasmaféresis, que es la medida que reduce la mortalidad.",D:"La transfusión de plaquetas está contraindicada en PTT, puede empeorar la trombosis microvascular."}},
{id:"26f2-m17",area:"MI",q:"¿Cuál es el territorio vascular más característicamente comprometido en la arteritis de Takayasu?",opts:[["A","Arterias pulmonares segmentarias exclusivamente"],["B","Arterias intrarrenales de pequeño calibre"],["C","Arterias coronarias distales"],["D","Cayado aórtico y sus ramas principales"]],ans:"D",exp:"El cayado aórtico y sus ramas principales son el territorio vascular más característicamente afectado en la arteritis de Takayasu.",wrong:{A:"El compromiso pulmonar puede ocurrir en Takayasu, pero no de forma exclusiva ni como el territorio más característico.",B:"Las arterias intrarrenales de pequeño calibre son típicas de la poliarteritis nodosa, no de Takayasu.",C:"Takayasu afecta grandes vasos proximales; las coronarias distales no son el territorio característico."}},
{id:"26f2-m18",area:"MI",q:"¿Cuál es la enzima responsable de inactivar el cortisol a cortisona en el riñón para evitar la activación excesiva del receptor de mineralocorticoides?",opts:[["A","21-hidroxilasa"],["B","11β-hidroxiesteroide deshidrogenasa tipo 2"],["C","11β-hidroxiesteroide deshidrogenasa tipo 1"],["D","Aldosterona sintasa"]],ans:"B",exp:"La 11β-hidroxiesteroide deshidrogenasa tipo 2 inactiva el cortisol a cortisona en el riñón, protegiendo al receptor mineralocorticoide de la activación excesiva por cortisol.",wrong:{A:"La 21-hidroxilasa participa en la esteroidogénesis suprarrenal, no en la inactivación renal del cortisol.",C:"La 11β-hidroxiesteroide deshidrogenasa tipo 1 actúa en sentido inverso, regenerando cortisol activo en tejidos como el hígado.",D:"La aldosterona sintasa sintetiza aldosterona, no participa en la inactivación del cortisol."}},
{id:"26f2-m19",area:"MI",q:"¿Qué signo clínico del síndrome de Cushing es considerado más específico y útil para el diagnóstico diferencial en pacientes jóvenes?",opts:[["A","Diabetes tipo 2 de inicio reciente"],["B","Irritabilidad y labilidad emocional"],["C","Obesidad central y aumento de peso"],["D","Estrías violáceas amplias superiores a 1 cm"]],ans:"D",exp:"Las estrías violáceas amplias (>1 cm) son un signo particularmente específico de síndrome de Cushing en pacientes jóvenes.",wrong:{A:"La diabetes de inicio reciente es frecuente pero inespecífica, se observa en múltiples condiciones metabólicas.",B:"La irritabilidad y labilidad emocional son hallazgos inespecíficos, comunes a muchas otras condiciones.",C:"La obesidad central es frecuente en el Cushing pero poco específica, también presente en la obesidad simple."}},
{id:"26f2-m20",area:"MI",q:"¿Cuál es la enzima de elección para el diagnóstico de pancreatitis aguda debido a su mayor especificidad cuando sus valores superan el triple del límite superior normal?",opts:[["A","Amilasa sérica"],["B","Elastasa fecal"],["C","Lipasa sérica"],["D","Tripsina urinaria"]],ans:"C",exp:"La lipasa sérica es la enzima de elección para el diagnóstico de pancreatitis aguda por su mayor especificidad frente a la amilasa.",wrong:{A:"La amilasa sérica es menos específica que la lipasa, se eleva también en condiciones no pancreáticas.",B:"La elastasa fecal evalúa insuficiencia exocrina crónica, no es el marcador diagnóstico de pancreatitis aguda.",D:"La tripsina urinaria no es el estudio estándar de elección para el diagnóstico de pancreatitis aguda."}},
{id:"26f2-m21",area:"MI",q:"Varón de 55 años hipertenso de larga data presenta dolor torácico desgarrante de inicio súbito, irradiado hacia la espalda. TC de tórax con contraste: disección que compromete la aorta ascendente y el arco aórtico. Presión arterial: 170/100 mmHg en brazo derecho y 140/85 mmHg en el izquierdo. ¿Cuál es la conducta terapéutica inmediata correcta?",opts:[["A","Trombolisis sistémica con alteplase en las primeras 4.5 horas"],["B","Anticoagulación con heparina IV y observación en UCI"],["C","Control de la frecuencia cardíaca con betabloqueantes IV y cirugía de urgencia"],["D","Stent endovascular aórtico como única medida terapéutica definitiva"]],ans:"C",exp:"Ante una disección aórtica tipo A (que compromete la aorta ascendente), el manejo inmediato combina control estricto de la frecuencia cardíaca con betabloqueantes IV y cirugía de urgencia.",wrong:{A:"La trombolisis está contraindicada en la disección aórtica, empeoraría el sangrado de la pared arterial.",B:"La anticoagulación con heparina está contraindicada; el manejo requiere cirugía urgente, no solo observación.",D:"El stent endovascular (TEVAR) es la técnica para disecciones tipo B, no para la tipo A que requiere cirugía abierta."}},
{id:"26f2-m22",area:"MI",q:"¿Cuál es el mecanismo fisiopatológico responsable del hipertiroidismo en la enfermedad de Graves?",opts:[["A","Destrucción folicular con liberación pasiva de hormonas tiroideas"],["B","Mutación activadora somática del receptor de TSH"],["C","Producción excesiva de TSH por adenoma hipofisario"],["D","Estimulación del receptor de TSH por inmunoglobulinas circulantes"]],ans:"D",exp:"En la enfermedad de Graves, inmunoglobulinas estimulantes se unen al receptor de TSH y lo activan de forma sostenida, generando hipertiroidismo.",wrong:{A:"La destrucción folicular con liberación pasiva describe una tiroiditis, no el mecanismo de la enfermedad de Graves.",B:"La mutación activadora somática del receptor de TSH causa el adenoma tóxico, no la enfermedad de Graves.",C:"El exceso de TSH por adenoma hipofisario causa hipertiroidismo secundario, un cuadro distinto y mucho más raro que Graves."}},
{id:"26f2-m23",area:"MI",q:"Debido a la gran reserva funcional del páncreas exocrino, ¿qué porcentaje mínimo de la glándula debe estar afectado para que se manifieste clínicamente la digestión deficiente de grasas y proteínas?",opts:[["A","90%"],["B","50%"],["C","85%"],["D","75%"]],ans:"A",exp:"Debido a la gran reserva funcional del páncreas exocrino, se requiere que aproximadamente un 90% de la glándula esté afectado antes de que aparezca digestión deficiente clínicamente evidente.",wrong:{B:"Un 50% de afectación glandular es insuficiente, la gran reserva funcional del páncreas compensa cifras mucho mayores.",C:"El 85% está por debajo del umbral real requerido para que aparezca digestión deficiente clínica.",D:"El 75% está por debajo del umbral real de afectación glandular necesario para manifestación clínica."}},
{id:"26f2-m24",area:"MI",q:"Un hombre de 67 años con leucemia mieloide crónica en fase crónica presenta resistencia al imatinib. El estudio molecular detecta la mutación T315I en el dominio kinasa de BCR-ABL. ¿Cuál es el inhibidor de tirosina kinasa de elección en este escenario?",opts:[["A","Nilotinib"],["B","Dasatinib"],["C","Bosutinib"],["D","Ponatinib"]],ans:"D",exp:"El ponatinib es el inhibidor de tirosina kinasa activo frente a la mutación T315I, resistente a los ITK de generaciones previas en LMC.",wrong:{A:"El nilotinib carece de actividad frente a la mutación T315I del dominio kinasa de BCR-ABL.",B:"El dasatinib no es eficaz frente a la mutación T315I, considerada de resistencia pan-ITK de segunda generación.",C:"El bosutinib tampoco cubre la mutación gatekeeper T315I, al igual que los otros ITK de generaciones previas."}},
{id:"26f2-m25",area:"MI",q:"Mujer de 41 años, sin antecedentes cardiovasculares previos presenta síncope durante el ejercicio. ECG en reposo: intervalo QT corregido de 520 ms. Su hermano falleció súbitamente a los 35 años. ¿Cuál es el mecanismo arrítmico en esta condición y su tratamiento de elección?",opts:[["A","Bloqueo AV de tercer grado; marcapasos definitivo bicameral"],["B","Fibrilación auricular con conducción aberrante; ablación con catéter"],["C","Taquicardia ventricular monomórfica sostenida; amiodarona IV"],["D","Torsades de pointes degenerada en fibrilación ventricular; cardiodesfibrilador implantable"]],ans:"D",exp:"Un QT largo congénito con antecedente familiar de muerte súbita predispone a torsades de pointes que puede degenerar en fibrilación ventricular; el tratamiento definitivo es el cardiodesfibrilador implantable.",wrong:{A:"El bloqueo AV de tercer grado no se relaciona con QT largo congénito ni con el antecedente familiar descrito.",B:"La fibrilación auricular con conducción aberrante no explica el síncope de esfuerzo con QT prolongado en el ECG.",C:"La amiodarona prolonga el intervalo QT y puede agravar las torsades de pointes en este contexto."}},
{id:"26f2-m26",area:"MI",q:"¿Cuál es el estudio bioquímico de elección para confirmar el diagnóstico de feocromocitoma?",opts:[["A","Determinación de renina plasmática"],["B","Prueba de supresión con dexametasona"],["C","Dosificación sérica de cortisol matutino"],["D","Determinación de metanefrinas plasmáticas libres"]],ans:"D",exp:"La determinación de metanefrinas plasmáticas libres es el estudio bioquímico de elección para confirmar el diagnóstico de feocromocitoma.",wrong:{A:"La renina plasmática evalúa el eje renina-angiotensina-aldosterona, no las catecolaminas del feocromocitoma.",B:"La prueba de supresión con dexametasona se utiliza para el diagnóstico de síndrome de Cushing, no de feocromocitoma.",C:"El cortisol matutino evalúa el eje corticoadrenal, no la producción de catecolaminas."}},
{id:"26f2-m27",area:"MI",q:"¿Cuál de las siguientes características orienta al diagnóstico de fenómeno de Raynaud secundario más que primario?",opts:[["A","Cambios trifásicos reversibles con recuperación completa tras el recalentamiento"],["B","Episodios desencadenados exclusivamente por exposición al frío"],["C","Inicio en mujeres jóvenes con antecedentes familiares y ANA negativo"],["D","Presencia de úlceras digitales isquémicas y necrosis tisular"]],ans:"D",exp:"La presencia de úlceras digitales isquémicas y necrosis tisular orienta hacia un fenómeno de Raynaud secundario, no primario.",wrong:{A:"Los cambios trifásicos reversibles con recuperación completa son típicos del Raynaud primario benigno.",B:"Los episodios desencadenados exclusivamente por frío, sin daño tisular, son un patrón característico del Raynaud primario.",C:"El inicio en mujeres jóvenes con antecedentes familiares y ANA negativo es el perfil característico del Raynaud primario."}},
{id:"26f2-m28",area:"MI",q:"¿Cuál es el mejor marcador fisiológico de la acción de las hormonas tiroideas y el marcador de primera línea para el diagnóstico de disfunción tiroidea?",opts:[["A","Hormona estimulante de la tiroides (TSH)"],["B","Tiroxina libre (T4L)"],["C","Tiroglobulina (Tg)"],["D","Triyodotironina total (T3)"]],ans:"A",exp:"La TSH es el marcador fisiológico más sensible de la acción de las hormonas tiroideas y el estudio de primera línea para evaluar la función tiroidea.",wrong:{B:"La T4 libre es útil pero menos sensible que la TSH para detectar disfunción tiroidea subclínica.",C:"La tiroglobulina es un marcador de seguimiento del cáncer diferenciado de tiroides, no de función tiroidea general.",D:"La T3 total no es de primera línea, está influida por las proteínas transportadoras y es menos sensible."}},
{id:"26f2-m29",area:"MI",q:"Varón de 44 años VIH positivo con CD4 de 45 células/µL presenta cefalea subuda, fiebre leve y rigidez de nuca. Punción lumbar: presión de apertura de 28 cmH2O, glucosa baja, proteínas elevadas y tinta china positiva. ¿Cuál es la secuencia terapéutica correcta según las guías actuales?",opts:[["A","Fluconazol 400 mg/día VO por 8 semanas, luego mantenimiento"],["B","Anfotericina B deoxicolato en monoterapia por 6 semanas"],["C","Anfotericina B liposomal + flucitosina por 2 semanas, y luego mantenimiento con fluconazol"],["D","Voriconazol IV por 2 semanas, luego itraconazol de mantenimiento"]],ans:"C",exp:"En meningitis criptocócica en paciente con SIDA avanzado, el tratamiento de inducción es anfotericina B liposomal más flucitosina por 2 semanas, seguido de mantenimiento con fluconazol.",wrong:{A:"El fluconazol en monoterapia es insuficiente como inducción en SIDA avanzado, se asocia a mayor mortalidad.",B:"La anfotericina B deoxicolato en monoterapia es menos eficaz y más tóxica sin flucitosina asociada.",D:"El voriconazol no tiene indicación estándar para criptococosis, es un antifúngico dirigido a Aspergillus."}},
{id:"26f2-m30",area:"MI",q:"Varón de 35 años, usuario de drogas intravenosas, presenta fiebre de 39°C, soplo holosistólico en foco tricuspídeo; múltiples nódulos pulmonares cavitados en radiografía de tórax y hemocultivos positivos. ¿Cuál es el agente etiológico más frecuente en esta situación?",opts:[["A","Staphylococcus aureus"],["B","Pseudomonas aeruginosa"],["C","Enterococcus faecalis"],["D","Streptococcus viridans"]],ans:"A",exp:"En usuarios de drogas intravenosas con endocarditis tricuspídea, Staphylococcus aureus es el agente etiológico más frecuente.",wrong:{B:"Pseudomonas aeruginosa es una causa menos frecuente, más típica de otros contextos como quemados o inmunodeprimidos.",C:"Enterococcus faecalis es más típico de endocarditis asociada a manipulación genitourinaria, no a uso de drogas IV.",D:"Streptococcus viridans es típico de endocarditis subaguda sobre válvulas dañadas, no del contexto de UDIV descrito."}},
{id:"26f2-sp1",area:"SP",q:"En un estudio de causalidad, el único criterio que exige que la exposición ocurra antes que el desenlace es:",opts:[["A","Analogía"],["B","Secuencia temporal"],["C","Coherencia"],["D","Especificidad"]],ans:"B",exp:"La secuencia temporal (la exposición debe ocurrir antes que el desenlace) es el único criterio de causalidad estrictamente indispensable.",wrong:{A:"La analogía compara con relaciones causales similares ya conocidas, pero no exige por sí misma un orden temporal.",C:"La coherencia exige que la asociación no contradiga el conocimiento biológico existente, no que exista secuencia temporal.",D:"La especificidad se refiere a que una causa produzca un efecto único, no al orden temporal entre exposición y desenlace."}},
{id:"26f2-sp2",area:"SP",q:"En un brote, el tiempo entre la exposición y la aparición de síntomas corresponde a:",opts:[["A","Período de latencia"],["B","Período de incubación"],["C","Período de remisión"],["D","Período de recuperación"]],ans:"B",exp:"El período de incubación es el tiempo transcurrido entre la exposición a un agente y la aparición de los síntomas en un brote.",wrong:{A:"El período de latencia se refiere al tiempo hasta que el huésped puede transmitir el agente, no a la aparición de síntomas.",C:"El período de remisión describe la disminución de síntomas durante la enfermedad, no el intervalo inicial tras la exposición.",D:"El período de recuperación corresponde a la fase de resolución de la enfermedad, no al tiempo previo a los síntomas."}},
{id:"26f2-sp3",area:"SP",q:"La ley que crea el Sistema Nacional de Salud señala que el pilar básico del Sistema es:",opts:[["A","El concepto científico de atención integral de la salud que armoniza protección de la salud, prevención de la enfermedad, curación y rehabilitación del enfermo controlando las causas bio-socio-económicas y culturales de la enfermedad"],["B","La universalización del seguro médico nacional obligatorio y del seguro de la seguridad social, de cooperativas e internacionales"],["C","La medicina especializada de alto costo y complejidad tecnológica concentrada en hospitales de segundo y tercer nivel de atención, así como de cuarto nivel, cuando corresponda"],["D","La descentralización financiera de los hospitales públicos y privados, de las regiones sanitarias y de los consejos de salud"]],ans:"A",exp:"La ley que crea el Sistema Nacional de Salud establece como pilar básico el concepto científico de atención integral, que armoniza promoción, prevención, curación y rehabilitación.",wrong:{B:"La universalización del seguro médico es un mecanismo o meta derivada, no el pilar básico definido por la ley.",C:"La medicina especializada de alto costo contradice el enfoque integral y de atención primaria que sustenta el sistema.",D:"La descentralización financiera describe un aspecto organizativo, no el pilar conceptual básico del sistema."}},
{id:"26f2-sp4",area:"SP",q:"Según el marco contextual de la Política Nacional de Salud 2015 – 2030, el Sistema Nacional de Salud de Paraguay se caracteriza por ser un Sistema:",opts:[["A","Único de salud"],["B","Único y universal"],["C","Segmentado y fragmentado"],["D","Basado predominantemente, en el modelo de seguridad social"]],ans:"C",exp:"El Sistema Nacional de Salud de Paraguay se caracteriza, según la Política Nacional de Salud 2015-2030, por ser segmentado y fragmentado.",wrong:{A:"El sistema paraguayo no es único; coexisten múltiples subsectores sin integración plena.",B:"El sistema no es único ni universal en la práctica, dada la coexistencia de subsectores desarticulados.",D:"La seguridad social (IPS) cubre solo una fracción de la población, no es el modelo predominante del sistema."}},
{id:"26f2-sp5",area:"SP",q:"La segmentación del sistema de salud paraguayo tiene como consecuencia que, aunque todos tengan el mismo derecho declarado en la Constitución Nacional:",opts:[["A","El IPS garantiza cobertura complementaria a quienes no acceden al MSPBS"],["B","El acceso efectivo a los servicios es uniforme para toda la población gracias a la red del MSPBS"],["C","Los beneficios para la atención a la salud no son los mismos para todas las personas"],["D","La Superintendencia de Salud regula la calidad para garantizar equidad entre subsistemas"]],ans:"C",exp:"La segmentación implica que, aunque el derecho a la salud sea universal en la Constitución, los beneficios reales de atención no son iguales para todas las personas.",wrong:{A:"El IPS cubre principalmente a sus afiliados cotizantes, no ofrece cobertura complementaria universal a quienes no acceden al MSPBS.",B:"El acceso efectivo no es uniforme; existen marcadas inequidades entre subsectores y regiones.",D:"La Superintendencia de Salud no logra garantizar equidad plena entre subsistemas, que es justamente el problema de la segmentación."}},
{id:"26f2-sp6",area:"SP",q:"Según los Indicadores Básicos de Salud 2024, ¿con qué finalidad se emplea principalmente la tasa de mortalidad ajustada por edad?",opts:[["A","Evaluar el riesgo de muerte a nivel individual"],["B","Permitir la comparación de la mortalidad entre poblaciones con distintas estructuras etarias"],["C","Determinar la letalidad de eventos específicos"],["D","Estimar la incidencia de enfermedades en la población"]],ans:"B",exp:"La tasa de mortalidad ajustada por edad permite comparar la mortalidad entre poblaciones con estructuras etarias distintas, eliminando el efecto del envejecimiento poblacional.",wrong:{A:"La tasa ajustada se usa para comparaciones poblacionales, no para evaluar el riesgo de un individuo particular.",C:"La letalidad de eventos específicos se mide con otro indicador (tasa de letalidad), no con la tasa ajustada por edad.",D:"La incidencia mide casos nuevos de enfermedad, un concepto distinto al de mortalidad ajustada."}},
{id:"26f2-sp7",area:"SP",q:"La cohesión social actúa en el modelo de determinantes como:",opts:[["A","Un determinante estructural aislado"],["B","Un indicador exclusivo de pobreza"],["C","Un factor biológico protector"],["D","Un mediador entre posición social y condiciones de salud"]],ans:"D",exp:"La cohesión social actúa como mediadora entre la posición social de las personas y sus condiciones de salud, dentro del modelo de determinantes sociales.",wrong:{A:"La cohesión social no actúa de forma aislada; se relaciona con otros determinantes estructurales del modelo.",B:"La cohesión social no es un indicador exclusivo de pobreza, sino un concepto más amplio de vínculo social.",C:"La cohesión social es un constructo social, no un factor biológico dentro del modelo de determinantes."}},
{id:"26f2-sp8",area:"SP",q:"De acuerdo a los Indicadores Básicos de Salud 2024, ¿qué indicador evalúa directamente la calidad del control prenatal?",opts:[["A","Razón de mortalidad materna"],["B","Porcentaje de madres con 4 o más controles prenatales"],["C","Porcentaje de partos institucionales"],["D","Tasa de mortalidad neonatal"]],ans:"B",exp:"El porcentaje de madres con 4 o más controles prenatales es el indicador que evalúa directamente la calidad del control prenatal.",wrong:{A:"La razón de mortalidad materna mide un desenlace grave, no la calidad del proceso de control prenatal en sí.",C:"El porcentaje de partos institucionales evalúa la atención del parto, no la calidad del seguimiento prenatal.",D:"La mortalidad neonatal es un resultado posterior al parto, no un indicador directo de la calidad del control prenatal."}},
