{id:"23f1-c17",area:"CIR",q:"En el síndrome de Zollinger-Ellison, el gastrinoma se encuentra ubicado preferentemente en:",opts:[["A","Estómago"],["B","Esófago"],["C","Páncreas"],["D","Colon"]],ans:"C",exp:"En el síndrome de Zollinger-Ellison, el gastrinoma se localiza preferentemente en el páncreas (y en el llamado triángulo del gastrinoma duodenopancreático).",wrong:{A:"El estómago no es el sitio preferente de localización del gastrinoma en el síndrome de Zollinger-Ellison.",B:"El esófago no forma parte del triángulo del gastrinoma ni es sitio habitual de este tumor.",D:"El colon no es una localización descrita para el gastrinoma en este síndrome."}},
{id:"23f1-c18",area:"CIR",q:"La prueba de sangre oculta en heces:",opts:[["A","Reduce la mortalidad por cáncer colorrectal en 90%"],["B","Es un estudio con baja sensibilidad que no detecta hasta la mitad de los cánceres"],["C","Posee una alta especificidad para detectar el cáncer colorrectal"],["D","Luego de una prueba positiva, debe evaluarse la necesidad o no de la colonoscopía"]],ans:"D",exp:"La prueba de sangre oculta en heces tiene sensibilidad limitada (no detecta hasta la mitad de los cánceres) y un resultado positivo obliga a evaluar la necesidad de colonoscopía.",wrong:{A:"La reducción de mortalidad demostrada con el tamizaje de sangre oculta es mucho menor al 90% reportado en la opción.",B:"Afirmar baja sensibilidad sin matices es incompleto; el punto clave clínico es la conducta ante un resultado positivo.",C:"La prueba de sangre oculta tiene especificidad limitada, con falsos positivos por otras causas de sangrado digestivo."}},
{id:"23f1-c19",area:"CIR",q:"Acerca del absceso hepático piógeno:",opts:[["A","Debe iniciarse antibióticos contra gram positivos"],["B","La ictericia es el motivo principal de consulta"],["C","Está causado principalmente por estafilococos y estreptococos"],["D","Es más frecuente en el lóbulo derecho"]],ans:"D",exp:"El absceso hepático piógeno es más frecuente en el lóbulo derecho del hígado, por su mayor volumen y el flujo portal preferencial desde el territorio mesentérico-apendicular.",wrong:{A:"El absceso hepático piógeno requiere cobertura empírica de gramnegativos y anaerobios, no solo grampositivos.",B:"La fiebre y el dolor en hipocondrio derecho, no la ictericia, son el motivo de consulta más frecuente.",C:"El absceso piógeno suele ser polimicrobiano con predominio de enterobacterias y anaerobios, no solo estafilococos y estreptococos."}},
{id:"23f1-c20",area:"CIR",q:"Sobre el objetivo de la reanimación inicial hídrica en trauma:",opts:[["A","Consiste en restablecer la perfusión hística"],["B","En adultos, requiere reanimación con líquidos de 4 litros"],["C","En niños, requiere reanimación con líquidos a 2 ml/kg"],["D","Indica evitar las transfusiones en fases iniciales"]],ans:"A",exp:"El objetivo primario de la reanimación hídrica inicial en trauma es restablecer la perfusión tisular (hística), no simplemente alcanzar un volumen fijo predeterminado.",wrong:{B:"La reanimación en trauma se guía por respuesta clínica y perfusión, no por un volumen fijo de 4 litros en todos los adultos.",C:"La reanimación pediátrica se calcula en bolos de 20 mL/kg, no 2 mL/kg.",D:"La transfusión temprana de hemoderivados está indicada en shock hemorrágico significativo, no debe evitarse en fases iniciales."}},
{id:"23f1-c21",area:"CIR",q:"Paciente de sexo femenino, 60 años de edad con diabetes de inicio reciente, acude por dolor abdominal y pérdida de peso del 10%. En la tomografía contrastada se evidencia una lesión en cabeza de páncreas con nódulos hepáticos compatibles con metástasis. ¿Cómo procedería con esta paciente?",opts:[["A","Duodeno pancreatectomía cefálica"],["B","Quimio - radioterapia neoadyuvante"],["C","Quimioterapia paliativa"],["D","Ablación por radiofrecuencia"]],ans:"C",exp:"Ante metástasis hepáticas ya establecidas en cáncer de páncreas, el tratamiento deja de ser quirúrgico curativo y pasa a ser quimioterapia paliativa.",wrong:{A:"La duodenopancreatectomía está contraindicada ante metástasis hepáticas a distancia ya establecidas.",B:"La quimiorradioterapia neoadyuvante se reserva para enfermedad localmente avanzada potencialmente resecable, no para enfermedad metastásica.",D:"La ablación por radiofrecuencia no es el manejo estándar de la enfermedad metastásica difusa por cáncer de páncreas."}},
{id:"23f1-c22",area:"CIR",q:"¿Cuál es el área de afectación más frecuente de las infecciones agresivas del tejido blando?",opts:[["A","Extremidades"],["B","Perineo"],["C","Tronco"],["D","Dorso"]],ans:"A",exp:"Las infecciones necrotizantes agresivas de tejidos blandos afectan con mayor frecuencia las extremidades.",wrong:{B:"El perineo es sitio característico de la gangrena de Fournier, pero menos frecuente en conjunto que las extremidades.",C:"El tronco es un sitio posible pero menos frecuente que las extremidades para las infecciones necrotizantes.",D:"El dorso no es el área de afectación más común descrita para las infecciones agresivas de tejidos blandos."}},
{id:"23f1-c23",area:"CIR",q:"Paciente de sexo femenino, de 40 años, acude al consultorio de cirugía refiriendo presentar cuadro de varios meses de evolución, de dolor torácico a menudo posprandial, y disfagia a alimentos sólidos más frecuentemente que a líquidos. Se le medica con omeprazol 20mg/día no cediendo los síntomas, por lo que se solicita un esofagograma, en el cual se constata un \"esófago anillado\" o \"esófago felino\". ¿Cuál es el primer diagnóstico a plantear?",opts:[["A","Esofagitis eosinofílica"],["B","Esclerodermia"],["C","Acalasia"],["D","Enfermedad por reflujo gastroesofágico"]],ans:"A",exp:"El hallazgo endoscópico de \"esófago anillado/felino\" con disfagia a sólidos y dolor torácico posprandial, sin respuesta a IBP, es característico de esofagitis eosinofílica.",wrong:{B:"La esclerodermia produce hipomotilidad con reflujo severo, pero no el hallazgo endoscópico de esófago anillado descrito.",C:"La acalasia se caracteriza por ausencia de peristalsis y disfagia progresiva, no por el patrón anillado 'felino' descrito.",D:"La ERGE simple no explica el hallazgo endoscópico característico de anillos concéntricos ('esófago felino')."}},
{id:"23f1-c24",area:"CIR",q:"Teniendo en cuenta los problemas posteriores a la gastrectomía, ¿cómo se denomina a la hipoglucemia posprandial que ocurre 2 a 3 horas posteriores a la ingesta de alimentos, y que mejora mediante la administración de azúcar?",opts:[["A","Dumping precoz"],["B","Síndrome del asa aferente"],["C","Síndrome del asa eferente"],["D","Dumping tardío"]],ans:"D",exp:"La hipoglucemia posprandial tardía (2-3 h después de comer), que mejora con azúcar, corresponde al dumping tardío, causado por hiperinsulinismo reactivo tras la absorción rápida de glucosa.",wrong:{A:"El dumping precoz ocurre 15-30 minutos posprandiales con síntomas vasomotores, no hipoglucemia a las 2-3 horas.",B:"El síndrome de asa aferente cursa con dolor y vómito bilioso, no con hipoglucemia posprandial tardía.",C:"El síndrome de asa eferente se manifiesta con obstrucción intestinal, no con hipoglucemia tardía tras la ingesta."}},
{id:"23f1-c25",area:"CIR",q:"¿Cuál es el tratamiento de elección en la tirotoxicosis recurrente luego de la tiroidectomía por enfermedad de Graves?",opts:[["A","Re intervención quirúrgica"],["B","Inhibición farmacológica"],["C","Ablación con yodo radiactivo"],["D","Esteroides"]],ans:"C",exp:"La ablación con yodo radiactivo es el tratamiento de elección ante recurrencia de tirotoxicosis por enfermedad de Graves luego de una tiroidectomía.",wrong:{A:"La reintervención quirúrgica conlleva mayor riesgo de complicaciones (lesión de nervio recurrente, paratiroides) en un cuello ya operado.",B:"La inhibición farmacológica con antitiroideos suele reservarse para preparación previa, no como tratamiento definitivo de la recurrencia.",D:"Los esteroides no tratan la causa de la tirotoxicosis recurrente; solo se usan en contextos específicos como la tormenta tiroidea."}},
{id:"23f1-c26",area:"CIR",q:"¿Cuáles son los sitios más comunes de afectación en la enfermedad de Crohn?",opts:[["A","Íleon terminal y ciego"],["B","Estómago y duodeno"],["C","Colon transverso y descendente"],["D","Recto y ano"]],ans:"A",exp:"El íleon terminal y el ciego son los sitios más comúnmente afectados por la enfermedad de Crohn.",wrong:{B:"El estómago y duodeno pueden afectarse en la enfermedad de Crohn, pero no son los sitios más comunes.",C:"El colon transverso y descendente pueden verse comprometidos, pero con menor frecuencia que la región ileocecal.",D:"El recto y el ano pueden afectarse, especialmente con fístulas perianales, pero no son el sitio de mayor frecuencia global."}},
{id:"23f1-c27",area:"CIR",q:"¿Cuál es la causa más frecuente de los quistes esplénicos?",opts:[["A","Infección parasitaria"],["B","Traumatismos"],["C","Tumores"],["D","Congénitos"]],ans:"A",exp:"La infección parasitaria (particularmente hidatidosis) es la causa más frecuente de los quistes esplénicos verdaderos.",wrong:{B:"Los traumatismos pueden causar pseudoquistes esplénicos, pero son menos frecuentes que los de origen parasitario en zonas endémicas.",C:"Los tumores son una causa infrecuente de quistes esplénicos comparados con la etiología parasitaria.",D:"Los quistes congénitos (epidermoides) son menos comunes que los de origen parasitario como causa global de quistes esplénicos."}},
{id:"23f1-c28",area:"CIR",q:"¿A qué tipo corresponden los quistes biliares múltiples que afectan los conductos intra y extrahepáticos?",opts:[["A","II"],["B","III"],["C","IVa"],["D","IVb"]],ans:"C",exp:"Los quistes de colédoco tipo IVa (Todani) afectan simultáneamente los conductos biliares intra y extrahepáticos.",wrong:{A:"El tipo II corresponde a un divertículo aislado del colédoco extrahepático, no a afectación combinada intra y extrahepática.",B:"El tipo III corresponde al coledococele, una dilatación quística de la porción intraduodenal del colédoco, no a afectación bilateral.",D:"El tipo IVb corresponde a múltiples quistes limitados a la vía biliar extrahepática, sin compromiso intrahepático."}},
{id:"23f1-c29",area:"CIR",q:"En la exploración física del abdomen, el \"signo de Tillaux\" se presenta más frecuentemente en:",opts:[["A","Tumores del epiplón"],["B","Mesenteritis esclerosante"],["C","Quistes del mesenterio"],["D","Carcinomatosis peritoneal"]],ans:"C",exp:"El signo de Tillaux (masa palpable con ruidos hidroaéreos audibles en su interior) se asocia clásicamente a los quistes del mesenterio.",wrong:{A:"Los tumores del epiplón no se asocian clásicamente al signo de Tillaux descrito para masas quísticas móviles.",B:"La mesenteritis esclerosante produce una masa más fija e infiltrativa, sin el signo hidroaéreo característico de Tillaux.",D:"La carcinomatosis peritoneal se presenta con ascitis y nódulos difusos, no con una masa quística única con el signo de Tillaux."}},
{id:"23f1-c30",area:"CIR",q:"Sobre los síntomas de la apendicitis aguda, podemos afirmar que:",opts:[["A","La manifestación inicial más usual es el dolor sordo en la fosa ilíaca derecha"],["B","La aparición de síntomas digestivos, previamente al dolor típico, sugieren el compromiso apendicular"],["C","La anorexia tiene una baja sensibilidad para el diagnóstico"],["D","La diarrea puede asociarse a la presencia de perforación"]],ans:"D",exp:"La diarrea en el contexto de apendicitis aguda puede asociarse a perforación con irritación peritoneal pélvica, a diferencia del cuadro clásico sin diarrea.",wrong:{A:"El dolor periumbilical difuso, no el dolor localizado en fosa ilíaca derecha, es la manifestación inicial más típica de la apendicitis.",B:"Los síntomas digestivos previos al dolor típico sugieren gastroenteritis, restando especificidad al diagnóstico de apendicitis, no confirmándolo.",C:"La anorexia tiene alta sensibilidad y es un hallazgo temprano frecuente en la apendicitis aguda, no de baja sensibilidad."}},
{id:"23f1-g1",area:"GO",q:"Son variables de mal pronóstico en el cáncer endometrial:",opts:[["A","Citología peritoneal negativa para células cancerosas en tumores grandes"],["B","Presencia de invasión miometrial con invasión del espacio vascular linfático"],["C","Tumores en mujeres jóvenes y etapa quirúrgica avanzada"],["D","Niveles bajos de expresión tumoral de Receptores de estrogenos (ER) y progesterona (PR)"]],ans:"B",exp:"La invasión miometrial acompañada de invasión del espacio vascular linfático es una variable de mal pronóstico establecida en el cáncer de endometrio.",wrong:{A:"La citología peritoneal negativa es un hallazgo favorable; es la citología positiva la que se asocia a mal pronóstico.",C:"La edad joven es en general un factor favorable; es la combinación con etapa avanzada, no la juventud en sí, lo que ensombrece el pronóstico.",D:"Los receptores hormonales bajos se asocian a peor pronóstico, pero es un marcador molecular secundario frente a la invasión miometrial con compromiso linfovascular."}},
{id:"23f1-g2",area:"GO",q:"La incontinencia urinaria en la mujer puede producirse por:",opts:[["A","Disminución de la presión de cierre uretral"],["B","Aumento de la presión intrauretral"],["C","Contracción del músculo detrusor y relajación del esfínter uretral"],["D","Fármacos que relajan el esfínter uretral y los músculos elevadores del ano"]],ans:"A",exp:"La disminución de la presión de cierre uretral (insuficiencia esfinteriana) es un mecanismo reconocido de incontinencia urinaria de esfuerzo en la mujer.",wrong:{B:"Un aumento de la presión intrauretral favorecería la continencia, no la incontinencia.",C:"Esto describe el mecanismo de la micción voluntaria o de urgencia, no el de la incontinencia de esfuerzo por insuficiencia esfinteriana.",D:"Los fármacos relajantes son una causa farmacológica secundaria, no el mecanismo fisiopatológico principal descrito."}},
{id:"23f1-g3",area:"GO",q:"La transición a la menopausia se caracteriza por:",opts:[["A","Anovulación y cese de menstruaciones"],["B","FSH elevada, ciclos irregulares, anovulación"],["C","Ciclos de 60 días, FSH normal, estradiol normal"],["D","Ciclos regulares, FSH baja, estradiol aumentado"]],ans:"B",exp:"La transición a la menopausia se caracteriza por FSH elevada, ciclos irregulares y anovulación, reflejo de la declinación de la reserva ovárica.",wrong:{A:"El cese completo de menstruaciones define la menopausia establecida, no la fase de transición.",C:"En la transición menopáusica la FSH está elevada, no normal, reflejando la declinación de la reserva ovárica.",D:"Ciclos regulares con FSH baja describen la función ovárica reproductiva normal, no la transición a la menopausia."}},
{id:"23f1-g4",area:"GO",q:"En los mecanismos hormonales implicados en la génesis de los implantes endometriosicos ocurre:",opts:[["A","Conversión de androstenediona a estradiol por la 17-ß hidroesteroide deshidrogenasa tipo 1"],["B","Se suprime la expresión del receptor α estrogénico, lo cual disminuye la inducción del receptor de progesterona"],["C","Se incrementa la actividad de 17-ß hidroesteroide deshidrogenasa tipo 2"],["D","Se reprime la actividad de las MMP (metaloproteinasas de la matriz) resultante de la resistencia a la progesterona"]],ans:"B",exp:"En la endometriosis, la resistencia a la progesterona suprime la expresión del receptor estrogénico α, lo que a su vez reduce la inducción normal del receptor de progesterona.",wrong:{A:"La aromatasa convierte androstenediona en estrona; la 17-ß-HSD tipo 1 actúa después transformando estrona en estradiol, no directamente sobre la androstenediona.",C:"La actividad de la 17-ß-HSD tipo 2, que inactiva estradiol, está reducida en la endometriosis, no incrementada.",D:"La resistencia a la progesterona desinhibe la actividad de las MMP, no la reprime."}},
{id:"23f1-g5",area:"GO",q:"En la patogenia de la alopecia que se observa en el síndrome de ovario poliquístico, intervienen, señalar lo correcto:",opts:[["A","Exceso de actividad de la 5 alfa reductasa"],["B","Disminución en la producción de 21 – hidroxilasa"],["C","Disminución de la concentración de Di hidrotestosterona"],["D","Aumento de las globulinas transportadoras de hormonas sexuales"]],ans:"A",exp:"El exceso de actividad de la 5-alfa reductasa, que convierte testosterona en dihidrotestosterona más potente, interviene en la patogenia de la alopecia androgénica del SOP.",wrong:{B:"La deficiencia de 21-hidroxilasa se relaciona con la hiperplasia suprarrenal congénita, no con la alopecia del SOP.",C:"En el SOP existe un aumento, no una disminución, de dihidrotestosterona, la responsable de la alopecia androgénica.",D:"En el SOP la SHBG suele estar disminuida por la hiperinsulinemia, no aumentada, lo que eleva los andrógenos libres."}},
{id:"23f1-g6",area:"GO",q:"La sonohisterografia, como método de diagnóstico en ginecología consiste en",opts:[["A","Ecografía con solución salina en cavidad endometrial a través de un catéter"],["B","Mide la rigidez de un tejido en estado fisiológico y patológico"],["C","Inyección de un contraste ecógeno durante la ecografía en tiempo real"],["D","Tiene tres componentes principales: volumen, procesamiento y visualización"]],ans:"A",exp:"La sonohisterografía consiste en instilar solución salina en la cavidad endometrial a través de un catéter mientras se realiza ecografía, mejorando la visualización de la cavidad uterina.",wrong:{B:"Esto describe la elastografía, una técnica que mide rigidez tisular, no la sonohisterografía.",C:"Esto corresponde a la ecografía con contraste, no a la instilación simple de solución salina de la sonohisterografía.",D:"Esta descripción corresponde a la ecografía tridimensional, no a la técnica de sonohisterografía."}},
{id:"23f1-g7",area:"GO",q:"Usted detecta en una paciente el \"Signo del surco\". Este surco característico es producto de la linfadenomegalia con confluencia de ganglios en uno y otro lado del arco crural y acompaña al cuadro de:",opts:[["A","Chancroide"],["B","Linfogranuloma venéreo"],["C","Sífilis"],["D","Virus herpes simple"]],ans:"B",exp:"El signo del surco, por linfadenomegalia inguinal bilateral confluente, es característico del linfogranuloma venéreo.",wrong:{A:"El chancroide produce adenopatía inguinal dolorosa y supurativa, pero no es la causa clásica del signo del surco.",C:"La sífilis produce adenopatía inguinal indolora, pero no se asocia clásicamente al signo del surco.",D:"El herpes simple genera adenopatía reactiva por vesículas dolorosas, no el signo del surco descrito."}},
{id:"23f1-g8",area:"GO",q:"Usted recibe a una paciente adolescente, nulípara, con antecedente de conducta sexual promiscua cuyo motivo de consulta es una lesión ulcerosa en genitales externos y región perianal, no dolorosa, aislada, que tiene bordes redondeados y elevados y una base no infectada, sin otros síntomas. Su diagnóstico probable es:",opts:[["A","Linfogranuloma"],["B","Chancroide"],["C","Virus Papiloma Humano"],["D","Chancro sifilítico"]],ans:"D",exp:"Una úlcera genital única, indolora, de bordes indurados y elevados, en paciente con conducta sexual de riesgo, es el cuadro clásico del chancro sifilítico (sífilis primaria).",wrong:{A:"El linfogranuloma venéreo cursa con una lesión inicial fugaz y poco notoria, no con la úlcera indurada e indolora descrita.",B:"El chancroide produce úlceras dolorosas, de bordes irregulares y base sucia, a diferencia de la lesión indolora descrita.",C:"El virus del papiloma humano produce lesiones verrugosas (condilomas), no una úlcera genital."}},
{id:"23f1-g9",area:"GO",q:"Con respecto a la patogenia de los leiomiomas, marque lo correcto:",opts:[["A","Provienen de líneas citogenéticas independientes en un mismo útero"],["B","Aparecen fuera de los años reproductivos"],["C","Surgen tumores nuevos luego de la menopausia y tienden a ser tumores de gran tamaño"],["D","Las células contienen escasos receptores de estrógenos"]],ans:"A",exp:"Los leiomiomas uterinos son de origen monoclonal, pero distintos miomas en un mismo útero pueden provenir de líneas citogenéticas independientes entre sí.",wrong:{B:"Los leiomiomas son tumores dependientes de estrógenos que aparecen predominantemente en la edad reproductiva, no fuera de ella.",C:"Tras la menopausia los miomas tienden a involucionar y reducir su tamaño por la caída estrogénica, no a crecer como tumores nuevos grandes.",D:"Los leiomiomas contienen abundantes receptores de estrógeno y progesterona, no escasos."}},
{id:"23f1-g10",area:"GO",q:"Las neoplasias escamosas vulvares se desarrollan predominantemente en:",opts:[["A","Triángulos urogenitales"],["B","Región del clítoris"],["C","Línea de Hart"],["D","Glándulas de Bartholino"]],ans:"C",exp:"Las neoplasias escamosas de la vulva se desarrollan predominantemente a partir de la línea de Hart, el límite entre la piel queratinizada y la mucosa vulvar.",wrong:{A:"Los triángulos urogenitales son una referencia anatómica general, no el sitio histológico específico de origen descrito.",B:"El clítoris no es la localización predominante de desarrollo de las neoplasias escamosas vulvares.",D:"Los tumores de las glándulas de Bartholino son mayoritariamente de origen glandular, no escamoso vulvar típico."}},
{id:"23f1-g11",area:"GO",q:"Durante el uso de los anticonceptivos, los quistes ováricos funcionales se forman con mayor frecuencia en mujeres que utilizan:",opts:[["A","Anticonceptivos orales combinados"],["B","Anticonceptivos trandérmicos de estrógenos asociados a progestágenos"],["C","Dispositivos intrauterinos metálicos"],["D","Anticonceptivos que contienen sólo progestágeno"]],ans:"D",exp:"Los anticonceptivos que contienen solo progestágeno se asocian con mayor formación de quistes ováricos funcionales, al no suprimir completamente la actividad folicular.",wrong:{A:"Los anticonceptivos combinados suprimen la ovulación de forma más completa, con menor riesgo de quistes funcionales.",B:"Los preparados transdérmicos combinados también suprimen más completamente la actividad folicular que los de solo progestágeno.",C:"El DIU de cobre no tiene efecto hormonal supresor sobre la ovulación; su mecanismo no se relaciona con esta formación de quistes."}},
{id:"23f1-g12",area:"GO",q:"Dentro de las complicaciones en el puerperio es característico del flemón parametrial:",opts:[["A","Generalmente son bilaterales"],["B","Se limitan a la región parametrial en la base del ligamento ancho"],["C","Se acompaña de necrosis considerable de los tejidos circundantes a la incisión abdominal o la episiotomía"],["D","Tiende a extenderse por los trayectos venosos pudiendo provocar trombosis"]],ans:"B",exp:"El flemón parametrial puerperal se limita característicamente a la región parametrial en la base del ligamento ancho.",wrong:{A:"Los flemones parametriales suelen ser unilaterales, no bilaterales.",C:"La necrosis extensa de tejidos circundantes a la herida describe la fascitis necrotizante, no el flemón parametrial.",D:"La extensión por trayectos venosos con trombosis describe la tromboflebitis pélvica séptica, no el flemón parametrial."}},
{id:"23f1-g13",area:"GO",q:"Respecto al reinicio del coito después del parto, el epitelio vaginal es delgado y existe muy poca lubricación después de la estimulación sexual, lo que se debe a un estado:",opts:[["A","Hipoestrogénico consecutivo al parto"],["B","Hiperestrogénico asociada a la lactancia materna"],["C","Hiperprolactínico asociado a la bajada de leche materna"],["D","Hiperandrogénico por la descarga masiva de FSH (hormona foliculoestimulante)"]],ans:"A",exp:"Tras el parto, el estado hipoestrogénico (especialmente durante la lactancia) produce adelgazamiento del epitelio vaginal y escasa lubricación ante la estimulación sexual.",wrong:{B:"La lactancia se asocia a un estado hipoestrogénico por supresión del eje, no hiperestrogénico.",C:"La hiperprolactinemia fisiológica de la lactancia contribuye indirectamente, pero el adelgazamiento epitelial se debe directamente al hipoestrogenismo.",D:"No existe tal descarga de FSH postparto ni relación de este cuadro con hiperandrogenismo."}},
{id:"23f1-g14",area:"GO",q:"En la histerectomia total periparto, la condición que puede dificultar la identificación de la unión cervicovaginal por palpación constituye:",opts:[["A","El borramiento y la dilatación considerable del cuello uterino"],["B","La tortuosidad de las arterias uterinas que aumentan su calibre considerablemente durante el embarazo"],["C","El engrosamiento de los parametrios por la imbibición gravídica"],["D","La elevación sostenida del anillo de Bandl"]],ans:"A",exp:"El borramiento y la dilatación considerable del cuello uterino dificultan identificar por palpación la unión cervicovaginal durante la histerectomía periparto.",wrong:{B:"La tortuosidad vascular complica el control de las arterias uterinas, no la identificación palpatoria de la unión cervicovaginal.",C:"El engrosamiento parametrial dificulta la disección de los parametrios, no específicamente la palpación de la unión cervicovaginal.",D:"El anillo de Bandl es un hallazgo patológico de obstrucción, no la condición fisiológica gravídica que dificulta esta identificación."}},
{id:"23f1-g15",area:"GO",q:"Dentro de la clasificación de las presentaciones pélvicas, en el denominado feto astrónomo, el mismo se encuentra con:",opts:[["A","El eje del hombro fetal perpendicular al eje de sus caderas"],["B","La cabeza en hiperflexión forzada"],["C","La cabeza en hiperextensión extrema"],["D","Las nalgas por encima del estrecho superior de la pelvis materna"]],ans:"C",exp:"En la presentación pélvica denominada \"feto astrónomo\", la cabeza fetal se encuentra en hiperextensión extrema (mirando hacia arriba).",wrong:{A:"Esto describe la relación de los hombros fetales, no la posición cefálica que define al feto astrónomo.",B:"El feto astrónomo se caracteriza por hiperextensión, no por hiperflexión de la cabeza.",D:"Esto describe una característica general de la presentación pélvica, no la variedad específica de hiperextensión cefálica del feto astrónomo."}},
{id:"23f1-g16",area:"GO",q:"Durante el periodo expulsivo del trabajo de parto en una presentación cefálica, luego de la salida de la cabeza fetal se produce la rotación externa que indica lo siguiente:",opts:[["A","El diámetro biacromial ha rotado en el diámetro anteroposterior de la pelvis"],["B","Se produjo el descenso del hombro anterior por debajo de la sínfisis materna"],["C","El diámetro oblicuo izquierdo materno se puso en concordancia con el diámetro biparietal"],["D","Se produjo el descenso del hombro posterior por fuera del coxis materno"]],ans:"A",exp:"La rotación externa tras la salida de la cabeza indica que el diámetro biacromial de los hombros ha rotado hacia el diámetro anteroposterior de la pelvis materna.",wrong:{B:"El descenso del hombro anterior bajo la sínfisis es un evento posterior del desprendimiento de hombros, no lo que señala la rotación externa.",C:"Esto describe el encajamiento cefálico previo, no el evento de rotación externa tras la salida de la cabeza.",D:"El descenso del hombro posterior es parte del desprendimiento de hombros, un paso posterior a la rotación externa."}},
{id:"23f1-g17",area:"GO",q:"En la episiotomía media, es característico de esta técnica respecto a la mediolateral, lo siguiente:",opts:[["A","La reparación quirúrgica resulta más difícil"],["B","La cicatrización defectuosa es más frecuente"],["C","El dolor posoperatorio es mínimo"],["D","La hemorragia resulta ser mayor"]],ans:"C",exp:"La episiotomía media tiene menor dolor posoperatorio que la mediolateral, aunque con mayor riesgo de extensión hacia el esfínter anal.",wrong:{A:"La episiotomía media es, por el contrario, más fácil de reparar que la mediolateral.",B:"La cicatrización de la episiotomía media suele ser mejor, no más defectuosa, que la de la mediolateral.",D:"La episiotomía media produce menor sangrado, no mayor, en comparación con la mediolateral."}},
{id:"23f1-g18",area:"GO",q:"La Hipotensión materna es una complicación frecuente luego de la utilización de un anestésico preparto y esto se debe principalmente a:",opts:[["A","Obstrucción del retorno venoso secundario a la compresión pulmonar de grandes vasos"],["B","Aumento de la frecuencia cardíaca, con la consecuente disminución del gasto cardiaco luego de la inyección"],["C","Vasodilatación por el bloqueo simpático"],["D","Vasoconstricción de la arteria umbilical fetal y vasos placentarios"]],ans:"C",exp:"La hipotensión materna tras la anestesia preparto se debe principalmente a vasodilatación secundaria al bloqueo simpático inducido por el anestésico.",wrong:{A:"Describe una compresión aortocava por el útero grávido con terminología inexacta, un mecanismo distinto al bloqueo simpático anestésico.",B:"La hipotensión no se debe a taquicardia con bajo gasto, sino a la vasodilatación generada por el bloqueo simpático.",D:"Esto describe un efecto sobre la circulación fetoplacentaria, no la causa de la hipotensión materna."}},
{id:"23f1-g19",area:"GO",q:"Las dos causas más frecuentes de desaceleración tardía en una cardiotocografía intra parto son:",opts:[["A","Hipertensión portal materna y exceso de movimientos fetales"],["B","Nudo de cordón y pinzamiento de cordón por el feto"],["C","Hipotensión materna por analgesia epidural e hiperestimulación con oxitocina"],["D","La presencia de polihidramnios al final del embarazo y la detección de placentomegalia"]],ans:"C",exp:"La hipotensión materna por analgesia epidural junto con la hiperestimulación uterina por oxitocina son las causas más frecuentes de desaceleración tardía intraparto.",wrong:{A:"Ni la hipertensión portal ni el exceso de movimientos fetales son causas reconocidas de desaceleración tardía.",B:"El nudo y la compresión de cordón se asocian a desaceleraciones variables, no a las tardías.",D:"El polihidramnios y la placentomegalia no son causas típicas descritas de desaceleración tardía."}},
{id:"23f1-g20",area:"GO",q:"En muchos casos de síndrome de aspiración meconial, es un indicador sugestivo de hipoxia crónica fetal:",opts:[["A","Concentración de eritropoyetina fetal"],["B","Concentración meconial en el líquido amniótico"],["C","Recuento de plaquetas en sangre fetal"],["D","Concentración de sodio en plasma fetal"]],ans:"A",exp:"La hipoxia fetal crónica estimula la eritropoyesis compensatoria, por lo que una concentración elevada de eritropoyetina fetal es indicador sugestivo de hipoxia crónica, a diferencia de la concentración de meconio, que refleja más bien madurez/estrés agudo.",wrong:{B:"La concentración meconial en el líquido amniótico se relaciona más con madurez fetal o estrés agudo, no es el marcador bioquímico específico de hipoxia crónica.",C:"El recuento plaquetario fetal no es el marcador reconocido de hipoxia crónica intrauterina.",D:"La concentración de sodio plasmático fetal no constituye un indicador establecido de hipoxia crónica fetal."}},
{id:"23f1-g21",area:"GO",q:"La utilización del PH de la sangre capilar del cuero cabelludo fetal para confirmar el sufrimiento fetal se debe a que éste es:",opts:[["A","Mayor que el de la sangre venosa umbilical"],["B","Similar que el de la sangre venosa umbilical"],["C","Similar al de la sangre arterial umbilical"],["D","Menor que el de la sangre arterial umbilical"]],ans:"C",exp:"El pH de la sangre capilar del cuero cabelludo fetal es similar al de la sangre arterial umbilical, por lo que refleja adecuadamente el estado de oxigenación fetal.",wrong:{A:"El pH capilar fetal no es mayor que el de la sangre venosa umbilical, que está más oxigenada.",B:"La sangre venosa umbilical, al estar más oxigenada, tiene un pH distinto (mayor), no similar al capilar fetal.",D:"El pH capilar es similar al arterial umbilical, no menor."}},
{id:"23f1-g22",area:"GO",q:"Si usted tacta a una paciente en la fase de descenso fetal por el canal del parto y detecta la sutura sagital muy próxima al pubis y estamos ante un parietal posterior más descendido, estamos ante:",opts:[["A","Asinclitismo posterior"],["B","Asinclitismo anterior"],["C","Sinclitismo"],["D","Sinclitismo anterior"]],ans:"A",exp:"Cuando la sutura sagital está próxima al pubis y el parietal posterior está más descendido, se trata de un asinclitismo posterior.",wrong:{B:"El asinclitismo anterior implica el parietal anterior más descendido con la sutura hacia el promontorio, lo opuesto a lo descrito.",C:"El sinclitismo implica alineación simétrica de la sutura sagital, no la asimetría descrita en el caso.",D:"El sinclitismo anterior no describe la asimetría hacia el pubis con el parietal posterior más descendido."}},
{id:"23f1-g23",area:"GO",q:"De los elementos constituyentes de la matriz del tejido cérvico uterino el factor determinante de la disposición estructural del cérvix que corresponde a:",opts:[["A","Glicosaminoglucanos"],["B","Proteoglucanos"],["C","Elastina"],["D","Colágeno"]],ans:"D",exp:"El colágeno es el componente de la matriz cervical que determina fundamentalmente la disposición estructural y la rigidez del cérvix.",wrong:{A:"Los glicosaminoglucanos contribuyen a la hidratación tisular, pero no son el determinante principal de la disposición estructural.",B:"Los proteoglucanos modulan la organización de las fibras de colágeno, pero no son el componente estructural determinante.",C:"La elastina aporta elasticidad pero se encuentra en menor proporción, no es el factor determinante estructural del cérvix."}},
{id:"23f1-g24",area:"GO",q:"Durante el periodo de expulsión de la placenta y membranas (3ra fase del parto), existen dos mecanismos: Uno de ellos, cuando la placenta se separa primero en la periferia y la sangre acumulada entre las membranas y la pared uterina escapa por la vagina se denomina:",opts:[["A","Mecanismo de Schultz"],["B","Mecanismo de Duncan"],["C","Mecanismo de Smith"],["D","Mecanismo inverso"]],ans:"B",exp:"Cuando la placenta se separa primero por la periferia y la sangre acumulada escapa antes del alumbramiento completo, el mecanismo se denomina de Duncan.",wrong:{A:"El mecanismo de Schultz describe la separación central, con expulsión de la cara fetal primero y sin sangrado visible temprano, lo opuesto a lo descrito.",C:"Smith no es un epónimo reconocido para los mecanismos de alumbramiento placentario.",D:"'Mecanismo inverso' no es el término técnico empleado para describir este proceso de alumbramiento."}},
{id:"23f1-g25",area:"GO",q:"Toda la fuerza tensil así como la resistencia al desgarro y la rotura de las membranas fetales radica en:",opts:[["A","El amnios"],["B","El corion liso"],["C","La decidua"],["D","El corion frondoso"]],ans:"A",exp:"El amnios es la capa que aporta la mayor parte de la fuerza tensil y la resistencia al desgarro de las membranas ovulares.",wrong:{B:"El corion liso aporta menor resistencia tensil que el amnios, capa que concentra esta propiedad.",C:"La decidua es tejido de origen materno y no es la responsable de la resistencia tensil de las membranas ovulares.",D:"El corion frondoso forma parte de la placenta, no es el componente que aporta resistencia a las membranas."}},
{id:"23f1-g26",area:"GO",q:"Constituye la variedad más común de neoplasia trofoblástica después de un embarazo de término o un aborto:",opts:[["A","Mola invasora"],["B","Coriocarcinoma gestacional"],["C","Tumor trofoblástico placentario"],["D","Tumor trofoblástico epiteloide"]],ans:"B",exp:"El coriocarcinoma gestacional es la neoplasia trofoblástica más común después de un embarazo de término o de un aborto (a diferencia de la mola invasora, que sigue típicamente a una mola hidatiforme).",wrong:{A:"La mola invasora sigue típicamente a una mola hidatiforme previa, no a un embarazo de término o aborto.",C:"El tumor trofoblástico del sitio placentario es una variedad infrecuente, no la más común tras embarazo o aborto.",D:"El tumor trofoblástico epitelioide es la variedad más rara de neoplasia trofoblástica, no la más frecuente."}},
{id:"23f1-g27",area:"GO",q:"Los hallazgos clínicos para el diagnóstico de acretismo placentario incluyen:",opts:[["A","La cantidad de sangrado excepcionalmente es muy importante y es inusual que aparezca durante el embarazo"],["B","El sangrado genital durante el embarazo puede ser común y se confunde con otras entidades"],["C","La clínica es muy frecuente que se presente en el primer trimestre, y es raro en el post parto inmediato"],["D","Se asocia frecuentemente a factores de riesgo como la nuliparidad y pacientes jóvenes"]],ans:"B",exp:"En el acretismo placentario, el sangrado genital durante el embarazo suele ser inespecífico y puede confundirse fácilmente con otras causas de hemorragia.",wrong:{A:"El sangrado durante el embarazo suele ser variable e inespecífico, no excepcionalmente importante ni inusual como se plantea.",C:"La manifestación clásica y grave ocurre en el postparto inmediato al intentar el alumbramiento, no predominantemente en el primer trimestre.",D:"El acretismo se asocia a multiparidad y cirugía uterina previa (cesáreas), no a nuliparidad en pacientes jóvenes."}},
{id:"23f1-g28",area:"GO",q:"Son contraindicaciones para inhibir un trabajo de parto pretérmino:",opts:[["A","Trabajo de parto con dilatación menor a 4 cms"],["B","Sagrados uterinos de cualquier intensidad"],["C","Restricción del crecimiento intrauterino"],["D","Hipertiroidismo compensado"]],ans:"C",exp:"La restricción del crecimiento intrauterino es una contraindicación para inhibir el trabajo de parto pretérmino, ya que prolongar la gestación puede ser más riesgoso que el nacimiento.",wrong:{A:"Una dilatación menor a 4 cm favorece, más bien, el intento de tocólisis; es la dilatación avanzada la que la contraindica.",B:"Solo el sangrado significativo contraindica la tocólisis; un sangrado leve de cualquier intensidad no es, por sí mismo, la contraindicación descrita.",D:"El hipertiroidismo compensado no representa una contraindicación relevante para la tocólisis."}},
{id:"23f1-g29",area:"GO",q:"Realizado el triage, con la escala de alerta precoz obstétrica (EAPO) e independientemente a la clasificación constituida con la misma, se debe continuar evaluando la paciente con la escala hasta el alta o fin del proceso de atención de la paciente. El tiempo de los controles se instala según la clasificación de la EAPO:",opts:[["A","Rojo, cada 5 a 10 minutos"],["B","Amarillo, cada 20 a 30 minutos"],["C","Verde, cada 60 a 120 minutos"],["D","Blanco, cada 04 horas"]],ans:"A",exp:"Según la escala EAPO, la clasificación \"rojo\" (alerta máxima) exige reevaluación cada 5 a 10 minutos.",wrong:{B:"El intervalo estándar para la categoría amarilla es cada 30 minutos, no un rango de 20 a 30.",C:"El intervalo estándar para la categoría verde es cada 60 minutos, no un rango de 60 a 120.",D:"La categoría blanco se reevalúa según la rutina de sala, no con un intervalo fijo de 4 horas como el rojo."}},
{id:"23f1-g30",area:"GO",q:"El anillo de retracción patológica (anillo de Bandl) se asocia con: (repetición de referencia)",opts:[["A","Trabajo de parto normal en segunda etapa"],["B","Segmento pasivo fisiológico"],["C","Trabajo de parto obstruido"],["D","Útero gestante al término"]],ans:"C",exp:"El anillo de Bandl (retracción patológica) se asocia a trabajo de parto obstruido, reflejando sobredistensión del segmento uterino inferior.",wrong:{A:"El anillo de Bandl es un hallazgo patológico, no un fenómeno normal de la segunda etapa del parto.",B:"El anillo de Bandl expresa sobredistensión patológica del segmento inferior, no un segmento pasivo fisiológico.",D:"Menciona solo el útero gestante a término sin especificar la condición obstructiva que define al anillo patológico."}},
{id:"23f1-sp1",area:"SP",q:"Según la OMS, un sistema de salud ideal debería caracterizarse por ser:",opts:[["A","Universal, prestar una atención integral, equitativa, eficiente, flexible y participativa"],["B","Universal, prestar atención personalizada, inequitativa, poco flexible y participativa"],["C","Universal, prestar atención específica a grupos vulnerables, con justicia social, ineficiente, poco participativo"],["D","Universal, prestar una atención con enfoque cultural, inequitativo, deficiente, aunque flexible y participativo"],["E","Universal, prestar una atención con enfoque de género, equitativo, deficiente, flexible y poco participativo"]],ans:"A",exp:"Según la OMS, un sistema de salud ideal debe ser universal y brindar una atención integral, equitativa, eficiente, flexible y participativa.",wrong:{B:"Inequitativa y poco flexible contradice las cualidades ideales de equidad y flexibilidad que exige la OMS.",C:"Ineficiente y poco participativo contradice los atributos de eficiencia y participación que caracterizan al sistema ideal.",D:"Inequitativo y deficiente contradice la equidad y calidad que la OMS exige de un sistema de salud ideal.",E:"Deficiente y poco participativo contradice los atributos de eficiencia y participación plena requeridos por la OMS."}},
{id:"23f1-sp2",area:"SP",q:"Los beneficiarios del Sistema Nacional de salud son:",opts:[["A","Ancianos y niños"],["B","La población materno-infantil"],["C","La población total"],["D","Los trabajadores y sus familias"],["E","Las mujeres en edad fértil"]],ans:"C",exp:"Los beneficiarios del Sistema Nacional de Salud son la población total, en concordancia con el principio de universalidad.",wrong:{A:"Restringe los beneficiarios a un grupo etario específico, cuando el sistema nacional cubre a toda la población.",B:"Limita la cobertura a un grupo materno-infantil, cuando el principio de universalidad abarca a toda la población.",D:"Corresponde al modelo de seguridad social basado en el empleo, no al principio de universalidad del Sistema Nacional.",E:"Restringe la cobertura a un grupo específico, cuando el Sistema Nacional de Salud se basa en la universalidad."}},
{id:"23f1-sp3",area:"SP",q:"Es la ausencia de barreras de tipo geográfico, económico, sociocultural, de organización o de género, que se logra a través de la eliminación progresiva de las barreras que impiden que todas las personas utilicen servicios integrales de salud, determinados a nivel nacional, de manera equitativa, este concepto se refiere a:",opts:[["A","Acceso universal"],["B","Sistema de salud"],["C","Salud colectiva"],["D","Salud integral"],["E","Extensión de cobertura"]],ans:"A",exp:"El acceso universal se define como la ausencia de barreras geográficas, económicas, socioculturales, organizativas o de género para utilizar servicios de salud.",wrong:{B:"'Sistema de salud' es el conjunto organizacional completo, un concepto más amplio que la sola eliminación de barreras.",C:"La salud colectiva es un enfoque conceptual sobre salud poblacional, no la definición operativa de eliminar barreras de acceso.",D:"La salud integral se refiere a abordar todas las dimensiones de la persona, no específicamente a eliminar barreras.",E:"La extensión de cobertura es una estrategia para ampliar servicios, distinta del concepto de ausencia de barreras descrito."}},
{id:"23f1-sp4",area:"SP",q:"La prevención constituye uno de los pilares fundamentales en la atención del adulto mayor. En relación con la vacunación en este grupo poblacional, señale la que tiene una frecuencia anual:",opts:[["A","Antigripal"],["B","Antineumocóccica"],["C","Antitetánica"],["D","Antihepatitis B"]],ans:"A",exp:"Entre las vacunas del adulto mayor, la antigripal es la que se administra con frecuencia anual.",wrong:{B:"La vacuna antineumocócica se administra generalmente en esquema único o con refuerzo a los 5 años, no anualmente.",C:"La vacuna antitetánica se aplica según esquema de refuerzos cada 10 años, no con frecuencia anual.",D:"La vacuna antihepatitis B se administra según un esquema de dosis definidas, no con periodicidad anual."}},
{id:"23f1-sp5",area:"SP",q:"La estructura física en la que se desarrolla una parte importante de la estrategia de la Atención Primaria de Salud se denomina:",opts:[["A","Dispensario médico"],["B","Hospital distrital"],["C","Unidad de Salud Familiar (USF)"],["D","Clínica Periférica"]],ans:"C",exp:"La Unidad de Salud Familiar (USF) es la estructura física en la que se desarrolla gran parte de la estrategia de Atención Primaria de Salud.",wrong:{A:"El dispensario médico es una estructura de atención puntual más antigua, no la unidad base actual de la estrategia de APS.",B:"El hospital distrital corresponde a un nivel de mayor complejidad, no a la estructura de primer nivel donde se desarrolla la APS.",D:"La clínica periférica no es la denominación oficial de la estructura de base de la APS en el modelo paraguayo."}},
{id:"23f1-sp6",area:"SP",q:"Dentro de las categorías de la Unidad de Salud Familiar (USF), aquella que tiene ubicación fija, donde trabaja un Equipo de Salud de la Familia, en un territorio social asignado con una población adscripta de 3.500 a 5.000 habitantes si está en zonas urbanas, se denomina:",opts:[["A","Móvil"],["B","Satélite"],["C","Ampliada"],["D","Estándar"]],ans:"D",exp:"La categoría \"Estándar\" de la USF corresponde a la que tiene ubicación fija y atiende una población de 3.500 a 5.000 habitantes en zonas urbanas.",wrong:{A:"La categoría Móvil se refiere a equipos itinerantes sin ubicación fija, no a la USF con ubicación fija descrita.",B:"La categoría Satélite depende de una USF principal cercana y atiende población menor, no el rango de 3.500-5.000 descrito.",C:"La categoría Ampliada corresponde a un rango poblacional mayor que el descrito para la categoría Estándar."}},
{id:"23f1-sp7",area:"SP",q:"Los pre-requisitos que se consideran para la práctica de la Promoción de Salud, según la Carta de Otawa",opts:[["A","Honestidad, ideal de justicia, perspectiva de género, interculturalidad, educación inclusiva"],["B","La paz, la educación, la vivienda, la alimentación, la renta, un ecosistema estable, la justicia social y la equidad"],["C","Justicia, educación de alto nivel, equidad, distribución adecuada de la riqueza"],["D","Honestidad, rendición de cuentas, un ecosistema inestable, educación de adultos"]],ans:"B",exp:"Según la Carta de Ottawa, los prerrequisitos para la Promoción de la Salud incluyen la paz, la educación, la vivienda, la alimentación, la renta, un ecosistema estable, la justicia social y la equidad.",wrong:{A:"Menciona valores generales como honestidad e interculturalidad, que no forman parte de la lista textual de la Carta de Ottawa.",C:"Omite prerrequisitos clave como la paz y el ecosistema estable, y agrega 'educación de alto nivel', ajena al texto original.",D:"Incluye 'ecosistema inestable', que contradice directamente el prerrequisito real de un ecosistema estable."}},
{id:"23f1-sp8",area:"SP",q:"La diferencia fundamental entre un sistema de seguridad social y un Sistema nacional de salud, es que:",opts:[["A","El primero concibe la salud como un derecho y el segundo como un bien"],["B","En el primero los servicios son para los contribuyentes y en el segundo, para todos"],["C","El primero no hay cobertura integral de servicios sanitarios y en el segundo sí"],["D","El primero es un sistema más equitativo que el segundo"]],ans:"B",exp:"La diferencia clave entre seguridad social y sistema nacional de salud es que, en el primero, los servicios están destinados a los contribuyentes, mientras que en el segundo son para toda la población.",wrong:{A:"Ambos modelos conciben la salud como un derecho; la diferencia real está en la población cubierta, no en ese concepto.",C:"La cobertura integral no es el criterio que distingue ambos modelos; la diferencia clave es a quién cubren los servicios.",D:"La equidad relativa no es el criterio diferenciador central entre ambos modelos, sino el alcance poblacional de la cobertura."}},
{id:"23f1-sp9",area:"SP",q:"La existencia dentro del sistema de salud de subsistemas diferentes en función de las distintas fuentes y modalidades de financiación, las cuales reflejan una clasificación por capacidad de pago o por inserción en el mercado laboral, se denomina:",opts:[["A","Segmentación"],["B","Fragmentación"],["C","Descoordinación"],["D","Fraccionamiento"],["E","Desintegración"]],ans:"A",exp:"La segmentación describe la coexistencia de subsistemas de salud diferenciados según la capacidad de pago o la inserción en el mercado laboral.",wrong:{B:"La fragmentación se refiere a la falta de coordinación entre servicios, no a la clasificación por capacidad de pago descrita.",C:"Descoordinación no es el término técnico que designa la existencia de subsistemas según capacidad de pago.",D:"Fraccionamiento no es el término técnico estándar usado para describir subsistemas diferenciados por financiación.",E:"Desintegración no es el concepto técnico que corresponde a la clasificación de subsistemas por capacidad de pago."}},
{id:"23f1-sp10",area:"SP",q:"En el cuidado de la salud de la embarazada, ¿cuál es la vitamina que se indica para prevenir en los recién nacidos malformaciones del tubo neural?",opts:[["A","Vitamina A"],["B","Ácido fólico"],["C","Vitamina C"],["D","Vitamina E"]],ans:"B",exp:"El ácido fólico es la vitamina indicada en el cuidado prenatal para prevenir malformaciones del tubo neural en el recién nacido.",wrong:{A:"La vitamina A no previene malformaciones del tubo neural; en exceso incluso puede ser teratogénica.",C:"La vitamina C no tiene un rol establecido en la prevención de defectos del tubo neural.",D:"La vitamina E no está indicada específicamente para la prevención de malformaciones del tubo neural."}},
{id:"23f1-sp11",area:"SP",q:"El Diagnóstico de situación: Manejo de estadísticas vitales y situación de los grupos de riesgo y Generación de información útil para evaluar desempeño de los servicios de salud son acciones que corresponden a una de las Funciones esenciales de la Salud Publica. Indique cual es la respuesta correcta:",opts:[["A","Desarrollo de políticas y capacidad institucional de planificación (FESP 5)"],["B","Reducción del impacto de las emergencias (FESP 11)"],["C","Promoción del acceso equitativo a los servicios de salud FESP 7"],["D","Seguimiento, evaluación y análisis de la situación de salud (FESP1)"],["E","La vigilancia en la salud pública: el control y la gestión de los riesgos para la salud y las emergencias (FESP2)"]],ans:"D",exp:"El manejo de estadísticas vitales, la situación de grupos de riesgo y la generación de información para evaluar el desempeño de los servicios corresponden a la FESP 1: seguimiento, evaluación y análisis de la situación de salud.",wrong:{A:"La FESP 5 se refiere al desarrollo de políticas y planificación institucional, no al manejo de estadísticas vitales descrito.",B:"La FESP 11 aborda la reducción del impacto de emergencias y desastres, no el manejo de estadísticas vitales.",C:"La FESP 7 se centra en el acceso equitativo a los servicios, no en el análisis de estadísticas vitales.",E:"La FESP 2 corresponde a la vigilancia y control de riesgos, distinta del seguimiento y análisis de la situación de salud."}},
{id:"23f1-sp12",area:"SP",q:"Según datos publicados en Indicadores de Salud de Paraguay, año 2019. Señale cual es el departamento con menor cantidad de habitantes por km2:",opts:[["A","Alto Paraguay"],["B","Alto Paraná"],["C","Misiones"],["D","San Pedro"]],ans:"A",exp:"Según los Indicadores de Salud de Paraguay 2019, Alto Paraguay es el departamento con menor densidad poblacional (habitantes por km²).",wrong:{B:"Alto Paraná es uno de los departamentos con mayor densidad poblacional del país, no el de menor densidad.",C:"Misiones tiene una densidad poblacional intermedia, mayor que la del departamento de menor densidad, Alto Paraguay.",D:"San Pedro presenta una densidad poblacional considerablemente mayor que la del departamento de Alto Paraguay."}},
{id:"23f1-sp13",area:"SP",q:"El desarrollo de acciones educativas y de comunicación social para promover condiciones, comportamientos y ambientes saludables es una acción encuadrada dentro de una de las FESP. Señale a cuál corresponde:",opts:[["A","Reducción del impacto de las emergencias (FESP 11)"],["B","Vigilancia de salud pública, investigación y control de riesgos y daños en salud pública (FESP 2)"],["C","Evaluación del acceso equitativo a los servicios de salud (FESP 7)"],["D","Promoción de la salud (FESP 3)"],["E","Desarrollo de políticas y capacidad institucional de planificación (FESP 5)"]],ans:"D",exp:"El desarrollo de acciones educativas y de comunicación social para promover comportamientos saludables corresponde a la FESP 3: promoción de la salud.",wrong:{A:"La FESP 11 corresponde a la reducción del impacto de emergencias, no a la educación y comunicación social.",B:"La FESP 2 se centra en la vigilancia e investigación de riesgos, no en la promoción de comportamientos saludables.",C:"La FESP 7 evalúa el acceso equitativo a servicios, un enfoque distinto de la comunicación educativa.",E:"La FESP 5 se refiere al desarrollo de políticas institucionales, no a las acciones educativas y comunicacionales directas."}},
{id:"23f1-sp14",area:"SP",q:"En el marco de Atención Primaria de Salud, la atención médica debe basarse en:",opts:[["A","Métodos y tecnologías basados en la evidencia, en algunos casos"],["B","Utilización de los métodos de última generación, para evitar el \"primitivismo\""],["C","Métodos y tecnologías prácticos, científicamente fundados y socialmente aceptables"],["D","Métodos tradicionales, culturales y alternativos"]],ans:"C",exp:"En el marco de la Atención Primaria de Salud, la atención médica debe basarse en métodos y tecnologías prácticos, científicamente fundados y socialmente aceptables.",wrong:{A:"Limitar la evidencia a 'algunos casos' contradice el enfoque sistemático en métodos científicamente fundados de la APS.",B:"La APS no exige tecnología de última generación; prioriza métodos prácticos y socialmente aceptables.",D:"Los métodos exclusivamente tradicionales y alternativos no cumplen el requisito de fundamento científico exigido por la APS."}},
{id:"23f1-sp15",area:"SP",q:"Indique a qué tipo de programación se hace referencia cuando es posible la participación de diversos actores de una colectividad (políticos, religiosos, profesionales de la salud, educadores, etc):",opts:[["A","Comunitaria"],["B","Normativa"],["C","Estratégica"],["D","Gerencial"],["E","Administrativa"]],ans:"A",exp:"La programación comunitaria es aquella que permite la participación de diversos actores de la colectividad (políticos, religiosos, profesionales de salud, educadores, etc).",wrong:{B:"La programación normativa se define centralmente por expertos técnicos, sin la participación amplia de actores comunitarios.",C:"La programación estratégica se orienta a definir objetivos y prioridades técnicas, no a la participación comunitaria amplia.",D:"La programación gerencial se enfoca en la gestión de recursos institucionales, no en la participación de actores de la colectividad.",E:"La programación administrativa se centra en procesos de gestión interna, no en la participación de diversos actores sociales."}},
{id:"23f1-sp16",area:"SP",q:"Teniendo en cuenta los indicadores de mortalidad por grandes grupos de causas publicados en el año 2019, señale a que grupo corresponde la tasa de mortalidad más alta en nuestro país:",opts:[["A","Enfermedades del aparato respiratorio"],["B","Enfermedades trasmisibles"],["C","Tumores"],["D","Enfermedades del aparato circulatorio"]],ans:"D",exp:"Según los indicadores de 2019, las enfermedades del aparato circulatorio presentan la tasa de mortalidad más alta en Paraguay.",wrong:{A:"Las enfermedades respiratorias no encabezan la mortalidad; ocupan un lugar secundario frente al aparato circulatorio.",B:"Las enfermedades transmisibles tienen una tasa de mortalidad menor que las enfermedades del aparato circulatorio.",C:"Los tumores constituyen la segunda causa de mortalidad, por debajo de las enfermedades del aparato circulatorio."}},
{id:"23f1-sp17",area:"SP",q:"El campo de acción de la Atención Primaria es:",opts:[["A","Limitarse a dar medicamentos esenciales"],["B","Hacerse cargo de dirigir las acciones, de otros sectores que hacen a la salud"],["C","Debe resolver los problemas del sector a través del trabajo interdisciplinario del equipo, y adecuarse trabajar solo en su red"],["D","Debe coordinar acciones con otros sectores que hacen a la salud en la comunidad"],["E","Debe coordinar acciones con el área de educación"]],ans:"D",exp:"El campo de acción de la Atención Primaria implica coordinar acciones con otros sectores que inciden en la salud dentro de la comunidad.",wrong:{A:"Limitar la APS a entregar medicamentos esenciales reduce su alcance real, que es mucho más amplio e intersectorial.",B:"La APS no dirige las acciones de otros sectores, sino que coordina y articula con ellos de forma horizontal.",C:"Restringir el trabajo del equipo únicamente a su propia red contradice el enfoque intersectorial de la APS.",E:"Limitar la coordinación solo al sector educativo restringe indebidamente el alcance intersectorial amplio de la APS."}},
{id:"23f1-sp18",area:"SP",q:"Proceso permanente, voluntario, confidencial y periódico, de evaluación de las instituciones hospitalarias y su entorno con el fin de garantizar la calidad de los servicios ofrecidos, es referido al concepto de:",opts:[["A","Acreditación"],["B","Categorización"],["C","Calificación"],["D","Clasificación"],["E","Evaluación"]],ans:"A",exp:"La acreditación es el proceso permanente, voluntario, confidencial y periódico de evaluación de instituciones hospitalarias para garantizar la calidad de sus servicios.",wrong:{B:"La categorización clasifica establecimientos según su nivel de complejidad, no evalúa la calidad de forma voluntaria y periódica.",C:"Calificación no es el término técnico específico usado para este proceso voluntario y confidencial de evaluación de calidad.",D:"La clasificación ordena instituciones según criterios estructurales, sin el carácter voluntario y confidencial descrito.",E:"La evaluación es un término genérico; no implica necesariamente el carácter voluntario, confidencial y periódico descrito."}},
{id:"23f1-sp19",area:"SP",q:"Factores contribuyentes de la emergencia y la reemergencia de enfermedades transmisibles:",opts:[["A","Factores sociales, atención de salud, conducta humana"],["B","Factores políticos, religiosos, económicos, ambientales"],["C","Factores políticos, conducta de las mujeres, factores religiosos"],["D","Factores sociales, conducta de los hombres, factores religiosos"],["E","Factores sociales, religiosos, conductuales, económicos"]],ans:"A",exp:"Los factores sociales, la atención de salud y la conducta humana son contribuyentes reconocidos de la emergencia y reemergencia de enfermedades transmisibles.",wrong:{B:"Los factores políticos y religiosos no son los determinantes reconocidos principales de la emergencia de enfermedades transmisibles.",C:"Incluye 'conducta de las mujeres' de forma sesgada, un factor no reconocido como determinante específico en la literatura.",D:"Incluye 'conducta de los hombres' de forma sesgada, y omite los factores de atención de salud reconocidos como determinantes.",E:"Los factores religiosos no figuran entre los determinantes reconocidos de la emergencia de enfermedades transmisibles."}},
{id:"23f1-sp20",area:"SP",q:"En la Historia Natural de la enfermedad, se afirma que:",opts:[["A","El período prepatogénico es el que ocurre después de que el agente infecte al huésped"],["B","El periodo patogénico, es aquel en el cual, se rompe la situación de equilibrio entre la persona y los factores de riesgo (sociales, ambientales, personales), el organismo es invadido por el agente estableciéndose la enfermedad"],["C","En la infección subclínica, la persona ya nota signos o síntomas, que generalmente la lleva, a consultar a profesionales de la salud"],["D","El período pre patogénico se divide según sus manifestaciones en sintomático y asintomático"],["E","El periodo patogénico es el menos peligroso porque es sintomático"]],ans:"B",exp:"En la Historia Natural de la Enfermedad, el período patogénico es aquel en que se rompe el equilibrio entre la persona y los factores de riesgo, y el agente invade al huésped estableciendo la enfermedad.",wrong:{A:"El período prepatogénico ocurre antes de la interacción con el agente, no después de que este infecte al huésped.",C:"En la infección subclínica la persona no presenta signos ni síntomas notorios, a diferencia de lo que afirma la opción.",D:"El período prepatogénico no se clasifica en sintomático y asintomático; esa distinción corresponde al período patogénico.",E:"El período patogénico es justamente el de mayor riesgo, no el menos peligroso, pues implica enfermedad establecida."}},
{id:"23b2-m1",area:"MI",q:"Entre los métodos invasivos y no invasivos de detección para H. Pylori, ¿cuál de las citadas posee una técnica lenta, costosa y que depende de la experiencia?",opts:[["A","Estudio histológico"],["B","Serología"],["C","Detección de urea en el aliento"],["D","Cultivo"],["E","Ureasa rápida"]],ans:"D",exp:"El cultivo de H. Pylori es una técnica lenta, costosa y muy dependiente de la experiencia del laboratorio, por lo que se usa poco en la práctica diaria.",wrong:{A:"El estudio histológico es relativamente rápido y no depende tanto de la experiencia como el cultivo.",B:"La serología es una técnica rápida y económica, no lenta ni costosa.",C:"La detección de urea en el aliento es una prueba rápida y no invasiva.",E:"La prueba de ureasa rápida da resultado en minutos, no es lenta ni costosa."}},
{id:"23b2-m2",area:"MI",q:"Entre las Hepatopatías citadas. ¿Cuál de estas cursa con lesión vascular?",opts:[["A","Síndrome de Gilbert"],["B","Síndrome de Crigler-Najjar, tipos I y II"],["C","Síndrome de Dubin-Johnson"],["D","Síndrome de Rotor"],["E","Síndrome de Budd-Chiari"]],ans:"E",exp:"El síndrome de Budd-Chiari (trombosis de venas hepáticas) es la hepatopatía citada que cursa con lesión vascular.",wrong:{A:"El síndrome de Gilbert es un trastorno de conjugación de bilirrubina, sin componente vascular.",B:"El síndrome de Crigler-Najjar es un déficit enzimático de glucuronidación, no cursa con lesión vascular.",C:"El síndrome de Dubin-Johnson es un defecto de excreción canalicular de bilirrubina, no vascular.",D:"El síndrome de Rotor es un defecto de almacenamiento hepático de bilirrubina, no vascular."}},
{id:"23b2-m3",area:"MI",q:"¿Cuál de estos compuestos tiene un efecto tóxico directo sobre el hígado?",opts:[["A","Tetracloruro de carbono"],["B","Amoxicilina clavulanato"],["C","Isoniazida"],["D","Ciprofloxacina"],["E","Metformina"]],ans:"A",exp:"El tetracloruro de carbono tiene un efecto hepatotóxico directo y dosis-dependiente, a diferencia de las reacciones idiosincrásicas de otros fármacos.",wrong:{B:"El amoxicilina-clavulánico produce hepatotoxicidad idiosincrásica, no un efecto tóxico directo y dosis-dependiente.",C:"La isoniazida produce daño hepático idiosincrásico ligado a su metabolismo, no toxicidad directa predecible.",D:"La ciprofloxacina causa hepatotoxicidad idiosincrásica rara, no un efecto tóxico directo.",E:"La metformina rara vez es hepatotóxica y no actúa por un mecanismo de toxicidad directa."}},
{id:"23b2-m4",area:"MI",q:"En el cuadro clínico (Signos y Síntomas) del Síndrome de Cushing, lo más frecuente de encontrar es:",opts:[["A","Hiperpigmentación con alcalosis hipopotasémica"],["B","Obesidad o aumento de peso y piel delgada"],["C","Edema de extremidades inferiores"],["D","Hematomas fáciles y acné"],["E","Debilidad de músculos proximales"]],ans:"B",exp:"La obesidad o el aumento de peso con adelgazamiento de la piel es el hallazgo más frecuente en el cuadro clínico del síndrome de Cushing.",wrong:{A:"La hiperpigmentación con alcalosis hipopotasémica es típica del Cushing por ACTH ectópico, no el hallazgo más frecuente general.",C:"El edema de miembros inferiores es un hallazgo posible pero no el más frecuente en el cuadro clínico global.",D:"Los hematomas fáciles y el acné están presentes pero son menos constantes que la obesidad con piel delgada.",E:"La debilidad muscular proximal es frecuente pero no constituye el hallazgo más común descrito en el cuadro."}},
{id:"23b2-m5",area:"MI",q:"Es causa de hipertiroidismo primario:",opts:[["A","Adenoma hipofisario secretor de TSH"],["B","Síndrome de resistencia a la hormona tiroidea"],["C","Tumores secretores de gonadotropina coriónica"],["D","Adenoma tóxico"],["E","Tirotoxicosis gravídica"]],ans:"D",exp:"El adenoma tóxico (nódulo hiperfuncionante autónomo) es causa de hipertiroidismo primario.",wrong:{A:"El adenoma hipofisario secretor de TSH causa hipertiroidismo central o secundario, no primario.",B:"El síndrome de resistencia a hormona tiroidea cursa con TSH inadecuadamente normal o alta, no es hipertiroidismo primario clásico.",C:"Los tumores secretores de hCG estimulan indirectamente el receptor de TSH, mecanismo secundario y no autónomo primario.",E:"La tirotoxicosis gravídica depende de la hCG elevada del embarazo, no es autonomía tiroidea primaria."}},
{id:"23b2-m6",area:"MI",q:"En un paciente que presenta episodios de hipoglicemia. ¿Cuál sería la respuesta fisiológica esperada ante la disminución de las concentraciones plasmáticas de Glucosa?",opts:[["A","Disminución de adrenalina"],["B","Disminución de glucagón"],["C","Aumento del cortisol y hormona del crecimiento"],["D","Aumento de la insulina"],["E","Aumento de las funciones intelectuales"]],ans:"C",exp:"Ante hipoglicemia, la respuesta contrarreguladora fisiológica esperada es el aumento de cortisol y hormona de crecimiento, junto con glucagón y adrenalina.",wrong:{A:"Ante hipoglucemia se espera un aumento de adrenalina como respuesta contrarreguladora, no una disminución.",B:"El glucagón aumenta como hormona contrarreguladora ante la hipoglucemia, no disminuye.",D:"Fisiológicamente la insulina disminuye ante la hipoglucemia, no aumenta.",E:"La hipoglucemia deteriora la función cognitiva, no mejora las funciones intelectuales."}},
{id:"23b2-m7",area:"MI",q:"El método de diagnóstico de menor sensibilidad para el diagnóstico de infección por Clostridium difficile es:",opts:[["A","Cultivo de heces en busca de C. difficile"],["B","Identificación de citotoxinas en cultivo celular en heces"],["C","Inmunoanálisis enzimático para detectar la toxina A o B en heces"],["D","Enzimoinmunoanálisis para detectar Antígeno de C. difficile en heces"],["E","Colonoscopia"]],ans:"E",exp:"La colonoscopia tiene menor sensibilidad diagnóstica para C. difficile que las pruebas específicas de toxinas o cultivo, siendo un método indirecto e inespecífico.",wrong:{A:"El cultivo de heces, aunque lento, es más sensible que la colonoscopia para detectar C. difficile.",B:"La detección de citotoxinas en cultivo celular es considerada el estándar de referencia, con alta sensibilidad.",C:"El inmunoanálisis enzimático para toxina A o B es una prueba específica con sensibilidad diagnóstica aceptable.",D:"El enzimoinmunoanálisis de antígeno GDH es una prueba de tamizaje sensible, superior a la colonoscopia."}},
{id:"23b2-m8",area:"MI",q:"Alrededor de 50% de todos los receptores de trasplante renal que se presentan con Fiebre entre 1-4 meses después del trasplante tiene evidencia de enfermedad por:",opts:[["A","Cándida"],["B","Citomegalovirus"],["C","Toxoplasma"],["D","Pneumocystis"],["E","Estafilococo"]],ans:"B",exp:"El citomegalovirus es responsable de aproximadamente la mitad de los cuadros febriles en receptores de trasplante renal entre 1 y 4 meses post-trasplante.",wrong:{A:"La cándida es una infección fúngica que no predomina como causa de fiebre en ese período postrasplante.",C:"El toxoplasma es una causa infrecuente de fiebre en receptores de trasplante renal en ese período.",D:"Pneumocystis se asocia más a neumonía específica y no representa el 50% de los cuadros febriles descritos.",E:"El estafilococo es una causa bacteriana, no la etiología predominante en el período de 1 a 4 meses postrasplante."}},
{id:"23b2-m9",area:"MI",q:"La fosfomicina se utiliza predominantemente para profilaxis y tratamiento de:",opts:[["A","Cistitis no complicada"],["B","Neumonía atípica"],["C","Amigdalitis aguda"],["D","Infecciones de piel"],["E","Osteomielitis"]],ans:"A",exp:"La fosfomicina se utiliza predominantemente para la profilaxis y el tratamiento de la cistitis no complicada.",wrong:{B:"La fosfomicina no cubre patógenos atípicos intracelulares, no se usa en neumonía atípica.",C:"La amigdalitis aguda no es una indicación de la fosfomicina.",D:"Las infecciones de piel no constituyen el uso predominante de este fármaco.",E:"La osteomielitis requiere antibióticos con mejor penetración ósea sostenida, no fosfomicina como elección predominante."}},
{id:"23b2-m10",area:"MI",q:"Presenta mayor sensibilidad y especificidad para el diagnóstico de coronariopatía:",opts:[["A","Ecocardiografía de esfuerzo"],["B","Ecocardiografía con dobutamina"],["C","Perfusión miocárdica con tomografía por emisión de positrones"],["D","Perfusión con resonancia magnética cardiaca"],["E","Angiografía coronaria por tomografía computada"]],ans:"E",exp:"La angiografía coronaria por tomografía computada ofrece la mayor sensibilidad y especificidad no invasiva para el diagnóstico de coronariopatía entre las opciones listadas.",wrong:{A:"La ecocardiografía de esfuerzo tiene menor sensibilidad que la angio-TC para detectar enfermedad coronaria.",B:"La ecocardiografía con dobutamina es una técnica funcional, con menor precisión diagnóstica anatómica.",C:"La PET de perfusión miocárdica evalúa perfusión funcional, no ofrece la mejor definición anatómica coronaria.",D:"La perfusión con RM cardíaca es funcional, no alcanza la sensibilidad y especificidad combinadas de la angio-TC."}},
{id:"23b2-m11",area:"MI",q:"Electrocardiograma que muestra un intervalo PR corto, onda delta y una prolongación del QRS hace pensar en:",opts:[["A","Ritmo de la unión"],["B","Taquicardia sinusal inapropiada"],["C","Síndrome de Wolff Parkinson White"],["D","Fluter auricular"],["E","Taquicardia ventricular"]],ans:"C",exp:"Un PR corto, onda delta y QRS prolongado son hallazgos característicos del síndrome de Wolff-Parkinson-White, por preexcitación ventricular.",wrong:{A:"El ritmo de la unión no se asocia a onda delta ni a un intervalo PR corto.",B:"La taquicardia sinusal inapropiada no genera onda delta ni acorta el PR.",D:"El flutter auricular muestra un patrón en dientes de sierra, no onda delta.",E:"La taquicardia ventricular presenta QRS ancho de origen ventricular, sin PR corto ni onda delta."}},
{id:"23b2-m12",area:"MI",q:"Maque lo correcto sobre la miocardiopatía de Takotsubo:",opts:[["A","Es más común en varones jóvenes sanos"],["B","Ocurre por enfermedad de múltiples vasos coronarios"],["C","La angioplastia coronaria de urgencia es el tratamiento de elección"],["D","La diabetes mellitus es el factor de riesgo más importante para su aparición"],["E","La disfunción ventricular por lo general se resuelve en días a semanas"]],ans:"E",exp:"En la miocardiopatía de Takotsubo, la disfunción ventricular suele ser reversible, resolviéndose habitualmente en días a semanas.",wrong:{A:"El Takotsubo predomina en mujeres posmenopáusicas, no en varones jóvenes sanos.",B:"Por definición las coronarias son angiográficamente normales o sin lesión que explique el cuadro, no hay enfermedad multivaso.",C:"No existe lesión coronaria que tratar; el manejo es de soporte, no angioplastia de urgencia.",D:"El desencadenante típico es el estrés emocional o físico agudo, no la diabetes mellitus como factor principal."}},
{id:"23b2-m13",area:"MI",q:"Marque la característica que no corresponde al síndrome de Sjogren:",opts:[["A","Predominio en mujeres de mediana edad"],["B","Presencia de autoanticuerpos"],["C","Granulomas en las glándulas salivales"],["D","Rara vez cursa con daño del sistema nervioso central"],["E","La afectación renal consiste en una nefritis intersticial"]],ans:"C",exp:"Los granulomas en glándulas salivales no son una característica del síndrome de Sjögren, que se caracteriza por infiltrado linfocítico, no granulomatoso.",wrong:{A:"El predominio en mujeres de mediana edad sí es un rasgo característico del Sjögren, por lo que no es la excepción buscada.",B:"La presencia de autoanticuerpos (anti-Ro/La) sí es típica del Sjögren, por lo que no corresponde a la excepción.",D:"El compromiso de sistema nervioso central es en efecto infrecuente en el Sjögren, por lo que sí corresponde y no es la excepción.",E:"La nefritis intersticial sí es la forma típica de afectación renal en el Sjögren, por lo que no es la excepción buscada."}},
{id:"23b2-m14",area:"MI",q:"El hallazgo del signo y pápulas de Gottron hace pensar en:",opts:[["A","Dermatomiositis"],["B","Lupus Discoide"],["C","Sarcoidosis"],["D","Síndrome de Behcet"],["E","Esclerodermia"]],ans:"A",exp:"Las pápulas de Gottron son un signo cutáneo patognomónico de la dermatomiositis.",wrong:{B:"El lupus discoide presenta placas eritematosas descamativas, no pápulas de Gottron.",C:"La sarcoidosis produce lesiones granulomatosas cutáneas distintas, no pápulas de Gottron.",D:"El síndrome de Behçet cursa con úlceras orales y genitales, no con pápulas de Gottron.",E:"La esclerodermia produce esclerosis cutánea difusa, no pápulas de Gottron."}},
{id:"23b2-m15",area:"MI",q:"La tendencia a formar lesiones tumefactas que imitan procesos neoplásicos es una característica de:",opts:[["A","Sarcoidosis"],["B","Enfermedad relacionada a IgG4"],["C","Artritis reumatoide"],["D","Esclerodermia"],["E","Síndrome de Sjogren"]],ans:"B",exp:"La enfermedad relacionada con IgG4 tiende a formar lesiones tumefactas (pseudotumorales) que pueden simular procesos neoplásicos.",wrong:{A:"La sarcoidosis forma granulomas, pero no es la enfermedad más característica por lesiones pseudotumorales imitando neoplasias.",C:"La artritis reumatoide afecta articulaciones, no forma masas pseudotumorales en órganos.",D:"La esclerodermia produce fibrosis cutánea y visceral difusa, no masas focales pseudotumorales.",E:"El síndrome de Sjögren produce infiltración glandular linfocítica difusa, no pseudotumores masivos como la IgG4."}},
{id:"23b2-m16",area:"MI",q:"En un paciente con Enfermedad de Parkinson la historia clínica es fundamental, ¿cuál de los siguientes datos clínicos arroja la información clave para el diagnóstico de esta patología?",opts:[["A","Antecedentes genéticos"],["B","Trastornos de dislipemias mixta"],["C","La sarcoidosis"],["D","La encefalitis aguda"]],ans:"A",exp:"Los antecedentes genéticos aportan información clave para el diagnóstico de la enfermedad de Parkinson, especialmente en formas de inicio temprano o con historia familiar.",wrong:{B:"Los trastornos de dislipemia mixta no constituyen un dato clave para el diagnóstico de la enfermedad de Parkinson.",C:"La sarcoidosis no guarda relación con el diagnóstico clínico de la enfermedad de Parkinson.",D:"La encefalitis aguda puede causar parkinsonismo secundario, pero no es el dato clave para el diagnóstico de la forma idiopática."}},
{id:"23b2-m17",area:"MI",q:"En la Demencia Fronto Temporal, los trastornos neuro psiquiátricos característicos son:",opts:[["A","Parálisis de la mirada vertical, rigidez axial, distonía"],["B","Apatía, anorexia, desinhibición, compulsividad"],["C","Incremento de la oralidad, apatía, deficiencia de juicio"],["D","Apatía, comer en exceso, desinhibición, compulsividad"]],ans:"D",exp:"En la demencia frontotemporal predominan los trastornos neuropsiquiátricos de apatía, hiperfagia (comer en exceso), desinhibición y compulsividad.",wrong:{A:"La parálisis de la mirada vertical, rigidez axial y distonía describen la parálisis supranuclear progresiva, no la DFT.",B:"La anorexia no es típica de la DFT; en esta entidad predomina la hiperfagia, no la pérdida de apetito.",C:"El incremento de la oralidad y apatía es incompleto, falta la desinhibición y compulsividad características de la DFT."}},
{id:"23b2-m18",area:"MI",q:"En un paciente de 18 años, deportista que es diagnosticado de Asma inducida por el ejercicio, los episodios de agudización se caracterizan clínicamente por ser:",opts:[["A","Graves en climas cálidos y secos"],["B","Crisis que aparecen al inicio del ejercicio"],["C","Crisis aparecen al final del ejercicio"],["D","Es frecuente en deportes acuáticos"]],ans:"C",exp:"En el asma inducida por ejercicio, las crisis de broncoespasmo aparecen típicamente al finalizar el ejercicio, no al inicio.",wrong:{A:"El desencadenante típico del asma inducida por ejercicio es el aire frío y seco, no el clima cálido.",B:"Las crisis de broncoespasmo aparecen típicamente al finalizar el ejercicio, no al inicio.",D:"La natación en ambiente húmedo se asocia a menor riesgo de crisis, no a mayor frecuencia."}},
{id:"23b2-m19",area:"MI",q:"Paciente de 40 años, que trabaja en una cantera desde hace 10 años, acude por disnea y tos crónica. El diagnóstico que plantearía en primer lugar es:",opts:[["A","Asbestosis"],["B","Silicosis"],["C","Bisinosis"],["D","Sarcoidosis"]],ans:"B",exp:"La exposición laboral prolongada a sílice (trabajo en cantera) orienta en primer lugar al diagnóstico de silicosis ante disnea y tos crónica.",wrong:{A:"La asbestosis se debe a exposición a asbesto, no a la sílice propia del trabajo en cantera.",C:"La bisinosis se debe a exposición a polvo de algodón, sin relación con el trabajo en cantera.",D:"La sarcoidosis es una enfermedad granulomatosa no ocupacional, no vinculada a la exposición a sílice."}},
{id:"23b2-m20",area:"MI",q:"El derrame paraneumónico se vincula con neumonía bacteriana, abscesos pulmonares y bronquiectasias, en estos pacientes, un criterio importante para efectuar un procedimiento más invasor que la toracentesis es:",opts:[["A","Liquido pleural loculado"],["B","Tinción de Gram negativo"],["C","Liquido libre pleural de menor a 10 mm"],["D","Liquido pleural con PH mayor de 7.40"]],ans:"A",exp:"La presencia de líquido pleural loculado es un criterio importante para indicar un procedimiento más invasivo que la toracentesis simple en el derrame paraneumónico.",wrong:{B:"Un Gram negativo en el líquido pleural orienta a manejo conservador, no constituye criterio de intervención invasiva.",C:"El líquido libre menor a 10 mm es un derrame mínimo que no requiere drenaje invasivo.",D:"Un pH mayor a 7.40 es un valor normal que no indica complicación, lo contrario del criterio de pH bajo."}},
{id:"23b2-m21",area:"MI",q:"Paciente del sexo masculino de 25 años de edad consulta por dolor en fosa lumbar derecha con irradiación a flanco y fosa ilíaca derecha, los episodios son repetitivos e incluso con eliminación de una piedrita, además refiere como antecedente padres y hermanos con complicaciones renales importante por litiasis. Usted le aconseja hacer un estudio metabólico. De las siguientes, ¿cuál sería la etiología más común para la formación de estos cálculos?",opts:[["A","Oxalato de calcio"],["B","Ácido úrico"],["C","Cisteína"],["D","Estruvita"]],ans:"A",exp:"El oxalato de calcio es la etiología más común de la litiasis renal recurrente, incluso en el contexto de agregación familiar.",wrong:{B:"El ácido úrico es una causa menos frecuente de litiasis, asociada más a gota o síndrome metabólico.",C:"La cisteína es una causa rara y hereditaria, propia de la cistinuria específica.",D:"La estruvita se asocia a infecciones urinarias por bacterias ureasa-positivas, no a agregación familiar metabólica."}},
{id:"23b2-m22",area:"MI",q:"La Injuria Renal Aguda por exposición a contrastes iodados la creatinina aumenta a partir de las:",opts:[["A","6 horas"],["B","12 horas"],["C","18 horas"],["D","24 horas"]],ans:"D",exp:"Tras la exposición a contrastes iodados, la creatinina sérica comienza a elevarse a partir de las 24 horas en la injuria renal aguda por contraste.",wrong:{A:"A las 6 horas es demasiado precoz, la creatinina aún no se eleva tras la exposición al contraste.",B:"A las 12 horas todavía es precoz para el inicio típico de la nefropatía por contraste.",C:"A las 18 horas aún es anterior al inicio característico de elevación de la creatinina."}},
