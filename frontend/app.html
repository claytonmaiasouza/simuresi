/* ======================= GAMIFICACIÓN: XP, NIVEL, RACHA, LIGA ======================= */
var LEAGUE_TIERS = [
  {name:"Bronce", color:"#A15C2E"},
  {name:"Plata", color:"#8B95A1"},
  {name:"Oro", color:"#C99A2E"},
  {name:"Zafiro", color:"#2F6FA8"},
  {name:"Rubí", color:"#B23A52"},
  {name:"Esmeralda", color:"#2E8B57"},
  {name:"Amatista", color:"#7B4FA0"},
  {name:"Perla", color:"#AFA48C"},
  {name:"Obsidiana", color:"#4A4A52"},
  {name:"Diamante", color:"#3FB6C9"}
];

var LEVEL_THRESHOLDS = [0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11000,13000,15200,17600,20200];
var LEVEL_STEP_AFTER = 2500;

// XP/streak/league math now lives server-side (src/services/gamify.js and
// src/services/league.js) so it's authoritative and can't be tampered with
// from the client. loadGamify() just returns what hydrateFromServer() fetched.
function loadGamify(){
  return __gamifyCache;
}

function thresholdForLevel(level){
  if(level<=1) return 0;
  var idx = level-1;
  if(idx < LEVEL_THRESHOLDS.length) return LEVEL_THRESHOLDS[idx];
  var over = idx - (LEVEL_THRESHOLDS.length-1);
  return LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length-1] + over*LEVEL_STEP_AFTER;
}
function levelInfo(xp){
  var level = 1;
  while(thresholdForLevel(level+1) <= xp){ level++; }
  var floor = thresholdForLevel(level);
  var ceil = thresholdForLevel(level+1);
  var pct = ceil>floor ? Math.round(((xp-floor)/(ceil-floor))*100) : 100;
  return {level:level, floor:floor, ceil:ceil, pct:Math.max(0,Math.min(100,pct))};
}

// Fetches a fresh /api/league snapshot (XP changes often, so this screen
// re-fetches on every entry rather than relying only on the boot-time cache)
// then shows the league screen.
async function openLeague(){
  try{
    var res = await fetch('/api/league', {credentials:'include'});
    if(res.ok){ __leagueCache = await res.json(); }
  }catch(e){}
  state.screen = "league";
  render();
}

function renderLeague(){
  var g = loadGamify();
  var lg = __leagueCache || {tierIndex:0, tierName:"Bronce", weekXp:0, rows:[], lastResult:null};

  var lvl = levelInfo(g.xp);
  var tier = LEAGUE_TIERS[lg.tierIndex] || LEAGUE_TIERS[0];

  var rows = (lg.rows||[]).slice();
  var n = rows.length;

  var lastResult = lg.lastResult;
  var banner = "";
  if(lastResult){
    if(lastResult.promoted){
      banner = '<div class="league-banner promo">&#127942; ¡Subiste a la liga <b>'+lastResult.tierName+'</b>! Terminaste #'+lastResult.rank+' de '+lastResult.total+' la semana pasada.</div>';
    } else if(lastResult.demoted){
      banner = '<div class="league-banner demo">Bajaste a la liga <b>'+lastResult.tierName+'</b>. Terminaste #'+lastResult.rank+' de '+lastResult.total+' la semana pasada. ¡A por la próxima!</div>';
    } else {
      banner = '<div class="league-banner">Te mantuviste en <b>'+lastResult.tierName+'</b>. Terminaste #'+lastResult.rank+' de '+lastResult.total+' la semana pasada.</div>';
    }
  }

  var html = ''+
  '<div class="case-bar">'+
    '<button class="btn subtle" id="backBtn" style="flex:0 0 auto;">&larr; Menú principal</button>'+
    '<div class="id"><span class="label">Mi progreso</span><span class="num display">Nivel, racha y liga</span></div>'+
    '<div class="stamp"><span class="gem-dot" style="background:'+tier.color+';margin-right:6px;"></span>'+tier.name+'</div>'+
  '</div>'+
  banner+
  '<div class="doc">'+
    '<h2 class="display">Nivel '+lvl.level+'</h2>'+
    '<p class="label" style="margin-top:2px;">'+g.xp+' XP totales &middot; '+(lvl.ceil-g.xp)+' XP para el nivel '+(lvl.level+1)+'</p>'+
    '<div class="bar-track" style="margin:10px 0 20px;"><div class="bar-fill" style="width:'+lvl.pct+'%"></div></div>'+
    '<div class="score-row">'+
      scoreItem("Racha actual", g.streak.current+" 🔥")+
      scoreItem("Racha más larga", String(g.streak.longest))+
      scoreItem("Congelamientos", String(g.streak.freezes))+
    '</div>'+
    '<p class="note">Un congelamiento de racha cubre automáticamente un día que te saltees. Se recarga cada 7 días consecutivos de actividad.</p>'+
  '</div>'+
  '<div class="doc" style="margin-top:16px;">'+
    '<h2 class="display">Liga '+tier.name+'</h2>'+
    '<p class="note">XP de esta semana: <b>'+(lg.weekXp||0)+'</b>. La liga se reinicia todos los lunes. Los primeros 3 suben de liga, los últimos 3 bajan.</p>'+
    '<div class="league-list">'+
      rows.map(function(r,i){
        var zone = i<3 ? "promo" : (i>=n-3 ? "demo" : "");
        var cls = "league-row"+(zone?" "+zone:"")+(r.who==="user"?" me":"");
        return '<div class="'+cls+'">'+
          '<span class="rank">'+(i+1)+'</span>'+
          '<span class="pname">'+r.name+(r.who==="user"?' <span class="label" style="color:var(--accent-ink);">(vos)</span>':'')+'</span>'+
          '<span class="pxp mono">'+r.xp+' XP</span>'+
        '</div>';
      }).join("")+
    '</div>'+
    (lg.realUserCount!==undefined && lg.realUserCount<n ?
      '<p class="note" style="margin-top:14px;">Esta liga combina estudiantes reales con algunos rivales generados para completarla mientras la comunidad crece.</p>'
      : '')+
  '</div>';
  appEl.innerHTML = html;

  document.getElementById("backBtn").addEventListener("click",function(){ state.screen="select"; render(); });
}

/* ======================= ROUTER ======================= */
function render(){
  if(state.screen==="select") renderSelect();
  else if(state.screen==="exam") renderExam();
  else if(state.screen==="report") renderReport();
  else if(state.screen==="history") renderHistory();
  else if(state.screen==="flashDecks") renderFlashDecks();
  else if(state.screen==="flashStudy") renderFlashStudy();
  else if(state.screen==="flashSummary") renderFlashSummary();
  else if(state.screen==="league") renderLeague();
}

/* ======================= SERVER HYDRATION ======================= */
var __historyCache = [];
var __srsCache = {};
var __gamifyCache = null;
var __leagueCache = null;

async function hydrateFromServer(){
  try{
    var [historyRes, srsRes, gamifyRes, leagueRes] = await Promise.all([
      fetch('/api/history', {credentials:'include'}),
      fetch('/api/srs', {credentials:'include'}),
      fetch('/api/gamify', {credentials:'include'}),
      fetch('/api/league', {credentials:'include'})
    ]);
    __historyCache = historyRes.ok ? await historyRes.json() : [];
    __srsCache = srsRes.ok ? await srsRes.json() : {};
    __gamifyCache = gamifyRes.ok ? await gamifyRes.json() : {xp:0,lastXpDate:null,streak:{current:0,longest:0,lastActiveDate:null,freezes:1},league:{tierIndex:0,weekKey:null,weekXp:0,bots:[],lastResult:null}};
    __leagueCache = leagueRes.ok ? await leagueRes.json() : null;
  }catch(e){
    __historyCache = [];
    __srsCache = {};
    __gamifyCache = {xp:0,lastXpDate:null,streak:{current:0,longest:0,lastActiveDate:null,freezes:1},league:{tierIndex:0,weekKey:null,weekXp:0,bots:[],lastResult:null}};
    __leagueCache = null;
  }
}

async function boot(){
  try{
    var res = await fetch('/api/auth/me', {credentials:'include'});
    if(!res.ok){ window.location.href = '/'; return; }
    window.__user = await res.json();
  }catch(e){ window.location.href = '/'; return; }
  await hydrateFromServer();
  render();
}
boot();
})();
</script>
